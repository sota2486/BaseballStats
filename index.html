<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%23fff' stroke='%23c9ccd1' stroke-width='1'/><path d='M7 3.5c3.5 3.6 4.6 9 3.4 12.5C9.2 19.5 6.4 24 7 28.5' fill='none' stroke='%23e0322d' stroke-width='2.2' stroke-linecap='round'/><path d='M25 3.5c-3.5 3.6-4.6 9-3.4 12.5 1.2 3.5 4 8 3.4 12.5' fill='none' stroke='%23e0322d' stroke-width='2.2' stroke-linecap='round'/></svg>">
<title>SBG Stats</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SBG Stats</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#f2f4f6;
  --panel:#ffffff;
  --panel-2:#f6f8f9;
  --line:#cfd8dc;
  --line-soft:#e6ebed;
  --rule:#2e7d8a;            /* 見出しの下線。Savant のティール */
  --text:#12181e;
  --muted:#6c7783;           /* ティール寄りの灰 */
  --hot:#d22d41;             /* 良い側 */
  --cold:#3b5fa8;            /* 悪い側 */
  --mid:#b8bec4;
  --track:#dfe5e8;
  --grass:#b9dcd7;
  --dirt:#ffffff;
  --single:#e8622a;
  --double:#7a6fd0;
  --triple:#e8b62a;
  --homer:#e0459a;
  --out:#8b98a4;
  --shadow:0 1px 2px rgba(18,24,30,.05), 0 4px 14px rgba(18,24,30,.06);
  --team-first:#c62828;      /* 先攻 */
  --team-second:#1565c0;     /* 後攻 */
}
:root[data-theme="dark"]{
  --ground:#0c1015; --panel:#151a20; --panel-2:#1b2129; --line:#2d353e; --line-soft:#232a32;
  --rule:#4aa3b0; --text:#e8edf1; --muted:#8d99a5; --hot:#e2485a; --cold:#5482d6;
  --mid:#4b545e; --track:#252d35; --grass:#1d322e; --dirt:#222a30;
  --team-first:#ff7b7b; --team-second:#6fa8ff;
  --shadow:0 1px 0 rgba(255,255,255,.03), 0 8px 24px rgba(0,0,0,.5);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0c1015; --panel:#151a20; --panel-2:#1b2129; --line:#2d353e; --line-soft:#232a32;
    --rule:#4aa3b0; --text:#e8edf1; --muted:#8d99a5; --hot:#e2485a; --cold:#5482d6;
    --mid:#4b545e; --track:#252d35; --grass:#1d322e; --dirt:#222a30;
    --team-first:#ff7b7b; --team-second:#6fa8ff;
    --shadow:0 1px 0 rgba(255,255,255,.03), 0 8px 24px rgba(0,0,0,.5);
  }
}

*{box-sizing:border-box}
img{max-width:100%}
[hidden]{display:none!important}
body{margin:0; background:var(--ground); color:var(--text);
  font-family:"Source Sans 3",system-ui,sans-serif; font-size:14px; line-height:1.5; padding:0 0 40px}
h1,h2,h3{margin:0; font-family:"Barlow Condensed","Source Sans 3",sans-serif; font-weight:600}
.mono{font-family:"Roboto Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}

/* ------------------------------------------------------------ header */
header{background:var(--panel); border-bottom:1px solid var(--line); padding:11px 18px 0}
.top{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap}
.wordmark{font-family:"Barlow Condensed",sans-serif; font-size:29px; font-weight:700;
  letter-spacing:.03em; text-transform:uppercase; line-height:1}
.wordmark b{color:var(--hot)}
.sub{color:var(--muted); font-size:12.5px}
.io{margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
button,label.filebtn,#parkPick{font:inherit; font-size:12.5px; color:var(--text); background:var(--panel-2);
  border:1px solid var(--line); border-radius:3px; padding:5px 11px; cursor:pointer}
button:hover,label.filebtn:hover,#parkPick:hover{border-color:var(--rule)}
#parkPick{max-width:230px}
/* 選手を選ぶ一覧。狭い画面でだけ使う */
#playerPick{display:none; font:inherit; font-size:13px; color:var(--text);
  background:var(--panel-2); border:1px solid var(--line); border-radius:99px;
  padding:5px 12px; cursor:pointer; max-width:100%}
#playerPick:hover{border-color:var(--rule)}
:focus-visible{outline:2px solid var(--rule); outline-offset:2px}
/* 選手のタブは多くなると横スクロールする。
   打者/投手の切り替えは巻き込まれないよう外に出して常に見せる */
.tabrow{display:flex; align-items:flex-end; gap:10px; margin-top:11px}
.tabrow[hidden]{display:none}
.tabs{display:flex; gap:2px; flex-wrap:wrap; flex:1; min-width:0; padding-bottom:1px}
.tab{font-family:"Barlow Condensed",sans-serif; font-size:16px; letter-spacing:.02em;
  padding:6px 15px 7px; border:1px solid var(--line); border-bottom:0; border-radius:4px 4px 0 0;
  background:var(--panel-2); color:var(--muted); white-space:nowrap; cursor:pointer}
.tab[aria-selected="true"]{background:var(--panel); color:var(--text); font-weight:600;
  box-shadow:inset 0 3px 0 var(--rule); margin-bottom:-1px}
.side{display:flex; gap:4px; flex:none; align-self:flex-end}
.side .tab{border-color:var(--rule); font-size:21px; padding:8px 26px 9px;
  font-weight:700}

#drop{margin:12px 18px 0; padding:8px 13px; background:var(--panel);
  border:1px dashed var(--line); border-radius:4px; color:var(--muted); font-size:12.5px;
  display:flex; gap:11px; align-items:center; flex-wrap:wrap}
#drop.over{border-color:var(--rule); background:var(--panel-2)}
.badge{font-size:11px; border:1px solid currentColor; border-radius:99px; padding:0 9px}
.badge.warn{color:#a8791a}
.badge.ok{color:var(--rule)}

/* ------------------------------------------------------------ 顔写真 */
.face{display:inline-block; border-radius:3px; vertical-align:middle; flex:none;
  image-rendering:pixelated; object-fit:cover; background:var(--panel-2)}
.face.ph{display:inline-flex; align-items:center; justify-content:center; color:#fff;
  font-family:"Barlow Condensed",sans-serif; font-weight:700; line-height:1;
  position:relative; overflow:hidden}
/* 頭文字の上にスキンの顔を重ねる。読めなければ img が消えて頭文字が残る */
.face.ph img{position:absolute; left:0; top:0; width:100%; height:100%;
  image-rendering:pixelated; object-fit:cover}
.withface{display:inline-flex; align-items:center; gap:6px; min-width:0}
/* 名前を押すとその選手の画面へ */
.plink{cursor:pointer}
.plink:hover span{text-decoration:underline}
.card ol.small li:hover .sub,.card ol.small li:hover b{text-decoration:none}
.card ol.small li .nmlink{text-decoration:none}
.withface span{overflow:hidden; text-overflow:ellipsis}
.who .facebig{margin-bottom:6px}

/* ------------------------------------------------- パワプロ風の能力画面 */
.abwrap{display:grid; grid-template-columns:minmax(320px,470px) minmax(0,1fr); gap:12px}
@media (max-width:820px){.abwrap{grid-template-columns:1fr}}
/* 選手の一覧を画面の横に置く */
.withlist{display:grid; grid-template-columns:225px minmax(0,1fr); gap:10px;
  align-items:start}
@media (max-width:760px){.withlist{grid-template-columns:1fr}}
/* 名札の一覧。画面の高さいっぱいで、はみ出したぶんはここだけ動かす */
.namelist{display:flex; flex-direction:column; gap:5px; height:calc(100vh - 120px);
  overflow-y:auto; overscroll-behavior:contain;
  padding:2px 6px 8px 2px; position:sticky; top:4px}
@media (max-width:760px){.namelist{flex-direction:row; flex-wrap:wrap;
  height:auto; position:static}}
.nameplate{border:2px solid transparent; border-radius:8px; padding:8px 10px;
  min-height:38px; display:flex; align-items:center; flex:none;
  font-size:15px; font-weight:800; color:#13395f; cursor:pointer;
  text-shadow:0 1px 0 rgba(255,255,255,.55); white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis}
.nameplate:hover{border-color:#e8a33c}
.nameplate.on{border-color:#e8a33c; box-shadow:0 0 0 2px rgba(232,163,60,.35)}
.listmain{min-width:0}
/* ---- 能力画面。ここだけはサイトのテーマに乗らず、独自の配色で描く ---- */
.pawa{
  --ink:#13395f; --plate:#ffffff;
  --label:#d6e9f8; --pale:#eaf4fd; --paletext:#96b2c8;
  background:linear-gradient(#eaf5fd 0%, #d3e7f7 55%, #c2ddf2 100%);
  border-radius:10px; padding:12px; color:var(--ink);
  font-family:"M PLUS Rounded 1c","Source Sans 3",system-ui,sans-serif}
.pawa .card{box-shadow:0 1px 0 rgba(19,57,95,.06)}
.pawa .tabs2{display:flex; gap:4px; margin-bottom:10px; flex-wrap:wrap}
.pawa .tabs2 span{padding:4px 14px; border-radius:6px 6px 0 0; font-size:12.5px;
  font-weight:700; background:#a9c7de; color:#fff}
.pawa .tabs2 span.on{background:#1d6fb8}
.pawa .card{background:var(--plate); border-radius:9px; padding:10px}
/* 打者・投手・守備で高さを揃える。打者の 7 段ぶん。 */
.pawa .abwrap{align-items:stretch}
.pawa .card.ab{min-height:512px; height:100%; display:flex; flex-direction:column}
.pawa .card.ab .abrow{flex:none}
.fieldmap{flex:1 1 0; width:100%; height:0; min-height:0; display:block; margin:3px 0}

/* 名前・背番号・顔・成績 */
.abhead{display:flex; align-items:center; gap:8px; padding:0 0 10px; flex-wrap:wrap}
/* 名前の枠は幅を決めておく。名前の長さで右側の並びが動かないように。 */
.abhead .plate{background:#fff; border:2px solid #e8a33c; border-radius:7px;
  padding:3px 10px; font-size:20px; font-weight:800; line-height:1.2;
  text-shadow:0 1px 0 rgba(255,255,255,.55);
  width:230px; flex:none; text-align:center; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis}
.abhead .numbox{background:#2b3a47; color:#fff; border-radius:6px; padding:4px 10px;
  font-family:"Barlow Condensed",sans-serif; font-size:20px; font-weight:700}
.abhead .facebox{background:#fff; border-radius:7px; padding:3px; line-height:0}
.abhead .stat{display:flex; align-items:center; gap:8px; background:#fff;
  border-radius:7px; padding:5px 12px; font-size:14px; font-weight:700}
/* 打者/投手/守備 の切り替え。右端へ寄せる */
.abhead .sidepick{display:inline-flex; gap:3px; background:#fff; border-radius:7px;
  padding:3px; margin-left:auto}
.abhead .sidepick b{padding:3px 12px; border-radius:5px; font-size:14px;
  cursor:pointer; color:#7f99ad}
.abhead .sidepick b.on{background:#1d6fb8; color:#fff}
.abhead .apt{display:flex; align-items:center; gap:4px; background:#fff;
  border-radius:7px; padding:5px 10px; font-size:14px; font-weight:700}
.abhead .apt span{color:#b9c4cc}
.abhead .apt span.on{color:#1d6fb8; font-size:16px}
.abhead .stat b{background:#e3ecf3; color:#6d8aa6; border-radius:5px;
  padding:3px 9px; font-size:12px; font-weight:700}

/* 能力の 1 行。行そのものを枠で囲み、項目名にも枠を付ける */
.abrow{display:flex; align-items:center; gap:8px; padding:4px 8px 4px 4px;
  margin:3px 0; border:1.5px solid #bcd6ea; border-radius:9px;
  background:linear-gradient(#ffffff, #eef6fd);
  box-shadow:inset 0 1px 0 #fff, 0 1px 2px rgba(19,57,95,.10)}
.abrow .nm{flex:none; width:170px; height:52px; display:flex;
  align-items:center; justify-content:center;
  border:2px solid #a9c9e4; border-radius:8px;
  background:linear-gradient(#f4fbff, var(--label));
  box-shadow:inset 0 1px 0 #fff;
  font-weight:800; letter-spacing:.04em; font-size:30px; line-height:1;
  white-space:nowrap; color:var(--ink)}
.abrow .rank{flex:1; text-align:center; font-weight:800; line-height:1;
  font-family:"Barlow Condensed",sans-serif; font-size:35px;
  text-shadow:0 1px 0 rgba(255,255,255,.9)}
/* 矢印の無い行の数字。名札のすぐ右から始める */
.abrow .num.left{text-align:left; padding-left:14px}
.abrow .num{flex:1; text-align:center; font-family:"Barlow Condensed",sans-serif;
  font-variant-numeric:tabular-nums; font-weight:800; font-size:35px; line-height:1;
  text-shadow:0 1px 0 rgba(255,255,255,.9)}
.abrow .arrow{color:#e0459a; font-size:20px; line-height:1}

/* 右上の基礎能力 */
.basics{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:4px}
.basic{height:55px}
.basic{display:flex; align-items:stretch; color:var(--paletext);
  background:linear-gradient(#f6fbff,#e8f2fa);
  border:1.5px solid rgba(19,57,95,.16); border-radius:7px; overflow:hidden;
  font-weight:800; letter-spacing:.02em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),
             inset 0 -3px 6px rgba(19,57,95,.10),
             0 1px 2px rgba(19,57,95,.14)}
.basic i{flex:1; min-width:0; font-style:normal; font-size:25px; line-height:1;
  display:flex; align-items:center; justify-content:center;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
/* 名前と段位のあいだの分け目 */
.basic b{flex:none; width:34px; font-size:25px; line-height:1;
  display:flex; align-items:center; justify-content:center;
  border-left:1.5px solid rgba(255,255,255,.85);
  background:rgba(255,255,255,.32)}
.basic.good{background:linear-gradient(#d7ebff,#a9d0f5); color:#0f4a86}
.basic.bad{background:linear-gradient(#ffe6e6,#ffc4c4); color:#9b2226}

/* 守備の段。1 段に 2 つずつ */
.abrow.dual{gap:6px; padding:4px}
.abrow .half{flex:1; min-width:0; height:52px; display:flex; align-items:center;
  justify-content:center; gap:8px; border:2px solid #a9c9e4; border-radius:8px;
  background:linear-gradient(#ffffff, #eef6fd); box-shadow:inset 0 1px 0 #fff}
.abrow .half i{font-style:normal; font-size:26px; font-weight:800; color:var(--ink)}
.abrow .half b{font-size:30px; font-weight:800; line-height:1;
  font-family:"Barlow Condensed",sans-serif}
.abrow .half u{text-decoration:none; font-size:30px; font-weight:800;
  font-family:"Barlow Condensed",sans-serif; color:var(--ink); min-width:46px;
  text-align:right}
.abrow .half.head{background:linear-gradient(#f4fbff, var(--label));
  font-size:26px; font-weight:800; letter-spacing:.04em; color:var(--ink)}
.abrow .half.none{color:var(--paletext); background:rgba(255,255,255,.5)}
.abrow .half.none i,.abrow .half.none b{color:var(--paletext)}

/* 守備位置ごとの守備力 */
.pawa .dhead{font-size:13px; font-weight:800; color:#3d7ea8; padding:0 2px 6px}
.posgrid{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:5px;
  padding-bottom:8px}
.posgrid .pos{display:flex; align-items:center; justify-content:center; gap:4px;
  background:var(--pale); border-radius:7px; padding:5px 2px; font-weight:800}
.posgrid .pos i{font-style:normal; font-size:15px; color:#3d7ea8}
.posgrid .pos b{font-size:16px}
.posgrid .pos u{text-decoration:none; font-family:"Barlow Condensed",sans-serif;
  font-size:18px}
.posgrid .pos.none{color:var(--paletext); background:rgba(255,255,255,.45)}
/* プレースタイル。緑の札 */
.styles{display:grid; grid-template-columns:repeat(4,minmax(0,1fr));
  grid-auto-rows:46px; gap:6px}
.style{display:flex; align-items:center; justify-content:center; min-width:0;
  padding:0 4px; border-radius:7px; font-size:20px; font-weight:800;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  border:1.5px solid rgba(19,57,95,.16);
  background:linear-gradient(#dcffe0,#aeeeb8); color:#177a35;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),
             inset 0 -3px 6px rgba(19,57,95,.08),
             0 1px 2px rgba(19,57,95,.12)}
.style.empty{background:rgba(255,255,255,.45); border-color:rgba(19,57,95,.08);
  box-shadow:none}

/* 特殊能力。空き枠も出す */
/* 選手の一覧を横に置いたぶん、ここだけ幅を詰める。
   能力の数字(左側)は読みづらくなるので触らない。 */
.skills{display:grid; grid-template-columns:repeat(4,minmax(0,1fr));
  grid-auto-rows:52px; gap:6px}
.skill{display:flex; align-items:center; justify-content:center; min-width:0;
  padding:0 4px; border-radius:7px; font-size:24px; line-height:1;
  font-weight:800; text-align:center; letter-spacing:.02em; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis;
  border:1.5px solid rgba(19,57,95,.16);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),
             inset 0 -3px 6px rgba(19,57,95,.10),
             0 1px 2px rgba(19,57,95,.14)}
/* 水=低い能力 青=高い能力 赤=悪い能力 緑=個性的 */
.skill.low{background:linear-gradient(#eaf7ff,#cfe8f8); color:#3d7ea8}
.skill.good{background:linear-gradient(#d7ebff,#a9d0f5); color:#0f4a86}
.skill.bad{background:linear-gradient(#ffe6e6,#ffc4c4); color:#9b2226}
.skill.green{background:linear-gradient(#e2f7e8,#bfe8cb); color:#1d6b32}
.skill.empty{background:linear-gradient(#f6fbff,#e8f2fa); border-color:rgba(19,57,95,.08);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}
.pawa .note{color:#6d8aa6}
/* 変化球の方向 */
.breaks{display:grid; grid-template-columns:repeat(3,1fr); gap:3px; width:150px;
  aspect-ratio:1; margin:4px auto}
.breaks div{display:flex; align-items:center; justify-content:center; border-radius:3px;
  background:var(--panel-2); font-family:"Roboto Mono",monospace; font-size:12px;
  font-weight:700; color:var(--muted)}
.breaks div.on{background:var(--rule); color:#fff}
.breaks div.mid{background:transparent; color:var(--muted); font-size:10px}
.breaklist{font-size:12px}
.breaklist div{display:flex; gap:6px; padding:2px 0}
.breaklist b{margin-left:auto; font-family:"Roboto Mono",monospace}

/* ------------------------------------------------------------- TOP */
.cards{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px}
@media (max-width:760px){.cards{grid-template-columns:1fr}}
.card{border:1px solid var(--line); border-radius:6px; background:var(--panel); overflow:hidden}
.card h4{margin:0; padding:6px 10px; font-family:"Barlow Condensed",sans-serif; font-size:15px;
  letter-spacing:.05em; background:var(--panel-2); border-bottom:1px solid var(--line-soft)}
.card ol{margin:0; padding:4px 0; list-style:none; counter-reset:rank}
.card li{display:flex; align-items:center; gap:7px; padding:3px 10px; font-size:12.5px}
.card li::before{counter-increment:rank; content:counter(rank);
  width:14px; text-align:center; color:var(--muted); font-family:"Roboto Mono",monospace;
  font-size:10.5px; flex:none}
.card li b{margin-left:auto; font-family:"Roboto Mono",monospace; font-weight:700}
.card .empty{padding:8px 10px}
.toptable{width:100%; font-size:12px}
.toptable td,.toptable th{padding:3px 6px; white-space:nowrap}
.toptable td.nm,.toptable th.nm{text-align:left; font-family:"Source Sans 3",sans-serif}
/* ベストオーダー */
.lineup{width:100%; font-size:12.5px}
.lineup td{padding:4px 6px}
.lineup td.slot{width:26px; color:var(--muted); font-family:"Roboto Mono",monospace}
.lineup td.nm{text-align:left; font-family:"Source Sans 3",sans-serif}
.lineup tr.pit td{border-top:2px solid var(--rule)}

/* --------------------------------------------------------- リーダーボード */
.lbbar{display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:0 0 10px}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:5px; overflow:hidden}
.seg button{border:0; border-radius:0; background:var(--panel); padding:5px 13px;
  font-size:12px; letter-spacing:.04em}
.seg button[aria-selected="true"]{background:var(--rule); color:#fff}
.lbwrap{overflow:auto; max-height:calc(100vh - 230px)}
table.lb{font-size:12.5px; min-width:100%}
table.lb thead th{position:sticky; top:0; background:var(--panel); z-index:2; cursor:pointer;
  white-space:nowrap; padding:6px 6px}
table.lb thead th:hover{color:var(--text)}
table.lb thead th.sorted{color:var(--rule); border-bottom:2px solid var(--rule)}
table.lb td{padding:3px 6px; white-space:nowrap}
table.lb td.nm{font-family:"Source Sans 3",sans-serif; text-align:left; color:var(--text)}
table.lb tbody tr:hover td{background:var(--panel-2)}
table.lb td.rank{color:var(--muted); width:34px}
/* 規定打席に届いていない選手 */
table.lb tr.unq td{color:var(--muted)}
table.lb tr.unq td.nm{opacity:.75}

/* 先攻は赤、後攻は青。プラグインのスコアボードと揃える */
.t-first{color:var(--team-first)}
.t-second{color:var(--team-second)}
table.board tr.first td.team{color:var(--team-first)}
table.board tr.second td.team{color:var(--team-second)}

/* ------------------------------------------------------------- リザルト */
.gamepick{display:flex; gap:6px; flex-wrap:wrap; padding:0 0 10px}
.gamepick button{font-size:12px; padding:4px 11px}
.gamepick button[aria-selected="true"]{background:var(--rule); color:#fff; border-color:var(--rule)}
table.board{width:auto; font-size:13px; text-align:center; border-collapse:collapse;
  border:1px solid var(--line); margin-bottom:2px}
table.board th,table.board td{text-align:center; padding:4px 0; width:34px;
  border:1px solid var(--line-soft); font-family:"Roboto Mono",monospace}
table.board thead th{background:var(--panel-2); border-bottom:1px solid var(--line)}
table.board td.team,table.board th.team{text-align:left; padding:4px 10px; width:auto;
  min-width:150px; font-family:"Source Sans 3",sans-serif; color:var(--text)}
table.board .big{font-weight:700; background:var(--panel-2); border-left:1px solid var(--line)}
table.board tr.win td.team{font-weight:700}
.boardnote{display:flex; flex-wrap:wrap; gap:16px; padding:10px 0 0; font-size:12px;
  align-items:center}
/* 見出しと顔を同じ高さに揃える。揃えないと写真の分だけ文字が下がる */
.boardnote > span{display:inline-flex; align-items:center; gap:6px; flex-wrap:wrap}
.boardnote b{font-family:"Barlow Condensed",sans-serif; font-size:13px; letter-spacing:.04em;
  color:var(--muted)}
.inninghead{font-family:"Barlow Condensed",sans-serif; font-size:16px; letter-spacing:.03em;
  padding:9px 0 3px; color:var(--rule)}
/* 回ごとに表を分けているので、列の幅を決め打ちにしないと回ごとにずれる */
table.pa2{font-size:12px; table-layout:fixed; width:auto; min-width:720px}
table.pa2 th,table.pa2 td{padding:3px 6px; overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap}
table.pa2 td.nm,table.pa2 th.nm{font-family:"Source Sans 3",sans-serif; text-align:left}
table.pa2 td.res{text-align:center}
table.pa2 col.c-p{width:158px} table.pa2 col.c-r{width:104px}
table.pa2 col.c-s{width:52px} table.pa2 col.c-m{width:62px} table.pa2 col.c-k{width:74px}
.rbi{color:var(--hot); font-weight:700}

/* ------------------------------------------------------------ layout */
main{display:grid; grid-template-columns:minmax(340px,1.08fr) minmax(430px,1.48fr) minmax(360px,1.08fr);
  gap:12px; padding:12px 18px; align-items:start}
/* 選手統計だけは字を詰めて、1 画面に収まりやすくする */
main:not(.wide){font-size:11.5px}
main:not(.wide) .head{font-size:16px; padding:1px 0 4px; border-bottom-width:2px;
  margin-bottom:6px}
main:not(.wide) .pad{padding:8px 10px}
main:not(.wide) table{font-size:11px}
main:not(.wide) table th,main:not(.wide) table td{padding:2px 5px}
main:not(.wide) .who .nm{font-size:20px}
main:not(.wide) section{border-radius:6px}
main:not(.wide) .title{font-size:13px; padding:7px 12px}
main:not(.wide) .who{padding:8px 12px 6px}
main:not(.wide) .who .meta{font-size:11px}
main:not(.wide) .prow{grid-template-columns:118px 1fr 40px; gap:7px; padding:2px 11px}
main:not(.wide) .prow .nm{font-size:11px}
main:not(.wide) .prow .nm small{font-size:9px}
main:not(.wide) .prow .val{font-size:11px}
main:not(.wide) .bar{height:16px}
main:not(.wide) .bar .num{width:18px; height:18px; font-size:9px; border-width:2px}
main:not(.wide) .pgroup{font-size:9.5px; padding:6px 11px 2px}
main:not(.wide) .zone{grid-template-columns:repeat(5,52px); grid-auto-rows:41px}
main:not(.wide) .z b{font-size:11px}
main:not(.wide) .z i{font-size:8.5px}
main:not(.wide) .zonebox{padding-left:56px}
main:not(.wide) .zonebox.lefty{padding-left:0; padding-right:56px}
main:not(.wide) .zoneman{width:58px; height:213px}
main:not(.wide) .zlegend{font-size:10px; max-width:130px}
main:not(.wide) .usage{font-size:11px}
main:not(.wide) .usage td{padding:3px 3px}
main:not(.wide) .note{font-size:10px; padding:6px 11px 0}
main:not(.wide) .apt{font-size:10.5px}
main:not(.wide) .empty{font-size:11px; padding:10px}
main:not(.wide) .loclegend{font-size:10px}
main.wide{grid-template-columns:minmax(0,1fr); max-width:1180px; margin-inline:auto}
/* 能力画面は名札のぶんと中身のぶん、1.3 倍ほど広く取る */
main.wide.pawawide{max-width:1540px}
section.span{grid-column:1/-1}

/* ----------------------------------------------- 狭い画面(スマホ)
   能力画面は横 1540px を前提に組んであるので、そのままでは収まらない。
   横幅を画面に合わせ、字と枠もそのぶん縮める。 */
@media (max-width:640px){
  /* 横へはみ出すものがあると、画面全体が縮んで表示される。
     はみ出しそうなものは画面幅で頭打ちにする。 */
  html,body{overflow-x:hidden}
  main{padding:10px 10px; max-width:100%}
  .pawa,.pawa *{max-width:100%}
  .pawa svg{max-width:100%; height:auto}
  header{padding:8px 10px 0}
  .wordmark{font-size:22px}
  .tabs{gap:2px}
  .tab{font-size:13px; padding:5px 10px 6px}
  main.wide.pawawide{max-width:100%}
  .pawa{padding:8px; border-radius:8px}
  .withlist{grid-template-columns:1fr; gap:8px}
  .namelist{flex-direction:row; flex-wrap:wrap; height:auto; position:static;
    gap:4px; padding:0 0 4px}
  .nameplate{font-size:12px; min-height:30px; padding:5px 8px; border-width:1.5px}
  /* 能力画面は折り返さず、まるごと縮めて収める(fitPawa) */
  .pawafit{overflow:visible}

  /* 選手は一覧から選ぶ。名前を並べると横へ延びて読めない */
  #playerPick{display:block}
  #tabs .tab{display:none}

  /* 選手統計は 3 列で組んであるので、狭い画面では 1 列に積む */
  main:not(.wide){grid-template-columns:minmax(0,1fr); gap:8px}
  main:not(.wide) section{min-width:0}
  main:not(.wide) .pad{padding:7px 8px}
  /* パーセンタイルは棒を画面いっぱいに伸ばす。
     POOR / AVERAGE / GREAT の見出しが棒の真上に来るよう、
     凡例も同じ列・同じ隙間・同じ余白にする */
  .prow,main:not(.wide) .prow,
  .legend,main:not(.wide) .legend{grid-template-columns:78px minmax(0,1fr) 30px;
    gap:6px}
  .prow,main:not(.wide) .prow{padding:3px 8px}
  .legend,main:not(.wide) .legend{padding:0 8px 3px; font-size:9px;
    letter-spacing:.04em}
  .prow .nm,main:not(.wide) .prow .nm{font-size:10px; white-space:normal;
    line-height:1.2}
  .prow .nm small,main:not(.wide) .prow .nm small{display:none}
  .prow .val,main:not(.wide) .prow .val{font-size:10.5px}
  .bar,main:not(.wide) .bar{height:22px; border-radius:3px}
  .bar .num,main:not(.wide) .bar .num{width:22px; height:22px; font-size:10px}
  /* 表はどれも横スクロールで逃がす */
  .scroll,.gamescroll,.palist,.mixtable{max-width:100%; overflow-x:auto}
  .zone{grid-template-columns:repeat(5,minmax(0,44px)); grid-auto-rows:36px}
  .zonebox{padding-left:40px}
  .zonebox.lefty{padding-left:0; padding-right:40px}
  .zoneman{width:42px; height:190px}
  .statgrid{grid-template-columns:repeat(3,minmax(0,1fr)); gap:5px}
  .statbox b{font-size:20px}
  .bigface,.bigface .shot{width:100%; max-width:200px}

  /* 打席詳細も縦に積む */
  .pacard{grid-template-columns:minmax(0,1fr)}
  .pazonebox{max-width:320px; margin:0 auto}
  .panav button{padding:7px 14px; font-size:13px}
}
@media (max-width:1280px){main{grid-template-columns:1fr 1fr}}
@media (max-width:860px){main{grid-template-columns:1fr}}
.col{display:flex; flex-direction:column; gap:12px}
section{background:var(--panel); border:1px solid var(--line); border-radius:5px;
  box-shadow:var(--shadow); overflow:hidden}
.pad{padding:12px 14px 14px}

/* 見出しはティールの太い下線。Savant と同じ */
.head{font-family:"Barlow Condensed",sans-serif; font-size:19px; letter-spacing:.02em;
  display:flex; align-items:baseline; gap:8px; padding:2px 0 5px;
  border-bottom:3px solid var(--rule); margin-bottom:9px}
.head small{font-family:"Source Sans 3",sans-serif; font-size:11.5px; color:var(--muted);
  font-weight:400; margin-left:auto}
/* 試合会場。イニングの並びの左に小さく添える */
.venue{font-family:"Source Sans 3",sans-serif; font-size:11px; font-weight:600;
  color:var(--rule); border:1px solid var(--line); border-radius:3px; padding:1px 6px;
  white-space:nowrap}
.title{text-align:center; font-family:"Barlow Condensed",sans-serif; font-size:22px;
  padding:11px 12px 9px}
.title b{color:var(--hot)}

/* ------------------------------------------------------------ 選手ヘッダ */
.who{padding:14px 14px 12px; text-align:center; border-bottom:1px solid var(--line-soft)}
.who .nm{font-family:"Barlow Condensed",sans-serif; font-size:34px; line-height:1.05}
.who .meta{color:var(--muted); font-size:12.5px; margin-top:2px}

/* ------------------------------------------------------------ tables */
table{width:100%; border-collapse:collapse; font-size:12.5px}
th,td{text-align:right; padding:4px 4px; border-bottom:1px solid var(--line-soft)}
th:first-child,td:first-child{text-align:left; color:var(--muted)}
thead th{font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);
  font-weight:700; border-bottom:1px solid var(--line)}
td{font-family:"Roboto Mono",monospace; font-variant-numeric:tabular-nums}
tr.total td{background:var(--panel-2); font-weight:700; border-bottom:0}
tr.total td:first-child{font-weight:700; color:var(--text)}
.scroll{overflow-x:auto}
/* 打席の一覧。字を詰めて、中でスクロールせずに全部出す。
   投手名が空の行があっても列がずれないよう、幅は固定にする */
.palist{overflow-x:auto}
.palist thead th{position:sticky; top:0; background:var(--panel); z-index:2;
  text-align:center; font-size:9px}
table.pafix{table-layout:fixed; min-width:620px; font-size:10.5px}
table.pafix th,table.pafix td{overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap; padding:1px 4px}
table.pafix td.nm .face{width:16px !important; height:16px !important}
table.pafix .rtag{font-size:9.5px; padding:1px 4px}
table.pafix .outdots i{width:7px; height:7px; border-width:1px}
table.pafix .wpt{font-size:10px}
col.c-game{width:96px} col.c-name{width:86px} col.c-res{width:76px}
col.c-num{width:40px} col.c-flag{width:54px} col.c-wpt{width:62px}
table.pafix td.wcell,table.pafix td.bases{text-align:center}
table.pafix td.rbi{font-weight:700}
.palist td.nm,.palist td.res{font-family:"Source Sans 3",sans-serif; text-align:left}
.palist td.nm{color:var(--text)}
.palist td.nm .none{color:var(--muted)}
.palist td.yes{color:var(--hot); font-weight:700}
.palist td.no{color:var(--muted)}
/* 打席結果は色の四角に白抜き。ヒット=青、四球=黄緑、三振=黄、それ以外のアウト=赤 */
.rtag{display:inline-block; width:100%; text-align:center; color:#fff;
  border-radius:3px; padding:1px 4px; font-size:11.5px; font-weight:700;
  letter-spacing:.02em}
.r-hit{background:#1f6fd0}
.r-walk{background:#5a9e2f}
/* 三振はしっかり黄色に。白抜きだと読めないので、この色だけ文字を濃くする */
.r-k{background:#f5c518; color:#2b2200}
.r-out{background:var(--hot)}
/* 試合の行は 4 試合ぶんだけ見せて、あとはスクロール。
   見出しと通算行は貼り付けたままにする */
.gamescroll{max-height:158px; overflow-y:auto; overflow-x:auto}
.gamescroll thead th{position:sticky; top:0; background:var(--panel); z-index:2}
.gamescroll tr.total td{position:sticky; bottom:0; z-index:2;
  box-shadow:inset 0 1px 0 var(--line)}

/* ------------------------------------------------------------ percentile */
.legend{display:grid; grid-template-columns:104px 1fr 44px; gap:9px; align-items:end;
  padding:0 14px 3px; font-size:10.5px; letter-spacing:.09em; font-weight:700}
.legend .marks{position:relative; height:15px}
.legend .marks span{position:absolute; bottom:2px; transform:translateX(-50%); white-space:nowrap}
.legend .marks i{position:absolute; bottom:-4px; width:0; height:0; transform:translateX(-50%);
  border-left:4px solid transparent; border-right:4px solid transparent; border-top:5px solid currentColor}
.poor{color:var(--cold)} .avg{color:var(--mid)} .great{color:var(--hot)}

.prow{display:grid; grid-template-columns:126px 1fr 44px; gap:8px; align-items:center;
  padding:3px 14px}
.prow + .prow{border-top:1px dashed var(--line-soft)}
/* パーセンタイルのくくりの見出し */
.pgroup{font-size:10.5px; font-weight:700; letter-spacing:.10em; text-transform:uppercase;
  color:var(--muted); padding:9px 14px 3px; border-top:1px solid var(--line-soft)}
.pgroup:first-child{border-top:0; padding-top:4px}
.pgroup + .prow{border-top:0}
.prow .nm{font-size:12.5px; font-weight:600; text-align:right; line-height:1.15}
.prow .nm small{display:block; font-weight:400; color:var(--muted); font-size:10px}
.bar{position:relative; height:19px; background:var(--track); border-radius:2px}
.bar .fill{position:absolute; inset:0 auto 0 0; border-radius:2px}
.bar .tickmid{position:absolute; top:0; bottom:0; left:50%; width:1px; background:var(--panel);
  opacity:.85}
.bar .num{position:absolute; top:50%; transform:translate(-50%,-50%);
  width:21px; height:21px; border-radius:99px; border:2px solid var(--panel);
  display:flex; align-items:center; justify-content:center; color:#fff;
  font-family:"Roboto Mono",monospace; font-size:10px; font-weight:500;
  box-shadow:0 1px 2px rgba(0,0,0,.25)}
.prow .val{font-family:"Roboto Mono",monospace; font-size:12.5px; font-weight:500; text-align:right}
.note{font-size:11px; color:var(--muted); padding:9px 14px 0; line-height:1.5}


/* ------------------------------------------------ 選手成績 */
/* 上部。左に顔写真、右に通算成績の枠 */
.profile{display:flex; gap:18px; align-items:flex-start; flex-wrap:wrap}
.bigface{flex:none; width:200px}
.bigface .shot{width:200px; height:200px; border-radius:10px; overflow:hidden;
  background:var(--panel-2); display:flex; align-items:center; justify-content:center}
/* 写真は切り取らずに全体を入れる。切り取ると顔の一部だけが大きく出る */
.bigface .shot .bigshot{width:100%; height:100%; max-width:100%;
  object-fit:contain; image-rendering:pixelated; border-radius:0}
.bigface .shot .bigph{width:100%; height:100%; display:flex; position:relative;
  align-items:center; justify-content:center; overflow:hidden;
  color:#fff; font-family:"Barlow Condensed",sans-serif; font-weight:700;
  font-size:88px; line-height:1}
.bigface .shot .bigph .bigshot{position:absolute; left:0; top:0}
.bigface .shot .withface{gap:0}
.bigface .shot .withface>span:last-child{display:none}
.bigface .nm{font-size:22px; font-weight:800; padding:8px 2px 4px; line-height:1.2}
.bigface dl{display:grid; grid-template-columns:auto 1fr; gap:3px 10px;
  margin:0; font-size:12.5px}
.bigface dt{color:var(--muted)}
.bigface dd{margin:0; font-weight:600}
.profstats{flex:1 1 420px; min-width:0}

/* 通算成績の枠。6 列 3 行 */
.statgrid{display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:6px}
.statbox{border:1px solid var(--line); border-radius:8px; background:var(--panel-2);
  padding:7px 6px; text-align:center; min-width:0}
.statbox i{display:block; font-style:normal; font-size:12.5px; font-weight:700;
  color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.statbox b{display:block; font-family:"Barlow Condensed",sans-serif;
  font-variant-numeric:tabular-nums; font-size:26px; font-weight:700; line-height:1.15}

/* 左右に並べる枠 */
.twoup{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:18px; align-items:start}
.twoup.wide-left{grid-template-columns:minmax(0,1.9fr) minmax(0,1fr)}

/* 打球方向の扇 */
.fanwrap{display:flex; flex-direction:column; align-items:center; gap:6px}
.fankey{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:11px; color:var(--muted)}
.fankey i{display:inline-block; width:14px; height:10px; border-radius:2px;
  margin-right:4px; vertical-align:middle}
.fankey .note{flex-basis:100%}

/* 過去の試合。4 試合ぶん見えてスクロールする */
.gamelog{max-height:210px; overflow:auto; border:1px solid var(--line-soft);
  border-radius:8px}
.gamelog table{width:100%; border-collapse:collapse; font-size:12px}
.gamelog thead th{position:sticky; top:0; background:var(--panel-2); z-index:1;
  padding:6px 8px; font-weight:700; white-space:nowrap;
  border-bottom:1px solid var(--line)}
.gamelog td{padding:6px 8px; border-bottom:1px solid var(--line-soft);
  text-align:center; white-space:nowrap}
.gamelog td.when{text-align:left; font-weight:600}
.gamelog td.when small{display:block; font-weight:400; color:var(--muted); font-size:10px}
.gamelog th.pares,.gamelog td.pares{text-align:left; white-space:normal; min-width:240px}
/* 過去の試合に並べる打席結果。色は打席一覧と同じ */
.rtag.inline{width:auto; margin:1px 3px 1px 0; padding:1px 7px}

/* 球種別データ */
.mixwrap{display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap}
.mixtable{flex:1 1 380px; min-width:0; max-width:620px; overflow-x:auto}
table.mix{width:100%; border-collapse:collapse; font-size:11.5px}
table.mix th,table.mix td{border:1px solid var(--line-soft); padding:4px 5px;
  text-align:center; white-space:nowrap}
table.mix thead th{background:var(--panel-2); font-weight:700}
table.mix th small{display:block; font-weight:400; font-size:10px; color:var(--muted)}
table.mix td.tname{text-align:left; font-weight:600}
table.mix td.tname i{display:inline-block; width:4px; height:14px; border-radius:2px;
  margin-right:6px; vertical-align:-2px}
.mixpie{flex:none; display:flex; flex-direction:column; align-items:center; gap:6px}
.mixkey{display:flex; flex-direction:column; gap:3px; font-size:11.5px}
.mixkey i{display:inline-block; width:12px; height:12px; border-radius:3px;
  margin-right:6px; vertical-align:-1px}
.mixpie .note{font-size:10.5px; color:var(--muted)}

@media (max-width:820px){
  .statgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .twoup,.twoup.wide-left{grid-template-columns:minmax(0,1fr)}
  .bigface,.bigface .shot{width:100%}
}


/* ------------------------------------------------ 打席詳細 */
/* 前後の送り */
.panav{display:flex; align-items:center; justify-content:flex-end; gap:12px;
  padding:0 0 10px; font-size:13px; color:var(--muted)}
.panav button{font:inherit; font-size:14px; font-weight:700; padding:8px 20px;
  border-radius:99px; cursor:pointer; border:1px solid var(--rule);
  background:var(--rule); color:#fff}
.panav button:hover:not(:disabled){filter:brightness(1.12)}
.panav button:disabled{opacity:.4; cursor:default}

.pacard{display:grid; grid-template-columns:minmax(0,1fr) 320px minmax(0,1.2fr);
  gap:12px; align-items:start}
/* 項目ごとの枠 */
.pabox{border:1px solid var(--line-soft); border-radius:9px;
  background:var(--panel-2); padding:10px 12px}
.paside{display:flex; flex-direction:column; gap:10px; min-width:0}
.paat{font-size:17px; font-weight:800}
.pascore{font-size:13px; color:var(--muted); padding:2px 0 7px}
.pascore b{color:var(--ink); font-family:"Barlow Condensed",sans-serif; font-size:16px}
.pascore .t-first{color:var(--team-first); font-weight:700}
.pascore .t-second{color:var(--team-second); font-weight:700}
/* ボールとストライクの丸 */
.bscount{display:inline-flex; flex-direction:column; gap:2px; font-size:10.5px}
.bscount span{display:flex; align-items:center; gap:3px}
.bscount b{width:10px; color:var(--muted); font-size:10px}
.bscount i{width:9px; height:9px; border-radius:99px; display:inline-block;
  border:1.5px solid var(--line); background:transparent}
.bscount i.on.ball{background:#2f9e4f; border-color:#2f9e4f}
.bscount i.on.strike{background:#f5c518; border-color:#f5c518}
.bscount i.on.out{background:var(--hot); border-color:var(--hot)}
.paside dl{display:grid; grid-template-columns:auto 1fr; gap:4px 9px; margin:0;
  font-size:12.5px; align-items:center}
.paside dt{color:var(--muted)}
.paside dd{margin:0; min-width:0}
.pares2{display:flex; align-items:center; gap:9px; flex-wrap:wrap}
.pacount{font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:17px;
  font-variant-numeric:tabular-nums}
.parbi{font-size:11.5px; font-weight:700; color:var(--rule)}
.pafacts{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px}
.pafacts span{text-align:center; min-width:0}
.pafacts i{display:block; font-style:normal; font-size:11px; color:var(--muted)}
.pafacts b{display:block; font-family:"Barlow Condensed",sans-serif; font-size:19px;
  font-weight:700; white-space:nowrap}

.pazonebox{padding:8px}
.pazone{display:block; width:100%}
.pazone .zbox{fill:var(--panel); stroke:var(--text); stroke-width:2.4}
.pazone .zdash{fill:none; stroke:var(--line); stroke-width:1.4; stroke-dasharray:4 5}
.pazone .zline{stroke:var(--line); stroke-width:1}
.pazone .zplate{fill:none; stroke:var(--line); stroke-width:1.4}
.pazone .shadow{fill:var(--muted); opacity:.20}
.pazone .pd{stroke:#fff; stroke-width:2}
.pazone .pd.strike{fill:#f5c518}
.pazone .pd.ball{fill:#2f9e4f}
.pazone .pd.inplay{fill:#d9463f}
.pazone .pd.hit{fill:#1f6fd0}
.pazone .pn{font-size:14px; font-weight:700; fill:#11161d; pointer-events:none;
  font-family:"Barlow Condensed",sans-serif}

.palist2{list-style:none; margin:0; padding:0; display:flex;
  flex-direction:column; gap:5px; font-size:12.5px}
.palist2 li{display:grid; grid-template-columns:26px minmax(0,1fr) auto auto;
  gap:9px; align-items:center}
.palist2 li.none{display:block; color:var(--muted)}
/* 球の番号。球種の色の帯(.pdot)とは別の名前にする */
.pnum{width:26px; height:26px; min-width:26px; max-width:26px;
  box-sizing:border-box; border-radius:99px; display:grid; place-items:center;
  justify-self:center; align-self:center; line-height:1; padding:0;
  color:#11161d; font-family:"Source Sans 3",sans-serif; font-weight:700;
  font-size:12px; font-style:normal; border:2px solid #fff}
.pnum.strike{background:#f5c518}
.pnum.ball{background:#2f9e4f; color:#fff}
.pnum.inplay{background:#d9463f; color:#fff}
.pnum.hit{background:#1f6fd0; color:#fff}
.palist2 .ptype{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.palist2 .pspd{font-family:"Roboto Mono",monospace; font-size:11.5px;
  text-align:right; white-space:nowrap}
.palist2 .pwhat{color:var(--muted); white-space:nowrap; min-width:56px;
  text-align:right}

/* アウトカウントの丸 */
.outdots{display:inline-flex; gap:3px; align-items:center}
.outdots i{width:9px; height:9px; border-radius:99px; display:inline-block;
  border:1.5px solid var(--line); background:transparent}
.outdots i.on{background:var(--hot); border-color:var(--hot)}

/* ランキングの札。同率なら同じ順位を出す */
.card ol.tied{counter-reset:none}
.card ol.tied li::before{content:none}
.card ol.tied li .rank{font-style:normal; width:14px; flex:none; text-align:center;
  color:var(--muted); font-family:"Roboto Mono",monospace; font-size:10.5px}
/* ベストプレー。1 行に収める。場面が長いときは字を細かくして押し込む。
   行の高さはランキングの札と同じ。中身が何であれ 1 行ぶんに抑える */
.card ol.small li{gap:5px; padding:3px 9px; font-size:11.5px; line-height:1.25;
  flex-wrap:nowrap; align-items:center}
.card ol.small li > *{align-self:center; border:0; padding-top:0; padding-bottom:0}
.card ol.small li .nmlink{display:inline-flex; align-items:center; gap:5px;
  flex:none; white-space:nowrap; cursor:pointer; line-height:1.25;
  padding:0; border:0; text-align:left}
.card ol.small li .nmlink:hover{text-decoration:underline}
.card ol.small li .sub{flex:1 1 auto; min-width:0; color:var(--muted);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.25}
.card ol.small li b{flex:none; margin-left:auto; padding-left:3px;
  font-size:12px; white-space:nowrap; line-height:1.25}
.card ol.small li b .unit{font-style:normal; font-family:inherit;
  font-size:9.5px; color:var(--muted); margin-right:3px}
/* 見出しに添える注釈 */
.head .headnote{font-style:normal; font-weight:400; font-size:10.5px;
  color:var(--muted); margin-left:8px; letter-spacing:0; text-transform:none}

/* 勝利ポイント。上がったら青、下がったら赤 */
.wpt{font-family:"Roboto Mono",monospace; font-size:11.5px; font-weight:700;
  white-space:nowrap}
.wup{color:#1f6fd0} .wdn{color:#d9463f}
.pares2 .wpt{font-size:12.5px}

.tiedrest{font-style:normal; font-size:10.5px; color:var(--muted); margin-left:5px;
  white-space:nowrap}

/* スコアボードの回と、打席結果の行。押すと移動する */
.board td.jump{cursor:pointer}
.board td.jump:hover{text-decoration:underline}
/* 試合の動画。横幅いっぱいで 16:9 */
.gamevideo{position:relative; width:100%; max-width:820px; margin:4px auto 0;
  aspect-ratio:16/9; border-radius:10px; overflow:hidden;
  border:1px solid var(--line-soft); background:#000}
.gamevideo iframe{position:absolute; inset:0; width:100%; height:100%; border:0}

/* 過去の試合の行。押すとその試合の画面へ */
tr.jumpgame{cursor:pointer}
tr.jumpgame:hover{background:var(--panel-2)}
tr.jumpgame .when{text-decoration:underline; text-decoration-style:dotted;
  text-underline-offset:2px}

tr.jumppa{cursor:pointer}
tr.jumppa:hover{background:var(--panel-2)}

@media (max-width:900px){
  .pacard{grid-template-columns:minmax(0,1fr)}
  .pazonebox{max-width:320px; margin:0 auto}
}

/* ------------------------------------------------------------ zone */
.zonewrap{display:flex; gap:11px; align-items:flex-start; flex-wrap:wrap}
/* 打者の影。捕手目線なので、右打者は左(三塁側)に立つ */
.zonebox{position:relative; padding-left:66px; color:var(--muted)}
.zonebox.lefty{padding-left:0; padding-right:66px}
.zoneman{position:absolute; left:0; top:0; opacity:.30; pointer-events:none}
.zonebox.lefty .zoneman{left:auto; right:0; transform:scaleX(-1)}
.zone{display:grid; grid-template-columns:repeat(5,60px); grid-auto-rows:48px; gap:2px}
.z{border-radius:2px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  border:1px solid transparent; color:#11161d}
.z.in{border-color:rgba(17,22,28,.5)}
:root[data-theme="dark"] .z.in{border-color:rgba(255,255,255,.55)}
.z b{font-family:"Roboto Mono",monospace; font-size:12px; font-weight:500}
.z i{font-style:normal; font-size:9px; opacity:.85; font-family:"Roboto Mono",monospace}
.zlegend{font-size:11px; color:var(--muted); max-width:150px; line-height:1.55}

/* ------------------------------------------------------------ pitch usage */
.usage{width:100%; border-collapse:collapse; font-size:12.5px}
.usage td{border-bottom:1px solid var(--line-soft); padding:4px 4px}
.usage .pillcell{text-align:left; width:1%; white-space:nowrap}
.ptype{display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  font-family:"Source Sans 3",sans-serif}
.pdot{width:26px; height:14px; border-radius:99px; display:inline-block; flex:none}
.ubar{position:relative; height:13px; background:var(--track); border-radius:99px; min-width:40px}
.ubar i{position:absolute; inset:0 auto 0 0; border-radius:99px; display:block}

/* 投球の散布図 */
.locwrap{display:flex; gap:10px; align-items:flex-start}
.loclegend{display:flex; flex-direction:column; gap:5px; font-size:11px; padding-top:6px}
.loclegend span{display:flex; align-items:center; gap:6px; white-space:nowrap}
.loclegend i{width:11px; height:11px; border-radius:99px; flex:none}

/* heat charts */
.heats{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.heat h3{font-size:13px; display:flex; justify-content:space-between; align-items:baseline;
  gap:6px; white-space:nowrap}
.heat h3 > span:first-child{overflow:hidden; text-overflow:ellipsis}
.heat h3 span{font-family:"Roboto Mono",monospace; font-size:10.5px; color:var(--muted); font-weight:400}
.hgrid{display:grid; grid-template-columns:repeat(5,1fr); grid-auto-rows:1fr; gap:1px;
  margin-top:5px; aspect-ratio:1}
.hcell{border-radius:1px; border:1px solid transparent}
.heat svg{display:block; width:100%; margin-top:5px}
.hcell.in{border-color:rgba(17,22,28,.45)}
:root[data-theme="dark"] .hcell.in{border-color:rgba(255,255,255,.5)}

/* spray */
.parkbox{margin:0 0 9px; border:1px solid var(--line-soft); border-radius:7px;
  background:var(--panel-2); font-size:11.5px}
.parkbox summary{cursor:pointer; padding:6px 10px; letter-spacing:.05em;
  list-style:none; display:flex; align-items:center; gap:8px}
.parkbox summary::-webkit-details-marker{display:none}
.parkbox summary::before{content:"\25B8"; color:var(--muted); font-size:10px}
.parkbox[open] summary::before{content:"\25BE"}
.parkbox summary small{color:var(--muted); margin-left:auto; letter-spacing:0}
.parklist{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:2px 12px; padding:2px 10px 9px}
.parklist label{display:flex; align-items:center; gap:6px; cursor:pointer; padding:2px 0}
.parklist label i{width:14px; height:3px; border-radius:2px; flex:none}
.parklist label b{font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.parklist label small{color:var(--muted); margin-left:auto; white-space:nowrap;
  font-family:"Roboto Mono", monospace; font-size:10.5px}
.parklist input{accent-color:var(--rule); margin:0}
.hrparks{border-bottom:1px dotted var(--muted); cursor:help}
.spraywrap{display:flex; gap:10px; align-items:flex-start}
.spraylegend{display:flex; flex-direction:column; gap:5px; font-size:11px; padding-top:6px}
.spraylegend span{display:flex; align-items:center; gap:6px; letter-spacing:.04em}
.dotmark{width:11px; height:11px; border-radius:99px; flex:none}
.empty{padding:24px 14px; text-align:center; color:var(--muted); font-size:12.5px}
table.pa2 col.c-w{width:104px}
table.pa2 td.wcell{text-align:center}
table.pa2 col.c-o{width:40px}
table.pa2 col.c-b{width:44px}
table.pa2 td.bases{text-align:center}
/* 塁状況。上が二塁、下の左右が三塁と一塁 */
.diamond{display:inline-flex; flex-direction:column; align-items:center; gap:1px}
.diamond .row{display:flex; gap:9px}
.diamond i{display:block; width:7px; height:7px; transform:rotate(45deg);
  border:1.2px solid var(--line); background:transparent}
.diamond i.on{background:var(--hot); border-color:var(--hot)}
table.pa2 td.slot{text-align:center}
/* 打順は四角で囲う */
table.pa2 td.slot i{display:inline-flex; align-items:center; justify-content:center;
  width:22px; height:22px; font-style:normal;
  border:1.5px solid var(--line); border-radius:4px; background:var(--panel-2);
  font-family:"Barlow Condensed",sans-serif; font-size:15px; font-weight:700;
  color:var(--text)}
/* 打順表 */
.lineup{margin:0; padding:4px 0; display:grid; gap:2px}
.lineup .row{display:flex; align-items:center; gap:8px; padding:4px 8px;
  border-radius:6px; background:var(--panel-2); font-size:12.5px}
.lineup .slot{width:24px; text-align:center; font-family:"Barlow Condensed",sans-serif;
  font-size:15px; font-weight:700; color:var(--muted)}
.lineup .at{width:20px; text-align:center; font-size:12px; font-weight:700;
  color:var(--rule)}
/* ベストオーダーとゴールデングラブを横に並べる */
.bestwrap{display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:12px;
  grid-column:1/-1}
@media (max-width:900px){.bestwrap{grid-template-columns:1fr}}
.glovefield{width:100%; height:auto; display:block}

/* 戦況変化 */
.winwrap{display:grid; grid-template-rows:auto 1fr auto; gap:2px}
.winchart{width:100%; height:auto; display:block}
.winside{display:flex; align-items:center; gap:8px; font-size:12px; padding:0 2px}
.winside b{font-family:"Barlow Condensed",sans-serif; font-size:16px}
.winside span{color:var(--muted); font-size:11px}
.winside.top b{color:var(--hot)}
.winside.bottom b{color:var(--cold)}

/* ランキング。カードは 1 行 3 つ */
.cards.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:900px){.cards.three{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.cards.three{grid-template-columns:1fr}}
.lbcard{cursor:pointer}
.lbcard:hover{outline:2px solid var(--rule); outline-offset:-2px}
.lbpick{display:flex; flex-wrap:wrap; gap:5px; padding:2px 0 10px}
.lbpick button{font:inherit; font-size:12px; padding:4px 11px; cursor:pointer;
  border:1px solid var(--line); border-radius:999px; background:var(--panel-2);
  color:var(--muted)}
.lbpick button[aria-selected="true"]{background:var(--rule); border-color:var(--rule);
  color:#fff; font-weight:700}
table.lbfull{border-collapse:collapse; width:100%}
table.lbfull th,table.lbfull td{border-bottom:1px solid var(--line); padding:7px 10px;
  text-align:left; white-space:nowrap}
table.lbfull th{font-size:11.5px; color:var(--muted); letter-spacing:.04em;
  border-bottom:2px solid var(--rule)}
table.lbfull td.place{width:46px; text-align:center;
  font-family:"Barlow Condensed",sans-serif; font-size:21px; font-weight:700;
  color:var(--rule)}
table.lbfull td.big,table.lbfull th.big{text-align:right;
  font-family:"Barlow Condensed",sans-serif; font-size:26px; font-weight:700}
table.lbfull td.lbsub,table.lbfull th.lbsub{text-align:right; font-size:12px;
  color:var(--muted); width:90px}
table.lbfull tr.unq td{opacity:.5}
table.lbfull tbody tr:hover td{background:var(--panel-2)}

/* 選手成績 */
.splithead{display:flex; align-items:center; gap:12px}
.splithead .nm{font-family:"Barlow Condensed",sans-serif; font-size:26px;
  font-weight:700; line-height:1.1}
.splithead .meta{font-size:12px; color:var(--muted); padding-top:2px}
table.split{border-collapse:collapse; font-size:13px; width:100%;
  font-family:"Barlow Condensed",sans-serif}
table.split th,table.split td{border-bottom:1px solid var(--line); padding:6px 10px;
  text-align:right; white-space:nowrap}
table.split th{color:var(--muted); font-weight:600; letter-spacing:.03em;
  border-bottom:2px solid var(--rule)}
table.split td.sit,table.split th.sit{text-align:left; width:132px;
  font-family:"Source Sans 3",sans-serif; font-size:12px}
table.split td.sit .diamond{margin-right:6px; vertical-align:middle}
table.split tbody tr:hover td{background:var(--panel-2)}
/* カウントのランプ。緑がボール、黄がストライク */
.lamp{display:inline-flex; align-items:center; gap:3px}
.lamp i{width:12px; height:12px; border-radius:99px; display:block;
  border:2px solid var(--muted); background:transparent}
.lamp i.b.on{background:#2fb400; border-color:#1c7a00}
.lamp i.k.on{background:#f5c400; border-color:#b08c00}
.lamp em{width:5px}

/* 順位表 */
table.stand{border-collapse:collapse; font-size:12.5px; width:100%;
  font-family:"Barlow Condensed",sans-serif}
table.stand th,table.stand td{border-bottom:1px solid var(--line); padding:5px 9px;
  text-align:right; white-space:nowrap}
table.stand th{color:var(--muted); font-weight:600; letter-spacing:.03em;
  border-bottom:2px solid var(--rule)}
table.stand td.nm,table.stand th.nm{text-align:left;
  font-family:"Source Sans 3",sans-serif}
table.stand td.place{text-align:center; font-size:15px; font-weight:700;
  color:var(--rule); width:36px}
table.stand tbody tr:hover td{background:var(--panel-2)}
.bignum{font-family:"Barlow Condensed",sans-serif; font-size:40px; font-weight:700;
  line-height:1.1; padding:6px 2px 2px}

/* ---------------------------------------------------------- スタジアム */
/* 球場の紹介。1 行 2 つ */
.parkcards{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
@media (max-width:760px){.parkcards{grid-template-columns:1fr}}
.parkcard{border:1px solid var(--line); border-radius:8px; overflow:hidden;
  background:var(--panel-2)}
.parkcard .shotwrap{position:relative; border-bottom:1px solid var(--line)}
.parkcard .shot{position:absolute; left:0; top:0; width:100%; height:100%;
  object-fit:cover; display:block}
.parkcard .noshot{width:100%; aspect-ratio:16/9; display:flex; align-items:center;
  justify-content:center; color:var(--muted); font-size:11.5px; background:var(--panel)}
.parkcard .body{padding:9px 11px 11px}
.parkcard h4{margin:0 0 6px; font-family:"Barlow Condensed",sans-serif; font-size:19px;
  letter-spacing:.02em}
.parkcard .facts{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px}
.parkcard .facts div{background:var(--panel); border-radius:5px; padding:5px 7px}
.parkcard .facts b{display:block; font-family:"Barlow Condensed",sans-serif;
  font-size:17px; line-height:1.1}
.parkcard .facts span{font-size:10px; color:var(--muted); letter-spacing:.04em}
.parkcard .facts div b small{font-weight:400}
/* 広さの一覧。表計算のように詰めて出す */
table.sheet{border-collapse:collapse; font-size:12px; width:100%;
  font-family:"Barlow Condensed",sans-serif}
table.sheet th,table.sheet td{border:1px solid var(--line); padding:3px 8px;
  text-align:right; white-space:nowrap}
table.sheet th{background:var(--panel-2); color:var(--muted); font-weight:600;
  letter-spacing:.03em; cursor:pointer; user-select:none}
table.sheet th:hover{color:var(--text)}
table.sheet td.nm,table.sheet th.nm{text-align:left;
  font-family:"Source Sans 3",sans-serif}
table.sheet tr:nth-child(even) td{background:var(--panel-2)}
/* 広さ比べ。左が平面、右が立体 */
.compare{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
@media (max-width:860px){.compare{grid-template-columns:1fr}}
.pickrow{display:flex; flex-wrap:wrap; gap:6px 12px; padding:2px 0 8px; font-size:12px}
.pickrow label{display:inline-flex; align-items:center; gap:5px; cursor:pointer}
.pickrow i{width:10px; height:10px; border-radius:2px; display:inline-block}
.solidwrap{position:relative}
.solidwrap canvas{width:100%; height:300px; display:block; border-radius:6px;
  background:var(--panel-2); cursor:grab; touch-action:none}
.solidwrap canvas:active{cursor:grabbing}
.solidnote{font-size:11px; color:var(--muted); padding-top:5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="top">
    <div class="wordmark">SBG <b>Stats</b></div>
    <div class="io">
      <button id="theme">テーマ</button>
      <select id="parkPick" title="チャートに使う球場" hidden><option value="">既定の球場</option></select>
    </div>
  </div>
  <div class="tabrow" id="viewRow">
    <div class="tabs" id="viewTabs"></div>
  </div>
  <div class="tabrow" id="playerRow">
    <div class="tabs" id="tabs"></div>
    <div class="side" id="sideTabs"></div>
  </div>
</header>

<main id="app"></main>

<script>
/* ==========================================================================
   result/<試合ID>.csv  game_id,inning,half,order,pitcher,batter,result,rbi,runs,outs,base1..3
   record/<名前>.csv    side,game,pa,pitch_no,inning,half,count,outs,pitcher,batter,type,
                        velocity,v_break,h_break,zone,in_zone,plate_x,plate_y,
                        swing,whiff,contact,call,exit_velocity,launch_angle,spray_angle,
                        distance,result
   ========================================================================== */
const DATA={plate:[], pitch:[], play:[], files:[]};
/**
 * 試合 ID → その試合の情報(チーム名と球場名)。game.csv から作る。
 *
 * <p>打席の記録は 1 打席 1 行なので、試合に 1 つしかないものを入れると
 * 同じ値が何百行も並ぶ。チーム名と球場名はこちらへ分けてある。
 */
const GAMES=new Map();
function ingestGames(rows){
  rows.forEach(r=>{
    const id=String(r.game_id||"").trim();
    if(!id) return;
    GAMES.set(id, {
      top:String(r.topteam||"").trim(),
      bottom:String(r.bottomteam||"").trim(),
      stadium:String(r.stadium||"").trim(),
      // 列の名前はいくつか受ける。あとから足しやすいように
      video:String(r.video || r.youtube || r.url || r.link || r.movie || "").trim()
    });
  });
}
/**

 */
function videoOf(id){
  const info=GAMES.get(String(id||"").trim());

  const at=raw.match(new RegExp("(?:youtu[.]be/|v=|/live/|/embed/|/shorts/)([A-Za-z0-9_-]{6,})"));
  if(!at) return "";
  const start=raw.match(new RegExp("[?&]t=([0-9]+)"));
  return "https://www.youtube-nocookie.com/embed/" + at[1]
    + (start ? "?start=" + start[1] : "");
}

function faceSrc(name){
  const direct=FACES[String(name)];
  if(direct) return direct;
  // 昔の ID のファイル名しか無い人。別名表を逆に引く。
  for(const old in ALIAS_NAME){

  // 大文字小文字だけ違うファイル名も拾う
  const key=String(name).toLowerCase();
  for(const has in FACES){
    if(has.toLowerCase()===key) return FACES[has];

  for(const old in ALIAS_NAME){
