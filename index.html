/* ------------------------------------------------------------------ csv */
function splitCsv(line){
  const out=[]; let cur="", q=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(q){ if(c==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===','){ out.push(cur); cur=""; }
    else cur+=c;
  }
  out.push(cur); return out;
}
const TEXT_COLS=new Set(["game_id","game","pa","count","half","side","type","result",
  "call","pitcher","batter"]);
/** 表計算で書き出した列名も受け取れるようにする。 */
const ALIAS={
  gameid:"game_id", game_id:"game_id",
  pitchername:"pitcher", battername:"batter",
  resulttype:"result", runsscored:"runs", outsonplay:"outs",
  runneronfirst:"base1", runneronsecond:"base2", runneronthird:"base3",
  battingorder:"order",
  // 打席の左右と投手の投げ手。1 球ごとの記録と同じ名前に寄せる
  batterstance:"stance", pitcherthrows:"throws"
};
function parseCsv(text){
  // Excel 用に付けてある先頭の BOM は見出しの一部ではない
  const lines=String(text).replace(/^\uFEFF/, "").split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length) return {head:[],rows:[]};
  const head=splitCsv(lines[0]).map(h=>{
    const k=h.trim().toLowerCase().replace(/\s+/g,"");
    return ALIAS[k] || h.trim().toLowerCase();
  });
  const rows=lines.slice(1).map(line=>{
    const cells=splitCsv(line), row={};
    head.forEach((h,i)=>{
      const v=(cells[i]??"").trim();
      const lower=v.toLowerCase();
      if(lower==="true"||lower==="false") row[h]=(lower==="true");
      else if(v!=="" && !TEXT_COLS.has(h) && !isNaN(Number(v))) row[h]=Number(v);
      else row[h]=v;
    });
    return row;
  });
  return {head,rows};
}

/* ------------------------------------------------- 打球からの期待値
   打球速度(km/h)と打球角度(度)から、その 1 打球の期待安打率と期待塁打。
   実測から作った表ではなく、野球としてもっともらしい形を手で置いたもの。 */
function battedExpectation(ev,la){
  if(!isFinite(ev)||!isFinite(la)) return {ba:0.55,tb:0.90};
  const clamp=(x,lo,hi)=>x<lo?lo:(x>hi?hi:x);
  // 打球速度を 0〜1 に均す。この試合の打球は中央値 166、上位 25% が 182km/h あるので、
  // 実測の散らばりに合わせて 125〜220 で目盛りを取る。
  // ここを狭くすると強い当たりが全部「上限」に張り付いて区別できなくなる。
  const hard=clamp((ev-125)/95,0,1);

  // ゴロは飛距離ではなく「野手の間を抜けるか」で決まる。速さだけを見る。
  const ground = la<-10 ? 0.09+0.34*hard : 0.20+0.50*hard;

  // 打ち上げた打球は飛距離で決まる。30 度が一番飛び、そこから離れるほど落ちる。
  // 角度で区切らず連続にしてあるので、40 度でも 50 度でも
  // 速ければちゃんと柵を越える。
  const af = Math.max(0, 1 - Math.pow((la-30)/48, 2));
  const carry = hard*af;                       // 0〜1。1 に近いほど遠くへ飛ぶ
  // carry 0.554(=40度180km/h) で .800、0.684(=30度190km/h) で 1.000 を通る。
  // それより手前は曲線で落として、平凡な当たりが過大にならないようにする。
  const air = clamp(carry<0.554
      ? 0.80*Math.pow(carry/0.554, 0.52)
      : 0.80+1.54*(carry-0.554), 0.02, 1.00);

  // 8〜16 度はゴロとライナーの中間。急に切り替わらないよう混ぜる。
  const mix = clamp((la-8)/8, 0, 1);
  const ba = ground*(1-mix) + air*mix;

  // 塁打。柵を越える見込みが立つほど 1 打球あたりの塁打が伸びる。
  const hr = clamp((carry-0.52)/0.30, 0, 1);
  const tb = (ground*1.18)*(1-mix) + (air*(1.35+2.65*hr))*mix;
  return {ba, tb};
}
/**
 * 打球の種類。バレルを最優先に、ゴロ・ライナー・フライを強弱で分ける。
 *
 * <p>強い / 弱いの線は Hard Hit と同じ 153km/h。
 * 角度はゴロが 10 度未満、ライナーが 25 度まで、それより上がフライ。
 */
function battedKind(ev,la){
  if(!isFinite(ev)||!isFinite(la)) return "";
  if(isBarrel(ev,la)) return "バレル";
  const hard=ev>=153;
  if(la<10) return hard ? "強ゴロ" : "弱ゴロ";
  if(la<25) return "ライナー";
  return hard ? "強いフライ" : "弱いフライ";
}

/**
 * バレル。MLB の定義に合わせてある。
 * 158km/h(98mph) で 26〜30 度。そこから 1km/h ごとに上下 0.65 度ずつ広がり、
 * 187km/h(116mph) の 8〜50 度で頭打ち。
 */
function isBarrel(ev,la){
  if(!(ev>=158)) return false;
  const extra=Math.min((ev-158)*0.65, 18.9);
  return la>=26-extra && la<=30+extra;
}

/* --------------------------------- 目盛り。上位何%ではなく値に数値を割り当てる */
/* 実測に合わせた目盛り。
   x 系はリーグの実際の成績が真ん中あたりに来るように置いてある。
     打率 .351 / 出塁率 .388 / 長打率 .577
   打球速度も三振率も MLB とはまるで違うので、MLB の基準では全員が振り切れる。 */
const SCALE={
  xwoba:[0.220,0.580], xba:[0.180,0.560], xslg:[0.220,0.980],
  ev:[145,192], barrel:[12,50], hard:[58,94], sweet:[42,76],
  // 見送るという考えがほぼ無いので、追いかけ率も空振り率も MLB とはまるで違う。
  // 実測は打者の追いかけ 60〜80%、空振り 32〜35%、
  // 投手の追いかけさせ 44〜63%、空振り取り 41〜49%。
  chase:[85,45], whiff:[48,20], k:[52,26], bb:[1,12],
  xera:[8.0,2.0], gb:[18,44], wrc:[40,190], k9:[4.0,16.0], bb9:[6.0,0.5],
  // スイングの速さと、芯で捉えた度合い
  bat_speed:[95,130], squared:[60,100],
  // Run Value。打者は通算の点、投手は 100 球あたりの点
  bat_rv:[-0.9,0.9], run_rv:[-0.05,0.10], field_rv:[-0.7,0.3],
  pitch_rv:[-4.0,4.0], fast_rv:[-5.0,5.0], break_rv:[-5.0,5.0], off_rv:[-7.0,7.0],
  // 守備と走塁。いずれも 1 プレーあたりに直した値で見る
  range:[-0.25,0.25], arm_value:[-0.20,0.20], arm:[95,145],
  baserun:[-0.20,0.25],
  // 投手側で向きが変わるもの
  ev_p:[192,145], barrel_p:[50,12], hard_p:[94,58], xba_p:[0.560,0.180],
  k_p:[26,52], bb_p:[12,1], chase_p:[40,75], whiff_p:[30,55]
};
/**
 * 真ん中より下の傾きを緩める割合。
 *
 * <p>下振れした数字がそのまま出ると、記録が少ないうちは
 * 目も当てられない数字が並ぶ。50 より下は差を縮めて出す。
 * 50 以上はそのまま。順番は変わらない。
 */
const SOFT_LOW=0.6;

/** 50 未満を 50 へ寄せる。 */
function softLow(value){
  return value>=50 ? value : 50-(50-value)*SOFT_LOW;
}

/**
 * 目盛りの下へ外れた値を 1〜20 に散らす。
 *
 * <p>目盛りの端で切ると、下のほうの人が全員 20 で並んでしまう。
 * どれだけ外れているかで 20 から 1 まで下げる。
 * 目盛りちょうど(0%)が 20、目盛り 1 つぶん外れたら 1。
 */
function belowScale(raw){
  const under=Math.min(1, -raw/100);
  return Math.max(1, 20*(1-under));
}

/**
 * Run Value の目盛りは、リーグの散らばりから作る。
 *
 * <p>ほかの項目は「この値なら何点」という固定の目盛りで足りるが、
 * Run Value は得点の入りやすさで桁が変わる。固定にすると、
 * よく打っている人がまとめて真ん中に寄ってしまう。
 *
 * <p>目盛りを作るのは、ある程度の打席を重ねた人だけ。
 * 数試合だけ出て飛び抜けた人を基準にすると、
 * 長く出ている上位の打者がその下に押し込められてしまう。
 */
const RANK_KEYS=new Set(["bat_rv","run_rv","field_rv",
  "pitch_rv","fast_rv","break_rv","off_rv"]);

/**
 * Run Value の目盛りを作るのに要る打席数(被打席数)。
 *
 * <p>規定打席の倍。数試合だけの人は目盛りの基準にしない。
 */
const VALUE_QUAL_PA=QUAL_PA*2;

let RANK_LIST=null, RANK_LIST_N=-1;
function rankValues(key){
  if(RANK_LIST && RANK_LIST_N===DATA.plate.length){
    if(RANK_LIST[key]) return RANK_LIST[key];
  }else{
    RANK_LIST={}; RANK_LIST_N=DATA.plate.length;
  }
  const out=[];
  const batting=key==="bat_rv" || key==="run_rv" || key==="field_rv";
  playerNames().forEach(name=>{
    let v=null;
    if(batting){
      // 数打席しか立っていない人を混ぜると、両端が極端な値で埋まる。
      // 規定打席に届いた人の中で順位を出す。
      if(plateOf(name,"bat").length < VALUE_QUAL_PA) return;
      const R=batterRunValues(name);
      v=key==="bat_rv" ? R.bat : key==="run_rv" ? R.run : R.field;
    }else{
      const pa=plateOf(name,"pit");
      const ps=pitchOf(name,"pit");
      if(!ps.length || pa.length < VALUE_QUAL_PA) return;
      const R=pitchRunValues(ps);
      v=key==="pitch_rv" ? R.pitching : key==="fast_rv" ? R.fast
        : key==="break_rv" ? R.breaking : R.offspeed;
    }
    if(v!==null && isFinite(v)) out.push(v);
  });
  out.sort((a,b)=>a-b);
  RANK_LIST[key]=out;
  return out;
}

/**
 * 打撃の Run Value の目盛り。wRC+ に合わせて置く。
 *
 * <p>wRC+ 100(リーグ平均)が 50 点、190 が 92 点になるように置く。
 * 150 なら 73 点、200 なら 97 点。
 * 打撃だけは他の選手の出来に左右されず、いつ見ても同じ物差しで読める。
 *
 * <p>Run Value は「wRC+ が 100 増えると、1 打席あたりの得点ぶんだけ増える」
 * という関係なので、その 1 段ぶんを step として目盛りを組み立てる。
 */
function battingScale(){
  const lg=league();
  if(lg.rpa===null || !isFinite(lg.rpa)) return null;
  const step=lg.rpa*leaguePaPerGame();
  if(!(step>0)) return null;
  // 合わせる点: wRC+ 190(1 段の 0.9 のところ)で 92 点。
  // 50 点からの伸びしろは 42 点ぶんなので、そこから半幅を逆算する。
  const at=0.90, gain=(92-50)/100;
  const half=step*at/(2*gain);
  return [-half, half];
}

/** 並んだ値の中から、下から q の割合のところを取る。 */
function quantile(list, q){
  if(!list.length) return null;
  const at=(list.length-1)*q;
  const low=Math.floor(at), high=Math.ceil(at);
  return list[low] + (list[high]-list[low])*(at-low);
}

/**
 * リーグの散らばりから作った目盛りに当てる。
 *
 * <p>下から 10% を 0 点、上から 15% のところを 100 点に置く。
 * 上位を 1 人の飛び抜けた値で決めると、そのすぐ下の人まで
 * 大きく下がってしまうので、上の端は少し内側に取る。
 */
function rankScore(key, value){
  // 打撃だけは wRC+ に合わせた目盛りを使う
  const fixed=key==="bat_rv" ? battingScale() : null;
  const list=fixed ? null : rankValues(key);
  if(!fixed && (!list || list.length<3)) return null;
  const lo=fixed ? fixed[0] : quantile(list, 0.10);
  const hi=fixed ? fixed[1] : quantile(list, 0.85);
  if(hi===lo) return 50;
  const raw=(value-lo)/(hi-lo)*100;
  if(raw<0) return Math.round(belowScale(raw));
  return Math.round(softLow(Math.min(100,raw)));
}

function score(key,value){
  if(value===null||!isFinite(value)) return null;
  if(RANK_KEYS.has(key)) return rankScore(key, value);
  const s=SCALE[key];
  if(!s) return null;
  const [lo,hi]=s;
  const raw=(value-lo)/(hi-lo)*100;
  if(raw<0) return Math.round(belowScale(raw));
  return Math.round(softLow(Math.min(100,raw)));
}
function scoreColor(v){
  if(v===null) return "var(--mid)";
  const t=v/100;
  return t<0.5 ? mix("--cold","--mid",t/0.5) : mix("--mid","--hot",(t-0.5)/0.5);
}
const mix=(a,b,k)=>`color-mix(in srgb, var(${b}) ${Math.round(k*100)}%, var(${a}))`;

/* ------------------------------------------------- 守備と走塁

   record/<名前>_play.csv の 1 行 = 1 つの打球に対する、その選手の関わり。
   kind=field なら守備、kind=run なら走塁。 */

/** 外野の守備位置。落球の重さを変えるのに使う。 */
const OUTFIELD=new Set(["LEFT_FIELDER","CENTER_FIELDER","RIGHT_FIELDER"]);

const playOf=(name,kind)=>DATA.play.filter(r=>
  r.player===name && (!kind || r.kind===kind));

function nz(value){
  const n=Number(value);
  return isFinite(n) ? n : null;
}

/** 守備の走る速さ。ブロック/秒。プラグインの Player_Assumed_Speed と同じ。 */
const FIELD_SPEED=5.6;

/** その試合の本塁の座標。球場が分からなければ null。 */
function homeOf(gameId){
  const park=parkOf(venueOf(gameId));
  if(!park || !isFinite(park.hx) || !isFinite(park.hz)) return null;
  return {x:park.hx, z:park.hz};
}

/**
 * その打球に、あとどれだけ足りなかったか(秒)。
 *
 * <p>負なら余裕を持って待てた、0 なら間一髪、正なら足りなかった。
 *
 * <p>フライは「落ちてくるところへ間に合うか」。
 * ゴロとライナーは、本塁から落下点へ伸びる線をそのまま転がる線とみなし、
 * 自分の横を通り過ぎるまでに、その線まで寄れるかで見る。
 * 外野の頭を越えた打球で内野手が減点されないよう、
 * 打球が自分の位置まで来る時間をきちんと数える。
 */
function reachGap(r){
  const sx=nz(r.startx), sz=nz(r.startz), lx=nz(r.landx), lz=nz(r.landz);
  if(sx===null||sz===null||lx===null||lz===null) return null;
  const home=homeOf(r.game);
  const hang=nz(r.hangticks)||0, la=nz(r.launchangle)||0, ev=nz(r.exitvelocity)||0;
  // 上がった打球。落ちてくるところへ走って間に合えば捕れる。
  // ただし落ちたあとに拾ってアウトにしたなら、やっていることはゴロと同じ。
  // そちらで見ないと、ふつうの小飛球が「追いつけない打球」になってしまう。
  if(flyBall(r) && !afterBounce(r)){
    return Math.hypot(sx-lx, sz-lz)/FIELD_SPEED - hang/20;
  }
  if(!home){
    return flyBall(r) ? Math.hypot(sx-lx, sz-lz)/FIELD_SPEED - hang/20 : null;
  }
  let ux=lx-home.x, uz=lz-home.z;
  const carry=Math.hypot(ux,uz);
  if(carry<0.5) return null;
  ux/=carry; uz/=carry;
  const dx=sx-home.x, dz=sz-home.z;
  // 打球の線に沿った距離と、そこからの横のずれ
  const along=dx*ux+dz*uz;
  const perp=Math.hypot(dx-along*ux, dz-along*uz);
  if(along<=0) return Math.hypot(sx-lx, sz-lz)/FIELD_SPEED;
  let ticks;
  if(along<=carry){
    // まだ空を飛んでいるあいだ。落下点まで hang tick で届く
    ticks=hang*(along/carry);
  }else{
    // 落ちてからは転がる。1 tick ごとに 0.96 倍で遅くなる
    let v=Math.max(0.2, ev*0.6/72), flown=0, t=0;
    while(flown < along-carry && t<200){ flown+=v; v*=0.96; t++; }
    ticks=hang+t;
  }
  return perp/FIELD_SPEED - ticks/20;
}

/** 空中で捕るかどうかを問う打球か。 */
function flyBall(r){
  return (nz(r.launchangle)||0)>=15 && (nz(r.hangticks)||0)>=25;
}

/** 上がった打球を、落ちたあとに拾ってアウトにしたか。 */
function afterBounce(r){
  return r.caughtonfly!==true && (r.gotout===true || r.assist===true);
}

/**
 * その打球をアウトにできたか。
 *
 * <p>空中で捕る打球は捕れたかどうか。落ちてから処理する打球は、
 * 追いついて、なおかつ落とさなければ成功。
 */
function convertedPlay(r){
  if(flyBall(r) && !afterBounce(r)) return r.caughtonfly===true;
  return reachedBall(r) && (r.fumbled!==true || recovered(r));
}

/**
 * 打球の難しさ 5 段階。
 *
 * <p>expect はその段でリーグが処理できる割合。
 * 易しい打球は成功しても伸びず、落とすと大きく減る。
 * 難しい打球はその逆になる。
 */
const REACH_TIERS=[
  {limit:-1.5, name:"必ず追いつける",   expect:0.95},
  {limit:-0.4, name:"大体追いつける",   expect:0.82},
  {limit: 0.5, name:"追いつけそう",     expect:0.50},
  {limit: 2.0, name:"追いつけなさそう", expect:0.18},
  {limit: Infinity, name:"追いつけない", expect:0.03}
];
function reachTier(gap){
  return REACH_TIERS.find(t=>gap<=t.limit) || REACH_TIERS[REACH_TIERS.length-1];
}

/**
 * 打球の系統から、どれだけ捕りやすいか。
 *
 * <p>battedType は「打ち出し角の帯 / 打球速度の帯」。
 * 弱く上がった打球は誰でも追いつけ、速く低い打球は抜けていく。
 * 実測でも LT100 の打球は到達率 50%、200+ は 0% だった。
 */
function battedEase(type){
  const text=String(type||"");
  const part=text.split("/");
  const SPEED={"LT100":1.35, "100-125":1.15, "125-150":1.05,
               "150-175":0.95, "175-200":0.80, "200+":0.65};
  const ANGLE={"LT0":1.10, "0-15":0.90, "15-30":0.95, "30-45":1.05, "45+":1.15};
  const speed=SPEED[part[1]] === undefined ? 1 : SPEED[part[1]];
  const angle=ANGLE[part[0]] === undefined ? 1 : ANGLE[part[0]];
  return speed*angle;
}

/** 同じ打球の行をまとめる鍵。 */
function playKey(r){
  return [r.game, r.inning, r.half, r.pa, r.hangticks, r.landx, r.landz].join("|");
}

/**
 * その打球を誰の守備機会とみなすか。
 *
 * <p>1 つの打球には守った全員の行が残る。そのまま数えると、
 * 味方が処理した打球でも他の 8 人が取りこぼしたことになってしまう。
 * 実際に追いついた人がいればその人、いなければ一番惜しかった人だけを数える。
 */
let FIELD_OWNER=null, FIELD_OWNER_N=-1;
function fieldOwners(){
  if(FIELD_OWNER && FIELD_OWNER_N===DATA.play.length) return FIELD_OWNER;
  const plays=new Map();
  DATA.play.forEach(r=>{
    if(r.kind!=="field") return;
    const gap=reachGap(r);
    if(gap===null) return;
    const key=playKey(r);
    const list=plays.get(key) || plays.set(key, []).get(key);
    list.push({name:r.player, gap, reached:reachedBall(r)});
  });
  const out=new Map();
  plays.forEach((list, key)=>{
    const got=list.find(x=>x.reached);
    const own=got || list.reduce((a,b)=>b.gap<a.gap ? b : a);
    out.set(key, own.name);
  });
  FIELD_OWNER=out; FIELD_OWNER_N=DATA.play.length;
  return out;
}

/** その行が、その打球の守備機会として数える 1 行か。 */
function ownsPlay(r){
  return fieldOwners().get(playKey(r))===r.player;
}

/**
 * 弾いたあとに拾い直したか。
 *
 * <p>ゴロは弾いても拾い直して投げられれば、失敗ではない。
 * ノーバウンドの打球を弾いた場合だけは、バウンドで拾っても落球のまま。
 * 捕れていればアウトだった打球なので、取り返しがつかない。
 */
function recovered(r){
  if(r.fumbleonfly===true) return false;
  return r.threwtobase===true || r.gotout===true || r.assist===true;
}

/** その打球に触れたか。順番は問わない。 */
function touchedBall(r){
  return r.caughtonfly===true || nz(r.touchorder)>0;
}

/**
 * 自分で打球に追いついたか。
 *
 * <p>飛球を捕った人か、その打球に最初に触った人だけを数える。
 * 一塁で送球を受けてアウトにしただけの人は、追いついたことにはしない。
 * ここを分けないと、一塁手が立っているだけで守備範囲が広く出てしまう。
 */
function reachedBall(r){
  return r.caughtonfly===true || nz(r.touchorder)===1;
}

/** 守備位置のまとまり。打球の来かたが違うので、比べる相手を分ける。 */
function fieldGroup(position){
  if(position==="PITCHER" || position==="CATCHER") return "battery";
  return OUTFIELD.has(position) ? "outfield" : "infield";
}

/**
 * リーグ全体の守備の下敷き。
 *
 * <p>打球に追いついた割合と落球の重さを、守備位置のまとまりごとに出す。
 * 打球の難しさを物理で当てるより、同じところを守っている人どうしで
 * 比べたほうが素直に並ぶ。
 */
let FIELD_BASE=null, FIELD_BASE_N=-1;
function fieldBase(){
  if(FIELD_BASE && FIELD_BASE_N===DATA.play.length) return FIELD_BASE;
  const sum={}, all={n:0, reach:0, drop:0, touches:0};
  DATA.play.forEach(r=>{
    if(r.kind!=="field") return;
    const at=String(r.position||"");
    if(!POS_LABEL[at]) return;
    const g=fieldGroup(at);
    const one=sum[g] || (sum[g]={n:0, reach:0, drop:0});
    const drop=(r.fumbled===true && !recovered(r))
      ? ((OUTFIELD.has(at) && r.fumbleonfly===true) ? 3.0 : 1.0) : 0;
    one.n++; all.n++;
    if(reachedBall(r)){ one.reach++; all.reach++; }
    if(touchedBall(r)) all.touches++;
    one.drop+=drop; all.drop+=drop;
  });
  const wide={reach: all.n ? all.reach/all.n : 0.35,
              drop: all.n ? all.drop/all.n : 0.15,
              // 触れた打球あたりの落球。捕球の目盛りはこちらで見る
              touchDrop: all.touches ? all.drop/all.touches : 0.2};
  const out={all:wide};
  ["battery","infield","outfield"].forEach(g=>{
    const one=sum[g];
    // そのまとまりの記録が薄いうちは、リーグ全体のほうへ寄せる
    const trust=one ? Math.min(1, one.n/40) : 0;
    out[g]={
      reach: one ? wide.reach + (one.reach/one.n - wide.reach)*trust : wide.reach,
      drop:  one ? wide.drop  + (one.drop/one.n  - wide.drop )*trust : wide.drop
    };
  });
  FIELD_BASE=out; FIELD_BASE_N=DATA.play.length;
  return out;
}

/**
 * 打球を処理できたときの伸び。
 *
 * <p>平均より上回った分だけを大きく見る。下回った分はそのまま。
 * 守備が上手い人の伸びしろが小さいと、誰も差が出ないため。
 */
const RANGE_GAIN=1.8;
function rangeLift(over){
  return over>0 ? over*RANGE_GAIN : over;
}

/**
 * 少ない記録の割合をリーグ平均へ寄せる。
 *
 * <p>4 機会で落球 0 でも、それは上手い証拠にはならない。
 * 平均どおりの人が prior 回ぶん先にいると考えて混ぜる。
 */
function blendRate(sum, n, base, prior){
  return (sum + base*prior)/(n + prior);
}

/**
 * 守備の集計。
 *
 * <p>Range は「自分で追いついた数 − 同じ守備位置の人なら追いつく数」。
 * 送球を受けただけのアウトは入れない。
 * 捕球は落球の少なさで、外野のノーバウンド落球だけ重く見る。
 * 手が届いていた飛球を落とすのは、失点に直結するため。
 * 肩は送球の速さ、送球の正確さは悪送球の少なさ。
 */
function fieldingLine(rows){
  const base=fieldBase();
  let chances=0, made=0, expected=0;
  let armSum=0, armN=0, assists=0, putouts=0;
  let throws=0, errors=0, errorWeight=0;
  let drops=0, dropWeight=0, bases=0, dropExpected=0, touches=0;
  const tiers={};
  rows.forEach(r=>{
    const sx=nz(r.startx), sz=nz(r.startz), lx=nz(r.landx), lz=nz(r.landz);
    const outfield=OUTFIELD.has(String(r.position||""));
    const speed=nz(r.throwspeed);
    if(speed!==null && speed>0){ armSum+=speed; armN++; }
    if(r.assist===true) assists++;
    if(r.gotout===true) putouts++;
    if(r.threwtobase===true){
      throws++;
      if(r.throwerror===true){
        errors++;
        // 外野の悪送球はそこまで重く見ない。距離があるぶん逸れやすい。
        errorWeight += outfield ? 0.4 : 1.0;
      }
    }
    const allowed=nz(r.basesallowed);
    if(allowed!==null) bases+=allowed;
    if(touchedBall(r)) touches++;
    if(r.fumbled===true && !recovered(r)){
      drops++;
      // 外野のノーバウンド落球は大減点。捕れていれば確実にアウトだった。
      dropWeight += (outfield && r.fumbleonfly===true) ? 3.0 : 1.0;
    }
    const at=String(r.position||"");
    if(!POS_LABEL[at]) return;
    // 難しさが測れて、その打球の受け持ちだった行だけを守備機会に数える
    const gap=reachGap(r);
    if(gap===null || !ownsPlay(r)) return;
    const tier=reachTier(gap);
    chances++;
    // 打球の系統でも捕りやすさは変わる。弱いフライは易しく、速いライナーは難しい。
    expected+=Math.max(0.02, Math.min(0.98, tier.expect*battedEase(r.battedtype)));
    tiers[tier.name]=tiers[tier.name] || {n:0, made:0};
    tiers[tier.name].n++;
    // 落球の起こりやすさは守備位置でそこまで変わらない。リーグ全体で見る。
    dropExpected+=base.all.drop;
    // 空中で捕る打球は捕れたか、落ちてから処理する打球は追いつけたか。
    // 弾いても拾い直したゴロは失敗にしない。
    if(convertedPlay(r)){ made++; tiers[tier.name].made++; }
  });
  // 機会が少ないうちは、平均どおりの人が 16 機会ぶん先にいるものとして混ぜる。
  // 寄せ先はその人が守った位置の平均。外野と内野では来る打球が違う。
  const reachRate=chances ? blendRate(made, chances, expected/chances, 16) : null;
  // 落球は「触れた打球」で割る。触ってもいない打球は関係ない。
  const dropRate=touches
    ? blendRate(dropWeight, touches, base.all.touchDrop, 8) : null;
  return {
    chances, made, expected, reachRate, dropRate, dropExpected, tiers, touches,
    // 1 つのアウトはおよそ 0.75 点ぶんの価値がある
    range: chances ? rangeLift(made-expected)*0.75 : null,
    arm: armN ? armSum/armN : null,
    // 送球の値打ち。刺した数を足し、悪送球と余計な進塁を引く。
    armValue: (armN||throws) ? assists*0.45 - errorWeight*0.5 - bases*0.12 : null,
    // 捕球。落球の重さぶんだけ引く。こぼしはそこまで重く見ない。
    catchRuns: chances ? -dropWeight*0.3 : null,
    throwAccuracy: throws ? 100*(throws-errors)/throws : null,
    drops, dropWeight, assists, putouts, throws, errors, bases
  };
}

/**
 * 走塁の集計。
 *
 * <p>進塁は「1 つ先までは当たり前、2 つ以上進めたら上積み」。
 * 走塁死(タッチアウト・飛び出し)は引く。封殺は走者のせいではないので数えない。
 */
/** 打席 ID → 打席結果。1 球ごとの記録から引く。 */
let PA_RESULT=null, PA_RESULT_N=-1;
function paResults(){
  if(PA_RESULT && PA_RESULT_N===DATA.pitch.length) return PA_RESULT;
  const box={};
  DATA.pitch.forEach(r=>{
    if(r.result && r.pa) box[String(r.pa)]=String(r.result);
  });
  PA_RESULT=box; PA_RESULT_N=DATA.pitch.length;
  return box;
}

/**
 * その打席で、走者が当たり前に進める塁の数。
 *
 * <p>二塁打を打った打者が二塁まで行くのは打撃の成果であって走塁ではない。
 * ここを引いておかないと、長打を打つ人ほど走塁がうまいことになってしまう。
 */
function expectedAdvance(row){
  const result=paResults()[String(row.pa)] || "";
  switch(result){
    case "HOME_RUN": return 4;
    case "TRIPLE": return 3;
    case "DOUBLE": case "GROUND_RULE_DOUBLE": return 2;
    case "SINGLE": case "WALK": case "HIT_BY_PITCH": case "ERROR": return 1;
    case "": return 1;              // 結果が分からない。単打と同じ扱い
    default: return 0;              // アウトになった打席。進めれば走塁の手柄
  }
}

/**
 * もう一つ先の塁を狙えたかの 5 段階。
 *
 * <p>守備が打球に触るまでの時間(touchTicks)で分ける。
 * 触るのが遅い打球ほど、走者は次の塁へ行きやすい。
 * 外野まで届くフライは 5〜6 秒、ライナーでも 4 秒はかかるので、
 * 境目はそのあたりから上に置いてある。
 *
 * <p>expect はその段で進塁できて当たり前という割合。
 * penalty は、行けたはずなのに止まったときに引く点。
 */
const RUN_TIERS=[
  {limit:80,       name:"無理",           expect:0.05, penalty:0},
  {limit:100,      name:"チャレンジ",     expect:0.25, penalty:0},
  {limit:120,      name:"ごぶごぶ",       expect:0.50, penalty:0},
  {limit:150,      name:"進塁できそう",   expect:0.75, penalty:0.25},
  {limit:Infinity, name:"絶対進塁できる", expect:0.95, penalty:0.5}
];

/**
 * 余分な塁を狙える打球か。
 *
 * <p>内野で止まるような当たりでは、どんなに足が速くても
 * もう一つ先へは行けない。走者として出ているときも同じ。
 */
const RUN_MIN_DISTANCE=80;

/**
 * 塁に出ている走者の有利ぶん(tick)。
 *
 * <p>打者走者は振り終わってから走り出すが、塁上の走者は打った瞬間に
 * もう動いている。先の塁にいるほどその差は積み上がるので、
 * 1 つにつきこれだけ touchTicks に足して難易度を見る。
 * 三塁走者が外野への当たりで還れないのは、打者が二塁を狙えないのとは
 * 意味が違う。
 */
const RUN_HEAD_START=30;
function runTier(touchTicks){
  const t=touchTicks===null ? 0 : touchTicks;
  return RUN_TIERS.find(one=>t<one.limit) || RUN_TIERS[RUN_TIERS.length-1];
}

function baserunLine(rows){
  let plays=0, extra=0, outs=0, sprint=0, sprintN=0, held=0;
  let credit=0, penalty=0;
  const tiers={};
  rows.forEach(r=>{
    const from=nz(r.startbase), to=nz(r.endbase);
    plays++;
    const ratio=nz(r.sprintratio);
    if(ratio!==null){ sprint+=ratio; sprintN++; }
    const kind=String(r.outkind||"");
    if(r.outonplay===true && (kind==="TAG"||kind==="DOUBLED_OFF")) outs++;
    if(from===null||to===null) return;
    // 当たり前に進める分を引いた残りが、その人の走塁で稼いだ塁。
    // 本塁より先は無いので、当たり前の分もそこで頭打ちにする。
    const need=Math.min(expectedAdvance(r), 4-from);
    const gained=(to-from)-need;
    const touch=nz(r.touchticks);
    const far=nz(r.distance);
    // 本塁打と、誰も追わずに転がり続けた打球は走塁を測れない。
    // 飛距離が足りない当たりも、そもそも余分な進塁ができない。
    const judge=paResults()[String(r.pa)]!=="HOME_RUN"
      && touch!==null && touch>0 && touch<=300
      && far!==null && far>=RUN_MIN_DISTANCE;
    if(!judge) return;
    // 塁に出ているぶんだけ余裕がある。同じ打球でも三塁走者は還りやすい。
    if(to>=4 && gained<=0){
      // 生還した走者。それ以上進む塁が無いので、走塁の機会として数えない。
      return;
    }
    const tier=runTier(touch + RUN_HEAD_START*Math.max(0, from));
    const one=tiers[tier.name] || (tiers[tier.name]={n:0, made:0});
    one.n++;
    if(gained>0){
      extra+=gained;
      one.made++;
      // 難しい場面で進めたほど大きく加点する
      credit+=gained*(1-tier.expect);
    }else if(to<4 && r.outonplay!==true && tier.penalty>0){
      // 行けたはずの場面で止まった。ごぶごぶ以下は咎めない。
      penalty+=tier.penalty;
      held++;
    }
  });
  return {
    plays, extra, outs, held, tiers,
    sprint: sprintN ? sprint/sprintN : null,
    // 1 つ先の塁はおよそ 0.3 点、走塁死はおよそ 0.5 点の損。
    // 難しい場面で進めたぶんは大きく、行けて当たり前を見送ったぶんは引く。
    runs: plays ? credit*0.3 - penalty*0.3 - outs*0.5 : null,
    extraRate: plays ? 100*(extra-held)/plays : null
  };
}

/* ------------------------------------------------------------- 集計 */
/**
 * 選手ごとの行を覚えておく。
 *
 * <p>打席も投球も、毎回すべての記録を端から見ていた。
 * 画面を移るたびに数え直すと、記録が増えるほど待たされる。
 * 1 度だけ選手ごとに束ねて、読み込みが変わったら作り直す。
 */
let BY_PLAYER=null, BY_PLAYER_N=-1;
function byPlayer(){
  if(BY_PLAYER && BY_PLAYER_N===DATA.plate.length+DATA.pitch.length) return BY_PLAYER;
  const box={plate:{bat:new Map(), pit:new Map()},
             pitch:{bat:new Map(), pit:new Map()}};
  const add=(map, key, row)=>{
    if(!key) return;
    (map.get(key) || map.set(key, []).get(key)).push(row);
  };
  DATA.plate.forEach(r=>{
    add(box.plate.bat, r.batter, r);
    add(box.plate.pit, r.pitcher, r);
  });
  DATA.pitch.forEach(r=>{
    if(r.side==="Pitching") add(box.pitch.pit, r.pitcher, r);
    else if(r.side==="Batting") add(box.pitch.bat, r.batter, r);
    else { add(box.pitch.bat, r.batter, r); add(box.pitch.pit, r.pitcher, r); }
  });
  BY_PLAYER=box;
  BY_PLAYER_N=DATA.plate.length+DATA.pitch.length;
  return box;
}
const NO_ROWS=[];
const plateOf=(n,s)=>byPlayer().plate[s==="bat"?"bat":"pit"].get(n) || NO_ROWS;
const pitchOf=(n,s)=>byPlayer().pitch[s==="bat"?"bat":"pit"].get(n) || NO_ROWS;
function line(rows){
  const c={}; rows.forEach(r=>{c[r.result]=(c[r.result]||0)+1;});
  const pa=rows.length;
  const ab=rows.reduce((n,r)=>n+(NOT_AB.has(r.result)?0:1),0);
  const h=rows.reduce((n,r)=>n+(HIT.has(r.result)?1:0),0);
  const tb=(c.SINGLE||0)+2*(c.DOUBLE||0)+3*(c.TRIPLE||0)+4*(c.HOME_RUN||0);
  const bb=c.WALK||0, hbp=c.HIT_BY_PITCH||0, so=c.STRIKE_OUT||0, sf=c.SACRIFICE_FLY||0;
  const rbi=rows.reduce((n,r)=>n+(Number(r.rbi)||0),0);
  const den=ab+bb+hbp+sf;
  const obp=den?(h+bb+hbp)/den:null, slg=ab?tb/ab:null;
  return {counts:c,pa,ab,h,tb,bb,hbp,so,rbi,hr:c.HOME_RUN||0,d2:c.DOUBLE||0,d3:c.TRIPLE||0,
    avg:ab?h/ab:null, obp, slg, ops:(obp!==null&&slg!==null)?obp+slg:null,
    kRate:pa?100*so/pa:null, bbRate:pa?100*bb/pa:null};
}
function summarize(rows){
  const bip=rows.filter(r=>r.contact===true&&r.call==="IN_PLAY"&&Number(r.exit_velocity)>0);
  const swings=rows.filter(r=>r.swing===true).length;
  const whiffs=rows.filter(r=>r.whiff===true).length;
  const outZone=rows.filter(r=>r.in_zone===false);
  const chase=outZone.filter(r=>r.swing===true).length;
  let xba=0,xslg=0,barrel=0,hard=0,sweet=0,ev=0,gb=0,fly=0;
  bip.forEach(r=>{
    const e=Number(r.exit_velocity), l=Number(r.launch_angle), x=battedExpectation(e,l);
    xba+=x.ba; xslg+=x.tb; ev+=e;
    if(isBarrel(e,l)) barrel++;
    if(e>=153) hard++;
    if(l>=8&&l<=32) sweet++;
    // 10 度未満がゴロ、25 度以上がフライ。その間はライナーでどちらでもない。
    if(l<10) gb++;
    if(l>=25) fly++;
  });
  // バットスピード。ゲージ 0% で 85km/h、100% で 135km/h。
  // そこへ使っていたバットのパワーを掛ける。
  let speedSum=0, speedN=0, sqSum=0, sqN=0;
  rows.forEach(r=>{
    if(r.swing!==true) return;
    const gauge=Number(r.swing_power), power=Number(r.bat_power);
    if(!isFinite(gauge) || !isFinite(power) || power<=0) return;
    const bat=(85+50*Math.max(0,Math.min(1,gauge)))*power;
    speedSum+=bat; speedN++;
    const e=Number(r.exit_velocity);
    if(r.contact===true && r.call==="IN_PLAY" && e>0){
      // 芯で捉えた度合い。分母は「その振りで出せるはずの打球速度」。
      // 球速の分は 150km/h で揃える。
      sqSum+=100*e/(bat*1.23 + 150*0.23); sqN++;
    }
  });
  const n=bip.length;
  // 打席の数と四死球も record から数える。
  // 打席結果は 1 球ごとの記録にも入っているので、result 側と混ぜずに済む。
  const ended=rows.filter(r=>r.result);
  const bb=ended.filter(r=>r.result==="WALK").length;
  const hbp=ended.filter(r=>r.result==="HIT_BY_PITCH").length;
  const so=ended.filter(r=>r.result==="STRIKE_OUT").length;
  // xBA と xSLG は打数で割る。打球だけで割ると「インプレーになったときの打率」に
  // なってしまい、三振の分が抜けて実際の打率と比べられない。
  // 三振は期待値 0 の打数として分母にだけ入れる。
  const ab=n+so;
  return {n,bip,pitches:rows.length,swings,whiffs,xbaSum:xba,
    batSpeed: speedN ? speedSum/speedN : null,
    squared:  sqN ? sqSum/sqN : null, squaredN:sqN, speedN,
    pa:ended.length, bb, hbp, so, ab,
    xba:ab?xba/ab:null, xslg:ab?xslg/ab:null, ev:n?ev/n:null,
    barrel:n?100*barrel/n:null, hard:n?100*hard/n:null,
    sweet:n?100*sweet/n:null, gb:n?100*gb/n:null, fly:n?100*fly/n:null,
    chase:outZone.length?100*chase/outZone.length:null,
    whiff:swings?100*whiffs/swings:null};
}

/* --------------------------------------------------- 投手の成績(result から) */
/**
 * 投球回・防御率など。
 *
 * <p>result の outs 列(そのプレーで取ったアウト)を足して投球回にする。
 * 自責点は分けて記録していないので、失点をそのまま防御率に使う。
 */
function pitcherLine(rows){
  const L=line(rows);
  const outs=rows.reduce((n,r)=>n+(Number(r.outs)||0),0);
  const runs=rows.reduce((n,r)=>n+(Number(r.runs)||0),0);
  const ip=outs/3;
  return Object.assign(L, {outs, runs, ip,
    // 5 回制なので 5 回あたりの失点を防御率とする
    era: ip? GAME_INNINGS*runs/ip : null,
    whip: ip? (L.h+L.bb)/ip : null});
}
/** 投球回の表示。5 回 1/3 なら 5.1。 */
function ipText(outs){
  if(!isFinite(outs)) return "—";
  return Math.floor(outs/3)+"."+(outs%3);
}
/** その行は裏の攻撃か。 */
const isBottom=r=>String(r.half||"").toUpperCase().startsWith("B");

/**
 * 勝ち投手と負け投手。
 *
 * <p>規定投球回のような縛りは置かない。
 * 「最後に勝ち越した回の 1 つ前の回で 3 アウト目を取った投手」が勝利投手、
 * 「その勝ち越し点を許した投手」が敗戦投手。
 */
function decisions(rows){
  if(!rows.length) return null;
  let top=0, bottom=0;
  const walk=rows.map(r=>{
    if(isBottom(r)) bottom+=Number(r.runs)||0; else top+=Number(r.runs)||0;
    return {r, bottom:isBottom(r), top:top, bot:bottom};
  });
  const last=walk[walk.length-1];
  if(last.top===last.bot) return null;              // 引き分け
  const winnerIsBottom=last.bot>last.top;
  // 勝ったチームがリードを取り、そのまま最後まで手放さなかった打席を後ろから探す
  let go=0;
  for(let i=walk.length-1;i>=0;i--){
    const lead=winnerIsBottom ? walk[i].bot-walk[i].top : walk[i].top-walk[i].bot;
    if(lead<=0){ go=i+1; break; }
  }
  if(go>=walk.length) return null;
  const goRow=walk[go].r;
  const lose=goRow.pitcher||"";
  // 勝ち越した回の 1 つ前の回(勝ったチームの守り)の 3 アウト目
  let win="";
  const sameHalf=(a,b)=>Number(a.inning)===Number(b.inning) && isBottom(a)===isBottom(b);
  let j=go-1;
  while(j>=0 && sameHalf(walk[j].r, goRow)) j--;
  if(j>=0){
    const prev=walk[j].r;
    // その回の最後にアウトを取った打席
    let k=j;
    while(k>=0 && sameHalf(walk[k].r, prev) && !(Number(walk[k].r.outs)>0)) k--;
    win=(k>=0 && sameHalf(walk[k].r, prev)) ? (walk[k].r.pitcher||"") : (prev.pitcher||"");
  }else{
    // 初回に勝ち越した。勝ったチームの先発を勝利投手にする
    const first=rows.find(r=>isBottom(r)!==winnerIsBottom);
    win=first ? (first.pitcher||"") : "";
  }
  return {win, lose, goRow, winnerIsBottom};
}
/**
 * その試合のセーブとホールド。
 *
 * <p>セーブ = 途中登板で、勝った側の投手として最終回の 3 アウト目を取った投手。
 * 勝利投手には付けない。
 *
 * <p>ホールド = 途中登板で、同点かリードしている場面で登板し、
 * 同点で入ったなら勝ち越されも勝ち越しもしないまま、
 * リードで入ったなら追いつかれも逆転もされないまま投げ終えた投手。
 * セーブが付いた投手には付けない。
 */
function reliefCredits(rows, decided){
  const out={save:"", holds:[]};
  if(!rows.length) return out;
  let top=0, bottom=0;
  const walk=rows.map(r=>{
    const low=isBottom(r);
    if(low) bottom+=Number(r.runs)||0; else top+=Number(r.runs)||0;
    // 投げているのは守っている側。表の攻撃なら投手は後攻(1)。
    return {r, side: low?0:1, top, bot:bottom, outs:Number(r.outs)||0};
  });
  const last=walk[walk.length-1];
  if(last.top===last.bot) return out;                 // 引き分けなら付かない
  const winnerSide = last.bot>last.top ? 1 : 0;
  const lead=(w,side)=> side===0 ? w.top-w.bot : w.bot-w.top;

  // 各チームの先発と、投手ごとの登板の範囲
  const starter={}, span={};
  walk.forEach((w,i)=>{
    if(starter[w.side]===undefined) starter[w.side]=w.r.pitcher||"";
    const name=w.r.pitcher||"";
    if(!name) return;
    if(!span[name]) span[name]={side:w.side, from:i, to:i};
    else span[name].to=i;
  });
  const relief=name=>name && span[name] && starter[span[name].side]!==name;

  // セーブ
  const closer=last.r.pitcher||"";
  if(relief(closer) && span[closer].side===winnerSide
     && last.outs>0 && closer!==(decided&&decided.win)){
    out.save=closer;
  }
  // ホールド
  Object.keys(span).forEach(name=>{
    if(!relief(name) || name===out.save) return;
    const {side, from, to}=span[name];
    const before = from>0 ? walk[from-1] : {top:0, bot:0};
    const entry = lead(before, side);
    if(entry<0) return;                                // 負けている場面での登板
    for(let i=from;i<=to;i++){
      const now=lead(walk[i], side);
      if(now<0) return;                                // 逆転された
      if(entry>0 && now<=0) return;                    // 追いつかれた
    }
    // 同点で入ったのに味方が勝ち越したら、その投手は勝ち投手側の扱い
    if(entry===0 && lead(walk[to], side)>0) return;
    out.holds.push(name);
  });
  return out;
}

/** 読み込んである全部の試合の責任投手。名前 -> {w,l,sv,hld}。 */
function decisionMap(){
  const out={};
  const at=name=>(out[name]=out[name]||{w:0,l:0,sv:0,hld:0});
  gameIds().forEach(g=>{
    const rows=DATA.plate.filter(r=>String(r.game_id)===g);
    const d=decisions(rows);
    if(d){
      if(d.win) at(d.win).w++;
      if(d.lose) at(d.lose).l++;
    }
    const relief=reliefCredits(rows, d);
    if(relief.save) at(relief.save).sv++;
    relief.holds.forEach(name=>at(name).hld++);
  });
  return out;
}
/** その試合でその投手に付いた救援の記録。 */
function reliefFor(gameId, name, which){
  const rows=DATA.plate.filter(r=>String(r.game_id)===gameId);
  const relief=reliefCredits(rows, decisions(rows));
  if(which==="save") return relief.save===name ? 1 : 0;
  return relief.holds.includes(name) ? 1 : 0;
}
function reliefTotal(name, which){
  return gameIds().reduce((n,g)=>n+reliefFor(g,name,which),0);
}
function gameIds(){
  return [...new Set(DATA.plate.map(r=>String(r.game_id)).filter(Boolean))].sort();
}
/**
 * 試合 ID の見せ方。
 *
 * <p>20260910 + 通し番号 02 なら「2026/9/10 二試合目」。
 * 形が違う ID はそのまま出す。
 */
function gameLabel(id){
  const text=String(id||"");
  const m=text.match(/^(\d{4})(\d{2})(\d{2})(\d{0,2})$/);
  if(!m) return text;
  const month=Number(m[2]), day=Number(m[3]), no=Number(m[4]);
  if(month<1 || month>12 || day<1 || day>31) return text;
  const count=no>0 ? " " + no + "試合目" : "";
  return `${m[1]}/${month}/${day}${count}`;
}

/* ============================================== 走者を追って得点を割り当てる
   result は 1 打席 1 行で、誰が生還したかまでは持っていない。
   打席の並びから塁上の顔ぶれを組み立て、得点と自責点をその人へ割り当てる。 */

/** 打者が塁に出たときの到達塁。出なければ 0。 */
function reachedBase(result){
  switch(result){
    case "SINGLE": case "WALK": case "HIT_BY_PITCH": case "ERROR":
    case "FIELDERS_CHOICE": return 1;
    case "DOUBLE": case "GROUND_RULE_DOUBLE": return 2;
    case "TRIPLE": return 3;
    case "HOME_RUN": return 4;
    default: return 0;
  }
}

/** その打席で前の走者が進む塁の数。 */
function pushBases(result){
  switch(result){
    case "DOUBLE": case "GROUND_RULE_DOUBLE": return 2;
    case "TRIPLE": return 3;
    case "HOME_RUN": return 4;
    case "SACRIFICE_FLY": case "SACRIFICE_BUNT": return 1;
    default: return 1;
  }
}

let SCORE_BOOK=null, SCORE_BOOK_N=-1;
/**
 * 走者の出入りを追って、得点と自責点を人ごとにまとめる。
 *
 * <p>塁が埋まっているかは result の runnerOnFirst などが正しいので、
 * そちらを真として、誰がそこにいるかだけをこちらで組み立てる。
 * 食い違ったら記録のほうに合わせる。
 *
 * @return {runs:{名前:得点}, allowed:{投手:失点}, earned:{投手:自責点},
 *          byGame:{名前:{試合:得点}}}
 */
function scoreBook(){
  if(SCORE_BOOK && SCORE_BOOK_N===DATA.plate.length) return SCORE_BOOK;
  const runs={}, allowed={}, earned={}, byGame={};
  const add=(box,key,n)=>{ if(key) box[key]=(box[key]||0)+n; };
  // 試合 → 表裏 → 回 の順に並べ直す
  const halves=new Map();
  DATA.plate.forEach(r=>{
    const key=[String(r.game_id), r.inning, r.half].join("|");
    (halves.get(key) || halves.set(key,[]).get(key)).push(r);
  });
  halves.forEach(rows=>{
    // 記録された順がそのまま打順
    let bases=[null,null,null];          // 1塁・2塁・3塁にいる走者
    rows.forEach(r=>{
      const result=String(r.result||"");
      const game=String(r.game_id);
      // 打席前の塁の状況は記録のほうが正しい。顔ぶれだけ合わせる。
      const want=[r.base1===true, r.base2===true, r.base3===true];
      for(let i=0;i<3;i++){
        if(want[i] && !bases[i]) bases[i]={name:"", pitcher:r.pitcher, earned:true};
        if(!want[i]) bases[i]=null;
      }
      const scored=Number(r.runs)||0;
      const push=pushBases(result);
      const reach=reachedBase(result);
      // 先の塁にいる人から順に進める
      const home=[];
      for(let i=2;i>=0;i--){
        if(!bases[i]) continue;
        const at=i+1+push;
        if(at>=4){ home.push(bases[i]); bases[i]=null; }
        else { const to=at-1; if(!bases[to]) { bases[to]=bases[i]; bases[i]=null; } }
      }
      if(reach===4) home.push({name:r.batter, pitcher:r.pitcher, earned:result!=="ERROR"});
      // 記録の得点数に合わせる。多ければ手前の人を戻し、少なければ足す。
      while(home.length>scored) home.pop();
      while(home.length<scored){
        let taken=null;
        for(let i=2;i>=0;i--){ if(bases[i]){ taken=bases[i]; bases[i]=null; break; } }
        home.push(taken || {name:"", pitcher:r.pitcher, earned:true});
      }
      home.forEach(one=>{
        add(runs, one.name, 1);
        add(allowed, one.pitcher, 1);
        if(one.earned) add(earned, one.pitcher, 1);
        if(one.name){
          byGame[one.name]=byGame[one.name]||{};
          byGame[one.name][game]=(byGame[one.name][game]||0)+1;
        }
      });
      if(reach>0 && reach<4){
        const to=reach-1;
        bases[to]={name:r.batter, pitcher:r.pitcher, earned:result!=="ERROR"};
      }
    });
  });
  SCORE_BOOK={runs, allowed, earned, byGame};
  SCORE_BOOK_N=DATA.plate.length;
  return SCORE_BOOK;
}

/**
 * 完投と完封。
 *
 * <p>その試合でチームの投手が自分ひとりなら完投。
 * そのうえで 1 点も与えていなければ完封。
 */
function completeGames(name){
  let cg=0, sho=0;
  const mine=new Set(plateOf(name,"pit").map(r=>String(r.game_id)));
  mine.forEach(game=>{
    const rows=DATA.plate.filter(r=>String(r.game_id)===game && r.pitcher===name);
    if(!rows.length) return;
    // 自分が投げた回の表裏。そこに自分以外の投手がいれば完投ではない。
    const halves=new Set(rows.map(r=>String(r.half)));
    const others=DATA.plate.filter(r=>String(r.game_id)===game
      && halves.has(String(r.half)) && r.pitcher && r.pitcher!==name);
    if(others.length) return;
    cg++;
    const runs=rows.reduce((n,r)=>n+(Number(r.runs)||0),0);
    if(runs===0) sho++;
  });
  return {cg, sho};
}

/** その選手の得点。 */
function runsOf(name){
  return scoreBook().runs[name] || 0;
}
/** その選手のその試合の得点。 */
function runsOfGame(name, game){
  const one=scoreBook().byGame[name];
  return one ? (one[String(game)] || 0) : 0;
}
/** その投手の自責点。途中交代でも、出した走者が還った分だけ背負う。 */
function earnedOf(name){
  return scoreBook().earned[name] || 0;
}

/* ------------------------------------------------------------- wRC+ */
/** wOBA。重みは一般的なもの。result から出す。 */
function wobaOf(L){
  const single=L.h-L.d2-L.d3-L.hr;
  const den=L.ab+L.bb+L.hbp+(L.counts.SACRIFICE_FLY||0);
  if(!den) return null;
  return (0.699*L.bb + 0.728*L.hbp + 0.883*single
        + 1.244*L.d2 + 1.569*L.d3 + 2.004*L.hr) / den;
}
let LEAGUE=null;
/** リーグ全体の基準。wRC+ を出すのに使う。読み込みが変わったら作り直す。 */
function league(){
  if(LEAGUE && LEAGUE.rows===DATA.plate.length) return LEAGUE;
  const L=line(DATA.plate);
  const runs=DATA.plate.reduce((n,r)=>n+(Number(r.runs)||0),0);
  LEAGUE={rows:DATA.plate.length, woba:wobaOf(L), rpa:L.pa?runs/L.pa:null};
  return LEAGUE;
}
/**
 * wRC+。100 がリーグ平均。
 * リーグの平均は読み込んである result 全部から出しているので、
 * ファイルを足すと基準も動く。球場補正は入れていない。
 */
function wrcPlus(L){
  const lg=league();
  const w=wobaOf(L);
  if(w===null||lg.woba===null||!lg.rpa) return null;
  const scale=1.25;
  return 100*((w-lg.woba)/scale + lg.rpa)/lg.rpa;
}

/* ====================================================== Run Value
   1 球ごとに「この球で得点期待値がどれだけ動いたか」を足していく。
   カウントが進めば投手が得をし、打たれれば損をする。
   打者側は打撃・走塁・守備の 3 つに分けて出す。 */

/** カウントごとの得点期待値(打者から見た点)。0-0 を 0 とする。 */
const COUNT_VALUE={"0-0":0.000, "0-1":-0.037, "0-2":-0.101,
  "1-0":0.032, "1-1":-0.015, "1-2":-0.082,
  "2-0":0.095, "2-1":0.036, "2-2":-0.042,
  "3-0":0.207, "3-1":0.132, "3-2":0.040};

/**
 * この試合の得点の入りやすさ。MLB の何倍かで見る。
 *
 * <p>カウントの表は MLB のものなので、点の入りやすさの違いだけ伸ばす。
 */
function runScale(){
  const lg=league();
  return lg.rpa ? Math.max(0.5, Math.min(4, lg.rpa/0.117)) : 1;
}

/** 打席が終わったときの値打ち。リーグ平均の打席を 0 とした点。 */
function endValue(woba){
  const lg=league();
  if(lg.woba===null) return 0;
  return (woba-lg.woba)/1.25;
}

/**
 * その 1 球で動いた点(打者から見て)。
 *
 * <p>打席が決まった球は結果の値打ち、そうでなければカウントの進み方。
 */
function pitchValue(r){
  const before=COUNT_VALUE[String(r.count||"0-0")];
  if(before===undefined) return null;
  const done=String(r.result||"");
  if(done==="WALK") return endValue(0.699)-before*runScale();
  if(done==="HIT_BY_PITCH") return endValue(0.728)-before*runScale();
  if(done==="STRIKE_OUT") return endValue(0)-before*runScale();
  if(r.call==="IN_PLAY"){
    const e=Number(r.exit_velocity), l=Number(r.launch_angle);
    const x=battedExpectation(e,l);
    // 期待安打率と期待塁打から、その打球の期待 wOBA を作る。
    // 1 つ余分に進む塁はおよそ 0.37 の重み。
    const woba=0.883*x.ba + 0.37*Math.max(0, x.tb-x.ba);
    return endValue(woba)-before*runScale();
  }
  const parts=String(r.count||"0-0").split("-").map(Number);
  const b=parts[0]||0, st=parts[1]||0;
  const next=(r.call==="BALL") ? (b+1)+"-"+st : b+"-"+Math.min(2, st+1);
  const after=COUNT_VALUE[next];
  if(after===undefined) return null;
  return (after-before)*runScale();
}

/** チェンジアップ系。ブレーキングのうち、遅くて沈む球。 */
const OFFSPEED=new Set(["チェンジアップ","チェンジオブペース","サークルチェンジ",
  "スローカーブ","スローシンカー","シンカー","カーブ"]);

/** 表に載っている球種か。 */
function knownType(name){
  return Object.keys(BREAK_DIRECTION)
    .some(k=>BREAK_DIRECTION[k].indexOf(name)>=0);
}

/**
 * その球が速球系かブレーキング系か。
 *
 * <p>上へ伸びる球として登録してあるものが速球。
 * 表に無い球種は速さで見分ける(110km/h 以上なら速球)。
 */
function pitchClass(name, velocity){
  if(BREAK_DIRECTION.up.indexOf(name)>=0) return "fast";
  if(knownType(name) || OFFSPEED.has(name)) return "breaking";
  return (isFinite(velocity) && velocity>=110) ? "fast" : "breaking";
}

/** オフスピード(ブレーキングのうち遅い球)か。 */
function isOffspeed(name, velocity){
  if(pitchClass(name, velocity)!=="breaking") return false;
  if(OFFSPEED.has(name)) return true;
  return !knownType(name) && isFinite(velocity) && velocity<80;
}

/**
 * 投手の Run Value。100 球あたりの点で出す。
 *
 * <p>球数が 10 に満たない区分は出さない。たまたま 1 球で大きく振れるため。
 */
function pitchRunValues(rows){
  const sum={all:0, fast:0, breaking:0, offspeed:0};
  const n={all:0, fast:0, breaking:0, offspeed:0};
  rows.forEach(r=>{
    const v=pitchValue(r);
    if(v===null) return;
    const name=String(r.type||"");
    const speed=Number(isFinite(Number(r.init_velocity)) && r.init_velocity!==""
      ? r.init_velocity : r.velocity);
    const cls=pitchClass(name, speed);
    sum.all-=v; n.all++;
    sum[cls]-=v; n[cls]++;
    if(isOffspeed(name, speed)){ sum.offspeed-=v; n.offspeed++; }
  });
  const per=k=>n[k]>=10 ? 100*sum[k]/n[k] : null;
  return {pitching:per("all"), fast:per("fast"),
    breaking:per("breaking"), offspeed:per("offspeed"), n};
}

/** 内野安打の数。走塁の値打ちに足す。 */
function infieldHits(name){
  return pitchOf(name,"bat").filter(r=>{
    if(r.result!=="SINGLE") return false;
    const la=Number(r.launch_angle), d=distanceOf(r);
    return isFinite(la) && la<10 && isFinite(d) && d>0 && d<=40;
  }).length;
}

/**
 * 打者の Run Value。打撃・走塁・守備の 3 つ。
 *
 * <p>打撃は wOBA がリーグ平均からどれだけ離れているか × 打席数。
 * 走塁は余分な進塁に内野安打を足したもの。足の速さは内野安打にも出る。
 * 守備は追いつき・捕球・送球を足したもの。
 */
function batterRunValues(name){
  const each=gamesPlayed(name);
  const L=line(plateOf(name,"bat"));
  const lg=league();
  const w=wobaOf(L);
  // 打撃は打席あたりの良さで見て、1 試合ぶんの打席数に直す。
  // 出た試合で割ると、打順が上で打席の多い人だけが得をしてしまい、
  // OPS の並びと食い違う。
  const bat=(w===null || lg.woba===null || !L.pa) ? null
    : (w-lg.woba)/1.25*leaguePaPerGame();
  const B=baserunLine(playOf(name,"run"));
  const F=fieldingLine(playOf(name,"field"));
  const infield=infieldHits(name);
  // 打球への追いつきも足の速さの表れなので、少しだけ走塁にも足す
  const legs=F.chances ? (F.range||0)*0.25 : 0;
  const run=(B.plays || infield)
    ? (B.runs||0) + infield*0.30 + legs : null;
  const field=F.chances
    ? (F.range||0)+(F.catchRuns||0)+(F.armValue||0) : null;
  // 走塁と守備は積み上げた点なので、出た試合で割って揃える。
  // 打撃はもともと打席あたりで出しているので、そのまま。
  const per=v=>v===null || !each ? null : v/each;
  return {bat, run:per(run), field:per(field)};
}

/** リーグの 1 試合あたりの打席数。打撃の点を試合の単位に直すのに使う。 */
let LEAGUE_PA_GAME=null, LEAGUE_PA_GAME_N=-1;
function leaguePaPerGame(){
  if(LEAGUE_PA_GAME!==null && LEAGUE_PA_GAME_N===DATA.plate.length) return LEAGUE_PA_GAME;
  const games=gameIds().length;
  // 1 試合には両チームぶんの打席が入っているので、打者 1 人ぶんへ均す
  const perSide=games ? DATA.plate.length/games/9 : 4;
  LEAGUE_PA_GAME=Math.max(1, perSide);
  LEAGUE_PA_GAME_N=DATA.plate.length;
  return LEAGUE_PA_GAME;
}

/** その選手が出た試合の数。打席と投球のどちらかがあれば 1 試合。 */
function gamesPlayed(name){
  const games=new Set();
  DATA.plate.forEach(r=>{
    if(r.batter===name || r.pitcher===name) games.add(String(r.game_id));
  });
  return games.size;
}

const f3=v=>v===null||!isFinite(v)?"—":v.toFixed(3).replace(/^0\./,".");
const f1=v=>v===null||!isFinite(v)?"—":v.toFixed(1);
const pc=v=>v===null||!isFinite(v)?"—":v.toFixed(1);
const f2=v=>v===null||!isFinite(v)?"—":v.toFixed(2);

/**
 * 画面を組む。中で落ちても真っ白にはしない。

 * <p>csv の列がずれているなど、1 つの記録が壊れているだけで

}

/**
 * 狭い画面で、能力画面を折り返さずに縮めて収める。
 *
 * <p>この画面は左右 2 枚の札で 1 つの絵になっているので、
 * 折り返すと読み方が変わってしまう。並びはそのままに、
 * 入る大きさまで縮める。
 */
const PAWA_DESIGN_WIDTH=980;
function fitPawa(){
  const box=document.querySelector(".pawafit");
  if(!box) return;
  const room=box.parentElement ? box.parentElement.clientWidth : 0;
  box.style.width="";
  box.style.transform="";
  box.style.height="";
  if(!room || room>=PAWA_DESIGN_WIDTH) return;
  const k=room/PAWA_DESIGN_WIDTH;
  box.style.width=PAWA_DESIGN_WIDTH+"px";
  box.style.transformOrigin="top left";
  box.style.transform="scale("+k.toFixed(4)+")";
  // 縮めても場所取りは元の大きさのままなので、下に余白が残る。
  // 高さは 980px 幅で組んだときの中身の高さ × 倍率。
  // 組み終わってから測らないと、下(特殊能力のあたり)が切れる。
  const fix=()=>{
    const tall=Math.max(box.scrollHeight,
      box.firstElementChild ? box.firstElementChild.scrollHeight : 0);
    box.style.height=Math.ceil(tall*k)+"px";
  };
  fix();
  // 描き終わってからもう一度測る。字の読み込みで高さが変わることがある。
  if(typeof requestAnimationFrame==="function") requestAnimationFrame(fix);
}
window.addEventListener("resize", ()=>{ if(VIEW==="pawa") fitPawa(); });

/**

 * <p>record/<名前>_play.csv がある選手だけ出す。

function fieldingPanel(name){
  const F=fieldingLine(playOf(name,"field"));
  const B=baserunLine(playOf(name,"run"));
  if(!F.chances && !B.plays) return "";
  const per=(value, n) => value===null||!n ? null : value/n;
  const rows=[
    ["Range","打球への到達","range", per(F.range,F.chances), v=>v.toFixed(3)],
    ["Arm Value","送球の値打ち","arm_value", per(F.armValue,Math.max(1,F.throws)),
      v=>v.toFixed(3)],
    ["Arm","送球の速さ","arm", F.arm, f1],
    ["Baserunning","走塁の値打ち","baserun", per(B.runs,B.plays), v=>v.toFixed(3)]
  ];
  return `<div class="pad" style="padding-top:10px">
      <div class="head">守備と走塁<small>守備 ${F.chances} 機会 / 走塁 ${B.plays} 回</small></div>
    </div>
    ${rows.map(r=>prow(...r)).join("")}`;
}
function prow(name, sub, key, value, fmt){
  // 先頭が "#" の行はくくりの見出し。棒は出さない。
  if(name==="#") return `<div class="pgroup">${esc(sub)}</div>`;
  const s=score(key,value), color=scoreColor(s), w=s===null?0:s;
  return `<div class="prow">
    <div class="nm">${name}${sub?`<small>${sub}</small>`:""}</div>
    <div class="bar">
      <div class="fill" style="width:${w}%; background:${color}"></div>
      <div class="tickmid"></div>
      ${s===null?"":`<div class="num" style="left:${w}%; background:${color}">${s}</div>`}
    </div>
    <div class="val">${value===null||!isFinite(value)?"—":fmt(value)}</div>
  </div>`;
}

/* ------------------------------------------------- 選手の別名

   プレイヤー ID を変えた人を、同じ選手としてまとめるための表。
   players.yml に、まとめ先の名前とそのときの ID を並べて書く。

     Players:
       sota2486:
         - sota_old
         - sota2486_2

   読み込んだあと ALIAS_NAME を通して、記録の中の名前を書き換える。 */

/**
 * players.yml を読む。
 *
 * <p>入れ子は 2 段だけなので、行頭の空白の数で見る。
 * 見出しの行がまとめ先の名前、その下の「- 」で始まる行が昔の ID。
 */
function ingestPlayers(text){
  const lines=String(text).replace(/\r/g,"").split("\n");
  let inRoot=false, rootIndent=0, current="", added=0;
  for(const raw of lines){
    const line=raw.trim();
    if(!line || line.startsWith("#")) continue;
    const indent=raw.length-raw.replace(/^ +/,"").length;
    if(!inRoot){
      if(/^Players\s*:$/i.test(line)){ inRoot=true; rootIndent=indent; }
      continue;
    }
    if(indent<=rootIndent) break;
    const item=line.match(/^-\s*['"]?([^'"]+?)['"]?$/);
    if(item){
      if(current){ ALIAS_NAME[item[1].trim()]=current; added++; }
      continue;
    }
    const head=line.match(/^['"]?([^'":]+?)['"]?\s*:(.*)$/);
    if(head){
      current=head[1].trim();
      // 1 行で書いた場合 (name: [a, b]) にも付き合う
      const inline=head[2].trim().replace(/^\[|\]$/g,"");
      if(inline){
        inline.split(",").forEach(one=>{
          const id=one.trim().replace(/^['"]|['"]$/g,"");
          if(id){ ALIAS_NAME[id]=current; added++; }
        });
      }
    }
  }
  return added ? "players" : null;
}

/** 別名を今の名前に直す。 */
const canon=name => ALIAS_NAME[name] || name;

/**
 * 読み込んだ記録の名前を、まとめ先の名前に置き換える。
 *
 * <p>別名表があとから読まれることもあるので、読み込みが済んでから 1 度だけ通す。
 */
function applyAliases(){
  if(!Object.keys(ALIAS_NAME).length) return;
  DATA.plate.forEach(r=>{
    if(r.batter) r.batter=canon(r.batter);
    if(r.pitcher) r.pitcher=canon(r.pitcher);
  });
  DATA.pitch.forEach(r=>{
    if(r.batter) r.batter=canon(r.batter);
    if(r.pitcher) r.pitcher=canon(r.pitcher);
  });
  DATA.play.forEach(r=>{
    if(r.player) r.player=canon(r.player);
  });
  // 顔も付け替える。昔の ID のファイル名で置いてあることがある。
  Object.keys(ALIAS_NAME).forEach(old=>{
    const now=ALIAS_NAME[old];
    if(FACES[old] && !FACES[now]) FACES[now]=FACES[old];
  });
}

/** 試合ごとの成績表。最後に通算行。 */
function gameTable(rows, cols, calc){
  calc = calc || line;
  const games=[...new Set(rows.map(r=>String(r.game_id)))].sort();
  const body=games.map(g=>{
    const L=calc(rows.filter(r=>String(r.game_id)===g));
    return `<tr><td>${esc(gameLabel(g))}</td>${cols.map(c=>`<td>${c.get(L,g)}</td>`).join("")}</tr>`;
  }).join("");
  const T=calc(rows);
  return `<div class="gamescroll"><table>
    <thead><tr><th>試合</th>${cols.map(c=>`<th>${c.head}</th>`).join("")}</tr></thead>
    <tbody>${body}
      <tr class="total"><td>${games.length} 試合</td>${cols.map(c=>`<td>${c.get(T,null)}</td>`).join("")}</tr>
    </tbody></table></div>`;
}
/** その試合の勝ち投手(または負け投手)がその選手なら 1。 */
function decisionFor(gameId, name, which){
  const d=decisions(DATA.plate.filter(r=>String(r.game_id)===gameId));
  return d && d[which]===name ? 1 : 0;
}
function decisionTotal(name, which){
  return gameIds().reduce((n,g)=>n+decisionFor(g,name,which),0);
}

/**
 * 主要成績の上位 3 人。
 *
 * @param filter 規定に届いた選手だけに絞るとき。null なら全員
 * @param high   大きいほうが上位か
 */
function card(title, rows, filter, get, fmt, high){
  const pool=rows.filter(d=>{
    if(filter && !filter(d)) return false;
    const v=get(d);
    return v!==null && v!==undefined && isFinite(v);
  }).sort((a,b)=>high ? get(b)-get(a) : get(a)-get(b));
  // 同じ値なら同じ順位。3 位が並んだら人数で添える。
  let place=0, last=null;
  const ranked=pool.map((d,i)=>{
    const v=get(d);
    if(last===null || Math.abs(v-last)>1e-9){ place=i+1; last=v; }
    return {d, v, place};
  });
  const within=ranked.filter(one=>one.place<=3);
  const list=within.slice(0,3);
  const rest=within.length-list.length;
  const body=list.length
    ? `<ol class="tied">${list.map((one,i)=>`<li class="plink" data-who="${esc(one.d.name)}">
        <i class="rank">${one.place}</i>${face(one.d.name,20)}
        <span>${esc(one.d.name)}${
          rest && i===list.length-1 ? `<em class="tiedrest">ほか ${rest} 人</em>` : ""
        }</span><b>${fmt(one.v)}</b></li>`).join("")}</ol>`
    : '<div class="empty">記録がありません</div>';
  return `<div class="card"><h4>${title}</h4>${body}</div>`;
}

/** その項目が大きい打席を上位 5 つ。record の打球から拾う。 */
function topBatted(key){
  return DATA.pitch
    .filter(r=>r.contact===true && r.call==="IN_PLAY" && Number(r.exit_velocity)>0)
    .filter((r,i,all)=>all.findIndex(o=>sameBatted(o,r))===i)
    .map(r=>({...r, _v: key==="distance" ? distanceOf(r) : Number(r[key])}))
    .filter(r=>isFinite(r._v) && r._v>0)
    .sort((a,b)=>b._v-a._v)
    .slice(0,5);
}
/** 同じ打球か。打者側と投手側の記録に同じ球が入っている。 */
function sameBatted(a,b){
  return a.game===b.game && a.inning===b.inning && a.pa===b.pa
      && a.pitch_no===b.pitch_no && a.batter===b.batter;
}
/**
 * その打球が、その打者のその試合での何打席目か。
 *
 * <p>打席 ID の番号は試合全体の通し番号なので、そのまま出すと
 * 「25 打席目」のように、その人が何度目に立ったのかが分からない。
 */
function paNumber(row){
  const who=row.batter, game=String(row.game||"");
  if(!who || !game) return null;
  const mine=[...new Set(pitchOf(who,"bat")
    .filter(r=>String(r.game)===game && r.pa)
    .map(r=>String(r.pa)))]
    .sort((a,b)=>(Number(a.split("#")[1])||0)-(Number(b.split("#")[1])||0));
  const it=mine.indexOf(String(row.pa||""));
  return it<0 ? null : it+1;
}

function playCard(title, rows, fmt){
  const body=rows.length ? `<ol class="tied small">${rows.map((r,i)=>{
      const at=paNumber(r);
      const where=esc(gameLabel(r.game))+(at ? " "+at+"打席目" : "");
      return bestRow(i+1, r.batter, where, fmt(r), r.game,
        plateIndexOfPa(r.game, r.pa));
    }).join("")}</ol>`
    : '<div class="empty">打球の記録がありません</div>';
  return `<div class="card"><h4>${title}</h4>${body}</div>`;
}

/* ================================================ 決定打・ファインプレー・勝利関与
   どれも「その 1 つのプレーが勝ち負けをどれだけ動かしたか」で見る。
   点差が開いた場面のプレーはほとんど動かさず、僅差の終盤ほど大きく動く。 */

/**
 * 1 打席ごとの勝利確率の動き。試合ごとにまとめて出す。
 *
 * @return [{row, swing, forBatting}] swing はその打席で動いた勝利確率(0〜1)
 */
let WIN_MOVES=null, WIN_MOVES_N=-1;
function winMoves(){
  if(WIN_MOVES && WIN_MOVES_N===DATA.plate.length) return WIN_MOVES;
  const out=[];
  gameIds().forEach(game=>{
    const rows=DATA.plate.filter(r=>String(r.game_id)===game);
    const path=winPath(rows);
    rows.forEach((r,i)=>{
      const at=path[i], next=path[i+1];
      const isTop=!isBottom(r), runs=Number(r.runs)||0;
      const before=at.p, after=next ? next.p : before;
      // 先攻から見た確率なので、後攻の攻撃では向きを裏返す
      const forBatting=(after-before)*(isTop ? 1 : -1);
      // 点差を抜きにした値打ち。塁と アウトから見た得点期待値の動きで見る。
      // 勝利確率だけだと、走者のいない場面で取ったアウトが 0 になってしまう。
      const sameHalf=next && next.r && next.inning===at.inning && next.isTop===at.isTop;
      const reAfter=sameHalf ? runExpect(next.bases, next.outs) : 0;
      const flat=(runs + reAfter - runExpect(at.bases, at.outs)) * WIN_PER_RUN;
      out.push({row:r, game, before, after, swing:after-before, forBatting, flat,
        at:i, index:i});
    });
  });
  WIN_MOVES=out; WIN_MOVES_N=DATA.plate.length;
  return out;
}

/**
 * 打席結果の行が、その打者のその試合で何打席目か。
 *
 * <p>1 球ずつの記録に頼る {@code paNumber} と違い、
 * 打席結果しか残っていない古い試合でも数えられる。
 */
let PA_ORDER=null, PA_ORDER_N=-1;
function plateNumber(row){
  if(!PA_ORDER || PA_ORDER_N!==DATA.plate.length){
    PA_ORDER=new Map();
    const seen={};
    DATA.plate.forEach(r=>{
      if(!r.batter) return;
      const key=String(r.game_id)+"|"+r.batter;
      seen[key]=(seen[key]||0)+1;
      PA_ORDER.set(r, seen[key]);
    });
    PA_ORDER_N=DATA.plate.length;
  }
  const v=PA_ORDER.get(row);
  return v===undefined ? null : v;
}

/** その試合の打席並びの中で、その打席行が何番目か。 */
function plateIndexOf(gameId, row){
  return DATA.plate.filter(r=>String(r.game_id)===String(gameId)).indexOf(row);
}

/** 打席 ID(2026091201#16)から、その試合の何番目の打席かを出す。 */
function plateIndexOfPa(gameId, pa){
  const n=Number(String(pa||"").split("#")[1]);
  if(!isFinite(n) || n<1) return -1;
  const all=DATA.plate.filter(r=>String(r.game_id)===String(gameId));
  return n<=all.length ? n-1 : -1;
}

/** 押したらその打席まで飛ぶ印。at が負なら試合の先頭まで。 */
function jumpMark(gameId, at){
  return `data-jump-pa="${esc(String(gameId))}" data-jump-at="${at}"`;
}

/**
 * 場面の字の大きさ。1 行に収めたいので、長いほど細かくする。
 *
 * <p>札の幅はおよそ 230px。名前と数字で半分ほど使うので、
 * 場面に回せるのは 110px 前後しかない。
 */
function subSize(text, name){
  const room=Math.max(6, 30 - String(name||"").length);
  const over=String(text||"").replace(/<[^>]*>/g, "").length - room;
  if(over<=0) return 10;
  if(over<=3) return 9.3;
  if(over<=6) return 8.7;
  if(over<=10) return 8.1;
  return 7.6;
}

/** ベストプレーの 1 行。名前だけは選手ページ、それ以外は試合へ飛ぶ。 */
function bestRow(rank, name, where, value, gameId, at){
  return `<li class="plink" ${jumpMark(gameId, at)}>
    <i class="rank">${rank}</i>
    <span class="nmlink" data-who="${esc(name||"")}">${face(name,20)}${esc(name||"?")}</span>
    <small class="sub" style="font-size:${subSize(where, name)}px">${where}</small>
    <b>${value}</b></li>`;
}

/** 決定打。打撃で勝利確率をいちばん動かした打席。 */
function clutchCard(){

/** 守備位置の呼び名。打球の言い方に合わせる。 */
const POS_JA={PITCHER:"ピッチャー", CATCHER:"キャッチャー", FIRST_BASEMAN:"ファースト",
  SECOND_BASEMAN:"セカンド", THIRD_BASEMAN:"サード", SHORTSTOP:"ショート",
  LEFT_FIELDER:"レフト", CENTER_FIELDER:"センター", RIGHT_FIELDER:"ライト"};

/** 「ショートゴロ」「ライトフライ」のような呼び方。 */
function playName(r){
  const at=POS_JA[String(r.position)] || "";
  const la=nz(r.launchangle)||0;
  const kind=r.caughtonfly===true ? (la<25 ? "ライナー" : "フライ") : "ゴロ";
  return at ? at+kind : kind;
}

/**
 * ファインプレー。追いつけて当たり前でない打球を処理したもの。
 *
 * <p>難しさは守備の評価に使っている 5 段階から取る。
 * 「追いつけない」に近いほど手柄が大きい。
 */
function fineCard(){
  const plays=[];
  DATA.play.forEach(r=>{
    if(r.kind!=="field" || !r.player) return;
    // 実際にアウトになった打球だけ。追いついて投げただけの安打は入れない。
    if(!convertedPlay(r)) return;
    if(r.caughtonfly!==true && r.gotout!==true && r.assist!==true) return;
    const gap=reachGap(r);
    if(gap===null || !ownsPlay(r)) return;
    const tier=reachTier(gap);
    const ease=battedEase(r.battedtype);
    // その難しさなら、リーグは何割アウトにできるか。低いほど値打ちがある。
    const rate=Math.max(0.02, Math.min(0.98, tier.expect*ease));
    plays.push({r, tier, rate, value:1-rate});
  });
  const list=plays.sort((a,b)=>b.value-a.value).slice(0,5);
  const body=list.length ? `<ol class="tied small">${list.map((one,i)=>{
    const r=one.r;
    const where=`${esc(gameLabel(r.game))} ${r.inning}回${
      String(r.half).toUpperCase().startsWith("B")?"裏":"表"} ${esc(playName(r))}`;
    return bestRow(i+1, r.player, where,
      `<em class="unit">アウト率</em>${(one.rate*100).toFixed(0)}%`,
      r.game, plateIndexOfPa(r.game, r.pa));
  }).join("")}</ol>` : '<div class="empty">守備の記録がありません</div>';
  return `<div class="card"><h4>ファインプレー</h4>${body}</div>`;
}

/**
 * 勝利関与。その試合で勝ちにどれだけ近づけたか。
 *
 * <p>打撃と投球をまとめて、動かした勝利確率を足し上げる。
 * 1 人の力だけで勝てば 1.00。大差の場面はほとんど動かないので、
 * 僅差の終盤で働いた人ほど大きくなる。負け試合でも働けば正になる。
 */
/**
 * 場面の重み。1 に近いほど、その試合の点差をそのまま効かせる。
 *
 * <p>点差がついた場面ほど勝利確率は動かないので、そのまま足すと
 * 大差の試合で投げ抜いた人の働きが消えてしまう。
 * 「0 対 0 だったら」で見た動きを混ぜて、重みづけを弱めてある。
 */
const WIN_SPOT=0.45;

function winShare(){
  const box={};
  const add=(name, game, bat, pit)=>{
    if(!name) return;
    const key=name+"|"+game;
    const at=box[key] || (box[key]={bat:0, pit:0});
    at.bat+=bat; at.pit+=pit;
  };
  winMoves().forEach(m=>{
    const r=m.row;
    // 実際の場面での動きと、点差を消した動きを混ぜる
    const v=m.forBatting*WIN_SPOT + m.flat*(1-WIN_SPOT);
    // 打者は攻撃側から見た動き、投手はその裏返し
    add(r.batter, m.game, v, 0);
    add(r.pitcher, m.game, 0, -v);
  });
  return Object.entries(box).map(([key,at])=>{
    const part=key.split("|");
    return {name:part[0], game:part[1], bat:at.bat, pit:at.pit,
      value:at.bat+at.pit};
  });
}

function winShareCard(){
  const list=winShare().sort((a,b)=>b.value-a.value).slice(0,5);
  const body=list.length ? `<ol class="tied small">${list.map((one,i)=>
    bestRow(i+1, one.name, esc(gameLabel(one.game)),
      (one.value>=0?"+":"")+one.value.toFixed(2), one.game, -1)).join("")}</ol>`
    : '<div class="empty">記録がありません</div>';
  return `<div class="card"><h4>勝利関与</h4>${body}</div>`;
}

/* ------------------------------------------------ 打席ごとの勝利ポイント */

/** 打席の行から、その打席で動いた勝利確率を引く。 */
let WIN_BY_ROW=null, WIN_BY_ROW_N=-1;
function winMoveOf(row){
  if(!WIN_BY_ROW || WIN_BY_ROW_N!==DATA.plate.length){
    WIN_BY_ROW=new Map();
    winMoves().forEach(m=>WIN_BY_ROW.set(m.row, m));
    WIN_BY_ROW_N=DATA.plate.length;
  }
  return WIN_BY_ROW.get(row) || null;
}

/** 打席が始まる前のアウト数。試合をまたいで一度に数えておく。 */
let OUTS_BEFORE=null, OUTS_BEFORE_N=-1;
function outsBeforeAll(){
  if(!OUTS_BEFORE || OUTS_BEFORE_N!==DATA.plate.length){
    OUTS_BEFORE=outsBefore(DATA.plate);
    OUTS_BEFORE_N=DATA.plate.length;
  }
  return OUTS_BEFORE;
}

/** 1 球ずつの記録から、その打席の結果の行を引く。 */
let PLATE_INDEX=null, PLATE_INDEX_N=-1;
function plateIndex(){
  if(PLATE_INDEX && PLATE_INDEX_N===DATA.plate.length) return PLATE_INDEX;
  const map=new Map();
  DATA.plate.forEach(r=>{
    const k=[String(r.game_id), r.inning, isBottom(r)?"B":"T", r.batter, r.result].join("|");
    if(!map.has(k)) map.set(k, r);
  });
  PLATE_INDEX=map; PLATE_INDEX_N=DATA.plate.length;
  return map;
}
function plateRowOf(rec){
  if(!rec) return null;
  const half=String(rec.half||"").toUpperCase().startsWith("B") ? "B" : "T";
  return plateIndex().get(
    [String(rec.game), rec.inning, half, rec.batter, rec.result].join("|")) || null;
}

/**
 * その打席で動いた勝利ポイント。
 *
 * <p>ふだんは攻撃側が主語。「後攻 +12.0pt」の形で、
 * 上がったら青、下がったら赤。投手の画面だけは主語を投手にする。
 *
 * @param opts team を渡すとチーム名を頭に付ける。pit:true で投手から見た向き
 */
function winPtText(row, opts){
  const m=row ? winMoveOf(row) : null;
  if(!m) return "";
  const at=opts||{};
  const v=(at.pit ? -m.forBatting : m.forBatting)*100;
  const head=at.team ? esc(at.team)+" " : "";
  return `<span class="wpt ${v>=0?"wup":"wdn"}">${head}${
    v>=0?"+":"−"}${Math.abs(v).toFixed(1)}pt</span>`;
}

/** 表に出す勝利関与。kind は "bat" か "pit"、省くと投打まとめて。 */
function winShareText(name, game, kind){
  const v=winShareOf(name, game, kind);
  return v===null ? "—" : (v>=0?"+":"")+v.toFixed(2);
}

/** その選手のその試合の勝利関与。過去の試合に出す。 */
let WIN_SHARE=null, WIN_SHARE_N=-1;
function winShareOf(name, game, kind){
  if(!WIN_SHARE || WIN_SHARE_N!==DATA.plate.length){
    WIN_SHARE={};
    winShare().forEach(one=>{ WIN_SHARE[one.name+"|"+one.game]=one; });
    WIN_SHARE_N=DATA.plate.length;
  }
  const at=WIN_SHARE[name+"|"+String(game)];
  if(at===undefined) return null;
  return kind==="bat" ? at.bat : kind==="pit" ? at.pit : at.value;
}

/** 1 試合で最も空振りを奪った投手。上位 5 つ。 */
function whiffCard(){
  const seen=new Set(), count={};
  DATA.pitch.forEach(r=>{
    if(r.whiff!==true || !r.pitcher) return;
    const key=[r.game,r.inning,r.half,r.pa,r.pitch_no,r.batter].join("|");
    if(seen.has(key)) return;                  // 打者側と投手側で同じ球を二度数えない
    seen.add(key);
    const at=r.pitcher+"|"+r.game;
    count[at]=(count[at]||0)+1;
  });
  const rows=Object.entries(count)
    .map(([k,n])=>({name:k.split("|")[0], game:k.split("|")[1], n}))
    .sort((a,b)=>b.n-a.n).slice(0,5);
  const body=rows.length ? `<ol class="tied small">${rows.map((r,i)=>
      bestRow(i+1, r.name, esc(gameLabel(r.game)), r.n, r.game, -1)).join("")}</ol>`
    : '<div class="empty">投球の記録がありません</div>';
  return `<div class="card"><h4>空振り</h4>${body}</div>`;
}

/**
 * ベストオーダー。
 *
 * <p>打者は規定打席に届いた人の wRC+ 上位 9 人。
 * 打順は wRC+ の順位で 3-4-1-2-5-6-7-8-9 の並びにする。
 * 投手は防御率・投球回・奪三振をまとめた点数で選ぶ。
 */
const ORDER_BY_RANK=[3,4,1,2,5,6,7,8,9];
function bestOrder(bat, pit){
  const list=bat.filter(d=>d.L.pa>=QUAL_PA && d.wrc!==null && isFinite(d.wrc))
                .sort((a,b)=>b.wrc-a.wrc).slice(0,9);
  if(list.length<1) return '<div class="empty">規定打席に届いた選手がいません</div>';
  const slots=[];
  list.forEach((d,i)=>{ slots[ORDER_BY_RANK[i]-1]=d; });
  const ace=bestPitcher(pit);
  return `<div class="scroll"><table class="lineup"><tbody>
    ${slots.map((d,i)=>d ? `<tr>
      <td class="slot">${i+1}</td>
      <td class="nm">${withFace(d.name,22)}</td>
      <td>${d.L.pa} 打席</td><td>${f3(d.L.avg)}</td>
      <td>${d.L.hr} 本</td><td>${d.L.rbi} 打点</td>
    </tr>` : "").join("")}
    ${ace ? `<tr class="pit">
      <td class="slot">P</td>
      <td class="nm">${withFace(ace.name,22)}</td>
      <td>${ipText(ace.L.outs)} 回</td><td>防御率 ${f2(ace.L.era)}</td>
      <td>${ace.w} 勝</td><td>${ace.L.so} 奪三振</td>
    </tr>` : ""}
  </tbody></table></div>`;
}
/**
 * ゴールデングラブ。守備位置ごとに、その位置でいちばん守れる人。
 *
 * <p>規定は置かない。同じ人が複数の位置に選ばれてもよい。
 * 投手だけは守備の数字ではなく、防御率がいちばん良い人にする。
 */
function goldenGlove(pit){
  const names=playerNames();
  const best={};
  Object.keys(POS_LABEL).forEach(at=>{
    if(at==="PITCHER") return;
    let top=null;
    names.forEach(n=>{
      const value=positionSkill(n, gloveAbility(n).glove, at);
      if(value===null) return;
      if(!top || value>top.value) top={name:n, value};
    });
    if(top) best[at]=top;
  });
  // 投手は防御率がいちばん良い人。ここだけは規定投球回に届いた人から選ぶ。
  const arms=pit.filter(d=>d.L.era!==null && isFinite(d.L.era)
      && d.L.outs/3>=QUAL_IP)
    .sort((a,b)=>a.L.era-b.L.era);
  if(arms.length) best.PITCHER={name:arms[0].name, era:arms[0].L.era};
  return gloveField(best);
}

/** ゴールデングラブの図。扇形の球場に選ばれた人を置く。 */
function gloveField(best){
  // 札は横 108。左右の端に置く札が切れないよう、図を広めに取る。
  const W=420, H=300, cx=W/2, cy=H-24, reach=H-56;
  const at=(x,y)=>[cx + x*reach*0.86, cy - y*reach];
  const [lx,ly]=at(-1,1), [rx,ry]=at(1,1);
  let g=`<path d="M${cx} ${cy} L${lx.toFixed(1)} ${ly.toFixed(1)}
      A ${reach.toFixed(1)} ${reach.toFixed(1)} 0 0 1 ${rx.toFixed(1)} ${ry.toFixed(1)} Z"
      fill="var(--panel-2)" stroke="var(--line)" stroke-width="1.4"/>`;
  const d=[[0,0],[0.30,0.30],[0,0.60],[-0.30,0.30]].map(v=>at(v[0],v[1]));
  g+=`<path d="M${d.map(q=>q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" L")} Z"
      fill="none" stroke="var(--line)" stroke-width="1.2"/>`;
  Object.keys(FIELD_SPOT).forEach(pos=>{
    const one=best[pos];
    const [x,y]=at(FIELD_SPOT[pos][0], FIELD_SPOT[pos][1]);
    const shot=one ? faceSrc(one.name) : null;
    // 選ばれた人の枠は金色。数字は出さず、守備位置と顔と名前だけ。
    g+=`<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})">
      <rect x="-54" y="-14" width="108" height="28" rx="8"
        fill="var(--panel)" stroke="${one ? "#e8a33c" : "var(--line)"}"
        stroke-width="${one ? 2.2 : 1}"/>
      <text x="-47" y="5" font-size="12" font-weight="800"
        fill="${one ? "#e8a33c" : "var(--muted)"}">${POS_LABEL[pos]}</text>
      ${shot ? `<image href="${esc(shot)}" x="-33" y="-9" width="18" height="18"
          preserveAspectRatio="xMidYMid slice"
          style="image-rendering:pixelated"/>` : ""}
      <text x="${shot ? -11 : -30}" y="5" font-size="12" font-weight="700"
        fill="${one ? "var(--text)" : "var(--muted)"}">${
        one ? esc(String(one.name).slice(0, shot ? 9 : 12)) : "—"}</text>
    </g>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="glovefield" role="img"
    aria-label="ゴールデングラブ">${g}</svg>`;
}

/**
 * 総合で一番の投手。
 *
 * <p>投球回・奪三振は多いほど、防御率は低いほどよい。
 * それぞれをリーグ内の最大で割って 0〜1 に均し、足して比べる。
 */
function bestPitcher(pit){
  const list=pit.filter(d=>d.L.outs/3>=QUAL_IP && d.L.era!==null && isFinite(d.L.era));
  if(!list.length) return null;
  const maxIp=Math.max(...list.map(d=>d.L.outs));
  const maxSo=Math.max(...list.map(d=>d.L.so));
  const maxEra=Math.max(...list.map(d=>d.L.era));
  const score=d=>0.40*(d.L.outs/(maxIp||1))
                + 0.30*(d.L.so/(maxSo||1))
                + 0.30*(1-d.L.era/(maxEra||1));
  return list.sort((a,b)=>score(b)-score(a))[0];
}

/**
 * FIP。守備に左右されない部分だけで測る失点の目安。
 *
 * <p>(13 × 被本塁打 + 3 × 与四球 − 2 × 奪三振) ÷ 投球回 + 3.5。
 * 投球回は 5 回制に合わせて、アウト数 ÷ 3 をそのまま使う。
 */
function fipOf(L){
  const ip=L.outs/3;
  if(!ip) return null;
  return (13*L.hr + 3*L.bb - 2*L.so)/ip + 3.5;
}

/** xERA の目盛りを覚えておく。読み込んだ記録が変われば作り直す。 */
let XERA_SCALE=null;

/**
 * xERA を出すための、このリーグの目盛り。
 *
 * <p>xERA は「打たれ方から見て、本来どれだけ点を取られる投手か」。
 * 大リーグ向けの決まった式をそのまま当てると、球場も打力も違うので
 * まるで合わない(実際 xERA がリーグ平均 1.9、実際の防御率は 6.9 になっていた)。
 * そこで読み込んだ記録そのものから目盛りを作る。
 *
 * <ul>
 *   <li>中心 … リーグの xwOBA と、そのときの失点率(9 回あたり)</li>
 *   <li>傾き … 9 回あたりの打者数 ÷ 1.15。
 *       wOBA が 1 上がると 1 打席あたり約 1.15 点ぶん、という目安から</li>
 * </ul>
 */
function xeraScale(){
  const key=DATA.plate.length+"/"+DATA.pitch.length;
  if(XERA_SCALE && XERA_SCALE.key===key) return XERA_SCALE;
  let pa=0, outs=0, runs=0;
  DATA.plate.forEach(r=>{
    pa++;
    outs+=Number(r.outs)||0;
    runs+=Number(r.runs)||0;
  });
  // リーグの xwOBA は 1 球ごとの記録から。投手側の行を全部まとめる。
  const S=summarize(DATA.pitch.filter(r=>r.side==="Pitching"||!r.side));
  const xwoba=S.pa ? (S.xbaSum+S.bb+S.hbp)/S.pa : null;
  if(!outs || !pa || xwoba===null){
    XERA_SCALE={key, ok:false};
    return XERA_SCALE;
  }
  XERA_SCALE={key, ok:true,
    xwoba,
    era: GAME_INNINGS*3*runs/outs,
    tilt: (pa/outs*GAME_INNINGS*3)/1.15};
  return XERA_SCALE;
}

/** その xwOBA なら、9 回あたり何点取られる投手か。 */
function xeraOf(xwoba){
  if(xwoba===null) return null;
  const lg=xeraScale();
  if(!lg.ok) return null;
  return Math.max(0, lg.era + (xwoba - lg.xwoba) * lg.tilt);
}

/** 一覧に並べる選手ぶんの数字をまとめて作る。 */
function leaderRows(side){
  const key=side==="bat"?"batter":"pitcher";
  const names=[...new Set(DATA.plate.map(r=>r[key]).filter(Boolean))];
  const dec=side==="pit" ? decisionMap() : {};
  return names.map(name=>{
    const pa=plateOf(name,side), ps=pitchOf(name,side);
    const L=side==="pit" ? pitcherLine(pa) : line(pa);
    const S=summarize(ps);
    const xwoba=S.pa ? (S.xbaSum+S.bb+S.hbp)/S.pa : null;
    const F=fieldingLine(playOf(name,"field"));
    return {name, L, S, F, xwoba,
      games:new Set(pa.map(r=>String(r.game_id))).size,
      wrc: side==="bat" ? wrcPlus(L) : null,
      xera: xeraOf(xwoba),
      w:(dec[name]||{}).w||0, l:(dec[name]||{}).l||0,
      sv:(dec[name]||{}).sv||0, hld:(dec[name]||{}).hld||0};
  });
}
/**
 * ランキング。
 *
 * <p>上は項目ごとの上位 3 人をカードで並べる(1 行 3 項目)。
 * Standard と Advanced は分けずに全部出す。
 * カードの見出しを押すと、下の一覧がその項目に切り替わる。
 */
function leaderColumns(side){
  const list = side==="bat"
    ? batterColumns("std").concat(batterColumns("adv"))
    : pitcherColumns("std").concat(pitcherColumns("adv"));
  // 同じ項目が両方に入っていることがあるので、先に出たほうを残す
  const seen=new Set();
  return list.filter(c=>{
    if(seen.has(c.key)) return false;
    seen.add(c.key);
    return true;
  });
}

/** その項目で並べ替えた一覧。規定に届かない人は後ろへ回す。 */
function leaderSorted(rows, col, side){
  const rated=!!col.rate;
  const ok=d=>!rated || (side==="bat" ? d.L.pa>=QUAL_PA : d.L.outs/3>=QUAL_IP);
  const dir=col.low ? 1 : -1;
  return rows.slice().sort((a,b)=>{
    if(rated && ok(a)!==ok(b)) return ok(a) ? -1 : 1;
    const x=col.get(a), y=col.get(b);
    const ax=(x===null||x===undefined||!isFinite(x))?null:x;
    const by=(y===null||y===undefined||!isFinite(y))?null:y;
    if(ax===null&&by===null) return a.name.localeCompare(b.name);
    if(ax===null) return 1;
    if(by===null) return -1;
    return (ax-by)*dir;
  }).filter(d=>{
    const v=col.get(d);
    return v!==null && v!==undefined && isFinite(v);
  }).map(d=>Object.assign({qualified:ok(d)}, d));
}

/** 項目 1 つぶんのカード。上位 3 人。率の項目は規定に届いた人だけ。 */
function leaderCard(col, rows, side){
  const all=leaderSorted(rows, col, side);
  const pool=col.rate ? all.filter(d=>d.qualified) : all;
  // 同じ値なら同じ順位。3 位が並んだらその人数ぶんまで出す。
  let place=0, last=null;
  const ranked=pool.map((d,i)=>{
    const v=col.get(d);
    if(last===null || Math.abs(v-last)>1e-9){ place=i+1; last=v; }
    return {d, v, place};
  });
  const within=ranked.filter(one=>one.place<=3);
  const list=within.slice(0,3);
  // 3 人で切れた先に同じ順位の人がいたら、名前ではなく人数で添える
  const rest=within.length-list.length;
  const body=list.length
    ? `<ol class="tied">${list.map((one,i)=>`<li class="plink" data-who="${esc(one.d.name)}">
        <i class="rank">${one.place}</i>${face(one.d.name,20)}
        <span>${esc(one.d.name)}${
          rest && i===list.length-1 ? `<em class="tiedrest">ほか ${rest} 人</em>` : ""
        }</span><b>${col.fmt(one.v)}</b></li>`).join("")}</ol>`
    : '<div class="empty">記録がありません</div>';
  return `<div class="card lbcard" data-lb-key="${col.key}">
    <h4>${col.head}</h4>${body}</div>`;
}

/** 下の一覧。1 項目だけを大きく並べる。 */
function leaderFull(col, rows, side){
  const list=leaderSorted(rows, col, side);
  if(!list.length) return '<div class="empty">記録がありません</div>';
  let place=0, last=null;
  const body=list.map((d,i)=>{
    const v=col.get(d);
    if(last===null || Math.abs(v-last)>1e-9){ place=i+1; last=v; }
    return `<tr class="${d.qualified?"":"unq"}">
      <td class="place">${place}</td>

/* ------------------------------------------------------------ リザルト */
/** record の打席行を引ける表にする。同じ打席は 1 行だけ持つ。 */
function recordIndex(){
  const map=new Map();
  DATA.pitch.forEach(r=>{
    if(!r.result) return;
    const k=[r.game,r.inning,isBottom(r)?"B":"T",r.batter,r.result].join("|");
    const kept=map.get(k);
    // 打者側の記録を優先する。投手側の記録は同じ打席の写し。
    if(!kept || (r.side==="Batting" && kept.side!=="Batting")) map.set(k,r);
  });
  return map;
}
/**
 * その試合で、誰がどちらのチームか。
 *
 * <p>表の攻撃の打者と裏の攻撃の投手が先攻、その逆が後攻。
 * 名前 -> 0(先攻) / 1(後攻)。
 */
function teamSides(rows){
  const side={};
  rows.forEach(r=>{
    const bottom=isBottom(r);
    if(r.batter && side[r.batter]===undefined) side[r.batter]=bottom?1:0;
    if(r.pitcher && side[r.pitcher]===undefined) side[r.pitcher]=bottom?0:1;
  });
  return side;
}
/** チームの色のクラス名。分からなければ空。 */
function teamClass(side){
  return side===0 ? "t-first" : side===1 ? "t-second" : "";
}
/** 顔と名前。チームの色を付ける。 */
function withTeamFace(name, side, size){
  if(!name) return `<span class="none">マネキン</span>`;
  return `<span class="withface plink ${teamClass(side)}" data-who="${esc(name)}"
    title="${esc(name)} の成績を見る">${face(name,size)}<span>${esc(name)}</span></span>`;
}
/**
 * その試合でその選手が守っていた守備位置。
 *
 * <p>play の記録から引く。守備機会の行(field)と、
 * 回ごとに置かれる spot の行の両方を数え、いちばん多いところを返す。
 * 記録が無ければ空。
 */
function positionIn(game, name){
  // 初めて守備についた回の位置を採る。
  // 途中で替わっても、打順表に出すのは最初に守っていたところ。
  let best=null;
  DATA.play.forEach(r=>{
    if(String(r.game)!==String(game) || r.player!==name) return;
    const at=String(r.position||"");
    if(!POS_LABEL[at]) return;
    const when=(Number(r.inning)||0)*2
      + (String(r.half||"").toUpperCase().startsWith("B") ? 1 : 0);
    // 同じ回なら先に出てきたものを使う
    if(best===null || when<best.when) best={when, at};
  });
  return best ? best.at : "";
}

/**
 * その試合の打順。
 *
 * <p>result の order 列は打順の枠ではなく「その回の何人目か」なので使えない。
 * 打った順に名前を並べ、一巡して先頭に戻るまでを打順とする。
 *
 * <p>一巡の中で代わった人はその枠の人として出る。
 * 二巡目以降に入ってきた代打・代走は出さない。誰の枠かを見るための表なので。
 *
 * @param side 0=先攻 1=後攻
 */
function lineup(rows, side){
  const out=[], used=new Set();
  for(const r of rows){
    if((isBottom(r)?1:0)!==side || !r.batter) continue;
    // 先頭打者にもう一度回ってきた = 一巡した
    if(out.length && r.batter===out[0].name) break;
    // 同じ人が続けて出てきただけ。打順が止まった記録でも
    // ここで打ち切ると、後ろの打順がまるごと抜ける。飛ばして先へ進む。
    if(used.has(r.batter)) continue;
    used.add(r.batter);
    out.push({slot:out.length+1, name:r.batter});
    if(out.length>=9) break;
  }
  return out;
}

/**
 * その試合の先発投手。
 *
 * <p>打順とは別に書く。投手は打順に入らないことが多く、
 * 入っていても交代が打順の並びと合わないため。
 * 交代した投手は打順表には出さない。打順表は「誰の枠か」を見るためのもの。
 *
 * @param side 0=先攻 1=後攻。その回に守っていたほうを拾う
 */
function starterOf(rows, side){
  for(const r of rows){
    // 表の攻撃で投げているのは後攻の投手
    if((isBottom(r)?1:0)===side || !r.pitcher) continue;
    return r.pitcher;
  }
  return "";
}

/** 打順表の 1 チームぶん。 */
function lineupCard(rows, side, name){
  const order=lineup(rows, side);
  const starter=starterOf(rows, side);
  if(!order.length && !starter) return "";
  // ol を使うと card の連番が重なって出るので、素の div で組む
  const line=(label, who, where) => `<div class="row">
      <span class="slot">${label}</span>
      <span class="at">${where ? esc(POS_LABEL[where]) : ""}</span>
      ${withTeamFace(who, side, 20)}
    </div>`;
  const body=order.map(one => {
    let where=positionIn(GAME, one.name);
    // 「投手」と書くのは先発だけ。救援した人や、マウンド付近にいて
    // 投手の位置として記録された人には付けない。
    if(where==="PITCHER" && one.name!==starter) where="";
    return line(one.slot, one.name, where);
  }).join("");
  const arm=starter ? line("投", starter, "PITCHER") : "";
  return `<div class="card">
    <h4 class="${teamClass(side)}">${esc(name)}</h4>
    <div class="lineup">${body}${arm}</div>
  </div>`;
}

function lineupBox(rows){
  const names=teamNames(rows);
  const cards=[lineupCard(rows,0,names[0]), lineupCard(rows,1,names[1])].join("");
  if(!cards) return "";
  return `<section class="span"><div class="pad">
    <div class="head">打順</div>
    <div class="cards">${cards}</div>
  </div></section>`;
}
