/** その選手が初めて出た試合の日付。 */
function debutOf(name){
  const games=[...new Set(plateOf(name,"bat").concat(plateOf(name,"pit"))
    .map(r=>String(r.game_id)))].sort();
  if(!games.length) return "—";
  const m=games[0].match(/^(\d{4})(\d{2})(\d{2})/);

}

    ["被打率", f3(L.avg)], ["被本塁打", L.hr],
    ["被OPS", f3(L.ops)], ["WHIP", f2(L.whip)]
  ]);

/* ---------------------------------------------------------- 打球方向 */
/** 打球方向の 5 分割。負が左。 */
const SPRAY_ZONES=[
  {name:"左",     from:-90, to:-27},
  {name:"左中間", from:-27, to:-9},
  {name:"中",     from:-9,  to:9},
  {name:"右中間", from:9,   to:27},
  {name:"右",     from:27,  to:90}
];

/**
 * 打球方向の扇形。5 つに分け、その割合と本塁打の数を出す。
 *
 * <p>内側の帯がその方向へ飛んだ割合、外側の帯がその方向の本塁打。
 * 割合の高い区画は赤、低い区画は青で塗る。
 */
function sprayFan(name){
  const rows=pitchOf(name,"bat").filter(r=>
    r.contact===true && isFinite(Number(r.spray_angle)));
  const box=SPRAY_ZONES.map(()=>({n:0, hr:0}));
  rows.forEach(r=>{
    const a=Number(r.spray_angle);
    const at=SPRAY_ZONES.findIndex(z=>a>=z.from && a<z.to);
    if(at<0) return;
    box[at].n++;
    if(r.result==="HOME_RUN") box[at].hr++;
  });
  const total=box.reduce((n,one)=>n+one.n,0);
  if(!total) return '<div class="empty">打球の記録がありません</div>';
  const W=420, H=250, cx=W/2, cy=H-14, outer=H-60, inner=0;
  // 画面の左がフィールドの左。角度は真上を 0 度として左右へ開く。
  const pos=(deg, r)=>{
    const rad=(deg-90)*Math.PI/180;
    return [cx + r*Math.cos(rad), cy + r*Math.sin(rad)];
  };
  const arc=(from, to, r1, r2, color)=>{
    const a=pos(from,r1), b=pos(to,r1), c=pos(to,r2), d=pos(from,r2);
    return `<path d="M${a[0]} ${a[1]} A${r1} ${r1} 0 0 1 ${b[0]} ${b[1]}
      L${c[0]} ${c[1]} A${r2} ${r2} 0 0 0 ${d[0]} ${d[1]} Z"
      fill="${color}" stroke="#fff" stroke-width="2"/>`;
  };
  let svg="";
  box.forEach((one, i)=>{
    const from=Math.max(-45, SPRAY_ZONES[i].from);
    const to=Math.min(45, SPRAY_ZONES[i].to);
    const share=100*one.n/total;
    const fill=share>=25 ? "#f7b6c7" : (share<15 ? "#a8cfe0" : "#f2f2f2");
    const mid=(from+to)/2;
    svg+=arc(from, to, inner, outer, fill);
    // 中心に近いほど扇が細いので、文字は外寄りに置く
    const at=pos(mid, inner + (outer-inner)*0.72);
    svg+=`<text x="${at[0]}" y="${at[1]}" text-anchor="middle"
      dominant-baseline="central" font-size="14" fill="#333">${share.toFixed(1)}%</text>`;
    svg+=arc(from, to, outer+5, outer+42, "#e6e6e6");
    const hrAt=pos(mid, outer+24);
    svg+=`<text x="${hrAt[0]}" y="${hrAt[1]}" text-anchor="middle"
      dominant-baseline="central" font-size="13" fill="#333">${one.hr}</text>`;
  });
  const top=pos(0, outer+52);
  svg+=`<text x="${top[0]}" y="${top[1]}" text-anchor="middle"
    font-size="12" fill="#666">HR</text>`;
  return `<div class="fanwrap">
    <svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px">${svg}</svg>
    <div class="fankey">
      <span><i style="background:#f7b6c7"></i>25%以上</span>
      <span><i style="background:#a8cfe0"></i>15%未満</span>
      <span class="note">外側の数字はその方向の本塁打</span>
    </div>
  </div>`;
}

/**
 * 打席結果を四角で囲って並べる。
 *
 * <p>色は打席一覧と同じ {@link resultClass} を使う。
 * 同じ結果が場所によって違う色になると読み替えが要る。

      r.batter, r.result].join("|"));
    return `<span class="rtag inline ${resultClass(r.result)}">${
      esc(resultText(r.result, rec))}</span>`;
  }).join("");
}

/** 球場ごとに分ける。 */
function parkGroups(rows){
  const box={};
  rows.forEach(r=>{
    const where=venueOf(r.game_id) || "不明";
    (box[where]=box[where]||[]).push(r);
  });
  return Object.keys(box).sort().map(where=>({label:esc(where), rows:box[where]}));
}

/** 四半期ごとに分ける。1 月から 3 か月ずつ。 */
function quarterGroups(rows){
  const box={};
  rows.forEach(r=>{
    const m=String(r.game_id).match(/^(\d{4})(\d{2})/);
    if(!m) return;
    const key=m[1]+"-"+(Math.floor((Number(m[2])-1)/3)+1);
    (box[key]=box[key]||[]).push(r);
  });
  return Object.keys(box).sort().map(key=>{
    const part=key.split("-");
    const from=(Number(part[1])-1)*3+1;
    return {label:part[0]+" 年 "+from+"〜"+(from+2)+" 月", rows:box[key]};
  });
}

function splitHead(name, role){
  return `<section class="span"><div class="pad">
    <div class="splithead">${face(name,48)}
      <div><div class="nm">${esc(name)}</div>
        <div class="meta">${role} ｜ ${handsText(name, true)}</div></div>
    </div>
  </div></section>`;

/* ======================================================== 順位表
   試合ごとの結果を、チーム名(game.csv)でまとめる。
   チームの成績と、その人が出た試合だけを集めた個人の成績を並べる。 */

/** 順位表に載せる最低試合数。 */
const STAND_MIN_GAMES=4;

/**
 * 1 試合ぶんの、両チームの成績。
 *
 * <p>先攻(side 0)と後攻(side 1)それぞれについて、打った側の成績と
 * 守った側の成績(相手の打席から数える)を出す。
 */
function gameSummary(id){
  const rows=DATA.plate.filter(r=>String(r.game_id)===id);
  if(!rows.length) return null;
  const names=teamNames(rows);
  const side=n=>rows.filter(r=>(isBottom(r)?1:0)===n);
  const make=n=>{
    const mine=side(n), theirs=side(1-n);
    const L=line(mine);
    // 守備側のアウトから投球回、相手の得点が失点
    const outs=theirs.reduce((a,r)=>a+(Number(r.outs)||0),0);
    return {
      name:names[n], side:n,
      pa:L.pa, ab:L.ab, h:L.h, hr:L.hr, bb:L.bb, so:L.so,
      onBase:L.h+L.bb+L.hbp, obDen:L.ab+L.bb+L.hbp+(L.counts.SACRIFICE_FLY||0), tb:L.tb,
      runs:mine.reduce((a,r)=>a+(Number(r.runs)||0),0),
      allowed:theirs.reduce((a,r)=>a+(Number(r.runs)||0),0),
      outs, k:theirs.filter(r=>r.result==="STRIKE_OUT").length,
      players:new Set(mine.map(r=>r.batter).filter(Boolean))
    };
  };
  const top=make(0), bottom=make(1);
  // 投げた人もそのチームの一員として数える
  side(0).forEach(r=>{ if(r.pitcher) bottom.players.add(r.pitcher); });
  side(1).forEach(r=>{ if(r.pitcher) top.players.add(r.pitcher); });
  return {id, top, bottom};
}

/** 空の成績。足し合わせの入れ物。 */
function emptyRecord(name){
  return {name, games:0, win:0, lose:0, draw:0,
    pa:0, ab:0, h:0, hr:0, bb:0, so:0, onBase:0, obDen:0, tb:0,
    runs:0, allowed:0, outs:0, k:0};
}

/** 1 試合ぶんを足す。 */
function addRecord(into, one, result){
  into.games++;
  if(result>0) into.win++; else if(result<0) into.lose++; else into.draw++;
  ["pa","ab","h","hr","bb","so","onBase","obDen","tb","runs","allowed","outs","k"]
    .forEach(k=>{ into[k]+=Number(one[k])||0; });
  return into;
}

/** 足し終えた成績から、率や平均を出す。 */
function finishRecord(rec){
  const games=rec.games||1;
  const decided=rec.win+rec.lose;
  return Object.assign(rec, {
    pct: decided ? rec.win/decided : null,
    over: rec.win-rec.lose,
    avg: rec.ab ? rec.h/rec.ab : null,
    obp: rec.obDen ? rec.onBase/rec.obDen : null,
    slg: rec.ab ? rec.tb/rec.ab : null,
    ops: (rec.ab && rec.obDen) ? rec.onBase/rec.obDen + rec.tb/rec.ab : null,
    perGame: rec.runs/games,
    era: rec.outs ? GAME_INNINGS*3*rec.allowed/rec.outs : null
  });
}

/**
 * 並び順。勝率 → 勝ち越し数 → 勝ち数 → 平均得点。
 * 同じなら次の項目で決める。それでも同じなら同率。
 */
function standingOrder(a,b){
  const keys=[r=>r.pct===null?-1:r.pct, r=>r.over, r=>r.win, r=>r.perGame];
  for(const get of keys){
    const d=get(b)-get(a);
    if(Math.abs(d)>1e-9) return d;
  }
  return 0;
}

/** 順位を振る。前と全部同じなら同じ順位。 */
function withPlace(list){
  let place=0;
  return list.map((rec,i)=>{
    if(i===0 || standingOrder(list[i-1], rec)!==0) place=i+1;
    return Object.assign({place}, rec);
  });
}

/** チームごとの成績。 */
function teamStandings(){
  const teams=new Map();
  gameIds().forEach(id=>{
    const g=gameSummary(id);
    if(!g) return;
    [[g.top, g.bottom],[g.bottom, g.top]].forEach(([mine, other])=>{
      if(!mine.name) return;
      if(!teams.has(mine.name)) teams.set(mine.name, emptyRecord(mine.name));
      addRecord(teams.get(mine.name), mine, mine.runs-other.runs);
    });
  });
  return withPlace([...teams.values()].map(finishRecord).sort(standingOrder));
}

/** 個人ごとの成績。出た試合の、自分のチームの成績を足していく。 */
function personalStandings(){
  const people=new Map();
  gameIds().forEach(id=>{
    const g=gameSummary(id);
    if(!g) return;
    [[g.top, g.bottom],[g.bottom, g.top]].forEach(([mine, other])=>{
      mine.players.forEach(who=>{
        if(!people.has(who)) people.set(who, emptyRecord(who));
        addRecord(people.get(who), mine, mine.runs-other.runs);
      });
    });
  });
  const list=[...people.values()]
    .filter(r=>r.games>=STAND_MIN_GAMES)
    .map(finishRecord)
    .sort(standingOrder);
  return withPlace(list);
}

/** リーグ全体の平均。打率・防御率・OPS。 */
function leagueAverage(){
  const all=emptyRecord("リーグ");
  gameIds().forEach(id=>{
    const g=gameSummary(id);
    if(!g) return;
    addRecord(all, g.top, 0);
    addRecord(all, g.bottom, 0);
  });
  return finishRecord(all);
}

/** 順位表の 1 行ぶんの列。 */

/** ゲーム差を入れる。1 位との勝ち越し数の差の半分。 */
function withBehind(list){

/* ======================================================== スタジアム
   球場の形は stadium.yml から読んだ dist(-45〜45 度の 1 度刻み)で持っている。
   そこから広さの数字を出し、平面と立体で見比べられるようにする。 */

/** 比べる球場。平面はいくつでも、立体は 2 つまで。 */
const PARK_PICK={flat:new Set(), solid:[], turn:-28, tilt:26, zoom:1, panX:0, panY:0};

/** 角度(度)での距離。-45 が左翼線、0 が中堅、45 が右翼線。 */
function distAt(park, deg){
  const i=Math.round(deg)+45;
  return park.dist[Math.max(0,Math.min(90,i))]||0;
}
/** フェンスの高さ。記録が無ければ 0。 */
function heightAt(park, deg){
  const i=Math.round(deg)+45;
  return (park.heights && park.heights[Math.max(0,Math.min(90,i))])||0;
}

/** その球場の主な寸法。 */
function parkFacts(park){
  const d=park.dist;
  const left=distAt(park,-45), right=distAt(park,45), center=distAt(park,0);
  const leftAlley=distAt(park,-22), rightAlley=distAt(park,22);
  const alley=(leftAlley+rightAlley)/2;
  const max=Math.max(...d), min=Math.min(...d);
  const avg=d.reduce((a,b)=>a+b,0)/d.length;
  // 面積。本塁を中心にした扇形を 1 度ずつ足す
  const area=d.reduce((sum,v)=>sum+0.5*v*v*(Math.PI/180),0);
  // フェンスの高さ。測れていないところ(0)は数に入れない
  const hs=(park.heights||[]).filter(v=>v>0);
  const h=hs.length ? {
    max:Math.max(...hs), min:Math.min(...hs),
    avg:hs.reduce((a,b)=>a+b,0)/hs.length
  } : null;
  return {left, right, center, alley, leftAlley, rightAlley,
    max, min, avg, area, height:h, lean:right-left};
}

/**
 * 球場の写真の置き場所。

 * <p>手元で開いているときは、読み込んだファイルの中にしか写真が無いので
 * 何も返さない。公開しているサイト(index.html)では、ここが
 * 実際のフォルダを指すように差し替わる。
 */
function parkShotUrl(){
  return "";
}

/** 収容人数。yml に書いてあれば出す。 */
function parkSeats(park){
  return isFinite(park.seats) && park.seats>0 ? park.seats : null;
}

/** 球場 1 つの紹介。写真は「球場名.png」を読み込んでおくと出る。 */
function parkCard(park){

  // 写真は「球場名.png」。読み込んであればそれ、無ければ置き場所から直に当たる。

        <div><b>${f.left.toFixed(0)} / ${f.right.toFixed(0)}</b><span>両翼</span></div>
        <div><b>${f.leftAlley.toFixed(0)} / ${f.rightAlley.toFixed(0)}</b><span>左右中間</span></div>
        <div><b>${seats===null ? "—" : seats.toLocaleString()}</b><span>収容人数</span></div>
        <div><b>${h===null ? "—" : h.avg.toFixed(1)}</b><span>フェンス平均</span></div>
        <div><b>${h===null ? "—" : h.min.toFixed(0)+"〜"+h.max.toFixed(0)}</b><span>フェンス最小〜最大</span></div>
      </div>
    </div>
  </div>`;
}

/** 一覧の並べ替え。押した項目で降順、もう一度押すと昇順。 */
const PARK_SORT={key:"", dir:-1};

/**
 * 広さの一覧。表計算のように並べる。
 *
 * <p>見出しを押すとその項目で並べ替える。最初は降順(大きい順)。
 */
function parkSheet(){
  const cols=[
    {key:"name",   head:"球場",     nm:true, get:p=>p.name},
    {key:"left",   head:"左翼",     get:p=>distAt(p,-45)},
    {key:"lalley", head:"左中間",   get:p=>distAt(p,-22)},
    {key:"center", head:"中堅",     get:p=>distAt(p,0)},
    {key:"ralley", head:"右中間",   get:p=>distAt(p,22)},
    {key:"right",  head:"右翼",     get:p=>distAt(p,45)},
    {key:"max",    head:"最大",     get:p=>parkFacts(p).max},
    {key:"min",    head:"最小",     get:p=>parkFacts(p).min},
    {key:"avg",    head:"平均",     get:p=>parkFacts(p).avg},
    {key:"hmax",   head:"フェンス最大", get:p=>(parkFacts(p).height||{}).max},
    {key:"hmin",   head:"フェンス最小", get:p=>(parkFacts(p).height||{}).min},
    {key:"havg",   head:"フェンス平均", get:p=>(parkFacts(p).height||{}).avg},
    {key:"area",   head:"面積 m²",  get:p=>parkFacts(p).area}
  ];
  const list=PARKS.slice();
  const by=cols.find(c=>c.key===PARK_SORT.key);
  if(by){
    list.sort((a,b)=>{
      const x=by.get(a), y=by.get(b);
      if(by.nm) return String(x).localeCompare(String(y))*(PARK_SORT.dir<0?-1:1);
      const nx=isFinite(x)?x:-Infinity, ny=isFinite(y)?y:-Infinity;
      return (ny-nx)*(PARK_SORT.dir<0?1:-1);
    });
  }
  const show=(c,park)=>{
    const v=c.get(park);
    if(c.nm) return esc(String(v));
    if(!isFinite(v)) return "—";
    return c.key==="area" ? Math.round(v).toLocaleString() : v.toFixed(1);
  };
  const head=cols.map(c=>`<th${c.nm?' class="nm"':""} data-park-sort="${c.key}"
    title="押すと並べ替え">${c.head}${PARK_SORT.key===c.key ? (PARK_SORT.dir<0?" ▼":" ▲") : ""}</th>`).join("");
  const rows=list.map(park=>`<tr>${cols.map(c=>
    `<td${c.nm?' class="nm"':""}>${show(c,park)}</td>`).join("")}</tr>`).join("");
  return `<table class="sheet"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>`;
}

/** 平面での比べ。選んだ球場の形を重ねる。 */
function parkFlat(){
  const picked=PARKS.filter(p=>PARK_PICK.flat.has(p.name));
  const show=picked.length ? picked : PARKS.slice(0,2);
  const W=320, H=300, cx=W/2, cy=H-26;
  const maxD=Math.max(...show.map(p=>Math.max(...p.dist)))*1.06;
  const k=Math.min((H-46)/maxD, (W/2-12)/(maxD*Math.sin(Math.PI/4)));
  const line=park=>{
    let d="";
    for(let a=-45;a<=45;a++){
      const r=distAt(park,a)*k, t=(a-90)*Math.PI/180;
      const x=cx+r*Math.cos(t), y=cy+r*Math.sin(t);
      d+=(a===-45?"M":"L")+x.toFixed(1)+" "+y.toFixed(1);
    }
    return d;
  };
  const paths=show.map(park=>{
    const at=PARKS.findIndex(x=>x.name===park.name);
    return `<path d="${line(park)}" fill="${parkColor(at)}" fill-opacity="0.10"
      stroke="${parkColor(at)}" stroke-width="1.8"/>`;
  }).join("");
  // 塁線と、50m ごとの目安
  const rings=[50,100,150].filter(r=>r*k<H).map(r=>
    `<path d="M${(cx-r*k*Math.sin(Math.PI/4)).toFixed(1)} ${(cy-r*k*Math.cos(Math.PI/4)).toFixed(1)}
      A${(r*k).toFixed(1)} ${(r*k).toFixed(1)} 0 0 1
      ${(cx+r*k*Math.sin(Math.PI/4)).toFixed(1)} ${(cy-r*k*Math.cos(Math.PI/4)).toFixed(1)}"
      fill="none" stroke="var(--line)" stroke-dasharray="3 4"/>
     <text x="${cx+3}" y="${(cy-r*k-3).toFixed(1)}" fill="var(--muted)" font-size="9">${r}m</text>`).join("");
  const foul=[-45,45].map(a=>{
    const t=(a-90)*Math.PI/180, r=maxD*k;
    return `<line x1="${cx}" y1="${cy}" x2="${(cx+r*Math.cos(t)).toFixed(1)}"
      y2="${(cy+r*Math.sin(t)).toFixed(1)}" stroke="var(--line)"/>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">
    ${rings}${foul}${paths}
    <circle cx="${cx}" cy="${cy}" r="3" fill="var(--text)"/>
  </svg>`;
}

/**
 * 立体での比べ。選んだ 2 球場のフェンスを起こして描く。
 *
 * <p>外から持ってくるものは無く、canvas に自前で投影する。
 * 奥行きは「遠いものほど小さく」の一点透視。ドラッグで回る。
 */
function drawParkSolid(){
  const canvas=document.getElementById("parkSolid");
  if(!canvas) return;
  const names=PARK_PICK.solid.length ? PARK_PICK.solid : PARKS.slice(0,2).map(p=>p.name);
  const show=names.map(n=>PARKS.find(p=>p.name===n)).filter(Boolean);
  const ratio=window.devicePixelRatio||1;
  const w=canvas.clientWidth||320, h=canvas.clientHeight||300;
  canvas.width=w*ratio; canvas.height=h*ratio;
  const g=canvas.getContext("2d");
  g.setTransform(ratio,0,0,ratio,0,0);
  g.clearRect(0,0,w,h);
  if(!show.length) return;

  const maxD=Math.max(...show.map(p=>Math.max(...p.dist)));
  const css=getComputedStyle(document.documentElement);
  const colors=show.map(p=>parkColor(PARKS.findIndex(x=>x.name===p.name)));
  const turn=PARK_PICK.turn*Math.PI/180, tilt=PARK_PICK.tilt*Math.PI/180;
  const zoom=Math.min(w,h)*0.78/maxD*PARK_PICK.zoom;
  // 本塁を原点に、x が右、z が中堅方向、y が高さ
  const project=(x,y,z)=>{
    const sx=x*Math.cos(turn)-z*Math.sin(turn);
    const sz=x*Math.sin(turn)+z*Math.cos(turn);
    return [w/2+PARK_PICK.panX+sx*zoom,
            h*0.62+PARK_PICK.panY-(y*zoom*Math.cos(tilt)) + sz*zoom*Math.sin(tilt)*-1];
  };
  const at=(park,a,y)=>{
    const r=distAt(park,a), t=a*Math.PI/180;
    return project(r*Math.sin(t), y, r*Math.cos(t));
  };
  // 地面の目安(50m ごとの円弧)
  g.strokeStyle=css.getPropertyValue("--line").trim()||"#333";
  g.lineWidth=1;
  [50,100,150].filter(r=>r<=maxD).forEach(r=>{
    g.beginPath();
    for(let a=-45;a<=45;a++){
      const t=a*Math.PI/180;
      const [px,py]=project(r*Math.sin(t),0,r*Math.cos(t));
      a===-45 ? g.moveTo(px,py) : g.lineTo(px,py);
    }
    g.stroke();
  });
  // ファールライン
  [-45,45].forEach(a=>{
    const t=a*Math.PI/180;
    const [x0,y0]=project(0,0,0);
    const [x1,y1]=project(maxD*Math.sin(t),0,maxD*Math.cos(t));
    g.beginPath(); g.moveTo(x0,y0); g.lineTo(x1,y1); g.stroke();
  });
  show.forEach((park,i)=>{
    const color=colors[i];
    // フェンスの壁
    g.beginPath();
    for(let a=-45;a<=45;a++){
      const [px,py]=at(park,a,0);
      a===-45 ? g.moveTo(px,py) : g.lineTo(px,py);
    }
    for(let a=45;a>=-45;a--){
      const [px,py]=at(park,a,Math.max(1,heightAt(park,a)));
      g.lineTo(px,py);
    }
    g.closePath();
    g.fillStyle=color; g.globalAlpha=0.22; g.fill();
    g.globalAlpha=1; g.strokeStyle=color; g.lineWidth=1.6; g.stroke();
    // 上辺をもう一度なぞって輪郭をはっきりさせる
    g.beginPath();
    for(let a=-45;a<=45;a++){
      const [px,py]=at(park,a,Math.max(1,heightAt(park,a)));
      a===-45 ? g.moveTo(px,py) : g.lineTo(px,py);
    }
    g.stroke();
    // 名前は左上に並べる。球場の上に置くと重なって読めない。
    g.fillStyle=color;
    g.font="600 12px 'Source Sans 3',sans-serif";
    g.textAlign="left";
    g.fillRect(10, 12+i*16-8, 12, 3);
    g.fillText(park.name, 27, 12+i*16);
  });
  // 本塁
  const [hx,hy]=project(0,0,0);
  g.fillStyle=css.getPropertyValue("--text").trim()||"#fff";
  g.beginPath(); g.arc(hx,hy,3,0,Math.PI*2); g.fill();
}

/* ------------------------------------------------------ コースの分布図
   5×5 のマスに丸めず、記録してある plate_x / plate_y から密度を出して描く。
   1 球ごとに釣鐘状の山を置いて足し合わせ(カーネル密度)、
   濃さで段階を付けたものを並べる。 */
/** ストライクゾーンの箱(config の既定値と同じ)。 */
const ZONE={w:0.6, bottom:0.5, top:1.7};
/** 1m を何ポイントで描くか。 */
const PLATE_SCALE=75;
/** 山の広がり(m)。小さくすると点が散り、大きくすると滑らかになる。 */
const KDE_BANDWIDTH=0.13;
/** 濃さの段数。 */
const KDE_BANDS=7;

function densityChart(rows, id){
  const W=200, H=230, cell=5;
  const cx=W/2, mid=(ZONE.bottom+ZONE.top)/2, cy=H/2;
  const X=x=>cx+x*PLATE_SCALE, Y=y=>cy-(y-mid)*PLATE_SCALE;
  // 枠線とベースは球が無くても描く
  let dens="";
  if(rows.length){
    const h2=2*KDE_BANDWIDTH*KDE_BANDWIDTH;
    const cols=Math.ceil(W/cell), lines=Math.ceil(H/cell);
    const grid=new Float64Array(cols*lines);
    let peak=0;
    for(let r=0;r<lines;r++){
      for(let c=0;c<cols;c++){
        // マスの中心を m に戻す
        const mx=((c+0.5)*cell-cx)/PLATE_SCALE;
        const my=mid-((r+0.5)*cell-cy)/PLATE_SCALE;
        let sum=0;
        for(const row of rows){
          const dx=Number(row.plate_x)-mx, dy=Number(row.plate_y)-my;
          sum+=Math.exp(-(dx*dx+dy*dy)/h2);
        }
        grid[r*cols+c]=sum;
        if(sum>peak) peak=sum;
      }
    }
    if(peak>0){
      for(let r=0;r<lines;r++){
        for(let c=0;c<cols;c++){
          const t=grid[r*cols+c]/peak;
          if(t<0.08) continue;
          // 段に丸めると、等高線のような見た目になる
          const band=Math.min(KDE_BANDS, Math.ceil(t*KDE_BANDS));
          const k=band/KDE_BANDS;
          const color=k<0.62 ? "var(--cold)" : mix("--cold","--hot",(k-0.62)/0.38);
          dens+=`<rect x="${c*cell}" y="${r*cell}" width="${cell}" height="${cell}"
              fill="${color}" fill-opacity="${(0.10+0.78*Math.min(1,k/0.62)).toFixed(2)}"/>`;
        }
      }
    }
  }
  // 密度はぼかして滑らかにし、枠線は輪郭のまま重ねる
  let g=`<rect x="0" y="0" width="${W}" height="${H}" fill="var(--panel-2)" rx="4"/>
    <g style="filter:blur(2.4px)">${dens}</g>`;
  const l=X(-ZONE.w), r=X(ZONE.w), t=Y(ZONE.top), b=Y(ZONE.bottom);
  for(let i=1;i<3;i++){
    const gx=l+(r-l)*i/3, gy=t+(b-t)*i/3;
    g+=`<line x1="${gx.toFixed(1)}" y1="${t.toFixed(1)}" x2="${gx.toFixed(1)}" y2="${b.toFixed(1)}"
        stroke="var(--line)"/>`;
    g+=`<line x1="${l.toFixed(1)}" y1="${gy.toFixed(1)}" x2="${r.toFixed(1)}" y2="${gy.toFixed(1)}"
        stroke="var(--line)"/>`;
  }
  g+=`<rect x="${l.toFixed(1)}" y="${t.toFixed(1)}" width="${(r-l).toFixed(1)}"
      height="${(b-t).toFixed(1)}" fill="none" stroke="var(--text)" stroke-width="1.6"/>`;
  // 本塁ベース(捕手目線)
  const hp=Y(ZONE.bottom)+26;
  g+=`<path d="M ${(cx-26)} ${hp} L ${(cx+26)} ${hp} L ${(cx+26)} ${hp+9}
      L ${cx} ${hp+17} L ${(cx-26)} ${hp+9} Z"
      fill="var(--panel)" stroke="var(--line)"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="コースの分布">${g}</svg>`;
}

/* --------------------------------------------------------- 打球分布 */
function sprayColor(res){
  if(res==="HOME_RUN") return "var(--homer)";
  if(res==="TRIPLE") return "var(--triple)";
  if(res==="DOUBLE") return "var(--double)";
  if(res==="SINGLE") return "var(--single)";
  return "var(--out)";
}
/** 球場の大きさ(m)。両翼・左右中間・中堅。測った球場が無いときの既定。 */
const FENCE={line:100, alley:116, center:122};
/** stadium.yml から読んだ球場。dist は -45 度から 1 度刻みで 91 個。 */
const PARKS=[];
/** チャートに使う球場の名前。空なら既定の形。 */
let PARK="";
/** フェンスを重ねて描く球場の名前。 */
const OVERLAY=new Set();
/** 球場オーバーレイの一覧を開いているか。描き直しても畳まれないよう覚えておく。 */
let OVERLAY_OPEN=false;
/** 重ねる球場の色。読み込んだ順に振る。 */
const PARK_COLORS=["#e8552b","#2e8bff","#25a55f","#c14fd6",
                   "#e0a600","#00b3b3","#ff77a8","#7a5cff"];
function parkColor(i){ return PARK_COLORS[i%PARK_COLORS.length]; }

/** チャートの上に置く、重ねる球場を選ぶ一覧。 */
function parkOverlayBox(){
  if(!PARKS.length) return "";
  return `<details class="parkbox" id="parkbox"${OVERLAY_OPEN?" open":""}>
    <summary>球場オーバーレイ<small>${overlayNote()}</small></summary>
    <div class="parklist">${PARKS.map((p,i)=>`<label>
      <input type="checkbox" data-park="${esc(p.name)}"${OVERLAY.has(p.name)?" checked":""}>
      <i style="background:${parkColor(i)}"></i><b>${esc(p.name)}</b>
      <small>${Math.round(fenceOf(p,-45))}/${Math.round(fenceOf(p,0))}/${Math.round(fenceOf(p,45))}</small>
    </label>`).join("")}</div>
  </details>`;
}
function overlayNote(){
  return OVERLAY.size ? OVERLAY.size+" 球場を重ねています" : PARKS.length+" 球場";
}
/** 今チャートに重ねる球場。読み込んだ順に色が決まる。 */
function overlayParks(){
  return PARKS.map((p,i)=>({park:p, color:parkColor(i)}))
              .filter(o=>OVERLAY.has(o.park.name));
}
function parkOf(name){ return PARKS.find(p=>p.name===name)||null; }
function activePark(){ return parkOf(PARK); }
/** その球場の、その方向のフェンスまでの距離。park が null なら既定の形。 */
function fenceOf(park,deg){
  if(!park) return fenceAt(deg);
  const a=Math.max(-45,Math.min(45,deg))+45;
  const lo=Math.floor(a), hi=Math.min(90,lo+1), t=a-lo;
  return park.dist[lo]*(1-t)+park.dist[hi]*t;
}
/**
 * 測り損ねた方向をならす。
 *
 * <p>フェンスに 1 ブロックでも隙間があると、そこだけレーダーが抜けて
 * ずっと先の壁まで飛んでしまう。フェンスは 1 度刻みで見れば滑らかなので、
 * 周りから大きく飛び出た値は測れなかったものとして扱う。
 *
 * <p>直し方は「両隣の平均」。2 つ以上続けて測れなかったときは
 * 平均を取る相手がいないので、近いほうの生きている値をそのまま使う。
 */
const SPIKE_MARGIN=15;
function despike(dist, heights){
  const median=(a,i,span)=>{
    const w=a.slice(Math.max(0,i-span), Math.min(a.length,i+span+1)).slice().sort((x,y)=>x-y);
    return w[w.length>>1];
  };
  // 隙間を抜けて遠くを拾った方向も、手前の物を拾った方向も直す
  const bad=dist.map((v,i)=>Math.abs(v-median(dist,i,3))>SPIKE_MARGIN);
  const from=dist.slice(), fromH=heights.slice();
  for(let i=0;i<dist.length;i++){
    if(!bad[i]) continue;
    let l=i-1; while(l>=0&&bad[l]) l--;
    let r=i+1; while(r<dist.length&&bad[r]) r++;
    const single = !(i>0&&bad[i-1]) && !(i+1<dist.length&&bad[i+1]);
    const pick=a=>{
      if(l<0&&r>=a.length) return a[i];
      if(l<0) return a[r];
      if(r>=a.length) return a[l];
      return single ? (a[l]+a[r])/2 : (i-l<=r-i ? a[l] : a[r]);
    };
    dist[i]=pick(from);
    heights[i]=pick(fromH);
  }
}

/** その球場のフェンスの高さ。測っていなければ空文字。 */
function wallOf(park){
  const seen=(park&&park.heights||[]).filter(v=>v>0);
  if(!seen.length) return "";
  return `, 壁${(seen.reduce((a,b)=>a+b,0)/seen.length).toFixed(1)}m`;
}
/** 実測のブロックを持っているか。 */
const measured=park=>!!(park&&park.pts&&park.pts.length);

/**
 * 登録した球場のうち、その打球が本塁打になる数。
 * 球場を 1 つも読み込んでいなければ null。
 */
/** その打球が本塁打になる球場の名前。球場を読み込んでいなければ null。 */
function hrParkNames(deg,d){
  if(!PARKS.length||!(d>0)||!isFinite(deg)||Math.abs(deg)>45) return null;
  return PARKS.filter(p=>d>=fenceOf(p,deg)).map(p=>p.name);
}
/** その方向のフェンスまでの距離。3 点を滑らかに繋ぐ。 */
function fenceAt(deg){
  const a=Math.min(45,Math.abs(deg));
  const ease=(from,to,t)=>from+(to-from)*(1-Math.cos(Math.PI*t))/2;
  return a<=22.5 ? ease(FENCE.center,FENCE.alley,a/22.5)
                 : ease(FENCE.alley,FENCE.line,(a-22.5)/22.5);
}

/**
 * 飛距離。記録が無い打球は、打球速度と角度から見積もる。
 * 柵越えのように球を消してしまう打球は、飛距離が 0 で残っていることがある。
 */
function distanceOf(r){
  const d=Number(r.distance);
  if(d>0) return d;
  const ev=Number(r.exit_velocity), la=Number(r.launch_angle);
  if(!isFinite(ev)||!isFinite(la)) return 0;
  // 斜方投射の到達距離。空気抵抗のぶんを掛けて実測に寄せる
  const v=ev/3.6, a=Math.max(-45,Math.min(89,la))*Math.PI/180;
  return Math.max(0, v*v*Math.sin(2*a)/9.8*0.62);
}
/**
 * フェンスをなぞる線。
 *
 * <p>ブロックの座標を持っている球場は、測った点をそのまま繋ぐので
 * 出っ張りや窪みがそのまま出る。持っていなければ 1 度刻みの表から引く。
 */
/**
 * フェンスの点をならす。
 *
 * <p>ブロック単位で測っているので、隣り合う点は 1 ブロックぶん飛び飛びに並ぶ。
 * 前後 2 点ずつの平均を取って、線として見えるようにする。
 * 出っ張りや窪みは残るくらいの弱さにしてある。
 */
function smoothPts(pts){
  if(pts.length<5) return pts;
  const span=2;
  return pts.map((pt,i)=>{
    let sum=0, n=0;
    for(let k=Math.max(0,i-span); k<=Math.min(pts.length-1,i+span); k++){ sum+=pts[k].d; n++; }
    return {ang:pt.ang, d:sum/n, h:pt.h};
  });
}
function fencePath(park,P,cx,cy){
  let d=`M ${cx} ${cy}`;
  if(park && park.pts && park.pts.length){
    // 点はブロックの中心なので、そのまま繋ぐと 1 ブロックぶんの階段になる。
    // 前後の点と均してから繋ぐと、実際のフェンスの曲がりに見える。
    const pts=smoothPts(park.pts);
    pts.forEach(pt=>{
      const [x,y]=P(pt.ang, pt.d);
      d+=` L ${x.toFixed(1)} ${y.toFixed(1)}`;
    });
    return d;
  }
  for(let a=-45;a<=45;a+=(park?1:1.5)){
    const [x,y]=P(a,fenceOf(park,a));
    d+=` L ${x.toFixed(1)} ${y.toFixed(1)}`;
  }
  return d;
}
function drawSpray(){
  const svg=document.getElementById("spray"); if(!svg) return;
  // チャートに載せるのは安打だけ
  const bip=summarize(pitchOf(PLAYER,"bat")).bip
    .filter(r=>HIT.has(r.result))
    .map(r=>({...r, _d:distanceOf(r)}))
    .filter(r=>r._d>0);
  const cx=160, cy=278;
  const park=activePark();
  const F=deg=>fenceOf(park,deg);
  const layers=overlayParks();
  const maxD=Math.max(F(0)+8,
    ...layers.map(o=>Math.max(...o.park.dist)+8),
    ...(park?[Math.max(...park.dist)+8]:[]),
    ...bip.map(r=>r._d));
  const scale=248/maxD;
  const P=(deg,d)=>{const a=deg*Math.PI/180;
    return [cx+Math.sin(a)*d*scale, cy-Math.cos(a)*d*scale];};
  const arc=d=>{const [x1,y1]=P(-45,d),[x2,y2]=P(45,d);
    return `M ${x1.toFixed(1)} ${y1.toFixed(1)} A ${(d*scale).toFixed(1)} ${(d*scale).toFixed(1)} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`;};

  // フェンスの形。ブロックを測ってあるならその通りに、無ければ滑らかな曲線で
  const fence=fencePath(park,P,cx,cy)+" Z";
  let g=`<path d="${fence}" fill="var(--grass)" stroke="var(--line)" stroke-width="1.5"/>`;
  // 内野
  g+=`<path d="M ${cx} ${cy} L ${P(-45,38)[0].toFixed(1)} ${P(-45,38)[1].toFixed(1)}
      L ${P(0,54)[0].toFixed(1)} ${P(0,54)[1].toFixed(1)}
      L ${P(45,38)[0].toFixed(1)} ${P(45,38)[1].toFixed(1)} Z"
      fill="var(--dirt)" stroke="var(--line)" stroke-opacity=".7"/>`;
  // 距離の目安。フェンスの実寸を書き込む
  [-45,-22.5,0,22.5,45].map(a=>[a,F(a)])
    .forEach(([a,d])=>{
      const [tx,ty]=P(a,d+7);
      g+=`<text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" fill="var(--muted)" font-size="9.5"
          font-family="Roboto Mono, monospace" text-anchor="middle">${Math.round(d)}</text>`;
    });
  [40,80].forEach(d=>{
    g+=`<path d="${arc(d)}" fill="none" stroke="var(--line)" stroke-dasharray="3 4"/>`;
  });
  const [lx,ly]=P(-45,F(-45)), [rx,ry]=P(45,F(45));
  g+=`<line x1="${cx}" y1="${cy}" x2="${lx.toFixed(1)}" y2="${ly.toFixed(1)}" stroke="var(--line)"/>`;
  g+=`<line x1="${cx}" y1="${cy}" x2="${rx.toFixed(1)}" y2="${ry.toFixed(1)}" stroke="var(--line)"/>`;
  // 重ねる球場のフェンス。地の球場の上、打球の下に描く
  layers.forEach(o=>{
    const path=fencePath(o.park,P,cx,cy)+" Z";
    g+=`<path d="${path}" fill="none" stroke="${o.color}" stroke-width="1.8"
        stroke-linejoin="round" opacity="0.9"><title>${esc(o.park.name)}</title></path>`;
  });
  // 球場名は線の上に置くと重なるので、空いている左上に並べる
  layers.forEach((o,i)=>{
    const y=14+i*13;
    g+=`<line x1="6" y1="${y-3.5}" x2="21" y2="${y-3.5}" stroke="${o.color}"
        stroke-width="2.5" stroke-linecap="round"/>`;
    g+=`<text x="25" y="${y}" fill="var(--text)" font-size="10"
        font-weight="600">${esc(o.park.name)}</text>`;
  });
  bip.forEach(r=>{
    const [x,y]=P(Number(r.spray_angle)||0, Math.min(r._d,maxD));
    g+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5" fill="${sprayColor(r.result)}"
        fill-opacity="0.88" stroke="var(--panel)" stroke-width="1.2">
        <title>${JA[r.result]||r.result||"打球"} ${f1(r._d)}m / ${f1(Number(r.exit_velocity))}km/h / ${f1(Number(r.launch_angle))}°</title></circle>`;
  });
  g+=`<circle cx="${cx}" cy="${cy}" r="3" fill="var(--text)"/>`;
  svg.innerHTML=g;
}

/* ------------------------------------------------------------- 入力 */
/**
 * stadium.yml を読む。
 *
 * <p>プラグインが書く形だけを相手にするので、汎用の yaml 読みは要らない。
 * Stadiums の下に球場の名前が並び、その中に Distances(91 個の距離) と
 * Heights(91 個のフェンスの高さ)が入っている。
 */
function ingestYaml(text){
  const lines=String(text).replace(/\r/g,"").split("\n");
  let inRoot=false, rootIndent=0, nameIndent=-1;
  let park=null, target=null, group="", added=0;
  const blank=()=>({name:"", dist:[], heights:[], fence:[],
    hx:NaN, hz:NaN, fx:NaN, fz:NaN, seats:NaN});
  const flush=()=>{
    const built=park && buildPark(park);
    if(built){
      const at=PARKS.findIndex(x=>x.name===built.name);
      if(at>=0) PARKS[at]=built; else PARKS.push(built);
      added++;
    }
    park=null; target=null; group="";
  };
  for(const raw of lines){
    const line=raw.trim();
    if(!line || line.startsWith("#")) continue;
    const indent=raw.length-raw.replace(/^ +/,"").length;
    if(!inRoot){
      if(/^Stadiums:$/i.test(line)){ inRoot=true; rootIndent=indent; }
      continue;
    }
    // Stadiums の外へ出た
    if(indent<=rootIndent){ flush(); inRoot=false; continue; }
    // 一覧の要素。直前に来た見出しの列に足す
    const item=line.match(/^-\s*['"]?([^'"]+?)['"]?$/);
    if(item){
      if(!park||!target) continue;
      if(target==="fence"){
        const xyz=item[1].split(",").map(Number);
        if(xyz.length>=3 && xyz.every(v=>isFinite(v))) park.fence.push(xyz);
      }else if(isFinite(Number(item[1]))){
        park[target].push(Number(item[1]));
      }
      continue;
    }
    const key=line.match(/^['"]?([^'":]+)['"]?:\s*(.*)$/);
    if(!key) continue;
    // Stadiums の中で最初に出てくるキーの深さが、球場の名前の深さ
    if(nameIndent<0) nameIndent=indent;
    if(indent===nameIndent){
      flush();
      park=blank(); park.name=key[1].trim();
      continue;
    }
    if(!park) continue;
    const k=key[1].trim(), v=key[2].trim();
    if(v===""){
      // 値の無い行。一覧の見出しか、入れ子の始まり
      target = /^Distances$/i.test(k) ? "dist"
             : /^Heights$/i.test(k) ? "heights"
             : /^Fence$/i.test(k) ? "fence" : null;
      group = target ? "" : k;
      continue;
    }
    target=null;
    // 収容人数。プラグインは書かないので、手で足したときだけ入る
    if(/^Seats$/i.test(k) && isFinite(Number(v))) park.seats=Number(v);
    else if(group==="Home"&&k==="X") park.hx=Number(v);
    else if(group==="Home"&&k==="Z") park.hz=Number(v);
    else if(group==="Forward"&&k==="X") park.fx=Number(v);
    else if(group==="Forward"&&k==="Z") park.fz=Number(v);
  }
  flush();
  return added?"stadium":null;
}
/**
 * 読んだ球場を、描画と判定に使える形にする。
 *
 * <p>Fence(ブロックの座標)があればそれが本物。無ければ古い形式の
 * Distances(1 度刻みの距離)をそのまま使う。
 */
function buildPark(park){
  if(park.fence.length && isFinite(park.hx) && isFinite(park.hz)
     && isFinite(park.fx) && isFinite(park.fz)){
    const built=profileFromBlocks(park.fence, park.hx, park.hz, park.fx, park.fz);
    if(built) return {name:park.name, dist:built.dist, heights:built.heights,
                      pts:built.pts, blocks:park.fence.length, seats:park.seats,
                      hx:park.hx, hz:park.hz};
  }
  if(park.dist.length===91 && park.dist.every(v=>isFinite(v)&&v>0)){
    const heights = park.heights.length===91 ? park.heights.slice() : new Array(91).fill(0);
    const dist=park.dist.slice();
    despike(dist, heights);
    return {name:park.name, dist, heights, pts:null, blocks:0, seats:park.seats};
  }
  return null;
}
/**
 * フェンスのブロックから、1 度刻みの距離の表と、描画用の点を作る。
 *
 * <p>距離は本塁からブロックまでの三平方から 1 引いた値。
 * 同じ方向に複数あれば手前を採る(本塁から見て最初に当たる壁がフェンス)。
 */
function profileFromBlocks(blocks, hx, hz, fx, fz){
  const dist=new Array(91).fill(0), heights=new Array(91).fill(0), pts=[];
  blocks.forEach(b=>{
    const dx=b[0]+0.5-hx, dz=b[1]+0.5-hz;
    const d=Math.hypot(dx,dz)-1;
    if(!(d>0)) return;
    const front=dx*fx+dz*fz, side=dx*(-fz)+dz*fx;
    const ang=Math.atan2(side,front)*180/Math.PI;
    if(Math.abs(ang)>45) return;
    pts.push({ang, d, h:b[2]});
    const i=Math.max(0,Math.min(90,Math.round(ang+45)));
    if(dist[i]<=0||d<dist[i]){ dist[i]=d; heights[i]=b[2]; }
  });
  if(!pts.length) return null;
  fillGaps(dist); fillGaps(heights);
  despike(dist, heights);
  // ファールラインの先はポールが立っていて高く出る。端は隣と同じ高さに。
  heights[0]=heights[1]; heights[90]=heights[89];
  pts.sort((a,b)=>a.ang-b.ang);
  return {dist, heights, pts};
}
/** 測れなかった角度を、両隣の値から埋める。 */
function fillGaps(values){
  let first=-1;
  for(let i=0;i<values.length;i++){ if(values[i]>0){ first=i; break; } }
  if(first<0) return;
  for(let i=0;i<first;i++) values[i]=values[first];
  let last=first;
  for(let i=first+1;i<values.length;i++){
    if(values[i]<=0) continue;
    for(let j=last+1;j<i;j++){
      const t=(j-last)/(i-last);
      values[j]=values[last]*(1-t)+values[i]*t;
    }
    last=i;
  }
  for(let i=last+1;i<values.length;i++) values[i]=values[last];
}
/**
 * もう読んだ記録の覚え書き。同じ内容を二度数えないために使う。
 *
 * <p>記録は試合ごとに書き出すので、同じ選手のファイルが
 * 置き場所ごとに複数あることがある(古い試合は site/、新しい試合は csv/ など)。
 * 全部読まないと抜ける試合が出るが、そのまま足すと重なった試合が倍になる。
 */
const SEEN={games:new Set(), pitch:new Set(), play:new Set()};

/** 読んだ記録の覚え書きを白紙に戻す。 */
function forgetSeen(){
  SEEN.games.clear(); SEEN.pitch.clear(); SEEN.play.clear();
}


/** 打席の記録。すでに読んだ試合のぶんは読み飛ばす。 */
function addPlate(rows){
  const mine=new Set(rows.map(r=>String(r.game_id||"")));
  const skip=new Set([...mine].filter(g=>SEEN.games.has(g)));
  mine.forEach(g=>SEEN.games.add(g));
  const keep=rows.filter(r=>!skip.has(String(r.game_id||"")));
  DATA.plate.push(...keep);
  return keep.length;
}

/** 1 行ずつ、同じものが無ければ足す。 */
function addRows(target, rows, seen, key){
  let added=0;
  rows.forEach(r=>{
    const k=key(r);
    if(seen.has(k)) return;
    seen.add(k);
    target.push(r);
    added++;
  });
  return added;
}

/** 1 球の記録を一意にする組。同じ球は同じ組になる。 */
function pitchKey(r){
  return [r.game, r.pa, r.pitch_no, r.side, r.pitcher, r.batter].join("|");
}

function ingest(text,name){
  if(name&&/\.ya?ml$/i.test(name)){
    // 同じ yml でも、選手の別名表と球場は中身で見分ける
    return /^\s*Players\s*:/m.test(text) ? ingestPlayers(text) : ingestYaml(text);
  }
  const {head,rows}=parseCsv(text);
  if(!rows.length) return null;
  // 1 試合 1 行の game.csv。打席の記録と同じ game_id を持つので、先に見分ける
  if(head.includes("game_id") && !head.includes("inning")){ ingestGames(rows); return "game"; }
  if(head.includes("game_id")){ addPlate(rows); return "result"; }
  if(head.includes("side")&&head.includes("pitch_no")){
    addRows(DATA.pitch, rows, SEEN.pitch, pitchKey);
    return "record";
  }
  // 守備と走塁の記録(record/<名前>_play.csv)
  if(head.includes("kind")&&head.includes("touchorder")){
    addRows(DATA.play, rows, SEEN.play, r=>JSON.stringify(r));
    return "play";
  }
  return null;
}
/**
 * csv をまとめて読む。何度でも足せる。
 * result も record も、何ファイルでも混ぜてよい。
 * 同じ名前のファイルは二重に数えないよう読み飛ばす。
 */
/**
 * manifest.json に並んだファイルを読み込む。
 *
 * <p>置き場所は index.html と同じところ。名前は index.html から見た相対のパスで、
 * csv・yml と顔画像(ファイル名 = プレイヤー名)を並べる。
 *
 *   {"files": ["2026090801.csv", "sota2486.png", "players.yml"]}
 *
 * <p>manifest.json が無ければサンプルのまま表示する。
 */
async function bootFromData(){
  // manifest はここのどれかにある。上から順に探す。
  const WHERE=["manifest.json", "data/manifest.json", "site/manifest.json"];
  let names=null, maybe=[], base="", why="";
  for(const at of WHERE){
    try{
      const res=await fetch(at, {cache:"no-cache"});
      if(!res.ok){ why=at+" -> HTTP "+res.status; continue; }
      const body=await res.json();
      names=Array.isArray(body) ? body : (body.files||[]);
      // maybe はまだ無いかもしれないファイル。無くても知らせない。
      maybe=Array.isArray(body) ? [] : (body.maybe||[]);
      // manifest の中の名前は、その manifest から見た相対のパス
      base=at.slice(0, at.lastIndexOf("/")+1);
      break;
    }catch(e){
      why=at+" -> "+(e && e.message ? e.message : e);
    }
  }
  if(!names){
    bootFailed(why);
    render();
    return;
  }
  const enc=name => name.split("/").map(encodeURIComponent).join("/");
  // 置き場所が変わっても拾えるよう、いくつか当たってみる。
  // 手元では site/ に入れていても、公開先では直下に並べていることがある。
  // site/ を先に見る。古い写しが直下に残っていると、そちらに引っぱられるため。
  const WHERE_FILE=["site/", "csv/", "", "data/"];
  // 一度どこで見つかったかを覚えておき、次からはそこだけ見る。
  // 毎回 3 か所当たると、ファイルの数だけ無駄な 404 が積み上がる。
  let goodDir=null;
  const candidates=name => {
    const only=name.split("/").pop();
    // 覚えたフォルダを先に当てて無駄な 404 を減らすが、そこに無ければ
    // ほかのフォルダも当たり直す。フォルダをまたいで置いてあっても読めるように。
    const dirs=goodDir===null ? WHERE_FILE
      : [goodDir, ...WHERE_FILE.filter(d=>d!==goodDir)];
    const list=name.includes("/") ? [base+enc(name)] : [];
    dirs.forEach(dir=>{
      const at=base+dir+enc(only);
      if(!list.includes(at)) list.push(at);
    });
    return list;
  };
  /** どこかに見つかるまで順に当たる。 */
  const grab=async name => {
    const only=name.split("/").pop();
    let last="";
    for(const at of candidates(name)){
      try{
        const res=await fetch(at, {cache:"no-cache"});
        if(res.ok){
          // どのフォルダで見つかったかを覚える
          WHERE_FILE.forEach(dir=>{
            if(at===base+dir+enc(only)) goodDir=dir;
          });
          return {at, text:await res.text()};
        }
        last=at+" -> HTTP "+res.status;
      }catch(e){
        last=at+" -> "+(e && e.message ? e.message : e);
      }
    }
    return {at:null, why:last};
  };
  // 写真は manifest に無いものも当たってみる(球場の写真を後から置いたとき用)
  const pics=names.filter(n=>/\.(png|jpe?g|gif|webp)$/i.test(n))
    .concat(maybe.filter(n=>/\.(png|jpe?g|gif|webp)$/i.test(n)));
  // 別名表を先に読みたいので、yml を前に出す
  const data=names.filter(n=>/\.(csv|ya?ml)$/i.test(n))
    .sort((a,b)=>{
      const ya=/\.ya?ml$/i.test(a) ? 0 : 1, yb=/\.ya?ml$/i.test(b) ? 0 : 1;
      return ya!==yb ? ya-yb : a.localeCompare(b);
    });
  if(data.length){ DATA.plate=[]; DATA.pitch=[]; DATA.play=[]; DATA.files=[];
    GAMES.clear(); forgetSeen(); SAMPLE=false; }
  const missing=[];
  // 置き場所を決めるために 1 つだけ先に取る。
  // ここで goodDir が決まるので、残りは無駄な 404 を出さずに済む。
  if(data.length){
    const first=await grab(data[0]);
    if(!first.at) missing.push(first.why);
    else if(ingest(first.text, data[0])) DATA.files.push(data[0]);
    else missing.push(first.at+" -> 中身が result / record / play のどれでもない");
  }
  // 顔と球場の写真は画像そのものを参照する。読み込みを待つ必要は無い。
  // 置き場所が決まってから並べると、最初の候補でそのまま当たる。
  // 外れても、img が出せなければ次の候補へ移る。
  pics.forEach(n=>{
    const only=n.split("/").pop();
    // 置き場所が分かっていれば名前だけで組む。manifest のパスは
    // 手元の並びなので、公開先が直下なら毎回 1 回外す。
    const where=candidates(goodDir===null ? n : only);
    FACES[only.replace(/\.[^.]+$/,"")]=where[0];
    FACE_ALT[where[0]]=where.slice(1);
  });
  // 残りはまとめて取ってから、並びどおりに読み込む。
  // 1 つずつ待っていると、ファイルの数だけ待ち時間が積み上がって画面が出ない。
  const rest=data.slice(1);
  const fetched=await Promise.all(rest.map(grab));
  rest.forEach((name, i)=>{
    const got=fetched[i];
    if(!got.at){ missing.push(got.why); return; }
    if(ingest(got.text, name)) DATA.files.push(name);
    else missing.push(got.at+" -> 中身が result / record / play のどれでもない");
  });
  // 先回りぶん。まだ置かれていなくても普通のことなので、黙って飛ばす。
  const later=maybe.filter(n=>/.(csv|ya?ml)$/i.test(n) && !DATA.files.includes(n));
  const extra=await Promise.all(later.map(grab));
  later.forEach((name, i)=>{
    const got=extra[i];
    if(got.at && ingest(got.text, name)) DATA.files.push(name);
  });
  if(!DATA.files.length){
    // 1 つも読めなかった。空の画面を出すよりサンプルに戻す。
    SAMPLE=true;
    ingest(SAMPLE_RESULT);
    ingest(SAMPLE_RECORD);
    bootFailed("manifest は読めたが、中のファイルを 1 つも読めなかった", missing);
  }else if(missing.length){
    // 一部が置かれていないのは普通のこと。画面には出さず、
    // 中身を見たいときのために開発者ツールへだけ残す。
    console.info("読めなかったファイル:", missing);
  }
  applyAliases();
  render();
}

/**
 * 顔画像の代わりの置き場所。最初の場所で出なければ次を試す。
 */
const FACE_ALT={};
document.addEventListener("error", event => {
  const img=event.target;
  if(!img || img.tagName!=="IMG") return;
  const next=(FACE_ALT[img.getAttribute("src")]||[]).slice();
  if(!next.length){
    // どこにも無かった。球場の写真は消して「写真なし」を見せる。
    if(img.classList.contains("shot")) img.remove();
    return;
  }
  const now=next.shift();
  FACE_ALT[now]=next;
  img.src=now;
}, true);

/**
 * manifest が読めなかったことを画面に出す。
 *
 * <p>黙ってサンプルに戻ると、置き場所を間違えたのか
 * そもそも読みに行っていないのかが分からない。
 */
function bootFailed(why, missing){
  const bar=document.createElement("div");
  bar.style.cssText="padding:10px 14px; background:#fff4d6; color:#7a4f05;"
    + "border-bottom:1px solid #e8c98a; font-size:13px; line-height:1.7";
  if(location.protocol==="file:"){
    bar.textContent="ファイルを読めないため、サンプルを表示しています。"
      + "ブラウザは file:// で開いたページからファイルを読めません。"
      + "GitHub Pages に置くか、このフォルダで簡易サーバを立てて開いてください。";
  }else{
    const NL=String.fromCharCode(10);
    const list=(missing||[]).slice(0,6).map(one=>"・"+one).join(NL);
    const more=(missing||[]).length>6
      ? NL+"ほか "+((missing||[]).length-6)+" 件" : "";
    bar.style.whiteSpace="pre-wrap";
    bar.textContent=why
      + (list ? NL+list+more : "")
      + NL+"読みに来た場所: "+location.href;
  }
  document.body.insertBefore(bar, document.getElementById("app"));
}
/** 球場を選ぶ欄を、読み込んである球場で作り直す。 */
function renderParks(){
  const sel=document.getElementById("parkPick"); if(!sel) return;
  if(!PARKS.some(p=>p.name===PARK)) PARK="";
  [...OVERLAY].forEach(name=>{ if(!PARKS.some(p=>p.name===name)) OVERLAY.delete(name); });
  sel.innerHTML=`<option value="">既定の球場 (100/116/122)</option>`
    + PARKS.map(p=>`<option value="${esc(p.name)}">${esc(p.name)} `
        + `(${Math.round(fenceOf(p,-45))}/${Math.round(fenceOf(p,0))}/`
        + `${Math.round(fenceOf(p,45))}${wallOf(p)})</option>`).join("");
  sel.value=PARK;
  sel.hidden=PARKS.length===0;
}

// リーダーボードの切り替えと並べ替え、リザルトの試合選び
document.getElementById("app").addEventListener("click",e=>{
  const seg=e.target.closest("[data-lb]");
  if(seg){ LB[seg.dataset.lb]=seg.dataset.value; render(); return; }
  // ランキングの項目。カードでも下のタブでも同じ扱い。
  const pick=e.target.closest("[data-lb-key]");
  if(pick){
    LB.key=pick.dataset.lbKey;
    const card=pick.classList.contains("lbcard");
    render();
    const full=document.getElementById("lbfull");
    if(full && card) full.scrollIntoView({behavior:"smooth", block:"start"});
    return;
  }
  const th=e.target.closest("th[data-sort]");
  if(th){
    // 同じ列をもう一度押したら逆順。別の列なら降順から
    if(LB.key===th.dataset.sort) LB.dir=-LB.dir; else { LB.key=th.dataset.sort; LB.dir=-1; }
    render();
    return;
  }
  const game=e.target.closest("[data-game]");
  if(game){ GAME=game.dataset.game; render(); return; }
  // 広さの一覧の並べ替え
  const ps=e.target.closest("th[data-park-sort]");
  if(ps){
    const key=ps.dataset.parkSort;
    if(PARK_SORT.key===key) PARK_SORT.dir=-PARK_SORT.dir;
    else { PARK_SORT.key=key; PARK_SORT.dir=-1; }
    render();
    return;
  }
  // 名前は先に見る。行にも打席送りが付いているので、
  // 先に打席を切り替えると名前を押しても選手ページへ行けない。
  const first=e.target.closest("[data-who]");
  if(first && first.dataset.who){
    PLAYER=canon(first.dataset.who);
    PAWA_PLAYER=PLAYER;
    VIEW="split";
    render();
    window.scrollTo({top:0, behavior:"auto"});
    return;
  }
  // ベストプレーの行。名前以外を押したら、その試合のその打席へ飛ぶ
  const best=e.target.closest("[data-jump-pa]");
  if(best){
    const to=String(best.dataset.jumpPa||"");
    const at=Number(best.dataset.jumpAt);
    if(to){
      VIEW="result"; GAME=to; PA_GAME=to;
      if(isFinite(at) && at>=0) PA_AT=at;
      render();
      const box=(isFinite(at) && at>=0) ? document.getElementById("padetail") : null;
      if(box) box.scrollIntoView({behavior:"smooth", block:"start"});
      else window.scrollTo({top:0, behavior:"auto"});
      return;
    }
  }
  // 打席詳細の前後送り、打席結果の行押し
  const pa=e.target.closest("[data-pa]");
  if(pa && pa.dataset.pa!==""){
    const to=Number(pa.dataset.pa);
    if(isFinite(to)){
      PA_AT=to;
      render();
      const box=document.getElementById("padetail");
      if(box) box.scrollIntoView({behavior:"smooth", block:"start"});
      return;
    }
  }
  // スコアボードの回を押したら、その回の打席結果まで移動する
  const jump=e.target.closest("[data-jump]");
  if(jump){
    const at=document.getElementById(jump.dataset.jump);
    if(at) at.scrollIntoView({behavior:"smooth", block:"start"});
    return;
  }
  // 名前を押したらその選手の画面へ
  const who=e.target.closest("[data-who]");
  if(who && who.dataset.who){
    PLAYER=canon(who.dataset.who);
    PAWA_PLAYER=PLAYER;
    VIEW="split";
    render();
    // 前に見ていた位置のまま出ると、選手の顔より下から始まってしまう
    window.scrollTo({top:0, behavior:"auto"});
  }
});

document.getElementById("app").addEventListener("change",e=>{
  const flat=e.target.closest("input[data-flat]");
  if(flat){
    if(flat.checked) PARK_PICK.flat.add(flat.dataset.flat);
    else PARK_PICK.flat.delete(flat.dataset.flat);
    render();
    return;
  }
  const solid=e.target.closest("input[data-solid]");
  if(solid){
    const name=solid.dataset.solid;
    if(solid.checked){
      PARK_PICK.solid.push(name);
    }else{
      PARK_PICK.solid=PARK_PICK.solid.filter(n=>n!==name);
    }
    render();
  }
});
// 立体の操作。ドラッグで回転、右ドラッグ(や Shift)で移動、ホイールで拡大縮小
(function(){
  let mode="", lastX=0, lastY=0;
  const app=document.getElementById("app");
  app.addEventListener("pointerdown",e=>{
    if(!e.target.closest("#parkSolid")) return;
    mode = (e.button===2 || e.shiftKey) ? "pan" : "turn";
    lastX=e.clientX; lastY=e.clientY;
    e.target.setPointerCapture && e.target.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  app.addEventListener("pointermove",e=>{
    if(!mode) return;
    const dx=e.clientX-lastX, dy=e.clientY-lastY;
    if(mode==="pan"){
      PARK_PICK.panX+=dx;
      PARK_PICK.panY+=dy;
    }else{
      PARK_PICK.turn+=dx*0.4;
      PARK_PICK.tilt=Math.max(4, Math.min(80, PARK_PICK.tilt+dy*0.3));
    }
    lastX=e.clientX; lastY=e.clientY;
    drawParkSolid();
  });
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>
    app.addEventListener(ev,()=>{ mode=""; }));
  // 右ドラッグで移動できるよう、右クリックのメニューは出さない
  app.addEventListener("contextmenu",e=>{
    if(e.target.closest("#parkSolid")) e.preventDefault();
  });
  app.addEventListener("wheel",e=>{
    if(!e.target.closest("#parkSolid")) return;
    e.preventDefault();
    const k=Math.exp(-e.deltaY*0.0012);
    PARK_PICK.zoom=Math.max(0.3, Math.min(6, PARK_PICK.zoom*k));
    drawParkSolid();
  }, {passive:false});
  // 二度押しで元に戻す
  app.addEventListener("dblclick",e=>{
    if(!e.target.closest("#parkSolid")) return;
    PARK_PICK.turn=-28; PARK_PICK.tilt=26;
    PARK_PICK.zoom=1; PARK_PICK.panX=0; PARK_PICK.panY=0;
    drawParkSolid();
  });
})();
// 重ねる球場の切り替え。チャートだけ描き直して、一覧の開閉は保つ
document.getElementById("app").addEventListener("change",e=>{
  const box=e.target.closest("input[data-park]");
  if(!box) return;
  if(box.checked) OVERLAY.add(box.dataset.park); else OVERLAY.delete(box.dataset.park);
  const note=document.querySelector("#parkbox summary small");
  if(note) note.textContent=overlayNote();
  drawSpray();
});
// toggle は上がってこないので捕まえる側で拾う
document.getElementById("app").addEventListener("toggle",e=>{
  if(e.target.id==="parkbox") OVERLAY_OPEN=e.target.open;
}, true);
document.getElementById("theme").addEventListener("click",()=>{
  const now=document.documentElement.getAttribute("data-theme");
  document.documentElement.setAttribute("data-theme", now==="dark"?"light":"dark");
});
