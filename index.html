<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SBG Savant</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#f2f4f6;
  --panel:#ffffff;
  --panel-2:#f6f8f9;
  --line:#cfd8dc;
  --line-soft:#e6ebed;
  --rule:#2e7d8a;            /* 見出しの下線。Savant のティール */
  --text:#12181e;
  --muted:#6c7783;           /* ティール寄りの灰 */
  --hot:#d22d41;             /* 良い側 */
  --cold:#3b5fa8;            /* 悪い側 */
  --mid:#b8bec4;
  --track:#dfe5e8;
  --grass:#b9dcd7;
  --dirt:#ffffff;
  --single:#e8622a;
  --double:#7a6fd0;
  --triple:#e8b62a;
  --homer:#e0459a;
  --out:#8b98a4;
  --shadow:0 1px 2px rgba(18,24,30,.05), 0 4px 14px rgba(18,24,30,.06);
  --team-first:#c62828;      /* 先攻 */
  --team-second:#1565c0;     /* 後攻 */
}
:root[data-theme="dark"]{
  --ground:#0c1015; --panel:#151a20; --panel-2:#1b2129; --line:#2d353e; --line-soft:#232a32;
  --rule:#4aa3b0; --text:#e8edf1; --muted:#8d99a5; --hot:#e2485a; --cold:#5482d6;
  --mid:#4b545e; --track:#252d35; --grass:#1d322e; --dirt:#222a30;
  --team-first:#ff7b7b; --team-second:#6fa8ff;
  --shadow:0 1px 0 rgba(255,255,255,.03), 0 8px 24px rgba(0,0,0,.5);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0c1015; --panel:#151a20; --panel-2:#1b2129; --line:#2d353e; --line-soft:#232a32;
    --rule:#4aa3b0; --text:#e8edf1; --muted:#8d99a5; --hot:#e2485a; --cold:#5482d6;
    --mid:#4b545e; --track:#252d35; --grass:#1d322e; --dirt:#222a30;
    --team-first:#ff7b7b; --team-second:#6fa8ff;
    --shadow:0 1px 0 rgba(255,255,255,.03), 0 8px 24px rgba(0,0,0,.5);
  }
}

*{box-sizing:border-box}
img{max-width:100%}
[hidden]{display:none!important}
body{margin:0; background:var(--ground); color:var(--text);
  font-family:"Source Sans 3",system-ui,sans-serif; font-size:14px; line-height:1.5; padding:0 0 40px}
h1,h2,h3{margin:0; font-family:"Barlow Condensed","Source Sans 3",sans-serif; font-weight:600}
.mono{font-family:"Roboto Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}

/* ------------------------------------------------------------ header */
header{background:var(--panel); border-bottom:1px solid var(--line); padding:11px 18px 0}
.top{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap}
.wordmark{font-family:"Barlow Condensed",sans-serif; font-size:29px; font-weight:700;
  letter-spacing:.03em; text-transform:uppercase; line-height:1}
.wordmark b{color:var(--hot)}
.sub{color:var(--muted); font-size:12.5px}
.io{margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
button,label.filebtn,#parkPick{font:inherit; font-size:12.5px; color:var(--text); background:var(--panel-2);
  border:1px solid var(--line); border-radius:3px; padding:5px 11px; cursor:pointer}
button:hover,label.filebtn:hover,#parkPick:hover{border-color:var(--rule)}
#parkPick{max-width:230px}
:focus-visible{outline:2px solid var(--rule); outline-offset:2px}
/* 選手のタブは多くなると横スクロールする。
   打者/投手の切り替えは巻き込まれないよう外に出して常に見せる */
.tabrow{display:flex; align-items:flex-end; gap:10px; margin-top:11px}
.tabrow[hidden]{display:none}
.tabs{display:flex; gap:2px; overflow-x:auto; flex:1; min-width:0; padding-bottom:1px}
.tab{font-family:"Barlow Condensed",sans-serif; font-size:16px; letter-spacing:.02em;
  padding:6px 15px 7px; border:1px solid var(--line); border-bottom:0; border-radius:4px 4px 0 0;
  background:var(--panel-2); color:var(--muted); white-space:nowrap; cursor:pointer}
.tab[aria-selected="true"]{background:var(--panel); color:var(--text); font-weight:600;
  box-shadow:inset 0 3px 0 var(--rule); margin-bottom:-1px}
.side{display:flex; gap:2px; flex:none}
.side .tab{border-color:var(--rule)}

#drop{margin:12px 18px 0; padding:8px 13px; background:var(--panel);
  border:1px dashed var(--line); border-radius:4px; color:var(--muted); font-size:12.5px;
  display:flex; gap:11px; align-items:center; flex-wrap:wrap}
#drop.over{border-color:var(--rule); background:var(--panel-2)}
.badge{font-size:11px; border:1px solid currentColor; border-radius:99px; padding:0 9px}
.badge.warn{color:#a8791a}
.badge.ok{color:var(--rule)}

/* ------------------------------------------------------------ 顔写真 */
.face{display:inline-block; border-radius:3px; vertical-align:middle; flex:none;
  image-rendering:pixelated; object-fit:cover; background:var(--panel-2)}
.face.ph{display:inline-flex; align-items:center; justify-content:center; color:#fff;
  font-family:"Barlow Condensed",sans-serif; font-weight:700; line-height:1}
.withface{display:inline-flex; align-items:center; gap:6px; min-width:0}
.withface span{overflow:hidden; text-overflow:ellipsis}
.who .facebig{margin-bottom:6px}

/* ------------------------------------------------- パワプロ風の能力画面 */
.abwrap{display:grid; grid-template-columns:minmax(250px,380px) minmax(0,1fr); gap:12px}
@media (max-width:820px){.abwrap{grid-template-columns:1fr}}
/* ---- 能力画面。ここだけはサイトのテーマに乗らず、独自の配色で描く ---- */
.pawa{
  --ink:#13395f; --plate:#ffffff;
  --label:#d6e9f8; --pale:#eaf4fd; --paletext:#96b2c8;
  background:linear-gradient(#eaf5fd 0%, #d3e7f7 55%, #c2ddf2 100%);
  border-radius:10px; padding:12px; color:var(--ink);
  font-family:"M PLUS Rounded 1c","Source Sans 3",system-ui,sans-serif}
.pawa .card{box-shadow:0 1px 0 rgba(19,57,95,.06)}
.pawa .tabs2{display:flex; gap:4px; margin-bottom:10px; flex-wrap:wrap}
.pawa .tabs2 span{padding:4px 14px; border-radius:6px 6px 0 0; font-size:12.5px;
  font-weight:700; background:#a9c7de; color:#fff}
.pawa .tabs2 span.on{background:#1d6fb8}
.pawa .card{background:var(--plate); border-radius:9px; padding:10px}

/* 名前・背番号・顔・成績 */
.abhead{display:flex; align-items:center; gap:8px; padding:0 0 10px; flex-wrap:wrap}
.abhead .plate{background:#fff; border:2px solid #e8a33c; border-radius:7px;
  padding:3px 14px; font-size:20px; font-weight:800; line-height:1.2;
  text-shadow:0 1px 0 rgba(255,255,255,.55)}
.abhead .numbox{background:#2b3a47; color:#fff; border-radius:6px; padding:4px 10px;
  font-family:"Barlow Condensed",sans-serif; font-size:20px; font-weight:700}
.abhead .facebox{background:#fff; border-radius:7px; padding:3px; line-height:0}
.abhead .stat{display:flex; align-items:center; gap:8px; background:#fff;
  border-radius:7px; padding:5px 12px; font-size:14px; font-weight:700}
.abhead .apt{display:flex; align-items:center; gap:4px; background:#fff;
  border-radius:7px; padding:5px 10px; font-size:14px; font-weight:700}
.abhead .apt span{color:#b9c4cc}
.abhead .apt span.on{color:#1d6fb8; font-size:16px}
.abhead .stat b{background:#e3ecf3; color:#6d8aa6; border-radius:5px;
  padding:3px 9px; font-size:12px; font-weight:700}

/* 能力の 1 行。行そのものを枠で囲み、項目名にも枠を付ける */
.abrow{display:flex; align-items:center; gap:8px; padding:4px 8px 4px 4px;
  margin:3px 0; border:1.5px solid #bcd6ea; border-radius:9px;
  background:linear-gradient(#ffffff, #eef6fd);
  box-shadow:inset 0 1px 0 #fff, 0 1px 2px rgba(19,57,95,.10)}
.abrow .nm{flex:none; width:170px; height:52px; display:flex;
  align-items:center; justify-content:center;
  border:2px solid #a9c9e4; border-radius:8px;
  background:linear-gradient(#f4fbff, var(--label));
  box-shadow:inset 0 1px 0 #fff;
  font-weight:800; letter-spacing:.04em; font-size:30px; line-height:1;
  white-space:nowrap; color:var(--ink)}
.abrow .rank{flex:1; text-align:center; font-weight:800; line-height:1;
  font-family:"Barlow Condensed",sans-serif; font-size:35px;
  text-shadow:0 1px 0 rgba(255,255,255,.9)}
.abrow .num{flex:1; text-align:center; font-family:"Barlow Condensed",sans-serif;
  font-variant-numeric:tabular-nums; font-weight:800; font-size:35px; line-height:1;
  text-shadow:0 1px 0 rgba(255,255,255,.9)}
.abrow .arrow{color:#e0459a; font-size:20px; line-height:1}

/* 右上の基礎能力 */
.basics{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:4px}
.basic{height:55px}
.basic{display:flex; align-items:stretch; color:var(--paletext);
  background:linear-gradient(#f6fbff,#e8f2fa);
  border:1.5px solid rgba(19,57,95,.16); border-radius:7px; overflow:hidden;
  font-weight:800; letter-spacing:.02em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),
             inset 0 -3px 6px rgba(19,57,95,.10),
             0 1px 2px rgba(19,57,95,.14)}
.basic i{flex:1; min-width:0; font-style:normal; font-size:25px; line-height:1;
  display:flex; align-items:center; justify-content:center;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
/* 名前と段位のあいだの分け目 */
.basic b{flex:none; width:34px; font-size:25px; line-height:1;
  display:flex; align-items:center; justify-content:center;
  border-left:1.5px solid rgba(255,255,255,.85);
  background:rgba(255,255,255,.32)}
.basic.good{background:linear-gradient(#d7ebff,#a9d0f5); color:#0f4a86}
.basic.bad{background:linear-gradient(#ffe6e6,#ffc4c4); color:#9b2226}

/* 特殊能力。空き枠も出す */
.skills{display:grid; grid-template-columns:repeat(4,minmax(0,1fr));
  grid-auto-rows:55px; gap:6px}
.skill{display:flex; align-items:center; justify-content:center; min-width:0;
  padding:0 4px; border-radius:7px; font-size:25px; line-height:1;
  font-weight:800; text-align:center; letter-spacing:.02em; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis;
  border:1.5px solid rgba(19,57,95,.16);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),
             inset 0 -3px 6px rgba(19,57,95,.10),
             0 1px 2px rgba(19,57,95,.14)}
/* 水=低い能力 青=高い能力 赤=悪い能力 緑=個性的 */
.skill.low{background:linear-gradient(#eaf7ff,#cfe8f8); color:#3d7ea8}
.skill.good{background:linear-gradient(#d7ebff,#a9d0f5); color:#0f4a86}
.skill.bad{background:linear-gradient(#ffe6e6,#ffc4c4); color:#9b2226}
.skill.green{background:linear-gradient(#e2f7e8,#bfe8cb); color:#1d6b32}
.skill.empty{background:linear-gradient(#f6fbff,#e8f2fa); border-color:rgba(19,57,95,.08);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}
.pawa .note{color:#6d8aa6}
/* 変化球の方向 */
.breaks{display:grid; grid-template-columns:repeat(3,1fr); gap:3px; width:150px;
  aspect-ratio:1; margin:4px auto}
.breaks div{display:flex; align-items:center; justify-content:center; border-radius:3px;
  background:var(--panel-2); font-family:"Roboto Mono",monospace; font-size:12px;
  font-weight:700; color:var(--muted)}
.breaks div.on{background:var(--rule); color:#fff}
.breaks div.mid{background:transparent; color:var(--muted); font-size:10px}
.breaklist{font-size:12px}
.breaklist div{display:flex; gap:6px; padding:2px 0}
.breaklist b{margin-left:auto; font-family:"Roboto Mono",monospace}

/* ------------------------------------------------------------- TOP */
.cards{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px}
@media (max-width:760px){.cards{grid-template-columns:1fr}}
.card{border:1px solid var(--line); border-radius:6px; background:var(--panel); overflow:hidden}
.card h4{margin:0; padding:6px 10px; font-family:"Barlow Condensed",sans-serif; font-size:15px;
  letter-spacing:.05em; background:var(--panel-2); border-bottom:1px solid var(--line-soft)}
.card ol{margin:0; padding:4px 0; list-style:none; counter-reset:rank}
.card li{display:flex; align-items:center; gap:7px; padding:3px 10px; font-size:12.5px}
.card li::before{counter-increment:rank; content:counter(rank);
  width:14px; text-align:center; color:var(--muted); font-family:"Roboto Mono",monospace;
  font-size:10.5px; flex:none}
.card li b{margin-left:auto; font-family:"Roboto Mono",monospace; font-weight:700}
.card .empty{padding:8px 10px}
.toptable{width:100%; font-size:12px}
.toptable td,.toptable th{padding:3px 6px; white-space:nowrap}
.toptable td.nm,.toptable th.nm{text-align:left; font-family:"Source Sans 3",sans-serif}
/* ベストオーダー */
.lineup{width:100%; font-size:12.5px}
.lineup td{padding:4px 6px}
.lineup td.slot{width:26px; color:var(--muted); font-family:"Roboto Mono",monospace}
.lineup td.nm{text-align:left; font-family:"Source Sans 3",sans-serif}
.lineup tr.pit td{border-top:2px solid var(--rule)}

/* --------------------------------------------------------- リーダーボード */
.lbbar{display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:0 0 10px}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:5px; overflow:hidden}
.seg button{border:0; border-radius:0; background:var(--panel); padding:5px 13px;
  font-size:12px; letter-spacing:.04em}
.seg button[aria-selected="true"]{background:var(--rule); color:#fff}
.lbwrap{overflow:auto; max-height:calc(100vh - 230px)}
table.lb{font-size:12.5px; min-width:100%}
table.lb thead th{position:sticky; top:0; background:var(--panel); z-index:2; cursor:pointer;
  white-space:nowrap; padding:6px 6px}
table.lb thead th:hover{color:var(--text)}
table.lb thead th.sorted{color:var(--rule); border-bottom:2px solid var(--rule)}
table.lb td{padding:3px 6px; white-space:nowrap}
table.lb td.nm{font-family:"Source Sans 3",sans-serif; text-align:left; color:var(--text)}
table.lb tbody tr:hover td{background:var(--panel-2)}
table.lb td.rank{color:var(--muted); width:34px}
/* 規定打席に届いていない選手 */
table.lb tr.unq td{color:var(--muted)}
table.lb tr.unq td.nm{opacity:.75}

/* 先攻は赤、後攻は青。プラグインのスコアボードと揃える */
.t-first{color:var(--team-first)}
.t-second{color:var(--team-second)}
table.board tr.first td.team{color:var(--team-first)}
table.board tr.second td.team{color:var(--team-second)}

/* ------------------------------------------------------------- リザルト */
.gamepick{display:flex; gap:6px; flex-wrap:wrap; padding:0 0 10px}
.gamepick button{font-size:12px; padding:4px 11px}
.gamepick button[aria-selected="true"]{background:var(--rule); color:#fff; border-color:var(--rule)}
table.board{width:auto; font-size:13px; text-align:center; border-collapse:collapse;
  border:1px solid var(--line); margin-bottom:2px}
table.board th,table.board td{text-align:center; padding:4px 0; width:34px;
  border:1px solid var(--line-soft); font-family:"Roboto Mono",monospace}
table.board thead th{background:var(--panel-2); border-bottom:1px solid var(--line)}
table.board td.team,table.board th.team{text-align:left; padding:4px 10px; width:auto;
  min-width:150px; font-family:"Source Sans 3",sans-serif; color:var(--text)}
table.board .big{font-weight:700; background:var(--panel-2); border-left:1px solid var(--line)}
table.board tr.win td.team{font-weight:700}
.boardnote{display:flex; flex-wrap:wrap; gap:16px; padding:10px 0 0; font-size:12px;
  align-items:center}
/* 見出しと顔を同じ高さに揃える。揃えないと写真の分だけ文字が下がる */
.boardnote > span{display:inline-flex; align-items:center; gap:6px; flex-wrap:wrap}
.boardnote b{font-family:"Barlow Condensed",sans-serif; font-size:13px; letter-spacing:.04em;
  color:var(--muted)}
.inninghead{font-family:"Barlow Condensed",sans-serif; font-size:16px; letter-spacing:.03em;
  padding:9px 0 3px; color:var(--rule)}
/* 回ごとに表を分けているので、列の幅を決め打ちにしないと回ごとにずれる */
table.pa2{font-size:12px; table-layout:fixed; width:auto; min-width:720px}
table.pa2 th,table.pa2 td{padding:3px 6px; overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap}
table.pa2 td.nm,table.pa2 th.nm{font-family:"Source Sans 3",sans-serif; text-align:left}
table.pa2 td.res{text-align:left}
table.pa2 col.c-p{width:158px} table.pa2 col.c-r{width:104px}
table.pa2 col.c-s{width:52px} table.pa2 col.c-m{width:62px}
.rbi{color:var(--hot); font-weight:700}

/* ------------------------------------------------------------ layout */
main{display:grid; grid-template-columns:minmax(340px,1.08fr) minmax(430px,1.48fr) minmax(360px,1.08fr);
  gap:12px; padding:12px 18px; align-items:start}
main.wide{grid-template-columns:minmax(0,1fr); max-width:1180px; margin-inline:auto}
section.span{grid-column:1/-1}
@media (max-width:1280px){main{grid-template-columns:1fr 1fr}}
@media (max-width:860px){main{grid-template-columns:1fr}}
.col{display:flex; flex-direction:column; gap:12px}
section{background:var(--panel); border:1px solid var(--line); border-radius:5px;
  box-shadow:var(--shadow); overflow:hidden}
.pad{padding:12px 14px 14px}

/* 見出しはティールの太い下線。Savant と同じ */
.head{font-family:"Barlow Condensed",sans-serif; font-size:19px; letter-spacing:.02em;
  display:flex; align-items:baseline; gap:8px; padding:2px 0 5px;
  border-bottom:3px solid var(--rule); margin-bottom:9px}
.head small{font-family:"Source Sans 3",sans-serif; font-size:11.5px; color:var(--muted);
  font-weight:400; margin-left:auto}
.title{text-align:center; font-family:"Barlow Condensed",sans-serif; font-size:22px;
  padding:11px 12px 9px}
.title b{color:var(--hot)}

/* ------------------------------------------------------------ 選手ヘッダ */
.who{padding:14px 14px 12px; text-align:center; border-bottom:1px solid var(--line-soft)}
.who .nm{font-family:"Barlow Condensed",sans-serif; font-size:34px; line-height:1.05}
.who .meta{color:var(--muted); font-size:12.5px; margin-top:2px}

/* ------------------------------------------------------------ tables */
table{width:100%; border-collapse:collapse; font-size:12.5px}
th,td{text-align:right; padding:4px 4px; border-bottom:1px solid var(--line-soft)}
th:first-child,td:first-child{text-align:left; color:var(--muted)}
thead th{font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);
  font-weight:700; border-bottom:1px solid var(--line)}
td{font-family:"Roboto Mono",monospace; font-variant-numeric:tabular-nums}
tr.total td{background:var(--panel-2); font-weight:700; border-bottom:0}
tr.total td:first-child{font-weight:700; color:var(--text)}
.scroll{overflow-x:auto}
/* 打席の一覧。多くなるのでスクロールさせる。
   投手名が空の行があっても列がずれないよう、幅は固定にする */
.palist{max-height:320px; overflow:auto}
.palist thead th{position:sticky; top:0; background:var(--panel); z-index:2;
  text-align:center}
table.pafix{table-layout:fixed; min-width:584px}
table.pafix th,table.pafix td{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
col.c-game{width:136px} col.c-name{width:112px} col.c-res{width:92px}
col.c-num{width:50px} col.c-flag{width:66px}
.palist td.nm,.palist td.res{font-family:"Source Sans 3",sans-serif; text-align:left}
.palist td.nm{color:var(--text)}
.palist td.nm .none{color:var(--muted)}
.palist td.yes{color:var(--hot); font-weight:700}
.palist td.no{color:var(--muted)}
/* 打席結果は色の四角に白抜き。ヒット=青、四球=黄緑、三振=黄、それ以外のアウト=赤 */
.rtag{display:inline-block; width:100%; text-align:center; color:#fff;
  border-radius:3px; padding:1px 4px; font-size:11.5px; font-weight:700;
  letter-spacing:.02em}
.r-hit{background:#1f6fd0}
.r-walk{background:#5a9e2f}
/* 三振はしっかり黄色に。白抜きだと読めないので、この色だけ文字を濃くする */
.r-k{background:#f5c518; color:#2b2200}
.r-out{background:var(--hot)}
/* 試合の行は 4 試合ぶんだけ見せて、あとはスクロール。
   見出しと通算行は貼り付けたままにする */
.gamescroll{max-height:158px; overflow-y:auto; overflow-x:auto}
.gamescroll thead th{position:sticky; top:0; background:var(--panel); z-index:2}
.gamescroll tr.total td{position:sticky; bottom:0; z-index:2;
  box-shadow:inset 0 1px 0 var(--line)}

/* ------------------------------------------------------------ percentile */
.legend{display:grid; grid-template-columns:104px 1fr 44px; gap:9px; align-items:end;
  padding:0 14px 3px; font-size:10.5px; letter-spacing:.09em; font-weight:700}
.legend .marks{position:relative; height:15px}
.legend .marks span{position:absolute; bottom:2px; transform:translateX(-50%); white-space:nowrap}
.legend .marks i{position:absolute; bottom:-4px; width:0; height:0; transform:translateX(-50%);
  border-left:4px solid transparent; border-right:4px solid transparent; border-top:5px solid currentColor}
.poor{color:var(--cold)} .avg{color:var(--mid)} .great{color:var(--hot)}

.prow{display:grid; grid-template-columns:104px 1fr 44px; gap:9px; align-items:center;
  padding:3px 14px}
.prow + .prow{border-top:1px dashed var(--line-soft)}

/* 投球の散布図 */

/* heat charts */

/* spray */

  background:var(--panel-2); font-size:11.5px}

  font-family:"Roboto Mono", monospace; font-size:10.5px}

.spraylegend{display:flex; flex-direction:column; gap:5px; font-size:11px; padding-top:6px}

/* 打順表 */
.lineup{margin:0; padding:4px 0; display:grid; gap:2px}
.lineup .row{display:flex; align-items:center; gap:8px; padding:4px 8px;
  border-radius:6px; background:var(--panel-2); font-size:12.5px}

  font-size:15px; font-weight:700; color:var(--muted)}

@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}

<body>

<header>
  <div class="top">
    <div class="wordmark">SBG <b>Savant</b></div>
    <div class="sub">result / record の csv から打者・投手を見る</div>
    <div class="io">
      <button id="theme">テーマ</button>
      <select id="parkPick" title="チャートに使う球場" hidden><option value="">既定の球場</option></select>
    </div>
  </div>
  <div class="tabrow" id="viewRow">
    <div class="tabs" id="viewTabs"></div>
  </div>
  <div class="tabrow" id="playerRow">
    <div class="tabs" id="tabs"></div>
    <div class="side" id="sideTabs"></div>
  </div>
</header>

<main id="app"></main>

<script>
/* ==========================================================================
   result/<試合ID>.csv  game_id,inning,half,order,pitcher,batter,result,rbi,runs,outs,base1..3
   record/<名前>.csv    side,game,pa,pitch_no,inning,half,count,outs,pitcher,batter,type,
                        velocity,v_break,h_break,zone,in_zone,plate_x,plate_y,
                        swing,whiff,contact,call,exit_velocity,launch_angle,spray_angle,
                        distance,result
   ========================================================================== */
const DATA={plate:[], pitch:[], play:[], files:[]};
let PLAYER="", SIDE="bat", SAMPLE=true;
/** 選手ページの見せ方。savant か pawa(パワプロ風)。 */
let STYLE="savant";
/** 上のタブ。player / leaderboard / result。 */
let VIEW="top";
/** リーダーボードの状態。並べ替えの列と向きを覚えておく。 */
const LB={side:"bat", mode:"std", key:null, dir:-1};
/** リザルトで開いている試合。 */
let GAME="";
/** 打者の規定打席。試合数は問わない。率で並べるときの線引きに使う。 */
const QUAL_PA=10;

const HIT=new Set(["SINGLE","DOUBLE","TRIPLE","HOME_RUN"]);
const NOT_AB=new Set(["WALK","HIT_BY_PITCH","SACRIFICE_BUNT","SACRIFICE_FLY"]);
const JA={SINGLE:"単打",DOUBLE:"二塁打",TRIPLE:"三塁打",HOME_RUN:"本塁打",WALK:"四球",
  HIT_BY_PITCH:"死球",STRIKE_OUT:"三振",GROUND_OUT:"ゴロアウト",FLY_OUT:"フライアウト",
  SACRIFICE_BUNT:"犠打",SACRIFICE_FLY:"犠飛",ERROR:"失策",FIELDER_CHOICE:"野選",
  DOUBLE_PLAY:"併殺",TRIPLE_PLAY:"三重殺",
  CALLED_STRIKE:"見逃し",SWINGING_STRIKE:"空振り",BALL:"ボール",IN_PLAY:"打球",FOUL:"ファール"};
const ZONE_IN=new Set([7,8,9,12,13,14,17,18,19]);
/** 球種の色。使用率順に割り当てる。 */
const TYPE_COLORS=["#d5455c","#dcb04a","#3fbfe0","#3f9e93","#e88b2e","#d9d13f","#8c5b46"];

/* ---------------------------------------------------------------- 顔写真
   プレイヤー名と同じファイル名の画像をドロップすると顔になる。
   data URI にしてページ内に持つので、外へ取りに行かない。
   localStorage に控えるので、次に開いたときは読み込み直さなくてよい。 */
const FACES={};
const FACE_KEY="sbg-savant-faces";
/** 昔の ID → いまの名前。players.yml から作る。 */
const ALIAS_NAME={};
function loadFaces(){
  try{ Object.assign(FACES, JSON.parse(localStorage.getItem(FACE_KEY)||"{}")); }
  catch(e){ /* 使えない環境でも困らない */ }
}
function saveFaces(){
  try{ localStorage.setItem(FACE_KEY, JSON.stringify(FACES)); }catch(e){}
}
/** 名前から決まる色。顔が無いときの丸に使う。 */
function nameColor(name){
  let h=0;
  for(let i=0;i<String(name).length;i++) h=(h*31+String(name).charCodeAt(i))%360;
  return `hsl(${h} 45% 46%)`;
}
/**
 * その選手の顔の画像。
 *
 * <p>いまの名前で見つからなければ、昔の ID のファイル名を探す。
 * 別名表の読み込みと画像の読み込みはどちらが先になるか決まっていないので、
 * 出すときに毎回引き直す。
 */
function faceSrc(name){
  const direct=FACES[String(name)];
  if(direct) return direct;
  for(const old in ALIAS_NAME){
    if(ALIAS_NAME[old]===name && FACES[old]) return FACES[old];
  }
  return null;
}
/** 顔の画像。無ければ頭文字の丸。 */
function face(name, size){
  size=size||22;
  const src=faceSrc(name);
  const box=`width:${size}px;height:${size}px`;
  if(src) return `<img class="face" src="${src}" alt="" style="${box}">`;
  const ch=(String(name||"?").trim()[0]||"?").toUpperCase();
  return `<span class="face ph" style="${box};background:${nameColor(name)};font-size:${Math.round(size*0.52)}px">${esc(ch)}</span>`;
}
/** 顔と名前を並べたもの。表のセルに入れる。 */
function withFace(name, size){
  if(!name) return '<span class="none">マネキン</span>';
  return `<span class="withface">${face(name,size)}<span>${esc(name)}</span></span>`;
}

/* ------------------------------------------------------------------ csv */
function splitCsv(line){
  const out=[]; let cur="", q=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(q){ if(c==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===','){ out.push(cur); cur=""; }
    else cur+=c;
  }
  out.push(cur); return out;
}
const TEXT_COLS=new Set(["game_id","game","pa","count","half","side","type","result",
  "call","pitcher","batter"]);
/** 表計算で書き出した列名も受け取れるようにする。 */
const ALIAS={
  gameid:"game_id", game_id:"game_id",
  pitchername:"pitcher", battername:"batter",
  resulttype:"result", runsscored:"runs", outsonplay:"outs",
  runneronfirst:"base1", runneronsecond:"base2", runneronthird:"base3",
  battingorder:"order"
};
function parseCsv(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length) return {head:[],rows:[]};
  const head=splitCsv(lines[0]).map(h=>{
    const k=h.trim().toLowerCase().replace(/\s+/g,"");
    return ALIAS[k] || h.trim().toLowerCase();
  });
  const rows=lines.slice(1).map(line=>{
    const cells=splitCsv(line), row={};
    head.forEach((h,i)=>{
      const v=(cells[i]??"").trim();
      const lower=v.toLowerCase();
      if(lower==="true"||lower==="false") row[h]=(lower==="true");
      else if(v!=="" && !TEXT_COLS.has(h) && !isNaN(Number(v))) row[h]=Number(v);
      else row[h]=v;
    });
    return row;
  });
  return {head,rows};
}

/* ------------------------------------------------- 打球からの期待値
   打球速度(km/h)と打球角度(度)から、その 1 打球の期待安打率と期待塁打。
   実測から作った表ではなく、野球としてもっともらしい形を手で置いたもの。 */
function battedExpectation(ev,la){
  if(!isFinite(ev)||!isFinite(la)) return {ba:0.55,tb:0.90};
  const clamp=(x,lo,hi)=>x<lo?lo:(x>hi?hi:x);
  // 打球速度を 0〜1 に均す。この試合の打球は中央値 166、上位 25% が 182km/h あるので、
  // 実測の散らばりに合わせて 125〜220 で目盛りを取る。
  // ここを狭くすると強い当たりが全部「上限」に張り付いて区別できなくなる。
  const hard=clamp((ev-125)/95,0,1);

  // ゴロは飛距離ではなく「野手の間を抜けるか」で決まる。速さだけを見る。
  const ground = la<-10 ? 0.09+0.34*hard : 0.20+0.50*hard;

  // 打ち上げた打球は飛距離で決まる。30 度が一番飛び、そこから離れるほど落ちる。
  // 角度で区切らず連続にしてあるので、40 度でも 50 度でも
  // 速ければちゃんと柵を越える。
  const af = Math.max(0, 1 - Math.pow((la-30)/48, 2));
  const carry = hard*af;                       // 0〜1。1 に近いほど遠くへ飛ぶ
  // carry 0.554(=40度180km/h) で .800、0.684(=30度190km/h) で 1.000 を通る。
  // それより手前は曲線で落として、平凡な当たりが過大にならないようにする。
  const air = clamp(carry<0.554
      ? 0.80*Math.pow(carry/0.554, 0.52)
      : 0.80+1.54*(carry-0.554), 0.02, 1.00);

  // 8〜16 度はゴロとライナーの中間。急に切り替わらないよう混ぜる。
  const mix = clamp((la-8)/8, 0, 1);
  const ba = ground*(1-mix) + air*mix;

  // 塁打。柵を越える見込みが立つほど 1 打球あたりの塁打が伸びる。
  const hr = clamp((carry-0.52)/0.30, 0, 1);
  const tb = (ground*1.18)*(1-mix) + (air*(1.35+2.65*hr))*mix;
  return {ba, tb};
}
/**
 * 打球の種類。バレルを最優先に、ゴロ・ライナー・フライを強弱で分ける。
 *
 * <p>強い / 弱いの線は Hard Hit と同じ 153km/h。
 * 角度はゴロが 10 度未満、ライナーが 25 度まで、それより上がフライ。
 */
function battedKind(ev,la){
  if(!isFinite(ev)||!isFinite(la)) return "";
  if(isBarrel(ev,la)) return "バレル";
  const hard=ev>=153;
  if(la<10) return hard ? "強ゴロ" : "弱ゴロ";
  if(la<25) return "ライナー";
  return hard ? "強いフライ" : "弱いフライ";
}

/**
 * バレル。MLB の定義に合わせてある。
 * 158km/h(98mph) で 26〜30 度。そこから 1km/h ごとに上下 0.65 度ずつ広がり、
 * 187km/h(116mph) の 8〜50 度で頭打ち。
 */
function isBarrel(ev,la){
  if(!(ev>=158)) return false;
  const extra=Math.min((ev-158)*0.65, 18.9);
  return la>=26-extra && la<=30+extra;
}

/* --------------------------------- 目盛り。上位何%ではなく値に数値を割り当てる */
/* 実測に合わせた目盛り。
   x 系はリーグの実際の成績が真ん中あたりに来るように置いてある。
     打率 .351 / 出塁率 .388 / 長打率 .577
   打球速度も三振率も MLB とはまるで違うので、MLB の基準では全員が振り切れる。 */
const SCALE={
  xwoba:[0.220,0.580], xba:[0.180,0.560], xslg:[0.220,0.980],
  ev:[145,192], barrel:[12,50], hard:[58,94], sweet:[42,76],
  chase:[42,16], whiff:[40,14], k:[52,26], bb:[1,12],
  xera:[8.0,2.0], gb:[18,44], wrc:[40,190], k9:[4.0,16.0], bb9:[6.0,0.5],
  // 守備と走塁。いずれも 1 プレーあたりに直した値で見る
  range:[-0.25,0.25], arm_value:[-0.20,0.20], arm:[95,145],
  baserun:[-0.20,0.25],
  // 投手側で向きが変わるもの
  ev_p:[192,145], barrel_p:[50,12], hard_p:[94,58], xba_p:[0.560,0.180],
  k_p:[26,52], bb_p:[12,1], chase_p:[16,42], whiff_p:[14,40]
};
function score(key,value){
  const s=SCALE[key];
  if(!s||value===null||!isFinite(value)) return null;
  const [lo,hi]=s;
  return Math.max(0,Math.min(100,Math.round((value-lo)/(hi-lo)*100)));
}
function scoreColor(v){
  if(v===null) return "var(--mid)";
  const t=v/100;
  return t<0.5 ? mix("--cold","--mid",t/0.5) : mix("--mid","--hot",(t-0.5)/0.5);
}
const mix=(a,b,k)=>`color-mix(in srgb, var(${b}) ${Math.round(k*100)}%, var(${a}))`;

/* ------------------------------------------------- 守備と走塁

   record/<名前>_play.csv の 1 行 = 1 つの打球に対する、その選手の関わり。
   kind=field なら守備、kind=run なら走塁。 */

/** 外野の守備位置。落球の重さを変えるのに使う。 */
const OUTFIELD=new Set(["LEFT_FIELDER","CENTER_FIELDER","RIGHT_FIELDER"]);

const playOf=(name,kind)=>DATA.play.filter(r=>
  r.player===name && (!kind || r.kind===kind));

function nz(value){
  const n=Number(value);
  return isFinite(n) ? n : null;
}

/**
 * その打球に追いつけたはずか。
 *
 * <p>落下地点までの距離を、滞空時間で割った「必要な速さ」で見る。
 * 人が走れるのはおよそ 6 ブロック/秒なので、そこを五分に置く。
 * 近くにゆっくり上がった打球なら誰でも捕れて、
 * 遠くへ速く抜けた打球は誰にも捕れない、という形になる。
 */
function reachChance(distance, hangTicks){
  if(distance===null || hangTicks===null || hangTicks<=0) return null;
  const need=distance/Math.max(0.25, hangTicks/20);
  return 1/(1+Math.exp((need-6.0)/1.1));
}

/**
 * 守備の集計。
 *
 * <p>Range は「捕れた数 − 捕れたはずの数」。
 * 捕球は落球の少なさで、外野のノーバウンド落球だけ重く見る。
 * 手が届いていた飛球を落とすのは、失点に直結するため。
 * 肩は送球の速さ、送球の正確さは悪送球の少なさ。
 */
function fieldingLine(rows){
  let chances=0, made=0, expected=0;
  let armSum=0, armN=0, assists=0, putouts=0;
  let throws=0, errors=0, errorWeight=0;
  let drops=0, dropWeight=0, bases=0;
  rows.forEach(r=>{
    const sx=nz(r.startx), sz=nz(r.startz), lx=nz(r.landx), lz=nz(r.landz);
    const outfield=OUTFIELD.has(String(r.position||""));
    const speed=nz(r.throwspeed);
    if(speed!==null && speed>0){ armSum+=speed; armN++; }
    if(r.assist===true) assists++;
    if(r.gotout===true) putouts++;
    if(r.threwtobase===true){
      throws++;
      if(r.throwerror===true){
        errors++;
        // 外野の悪送球はそこまで重く見ない。距離があるぶん逸れやすい。
        errorWeight += outfield ? 0.4 : 1.0;
      }
    }
    const allowed=nz(r.basesallowed);
    if(allowed!==null) bases+=allowed;
    if(r.fumbled===true){
      drops++;
      // 外野のノーバウンド落球は大減点。捕れていれば確実にアウトだった。
      dropWeight += (outfield && r.fumbleonfly===true) ? 3.0 : 1.0;
    }
    if(sx===null||sz===null||lx===null||lz===null) return;
    const distance=Math.hypot(sx-lx, sz-lz);
    const chance=reachChance(distance, nz(r.hangticks));
    if(chance===null) return;
    chances++;
    expected+=chance;
    // 滞空が長い打球はフライ。捕ればアウト。
    // 転がった打球は、触って落とさなければ処理できたとみなす。
    const fly=nz(r.hangticks)>=25;
    made += (fly ? r.caughtonfly===true
                 : (r.gotout===true || (r.assist===true)
                    || (r.threwtobase===true && r.fumbled!==true))) ? 1 : 0;
  });
  return {
    chances, made, expected,
    // 1 つのアウトはおよそ 0.75 点ぶんの価値がある
    range: chances ? (made-expected)*0.75 : null,
    arm: armN ? armSum/armN : null,
    // 送球の値打ち。刺した数を足し、悪送球と余計な進塁を引く。
    armValue: (armN||throws) ? assists*0.45 - errorWeight*0.5 - bases*0.12 : null,
    // 捕球。落球の重さぶんだけ引く。
    catchRuns: chances ? -dropWeight*0.5 : null,
    throwAccuracy: throws ? 100*(throws-errors)/throws : null,
    drops, dropWeight, assists, putouts, throws, errors, bases
  };
}

/**
 * 走塁の集計。
 *
 * <p>進塁は「1 つ先までは当たり前、2 つ以上進めたら上積み」。
 * 走塁死(タッチアウト・飛び出し)は引く。封殺は走者のせいではないので数えない。
 */
function baserunLine(rows){
  let plays=0, extra=0, outs=0, sprint=0, sprintN=0;
  rows.forEach(r=>{
    const from=nz(r.startbase), to=nz(r.endbase);
    plays++;
    const ratio=nz(r.sprintratio);
    if(ratio!==null){ sprint+=ratio; sprintN++; }
    const kind=String(r.outkind||"");
    if(r.outonplay===true && (kind==="TAG"||kind==="DOUBLED_OFF")) outs++;
    if(from===null||to===null) return;
    if(to-from>=2) extra+=(to-from)-1;
  });
  return {
    plays, extra, outs,
    sprint: sprintN ? sprint/sprintN : null,
    // 1 つ余分に進めばおよそ 0.3 点、走塁死はおよそ 0.5 点の損
    runs: plays ? extra*0.3 - outs*0.5 : null,
    extraRate: plays ? 100*extra/plays : null
  };
}

/* ------------------------------------------------------------- 集計 */
const plateOf=(n,s)=>DATA.plate.filter(r=>r[s==="bat"?"batter":"pitcher"]===n);
const pitchOf=(n,s)=>{
  const want=s==="bat"?"Batting":"Pitching", key=s==="bat"?"batter":"pitcher";
  return DATA.pitch.filter(r=>r[key]===n && (r.side===want||!r.side));
};
function line(rows){
  const c={}; rows.forEach(r=>{c[r.result]=(c[r.result]||0)+1;});
  const pa=rows.length;
  const ab=rows.reduce((n,r)=>n+(NOT_AB.has(r.result)?0:1),0);
  const h=rows.reduce((n,r)=>n+(HIT.has(r.result)?1:0),0);
  const tb=(c.SINGLE||0)+2*(c.DOUBLE||0)+3*(c.TRIPLE||0)+4*(c.HOME_RUN||0);
  const bb=c.WALK||0, hbp=c.HIT_BY_PITCH||0, so=c.STRIKE_OUT||0, sf=c.SACRIFICE_FLY||0;
  const rbi=rows.reduce((n,r)=>n+(Number(r.rbi)||0),0);
  const den=ab+bb+hbp+sf;
  const obp=den?(h+bb+hbp)/den:null, slg=ab?tb/ab:null;
  return {counts:c,pa,ab,h,tb,bb,hbp,so,rbi,hr:c.HOME_RUN||0,d2:c.DOUBLE||0,d3:c.TRIPLE||0,
    avg:ab?h/ab:null, obp, slg, ops:(obp!==null&&slg!==null)?obp+slg:null,
    kRate:pa?100*so/pa:null, bbRate:pa?100*bb/pa:null};
}
function summarize(rows){
  const bip=rows.filter(r=>r.contact===true&&r.call==="IN_PLAY"&&Number(r.exit_velocity)>0);
  const swings=rows.filter(r=>r.swing===true).length;
  const whiffs=rows.filter(r=>r.whiff===true).length;
  const outZone=rows.filter(r=>r.in_zone===false);
  const chase=outZone.filter(r=>r.swing===true).length;
  let xba=0,xslg=0,barrel=0,hard=0,sweet=0,ev=0,gb=0;
  bip.forEach(r=>{
    const e=Number(r.exit_velocity), l=Number(r.launch_angle), x=battedExpectation(e,l);
    xba+=x.ba; xslg+=x.tb; ev+=e;
    if(isBarrel(e,l)) barrel++;
    if(e>=153) hard++;
    if(l>=8&&l<=32) sweet++;
    if(l<10) gb++;
  });
  const n=bip.length;
  // 打席の数と四死球も record から数える。
  // 打席結果は 1 球ごとの記録にも入っているので、result 側と混ぜずに済む。
  const ended=rows.filter(r=>r.result);
  const bb=ended.filter(r=>r.result==="WALK").length;
  const hbp=ended.filter(r=>r.result==="HIT_BY_PITCH").length;
  const so=ended.filter(r=>r.result==="STRIKE_OUT").length;
  // xBA と xSLG は打数で割る。打球だけで割ると「インプレーになったときの打率」に
  // なってしまい、三振の分が抜けて実際の打率と比べられない。
  // 三振は期待値 0 の打数として分母にだけ入れる。
  const ab=n+so;
  return {n,bip,pitches:rows.length,swings,whiffs,xbaSum:xba,
    pa:ended.length, bb, hbp, so, ab,
    xba:ab?xba/ab:null, xslg:ab?xslg/ab:null, ev:n?ev/n:null,
    barrel:n?100*barrel/n:null, hard:n?100*hard/n:null,
    sweet:n?100*sweet/n:null, gb:n?100*gb/n:null,
    chase:outZone.length?100*chase/outZone.length:null,
    whiff:swings?100*whiffs/swings:null};
}

/* --------------------------------------------------- 投手の成績(result から) */
/**
 * 投球回・防御率など。
 *
 * <p>result の outs 列(そのプレーで取ったアウト)を足して投球回にする。
 * 自責点は分けて記録していないので、失点をそのまま防御率に使う。
 */
function pitcherLine(rows){
  const L=line(rows);
  const outs=rows.reduce((n,r)=>n+(Number(r.outs)||0),0);
  const runs=rows.reduce((n,r)=>n+(Number(r.runs)||0),0);
  const ip=outs/3;
  return Object.assign(L, {outs, runs, ip,
    era: ip? 9*runs/ip : null,
    whip: ip? (L.h+L.bb)/ip : null});
}
/** 投球回の表示。5 回 1/3 なら 5.1。 */
function ipText(outs){
  if(!isFinite(outs)) return "—";
  return Math.floor(outs/3)+"."+(outs%3);
}
/** その行は裏の攻撃か。 */
const isBottom=r=>String(r.half||"").toUpperCase().startsWith("B");

/**
 * 勝ち投手と負け投手。
 *
 * <p>規定投球回のような縛りは置かない。
 * 「最後に勝ち越した回の 1 つ前の回で 3 アウト目を取った投手」が勝利投手、
 * 「その勝ち越し点を許した投手」が敗戦投手。
 */
function decisions(rows){
  if(!rows.length) return null;
  let top=0, bottom=0;
  const walk=rows.map(r=>{
    if(isBottom(r)) bottom+=Number(r.runs)||0; else top+=Number(r.runs)||0;
    return {r, bottom:isBottom(r), top:top, bot:bottom};
  });
  const last=walk[walk.length-1];
  if(last.top===last.bot) return null;              // 引き分け
  const winnerIsBottom=last.bot>last.top;
  // 勝ったチームがリードを取り、そのまま最後まで手放さなかった打席を後ろから探す
  let go=0;
  for(let i=walk.length-1;i>=0;i--){
    const lead=winnerIsBottom ? walk[i].bot-walk[i].top : walk[i].top-walk[i].bot;
    if(lead<=0){ go=i+1; break; }
  }
  if(go>=walk.length) return null;
  const goRow=walk[go].r;
  const lose=goRow.pitcher||"";
  // 勝ち越した回の 1 つ前の回(勝ったチームの守り)の 3 アウト目
  let win="";
  const sameHalf=(a,b)=>Number(a.inning)===Number(b.inning) && isBottom(a)===isBottom(b);
  let j=go-1;
  while(j>=0 && sameHalf(walk[j].r, goRow)) j--;
  if(j>=0){
    const prev=walk[j].r;
    // その回の最後にアウトを取った打席
    let k=j;
    while(k>=0 && sameHalf(walk[k].r, prev) && !(Number(walk[k].r.outs)>0)) k--;
    win=(k>=0 && sameHalf(walk[k].r, prev)) ? (walk[k].r.pitcher||"") : (prev.pitcher||"");
  }else{
    // 初回に勝ち越した。勝ったチームの先発を勝利投手にする
    const first=rows.find(r=>isBottom(r)!==winnerIsBottom);
    win=first ? (first.pitcher||"") : "";
  }
  return {win, lose, goRow, winnerIsBottom};
}
/**
 * その試合のセーブとホールド。
 *
 * <p>セーブ = 途中登板で、勝った側の投手として最終回の 3 アウト目を取った投手。
 * 勝利投手には付けない。
 *
 * <p>ホールド = 途中登板で、同点かリードしている場面で登板し、
 * 同点で入ったなら勝ち越されも勝ち越しもしないまま、
 * リードで入ったなら追いつかれも逆転もされないまま投げ終えた投手。
 * セーブが付いた投手には付けない。
 */
function reliefCredits(rows, decided){
  const out={save:"", holds:[]};
  if(!rows.length) return out;
  let top=0, bottom=0;
  const walk=rows.map(r=>{
    const low=isBottom(r);
    if(low) bottom+=Number(r.runs)||0; else top+=Number(r.runs)||0;
    // 投げているのは守っている側。表の攻撃なら投手は後攻(1)。
    return {r, side: low?0:1, top, bot:bottom, outs:Number(r.outs)||0};
  });
  const last=walk[walk.length-1];
  if(last.top===last.bot) return out;                 // 引き分けなら付かない
  const winnerSide = last.bot>last.top ? 1 : 0;
  const lead=(w,side)=> side===0 ? w.top-w.bot : w.bot-w.top;

  // 各チームの先発と、投手ごとの登板の範囲
  const starter={}, span={};
  walk.forEach((w,i)=>{
    if(starter[w.side]===undefined) starter[w.side]=w.r.pitcher||"";
    const name=w.r.pitcher||"";
    if(!name) return;
    if(!span[name]) span[name]={side:w.side, from:i, to:i};
    else span[name].to=i;
  });
  const relief=name=>name && span[name] && starter[span[name].side]!==name;

  // セーブ
  const closer=last.r.pitcher||"";
  if(relief(closer) && span[closer].side===winnerSide
     && last.outs>0 && closer!==(decided&&decided.win)){
    out.save=closer;
  }
  // ホールド
  Object.keys(span).forEach(name=>{
    if(!relief(name) || name===out.save) return;
    const {side, from, to}=span[name];
    const before = from>0 ? walk[from-1] : {top:0, bot:0};
    const entry = lead(before, side);
    if(entry<0) return;                                // 負けている場面での登板
    for(let i=from;i<=to;i++){
      const now=lead(walk[i], side);
      if(now<0) return;                                // 逆転された
      if(entry>0 && now<=0) return;                    // 追いつかれた
    }
    // 同点で入ったのに味方が勝ち越したら、その投手は勝ち投手側の扱い
    if(entry===0 && lead(walk[to], side)>0) return;
    out.holds.push(name);
  });
  return out;
}

/** 読み込んである全部の試合の責任投手。名前 -> {w,l,sv,hld}。 */
function decisionMap(){
  const out={};
  const at=name=>(out[name]=out[name]||{w:0,l:0,sv:0,hld:0});
  gameIds().forEach(g=>{
    const rows=DATA.plate.filter(r=>String(r.game_id)===g);
    const d=decisions(rows);
    if(d){
      if(d.win) at(d.win).w++;
      if(d.lose) at(d.lose).l++;
    }
    const relief=reliefCredits(rows, d);
    if(relief.save) at(relief.save).sv++;
    relief.holds.forEach(name=>at(name).hld++);
  });
  return out;
}
/** その試合でその投手に付いた救援の記録。 */
function reliefFor(gameId, name, which){
  const rows=DATA.plate.filter(r=>String(r.game_id)===gameId);
  const relief=reliefCredits(rows, decisions(rows));
  if(which==="save") return relief.save===name ? 1 : 0;
  return relief.holds.includes(name) ? 1 : 0;
}
function reliefTotal(name, which){
  return gameIds().reduce((n,g)=>n+reliefFor(g,name,which),0);
}
function gameIds(){
  return [...new Set(DATA.plate.map(r=>String(r.game_id)).filter(Boolean))].sort();
}
/**
 * 試合 ID の見せ方。
 *
 * <p>20260910 + 通し番号 02 なら「2026/9/10 二試合目」。
 * 形が違う ID はそのまま出す。
 */
function gameLabel(id){
  const text=String(id||"");
  const m=text.match(/^(\d{4})(\d{2})(\d{2})(\d{0,2})$/);
  if(!m) return text;
  const month=Number(m[2]), day=Number(m[3]), no=Number(m[4]);
  if(month<1 || month>12 || day<1 || day>31) return text;
  const count=no>0 ? " " + no + "試合目" : "";
  return `${m[1]}/${month}/${day}${count}`;
}

/* ------------------------------------------------------------- wRC+ */
/** wOBA。重みは一般的なもの。result から出す。 */
function wobaOf(L){
  const single=L.h-L.d2-L.d3-L.hr;
  const den=L.ab+L.bb+L.hbp+(L.counts.SACRIFICE_FLY||0);
  if(!den) return null;
  return (0.699*L.bb + 0.728*L.hbp + 0.883*single
        + 1.244*L.d2 + 1.569*L.d3 + 2.004*L.hr) / den;
}
let LEAGUE=null;
/** リーグ全体の基準。wRC+ を出すのに使う。読み込みが変わったら作り直す。 */
function league(){
  if(LEAGUE && LEAGUE.rows===DATA.plate.length) return LEAGUE;
  const L=line(DATA.plate);
  const runs=DATA.plate.reduce((n,r)=>n+(Number(r.runs)||0),0);
  LEAGUE={rows:DATA.plate.length, woba:wobaOf(L), rpa:L.pa?runs/L.pa:null};
  return LEAGUE;
}
/**
 * wRC+。100 がリーグ平均。
 * リーグの平均は読み込んである result 全部から出しているので、
 * ファイルを足すと基準も動く。球場補正は入れていない。
 */
function wrcPlus(L){
  const lg=league();
  const w=wobaOf(L);
  if(w===null||lg.woba===null||!lg.rpa) return null;
  const scale=1.25;
  return 100*((w-lg.woba)/scale + lg.rpa)/lg.rpa;
}

/* ------------------------------------------------- 選手の別名

   プレイヤー ID を変えた人を、同じ選手としてまとめるための表。
   players.yml に、まとめ先の名前とそのときの ID を並べて書く。

     Players:
       sota2486:
         - sota_old
         - sota2486_2

   読み込んだあと ALIAS_NAME を通して、記録の中の名前を書き換える。 */

/**
 * players.yml を読む。
 *
 * <p>入れ子は 2 段だけなので、行頭の空白の数で見る。
 * 見出しの行がまとめ先の名前、その下の「- 」で始まる行が昔の ID。
 */
function ingestPlayers(text){
  const lines=String(text).replace(/\r/g,"").split("\n");
  let inRoot=false, rootIndent=0, current="", added=0;
  for(const raw of lines){
    const line=raw.trim();
    if(!line || line.startsWith("#")) continue;
    const indent=raw.length-raw.replace(/^ +/,"").length;
    if(!inRoot){
      if(/^Players\s*:$/i.test(line)){ inRoot=true; rootIndent=indent; }
      continue;
    }
    if(indent<=rootIndent) break;
    const item=line.match(/^-\s*['"]?([^'"]+?)['"]?$/);
    if(item){
      if(current){ ALIAS_NAME[item[1].trim()]=current; added++; }
      continue;
    }
    const head=line.match(/^['"]?([^'":]+?)['"]?\s*:(.*)$/);
    if(head){
      current=head[1].trim();
      // 1 行で書いた場合 (name: [a, b]) にも付き合う
      const inline=head[2].trim().replace(/^\[|\]$/g,"");
      if(inline){
        inline.split(",").forEach(one=>{
          const id=one.trim().replace(/^['"]|['"]$/g,"");
          if(id){ ALIAS_NAME[id]=current; added++; }
        });
      }
    }
  }
  return added ? "players" : null;
}

/** 別名を今の名前に直す。 */
const canon=name => ALIAS_NAME[name] || name;

/**
 * 読み込んだ記録の名前を、まとめ先の名前に置き換える。
 *
 * <p>別名表があとから読まれることもあるので、読み込みが済んでから 1 度だけ通す。
 */
function applyAliases(){
  if(!Object.keys(ALIAS_NAME).length) return;
  DATA.plate.forEach(r=>{
    if(r.batter) r.batter=canon(r.batter);
    if(r.pitcher) r.pitcher=canon(r.pitcher);
  });
  DATA.pitch.forEach(r=>{
    if(r.batter) r.batter=canon(r.batter);
    if(r.pitcher) r.pitcher=canon(r.pitcher);
  });
  DATA.play.forEach(r=>{
    if(r.player) r.player=canon(r.player);
  });
  // 顔も付け替える。昔の ID のファイル名で置いてあることがある。
  Object.keys(ALIAS_NAME).forEach(old=>{
    const now=ALIAS_NAME[old];
    if(FACES[old] && !FACES[now]) FACES[now]=FACES[old];
  });
}

/** 試合ごとの成績表。最後に通算行。 */
function gameTable(rows, cols, calc){
  calc = calc || line;
  const games=[...new Set(rows.map(r=>String(r.game_id)))].sort();
  const body=games.map(g=>{
    const L=calc(rows.filter(r=>String(r.game_id)===g));
    return `<tr><td>${esc(gameLabel(g))}</td>${cols.map(c=>`<td>${c.get(L,g)}</td>`).join("")}</tr>`;
  }).join("");
  const T=calc(rows);
  return `<div class="gamescroll"><table>
    <thead><tr><th>試合</th>${cols.map(c=>`<th>${c.head}</th>`).join("")}</tr></thead>
    <tbody>${body}
      <tr class="total"><td>${games.length} 試合</td>${cols.map(c=>`<td>${c.get(T,null)}</td>`).join("")}</tr>
    </tbody></table></div>`;
}
/** その試合の勝ち投手(または負け投手)がその選手なら 1。 */
function decisionFor(gameId, name, which){
  const d=decisions(DATA.plate.filter(r=>String(r.game_id)===gameId));
  return d && d[which]===name ? 1 : 0;
}
function decisionTotal(name, which){
  return gameIds().reduce((n,g)=>n+decisionFor(g,name,which),0);
}

/**
 * 主要成績の上位 3 人。
 *
 * @param filter 規定に届いた選手だけに絞るとき。null なら全員
 * @param high   大きいほうが上位か
 */
function card(title, rows, filter, get, fmt, high){
  const list=rows.filter(d=>{
    if(filter && !filter(d)) return false;
    const v=get(d);
    return v!==null && v!==undefined && isFinite(v);
  }).sort((a,b)=>high ? get(b)-get(a) : get(a)-get(b)).slice(0,3);
  const body=list.length ? `<ol>${list.map(d=>`<li>${face(d.name,20)}
      <span>${esc(d.name)}</span><b>${fmt(get(d))}</b></li>`).join("")}</ol>`
    : '<div class="empty">記録がありません</div>';
  return `<div class="card"><h4>${title}</h4>${body}</div>`;
}

/** その項目が大きい打席を上位 5 つ。record の打球から拾う。 */
function topBatted(key){
  return DATA.pitch
    .filter(r=>r.contact===true && r.call==="IN_PLAY" && Number(r.exit_velocity)>0)
    .filter((r,i,all)=>all.findIndex(o=>sameBatted(o,r))===i)
    .map(r=>({...r, _v: key==="distance" ? distanceOf(r) : Number(r[key])}))
    .filter(r=>isFinite(r._v) && r._v>0)
    .sort((a,b)=>b._v-a._v)
    .slice(0,5);
}
/** 同じ打球か。打者側と投手側の記録に同じ球が入っている。 */
function sameBatted(a,b){
  return a.game===b.game && a.inning===b.inning && a.pa===b.pa
      && a.pitch_no===b.pitch_no && a.batter===b.batter;
}
function playCard(title, rows, fmt){
  const body=rows.length ? `<ol>${rows.map(r=>`<li>${face(r.batter,20)}
      <span>${esc(r.batter||"?")}<small style="color:var(--muted)"> ${esc(gameLabel(r.game))}</small></span>
      <b>${fmt(r)}</b></li>`).join("")}</ol>`
    : '<div class="empty">打球の記録がありません</div>';
  return `<div class="card"><h4>${title}</h4>${body}</div>`;
}
/** 1 試合で最も空振りを奪った投手。上位 5 つ。 */
function whiffCard(){
  const seen=new Set(), count={};
  DATA.pitch.forEach(r=>{
    if(r.whiff!==true || !r.pitcher) return;
    const key=[r.game,r.inning,r.half,r.pa,r.pitch_no,r.batter].join("|");
    if(seen.has(key)) return;                  // 打者側と投手側で同じ球を二度数えない
    seen.add(key);
    const at=r.pitcher+"|"+r.game;
    count[at]=(count[at]||0)+1;
  });
  const rows=Object.entries(count)
    .map(([k,n])=>({name:k.split("|")[0], game:k.split("|")[1], n}))
    .sort((a,b)=>b.n-a.n).slice(0,5);
  const body=rows.length ? `<ol>${rows.map(r=>`<li>${face(r.name,20)}
      <span>${esc(r.name)}<small style="color:var(--muted)"> ${esc(gameLabel(r.game))}</small></span>
      <b>${r.n}</b></li>`).join("")}</ol>`
    : '<div class="empty">投球の記録がありません</div>';
  return `<div class="card"><h4>Swing &amp; Miss</h4>${body}</div>`;
}

/**
 * ベストオーダー。
 *
 * <p>打者は規定打席に届いた人の wRC+ 上位 9 人。
 * 打順は wRC+ の順位で 3-4-1-2-5-6-7-8-9 の並びにする。
 * 投手は防御率・投球回・奪三振をまとめた点数で選ぶ。
 */
const ORDER_BY_RANK=[3,4,1,2,5,6,7,8,9];
function bestOrder(bat, pit){
  const list=bat.filter(d=>d.L.pa>=QUAL_PA && d.wrc!==null && isFinite(d.wrc))
                .sort((a,b)=>b.wrc-a.wrc).slice(0,9);
  if(list.length<1) return '<div class="empty">規定打席に届いた選手がいません</div>';
  const slots=[];
  list.forEach((d,i)=>{ slots[ORDER_BY_RANK[i]-1]=d; });
  const ace=bestPitcher(pit);
  return `<div class="scroll"><table class="lineup"><tbody>
    ${slots.map((d,i)=>d ? `<tr>
      <td class="slot">${i+1}</td>
      <td class="nm">${withFace(d.name,22)}</td>
      <td>${d.L.pa} 打席</td><td>${f3(d.L.avg)}</td>
      <td>${d.L.hr} HR</td><td>${d.L.rbi} 打点</td>
    </tr>` : "").join("")}
    ${ace ? `<tr class="pit">
      <td class="slot">P</td>
      <td class="nm">${withFace(ace.name,22)}</td>
      <td>${ipText(ace.L.outs)} IP</td><td>${f2(ace.L.era)} ERA</td>
      <td>${ace.w} 勝</td><td>${ace.L.so} SO</td>
    </tr>` : ""}
  </tbody></table></div>`;
}
/**
 * 総合で一番の投手。
 *
 * <p>投球回・奪三振は多いほど、防御率は低いほどよい。
 * それぞれをリーグ内の最大で割って 0〜1 に均し、足して比べる。
 */
function bestPitcher(pit){
  const list=pit.filter(d=>d.L.outs/3>=QUAL_IP && d.L.era!==null && isFinite(d.L.era));
  if(!list.length) return null;
  const maxIp=Math.max(...list.map(d=>d.L.outs));
  const maxSo=Math.max(...list.map(d=>d.L.so));
  const maxEra=Math.max(...list.map(d=>d.L.era));
  const score=d=>0.40*(d.L.outs/(maxIp||1))
                + 0.30*(d.L.so/(maxSo||1))
                + 0.30*(1-d.L.era/(maxEra||1));
  return list.sort((a,b)=>score(b)-score(a))[0];
}

/** 一覧に並べる選手ぶんの数字をまとめて作る。 */
function leaderRows(side){
  const key=side==="bat"?"batter":"pitcher";
  const names=[...new Set(DATA.plate.map(r=>r[key]).filter(Boolean))];
  const dec=side==="pit" ? decisionMap() : {};
  return names.map(name=>{
    const pa=plateOf(name,side), ps=pitchOf(name,side);
    const L=side==="pit" ? pitcherLine(pa) : line(pa);
    const S=summarize(ps);
    const xwoba=S.pa ? (S.xbaSum+S.bb+S.hbp)/S.pa : null;
    return {name, L, S, xwoba,
      games:new Set(pa.map(r=>String(r.game_id))).size,
      wrc: side==="bat" ? wrcPlus(L) : null,
      xera: xwoba===null?null:Math.max(0,(xwoba-0.300)*30.0),
      w:(dec[name]||{}).w||0, l:(dec[name]||{}).l||0,
      sv:(dec[name]||{}).sv||0, hld:(dec[name]||{}).hld||0};
  });
}
function leaderboardView(){
  if(!DATA.plate.length) return '<section><div class="empty">result の csv を読み込んでください</div></section>';
  const cols=LB.side==="bat" ? batterColumns(LB.mode) : pitcherColumns(LB.mode);
  if(!cols.some(c=>c.key===LB.key)) LB.key=cols[0].key;
  const col=cols.find(c=>c.key===LB.key);
  const rows=leaderRows(LB.side);
  // 率で並べるときは、規定打席に届いている人を先にまとめる
  const rated = LB.side==="bat" && col.rate;
  const ok=d=>!rated || d.L.pa>=QUAL_PA;
  rows.sort((a,b)=>{
    if(rated && ok(a)!==ok(b)) return ok(a) ? -1 : 1;
    const x=col.get(a), y=col.get(b);
    const ax=(x===null||x===undefined||!isFinite(x))?null:x;
    const by=(y===null||y===undefined||!isFinite(y))?null:y;
    if(ax===null&&by===null) return a.name.localeCompare(b.name);
    if(ax===null) return 1;                 // 記録の無い選手は下
    if(by===null) return -1;
    return (ax-by)*LB.dir;
  });
  const seg=(group,value,label)=>
    `<button data-lb="${group}" data-value="${value}"
      aria-selected="${LB[group]===value}">${label}</button>`;
  return `<section class="span"><div class="pad">
    <div class="head">Leaderboard<small>${rows.length} 選手</small></div>
    <div class="lbbar">
      <div class="seg">${seg("side","bat","打者")}${seg("side","pit","投手")}</div>

      <thead><tr><th class="rank"></th><th style="text-align:left">選手</th>

          class="${c.key===LB.key?"sorted":""}">${c.head}${c.key===LB.key?(LB.dir<0?" ▼":" ▲"):""}</th>`).join("")}
      </tr></thead>
      <tbody>${rows.map((d,i)=>`<tr class="${rated&&!ok(d)?"unq":""}">
        <td class="rank">${i+1}</td>
        <td class="nm">${withFace(d.name,20)}</td>
        ${cols.map(c=>{

          return `<td>${bad?"—":c.fmt(v)}</td>`;
        }).join("")}
      </tr>`).join("")}</tbody>
    </table></div>
  </div></section>`;

/** record の打席行を引ける表にする。同じ打席は 1 行だけ持つ。 */
function recordIndex(){
  const map=new Map();
  DATA.pitch.forEach(r=>{
    if(!r.result) return;
    const k=[r.game,r.inning,isBottom(r)?"B":"T",r.batter,r.result].join("|");
    const kept=map.get(k);
    // 打者側の記録を優先する。投手側の記録は同じ打席の写し。
    if(!kept || (r.side==="Batting" && kept.side!=="Batting")) map.set(k,r);
  });
  return map;
}
/**
 * その試合で、誰がどちらのチームか。
 *
 * <p>表の攻撃の打者と裏の攻撃の投手が先攻、その逆が後攻。
 * 名前 -> 0(先攻) / 1(後攻)。
 */
function teamSides(rows){
  const side={};
  rows.forEach(r=>{
    const bottom=isBottom(r);
    if(r.batter && side[r.batter]===undefined) side[r.batter]=bottom?1:0;
    if(r.pitcher && side[r.pitcher]===undefined) side[r.pitcher]=bottom?0:1;
  });
  return side;
}
/** チームの色のクラス名。分からなければ空。 */
function teamClass(side){
  return side===0 ? "t-first" : side===1 ? "t-second" : "";
}
/** 顔と名前。チームの色を付ける。 */
function withTeamFace(name, side, size){
  if(!name) return `<span class="none">マネキン</span>`;
  return `<span class="withface ${teamClass(side)}">${face(name,size)}<span>${esc(name)}</span></span>`;
}
/**
 * その試合でその選手が守っていた守備位置。
 *
 * <p>play の記録から引く。守備機会の行(field)と、
 * 回ごとに置かれる spot の行の両方を数え、いちばん多いところを返す。
 * 記録が無ければ空。
 */
function positionIn(game, name){
  const count={};
  DATA.play.forEach(r=>{
    if(String(r.game)!==String(game) || r.player!==name) return;
    const at=String(r.position||"");
    if(!POS_LABEL[at]) return;
    count[at]=(count[at]||0)+1;
  });
  let best="", most=0;
  for(const at in count){
    if(count[at]>most){ most=count[at]; best=at; }
  }
  return best;
}

/**
 * その試合の打順。
 *
 * <p>result の order 列は打順の枠ではなく「その回の何人目か」なので使えない。
 * 打った順に名前を並べ、一巡して先頭に戻るまでを打順とする。
 *
 * <p>一巡の中で代わった人はその枠の人として出る。
 * 二巡目以降に入ってきた代打・代走は出さない。誰の枠かを見るための表なので。
 *
 * @param side 0=先攻 1=後攻
 */
function lineup(rows, side){
  const out=[], used=new Set();
  for(const r of rows){
    if((isBottom(r)?1:0)!==side || !r.batter) continue;
    // 一巡して先頭に戻った
    if(used.has(r.batter)) break;
    used.add(r.batter);
    out.push({slot:out.length+1, name:r.batter});
    if(out.length>=9) break;
  }
  return out;
}

/**
 * その試合の先発投手。
 *
 * <p>打順とは別に書く。投手は打順に入らないことが多く、
 * 入っていても交代が打順の並びと合わないため。
 * 交代した投手は打順表には出さない。打順表は「誰の枠か」を見るためのもの。
 *
 * @param side 0=先攻 1=後攻。その回に守っていたほうを拾う
 */
function starterOf(rows, side){
  for(const r of rows){
    // 表の攻撃で投げているのは後攻の投手
    if((isBottom(r)?1:0)===side || !r.pitcher) continue;
    return r.pitcher;
  }
  return "";
}

/** 打順表の 1 チームぶん。 */
function lineupCard(rows, side, name){
  const order=lineup(rows, side);
  const starter=starterOf(rows, side);
  if(!order.length && !starter) return "";
  // ol を使うと card の連番が重なって出るので、素の div で組む
  const line=(label, who, where) => `<div class="row">
      <span class="slot">${label}</span>
      <span class="at">${where ? esc(POS_LABEL[where]) : ""}</span>
      ${withTeamFace(who, side, 20)}
    </div>`;
  const body=order.map(one =>
    line(one.slot, one.name, positionIn(GAME, one.name))).join("");
  const arm=starter ? line("投", starter, "PITCHER") : "";
  return `<div class="card">
    <h4 class="${teamClass(side)}">${esc(name)}</h4>
    <div class="lineup">${body}${arm}</div>
  </div>`;
}

function lineupBox(rows){
  const first=rows.find(r=>r.topteam||r.bottomteam) || {};
  const names=[String(first.topteam||"").trim()||"先攻",
               String(first.bottomteam||"").trim()||"後攻"];
  const cards=[lineupCard(rows,0,names[0]), lineupCard(rows,1,names[1])].join("");
  if(!cards) return "";
  return `<section class="span"><div class="pad">
    <div class="head">打順</div>
    <div class="cards">${cards}</div>
  </div></section>`;
}

function resultView(){
  const games=gameIds();
  if(!games.length) return '<section><div class="empty">result の csv を読み込んでください</div></section>';
  if(!games.includes(GAME)) GAME=games[games.length-1];
  const rows=DATA.plate.filter(r=>String(r.game_id)===GAME);
  const pick=games.map(g=>
    `<button data-game="${esc(g)}" aria-selected="${g===GAME}">${esc(gameLabel(g))}</button>`).join("");
  return `<section class="span"><div class="pad">
    <div class="head">Result<small>${games.length} 試合</small></div>
    <div class="gamepick">${pick}</div>
    ${scoreBoard(rows)}
  </div></section>
  ${lineupBox(rows)}
  <section class="span"><div class="pad">
    <div class="head">打席結果<small>${rows.length} 打席</small></div>
    ${inningTables(rows)}
  </div></section>`;
}
function scoreBoard(rows){
  const innings=Math.max(1,...rows.map(r=>Number(r.inning)||1));
  const runs=[[],[]], hits=[[],[]], played=[[],[]];
  for(let i=1;i<=innings;i++){
    [0,1].forEach(side=>{
      const half=rows.filter(r=>Number(r.inning)===i && (isBottom(r)?1:0)===side);
      played[side][i]=half.length>0;
      runs[side][i]=half.reduce((n,r)=>n+(Number(r.runs)||0),0);
      hits[side][i]=half.filter(r=>HIT.has(r.result)).length;
    });
  }
  const total=side=>runs[side].reduce((a,b)=>a+(b||0),0);
  const totalH=side=>hits[side].reduce((a,b)=>a+(b||0),0);
  const d=decisions(rows);
  const relief=reliefCredits(rows, d);
  const winner = total(1)>total(0) ? 1 : (total(0)>total(1) ? 0 : -1);
  // 記録にチーム名があれば使う。無ければ先攻/後攻。
  const first=rows.find(r=>r.topteam||r.bottomteam) || {};
  const names=[String(first.topteam||"").trim()||"先攻",
               String(first.bottomteam||"").trim()||"後攻"];
  const sides=teamSides(rows);
  const row=side=>`<tr class="${side?"second":"first"} ${winner===side?"win":""}">
    <td class="team">${esc(names[side])}</td>
    ${Array.from({length:innings},(_,k)=>{
      const i=k+1;
      return `<td>${played[side][i] ? runs[side][i] : "-"}</td>`;
    }).join("")}
    <td class="big">${total(side)}</td><td class="big">${totalH(side)}</td>
  </tr>`;
  const homers=rows.filter(r=>r.result==="HOME_RUN");
  return `<div class="scroll"><table class="board">
    <thead><tr><th class="team"></th>
      ${Array.from({length:innings},(_,k)=>`<th>${k+1}</th>`).join("")}
      <th class="big">R</th><th class="big">H</th></tr></thead>
    <tbody>${row(0)}${row(1)}</tbody>
  </table></div>
  <div class="boardnote">
    ${d&&d.win ? `<span><b>勝</b>${withTeamFace(d.win,sides[d.win],20)}</span>` : ""}
    ${d&&d.lose ? `<span><b>敗</b>${withTeamFace(d.lose,sides[d.lose],20)}</span>` : ""}
    ${relief.save ? `<span><b>S</b>${withTeamFace(relief.save,sides[relief.save],20)}</span>` : ""}
    ${homers.length ? `<span><b>本塁打</b>${homers.map(h=>
        `<span class="withface ${teamClass(sides[h.batter])}" style="margin-right:10px">${face(h.batter,20)}
          <span>${esc(h.batter)}${Number(h.rbi)>1?`(${h.rbi}点)`:""}</span></span>`).join("")}</span>` : ""}
  </div>`;
}
function inningTables(rows){
  const index=recordIndex();
  const sides=teamSides(rows);
  const innings=Math.max(1,...rows.map(r=>Number(r.inning)||1));
  let html="";
  for(let i=1;i<=innings;i++){
    for(const side of [0,1]){
      const half=rows.filter(r=>Number(r.inning)===i && (isBottom(r)?1:0)===side);
      if(!half.length) continue;
      html+=`<div class="inninghead">${i} 回${side?"裏":"表"}</div>
      <div class="scroll"><table class="pa2">
      <colgroup><col class="c-p"><col class="c-p"><col class="c-r"><col class="c-s">
        <col class="c-m"><col class="c-s"><col class="c-m"><col class="c-m"><col class="c-s"></colgroup>
      <thead><tr>
        <th class="nm">打者</th><th class="nm">投手</th>
        <th class="nm">結果</th><th>打点</th>
        <th>初速</th><th>角度</th><th>距離</th><th>Barrel</th><th>xBA</th>
      </tr></thead><tbody>${half.map(r=>{
        const rec=index.get([GAME,r.inning,side?"B":"T",r.batter,r.result].join("|"));
        const ev=rec?Number(rec.exit_velocity):NaN, la=rec?Number(rec.launch_angle):NaN;
        const hit=rec && rec.contact===true && rec.call==="IN_PLAY" && isFinite(ev) && ev>0;
        const x=hit ? battedExpectation(ev,la).ba : null;
        const rbi=Number(r.rbi)||0;
        return `<tr>
          <td class="nm">${withTeamFace(r.batter,sides[r.batter],20)}</td>
          <td class="nm">${withTeamFace(r.pitcher,sides[r.pitcher],20)}</td>
          <td class="res"><span class="rtag ${resultClass(r.result)}">${JA[r.result]||r.result||""}</span></td>
          <td class="${rbi?"rbi":""}">${rbi||""}</td>
          <td>${hit?f1(ev):"–"}</td>
          <td>${hit?f1(la)+"°":"–"}</td>
          <td>${hit?f1(distanceOf(rec)):"–"}</td>
          <td>${hit?(isBarrel(ev,la)?"true":"false"):"–"}</td>
          <td>${x===null?"–":f3(x)}</td>
        </tr>`;
      }).join("")}</tbody></table></div>`;
    }
  }
  return html || '<div class="empty">打席の記録がありません</div>';
}

/* ======================================================== パワプロ風の能力
   持っている記録から 1〜100 の能力に直す。result と record の両方を見て、
   片方しか無ければそちらだけで判断する。何も無い項目は 55(並)。 */
/** 記録が足りない項目の値。 */
const ABILITY_DEFAULT=55;

/**
 * 値の範囲を能力値に均す。lo が 20、hi が 95。
 *
 * <p>目盛りの外へ出ても 20 と 95 で止める。
 * 端を 1 と 100 にすると、少ない記録で外れた数字がひとつ出ただけで
 * G が並んでしまうため。
 */
function ability(value, lo, hi){
  if(value===null || value===undefined || !isFinite(value)) return ABILITY_DEFAULT;
  const t=Math.max(0, Math.min(1, (value-lo)/(hi-lo)));
  return Math.round(20+75*t);
}
/**
 * 記録の量から、その項目をどれだけ重く見るか。
 * 記録が少ないうちは成績のほうを重く見る。
 */
function weightOf(n, full){
  return Math.max(0.15, Math.min(1, n/full));
}
/**
 * 打席数が足りない選手の能力を真ん中へ寄せる。
 *
 * <p>数試合しか出ていない選手は、たまたまの成績で
 * 極端に高くも低くも出てしまう。
 * 規定に届くまでは、足りない分だけ 55 へ近づける。
 * 高すぎる人は下がり、低すぎる人は上がる。規定を超えていればそのまま。
 *
 * @param n    その選手の打席数(投手は投球のアウト数)
 * @param full 規定の数
 */
function steady(value, n, full){
  const trust=Math.max(0, Math.min(1, n/full));
  return Math.round(ABILITY_DEFAULT + (value-ABILITY_DEFAULT)*trust);
}
/**
 * 能力値の段位。
 *
 * <p>目安はパワプロに合わせてある。
 * S=90〜 A=80〜 B=70〜 C=60〜 D=50〜 E=40〜 F=20〜 それ未満が G。
 */
function rank(value){
  if(value>=90) return "S";
  if(value>=80) return "A";
  if(value>=70) return "B";
  if(value>=60) return "C";
  if(value>=50) return "D";
  if(value>=40) return "E";
  if(value>=20) return "F";
  return "G";
}
/**
 * 段位の色。A〜F は指定のもの。
 * C と D、E と F は同じ色で、段位の文字で見分ける。
 */
const RANK_COLOR={S:"#ff5fb0",A:"#f50fd7",B:"#ff1441",C:"#ffa500",D:"#c3d21e",
  E:"#41d400",F:"#26b6f2",G:"#8b98a4"};
/** 右上の基礎能力の段位。上は A 止まりにする。 */
function basicRank(value){
  const r=rank(value);
  return r==="S" ? "A" : r;
}

/** 項目名の字の大きさ。6 文字の「コントロール」だけ枠に収まらないので詰める。 */
const nameFont=name => [...String(name)].length>=6 ? 28 : 30;

/** 能力の 1 行。名前の枠・段位・数字。 */
function abrow(name, value){
  const r=rank(value), color=RANK_COLOR[r];
  return `<div class="abrow">
    <span class="nm" style="font-size:${nameFont(name)}px">${name}</span>
    <span class="rank" style="color:${color}">${r}</span>
    <span class="num">${value}</span>
  </div>`;
}
/** 段位を出さない行(弾道や球速)。 */
function abplain(name, text, arrow){
  return `<div class="abrow">
    <span class="nm" style="font-size:${nameFont(name)}px">${name}</span>
    <span class="rank arrow">${arrow || ""}</span>
    <span class="num" style="width:auto;white-space:nowrap">${text}</span>
  </div>`;
}
/**
 * 弾道の矢印。数字が大きいほど上を向く。
 * 2 は水平ではなく、わずかに上がる打球なので少し傾ける。
 */
function trajectoryArrow(level){
  const tilt={1:-4, 2:-22, 3:-45, 4:-70}[level];
  if(tilt===undefined) return "";
  // 弾道が高いほど上の段位の色。1=D 2=C 3=B 4=A
  const color=RANK_COLOR[{1:"D", 2:"C", 3:"B", 4:"A"}[level]];
  return `<svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true"
      style="vertical-align:middle;transform:rotate(${tilt}deg)">
    <path d="M3 12h11" fill="none" stroke="${color}"
      stroke-width="5.5" stroke-linecap="round"/>
    <path d="M22 12 L11 5 L11 19 Z" fill="${color}"/>
  </svg>`;
}
/** 守備位置ごとの色。投手と中継ぎは同じ色。 */
const ROLE_COLOR={pitcher:"#fd8779", catcher:"#3eeff5",
  infield:"#facf04", outfield:"#64e86e"};
/** 内野の守備位置。 */
const INFIELD=new Set(["FIRST_BASEMAN","SECOND_BASEMAN","THIRD_BASEMAN","SHORTSTOP"]);
/** 記録が無いときの色。 */
const ROLE_UNKNOWN="#ffe45c";

/** 守備位置の 1 文字表記。 */
const POS_LABEL={PITCHER:"投", CATCHER:"捕", FIRST_BASEMAN:"一", SECOND_BASEMAN:"二",
  THIRD_BASEMAN:"三", SHORTSTOP:"遊", LEFT_FIELDER:"左", CENTER_FIELDER:"中",
  RIGHT_FIELDER:"右"};

/**
 * その選手が守った守備位置。多い順に並べる。投手は先頭。
 *
 * @return {position, n} の配列
 */
function aptitude(name){
  const count={};
  playOf(name,"field").forEach(r=>{
    const at=String(r.position||"");
    if(!POS_LABEL[at]) return;
    count[at]=(count[at]||0)+1;
  });
  const pitched=plateOf(name,"pit").length;
  const list=Object.keys(count)
    .map(at=>({position:at, n:count[at]}))
    .sort((a,b)=>b.n-a.n);
  if(pitched) list.unshift({position:"PITCHER", n:pitched});
  return list;
}

/** 成績の隣に出す適性。守った回数が多いところほど濃い。 */
function aptitudeBox(name){
  const list=aptitude(name);
  if(!list.length) return "";
  const most=list[0].n;
  const cells=list.map(at=>{
    const strong=at.n>=most*0.5;
    return `<span class="${strong?"on":""}" title="${at.n} 回">${POS_LABEL[at.position]}</span>`;
  });
  return `<span class="apt"><b>適性</b>${cells.join("")}</span>`;
}

/** その守備位置がどの色になるか。 */
function roleOf(position){
  if(position==="PITCHER") return "pitcher";
  if(position==="CATCHER") return "catcher";
  return INFIELD.has(position) ? "infield" : "outfield";
}

/**
 * その選手の守備の割合から、名前の枠に敷く色を決める。
 *
 * <p>投手をいちばん左に置き、あとは就いた回数の多い順。多くても 3 色まで。
 * 記録が無ければ黄色一色。
 */
function plateBackground(name){
  const count={};
  playOf(name,"field").forEach(r=>{
    const role=roleOf(String(r.position||""));
    count[role]=(count[role]||0)+1;
  });
  // 投球の記録があれば投手もやっている
  if(plateOf(name,"pit").length) count.pitcher=(count.pitcher||0)+999;
  const roles=Object.keys(count)
    .sort((a,b)=> a==="pitcher" ? -1 : b==="pitcher" ? 1 : count[b]-count[a])
    .slice(0,3);
  if(!roles.length) return ROLE_UNKNOWN;
  if(roles.length===1) return ROLE_COLOR[roles[0]];
  // 境目はぼかす。区切りの前後 2% を混ぜる。
  const step=100/roles.length;
  const stops=roles.map((role,i)=>{
    const from=i===0 ? 0 : i*step+2;
    const to=i===roles.length-1 ? 100 : (i+1)*step-2;
    return `${ROLE_COLOR[role]} ${from.toFixed(0)}%, ${ROLE_COLOR[role]} ${to.toFixed(0)}%`;
  });
  return `linear-gradient(90deg, ${stops.join(", ")})`;
}

/** 名前・顔・成績の帯。 */
function pawaHead(name, badge, stats){
  return `<div class="abhead">
    <span class="plate" style="background:${plateBackground(name)}">${esc(name)}</span>
    <span class="numbox">${badge}</span>
    <span class="facebox">${face(name,40)}</span>
    <span class="stat"><b>成績</b>${stats}</span>
    ${aptitudeBox(name)}
  </div>`;
}
/**
 * 枠に収まる字の大きさ。
 *
 * <p>枠の幅は決まっているので、字数が増えたらそのぶん小さくする。
 * 4 字までは 25px、それより長い 1 字につき 1px ずつ詰める。
 *
 * @param text 入れる字
 * @param room この字数までは大きいまま
 */
function fitFont(text, room){
  const n=[...String(text)].length;
  const keep=room || 4;
  if(n<=keep) return 25;
  return Math.max(12, 25 - (n-keep));
}

/**
 * 右上の基礎能力。
 *
 * <p>末尾の 1 文字を段位として読み、B 以上は青、F 以下は赤にする。
 */
function basicRow(items){
  return `<div class="basics">${items.map(text => {
    const whole=String(text).trim();
    const letter=whole.slice(-1);
    const name=whole.slice(0, -1).trim();
    const tone="SAB".indexOf(letter)>=0 ? " good"
      : "FG".indexOf(letter)>=0 ? " bad" : "";
    return `<span class="basic${tone}">`
      + `<i style="font-size:${fitFont(name, 4)}px">${esc(name)}</i>`
      + `<b>${esc(letter)}</b></span>`;
  }).join("")}</div>`;
}
/**
 * 特殊能力。ゲームと同じように空き枠も並べる。
 *
 * @param slots 最低これだけの枠を出す
 */
function skillGrid(skills, slots){
  // 水=低い能力 青=高い能力 赤=悪い能力 緑=個性的
  const tone=k => k.bad ? "bad" : k.green ? "green" : k.low ? "low" : "good";
  const cells=skills.map(k=>
    `<span class="skill ${tone(k)}" style="font-size:${fitFont(k.name, 4)}px">`
    + `${esc(k.name)}</span>`);
  const least=slots || 8;
  while(cells.length<least || cells.length%4!==0){
    cells.push('<span class="skill empty">&nbsp;</span>');
  }
  return `<div class="skills">${cells.join("")}</div>`;
}

/* ------------------------------------------------------------ 打者の能力 */
function batterAbility(name){
  const pa=plateOf(name,"bat"), ps=pitchOf(name,"bat");
  const L=line(pa), S=summarize(ps);
  const has=pa.length>0, hasPitch=ps.length>0;

  // 弾道。打球角度の平均から 1〜4。記録が少なければ 2。
  let trajectory=2;
  if(S.n>=3){
    const avg=S.bip.reduce((n,r)=>n+Number(r.launch_angle),0)/S.n;
    trajectory = avg<6 ? 1 : avg<13 ? 2 : avg<20 ? 3 : 4;
  }
  // 投球の記録の多さと、当たった打球の数。少ないほど軽く見る
  const wPitch=hasPitch ? weightOf(ps.length, 60) : 0;
  const wBip=S.n ? weightOf(S.n, 20) : 0;
  // ミート。打率・三振率・空振り率・xBA・弱い打球の少なさ。
  const meet=blend([
    [has ? ability(L.avg, 0.120, 0.480) : null, 1.4],
    [has ? ability(L.kRate, 60, 10) : null, 1.0],
    [hasPitch ? ability(S.whiff, 48, 14) : null, 0.8*wPitch],
    [hasPitch ? ability(S.xba, 0.150, 0.480) : null, 1.0*wBip],
    [hasPitch ? ability(weakRate(S), 60, 18) : null, 0.6*wBip]
  ]);
  // パワー。長打・打球速度・xSLG。
  const xbh=L.ab ? (L.d2+L.d3+L.hr)/L.ab : null;
  const power=blend([
    [has ? ability(xbh, 0.00, 0.35) : null, 1.0],
    [hasPitch ? ability(S.ev, 138, 190) : null, 1.2*wBip],
    [hasPitch ? ability(S.xslg, 0.200, 0.900) : null, 1.0*wBip]
  ]);
  // 規定打席に届かないうちは、上も下も真ん中へ寄せる
  return {L, S, trajectory,
          meet:steady(meet, L.pa, QUAL_PA),
          power:steady(power, L.pa, QUAL_PA),
          pa, ps};
}
/** 加重平均。値の無いものは飛ばす。全部無ければ 55。 */
function blend(pairs){
  let sum=0, weight=0;
  pairs.forEach(([value,w])=>{
    if(value===null||value===undefined||!isFinite(value)) return;
    sum+=value*w; weight+=w;
  });
  return weight ? Math.round(sum/weight) : ABILITY_DEFAULT;
}
/** 弱い打球の割合(%)。 */
function weakRate(S){
  if(!S.n) return null;
  const weak=S.bip.filter(r=>Number(r.exit_velocity)<153).length;
  return 100*weak/S.n;
}

/**
 * 守備と走塁の能力。パワプロ側で使う。
 *
 * <p>記録が少ないうちは {@link steady} で真ん中へ寄せる。
 * 守備機会は打席よりずっと少ないので、5 機会を規定とする。
 */
const QUAL_CHANCE=5;

function gloveAbility(name){
  const F=fieldingLine(playOf(name,"field"));
  const B=baserunLine(playOf(name,"run"));
  const per=(value, n) => value===null||!n ? null : value/n;
  // 記録が無い項目は 55(並)。打撃と同じ扱いにする。
  // 走力。余分に進めた割合と、ダッシュを使った割合から。
  const speed=B.plays
    ? steady(blend([
        [B.extraRate===null?null:ability(B.extraRate, 0, 70), 1.2],
        [B.sprint===null?null:ability(B.sprint*100, 55, 100), 0.6]
      ]), B.plays, QUAL_CHANCE)
    : ABILITY_DEFAULT;
  // 肩力。送球の速さそのもの。
  const arm=F.arm===null ? ABILITY_DEFAULT
    : steady(ability(F.arm, 95, 145), F.throws, QUAL_CHANCE);
  // 守備力。打球にどれだけ追いつけたか。
  const glove=F.chances
    ? steady(ability(per(F.range,F.chances), -0.25, 0.25), F.chances, QUAL_CHANCE)
    : ABILITY_DEFAULT;
  // 捕球。落球の少なさ。外野のノーバウンド落球は 3 つぶんとして数えてある。
  const hands=F.chances
    ? steady(ability(F.dropWeight/F.chances, 0.6, 0.0), F.chances, QUAL_CHANCE)
    : ABILITY_DEFAULT;
  // 送球(コントロール)。悪送球の少なさ。
  const control=F.throwAccuracy===null ? ABILITY_DEFAULT
    : steady(ability(F.throwAccuracy, 55, 100), F.throws, QUAL_CHANCE);
  // 走塁。走塁の値打ち。
  const baserun=B.plays
    ? steady(ability(per(B.runs,B.plays), -0.20, 0.25), B.plays, QUAL_CHANCE)
    : ABILITY_DEFAULT;
  return {F, B, speed, arm, glove, hands, control, baserun};
}

/** 打者の特殊能力。 */
function batterSkills(name, A){
  const basics=[], skills=[];
  // チャンス。得点圏とそれ以外の wRC+ を比べる。
  basics.push("チャンス " + basicRank(clutchSplit(name)));
  basics.push("対左投手 D");
  // 出場率から怪我のしにくさ。休まず出ているほど上。
  const games=new Set(A.pa.map(r=>String(r.game_id))).size;
  const all=gameIds().length;
  basics.push("ケガしにくさ "
    + (all ? (games/all>=0.9 ? "C" : games/all>=0.6 ? "D" : "E") : "D"));
  basics.push("回復 C");
  // 盗塁は記録の取りようが無いので並で置く
  basics.push("盗塁 D");
  const G=gloveAbility(name);
  basics.push("走塁 " + basicRank(G.baserun));
  basics.push("送球 " + basicRank(G.control));

  if(A.L.hr>=1) skills.push({name:"パワーヒッター"});
  if(A.L.avg!==null && A.L.avg>=0.400) skills.push({name:"アベレージヒッター"});
  const spray=sprayLean(A.S, name);
  if(spray==="oppo") skills.push({name:"広角打法"});
  if(spray==="pull") skills.push({name:"引っ張り"});
  // 選球眼は個性寄りなので緑
  if(A.L.bbRate!==null && A.L.bbRate>=12) skills.push({name:"選球眼", green:true});
  if(A.L.kRate!==null && A.L.kRate>=35) skills.push({name:"三振", bad:true});
  return {basics, skills};
}
/** 得点圏とそれ以外の wRC+ の差から、チャンスの強さを 1〜100 で返す。 */
function clutchSplit(name){
  const rows=plateOf(name,"bat");
  const scoring=rows.filter(r=>r.base2===true||r.base3===true);
  const rest=rows.filter(r=>!(r.base2===true||r.base3===true));
  if(scoring.length<3||rest.length<3) return ABILITY_DEFAULT;
  const a=wrcPlus(line(scoring)), b=wrcPlus(line(rest));
  if(a===null||b===null) return ABILITY_DEFAULT;
  return ability(a-b, -60, 60);
}
function letterOf(value){
  return " "+rank(value);
}
/**
 * 引っ張りか広角か。
 *
 * <p>強い打球(153km/h 以上)がどちら側に多いかで見る。
 * 右打席なら三塁側が引っ張り、左打席なら一塁側。
 */
function sprayLean(S, name){
  const hard=S.bip.filter(r=>Number(r.exit_velocity)>=153 && isFinite(Number(r.spray_angle)));
  if(hard.length<5) return "";
  const right=String(stanceOf(name)||"R").toUpperCase()!=="L";
  const pull=hard.filter(r=>{
    const a=Number(r.spray_angle);
    return right ? a<-8 : a>8;
  }).length;
  const oppo=hard.filter(r=>{
    const a=Number(r.spray_angle);
    return right ? a>8 : a<-8;
  }).length;
  if(pull>=hard.length*0.5 && pull>oppo*1.6) return "pull";
  if(oppo>=hard.length*0.32 && oppo>=pull*0.8) return "oppo";
  return "";
}
/** その打者の打席の左右。記録が無ければ空。 */
function stanceOf(name){
  const row=DATA.pitch.find(r=>r.batter===name && r.stance);
  return row ? row.stance : "";
}

/**
 * record から打席の一覧を作る。
 *
 * <p>打席の最後の 1 球にだけ結果が入っているので、その行を並べる。
 * 打球のデータはその 1 球のもの。四球や三振の行は打球の欄が空になる。
 *
 * @param other 相手の名前を引く列。打者なら pitcher、投手なら batter
 */
/**
 * 打席の一覧に使う行を作る。
 *
 * <p>record(1 球ごと)に残っている打席を土台にして、
 * result にしか無い打席を足す。投球の記録を取っていない試合でも
 * 打席の並びが出るようにするため。
 *
 * @param rows  その選手の record の行
 * @param plate その選手の result の行
 * @param other 相手を引く列。打者のページなら pitcher
 */
function paRows(rows, plate, other){
  const ended=rows.filter(r=>r.result);
  // record にある打席を、試合と回と結果で数えておく
  const seen=new Map();
  ended.forEach(r=>{
    const key=[r.game, r.inning, r.half, r.result].join("|");
    seen.set(key, (seen.get(key)||0)+1);
  });
  const extra=[];
  (plate||[]).forEach(r=>{
    const half=String(r.half||"").toUpperCase().startsWith("B") ? "BOTTOM" : "TOP";
    const key=[r.game_id, r.inning, half, r.result].join("|");
    const left=seen.get(key)||0;
    if(left>0){ seen.set(key, left-1); return; }
    // record に無い打席。打球の数字は残っていないので、結果だけ並べる。
    extra.push({game:r.game_id, inning:r.inning, half:half, result:r.result,
      pitcher:r.pitcher, batter:r.batter, fromResult:true});
  });
  const all=ended.concat(extra);
  // 試合と回の順に並べ、新しい打席を上にする
  all.sort((a,b)=>{
    const g=String(a.game).localeCompare(String(b.game));
    if(g) return g;
    const ia=Number(a.inning)||0, ib=Number(b.inning)||0;
    if(ia!==ib) return ia-ib;
    const ha=a.half==="BOTTOM" ? 1 : 0, hb=b.half==="BOTTOM" ? 1 : 0;
    return ha-hb;
  });
  return all.reverse();
}

function paTable(rows, other, plate){

        <td>${hit?f1(ev):"–"}</td>
