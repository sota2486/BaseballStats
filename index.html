function scoreBoard(rows){
  const innings=Math.max(1,...rows.map(r=>Number(r.inning)||1));
  const runs=[[],[]], hits=[[],[]], played=[[],[]];
  for(let i=1;i<=innings;i++){
    [0,1].forEach(side=>{
      const half=rows.filter(r=>Number(r.inning)===i && (isBottom(r)?1:0)===side);
      played[side][i]=half.length>0;
      runs[side][i]=half.reduce((n,r)=>n+(Number(r.runs)||0),0);
      hits[side][i]=half.filter(r=>HIT.has(r.result)).length;
    });
  }
  const total=side=>runs[side].reduce((a,b)=>a+(b||0),0);
  const totalH=side=>hits[side].reduce((a,b)=>a+(b||0),0);
  const d=decisions(rows);
  const relief=reliefCredits(rows, d);
  const winner = total(1)>total(0) ? 1 : (total(0)>total(1) ? 0 : -1);
  const names=teamNames(rows);
  const sides=teamSides(rows);
  const row=side=>`<tr class="${side?"second":"first"} ${winner===side?"win":""}">
    <td class="team">${esc(names[side])}</td>
    ${Array.from({length:innings},(_,k)=>{
      const i=k+1;
      // 押すとその回の打席結果まで移動する
      return played[side][i]
        ? `<td class="jump" data-jump="inning-${i}-${side}">${runs[side][i]}</td>`
        : "<td>-</td>";
    }).join("")}
    <td class="big">${total(side)}</td><td class="big">${totalH(side)}</td>
  </tr>`;
  const homers=rows.filter(r=>r.result==="HOME_RUN");
  const venue=venueOf(rows.length ? rows[0].game_id : GAME);
  return `<div class="scroll"><table class="board">
    <thead><tr><th class="team">${venue ? `<span class="venue">${esc(venue)}</span>` : ""}</th>
      ${Array.from({length:innings},(_,k)=>`<th>${k+1}</th>`).join("")}
      <th class="big">R</th><th class="big">H</th></tr></thead>
    <tbody>${row(0)}${row(1)}</tbody>
  </table></div>
  <div class="boardnote">
    ${d&&d.win ? `<span><b>勝</b>${withTeamFace(d.win,sides[d.win],20)}</span>` : ""}
    ${d&&d.lose ? `<span><b>敗</b>${withTeamFace(d.lose,sides[d.lose],20)}</span>` : ""}
    ${relief.save ? `<span><b>S</b>${withTeamFace(relief.save,sides[relief.save],20)}</span>` : ""}
    ${homers.length ? `<span><b>本塁打</b>${homers.map(h=>
        `<span class="withface ${teamClass(sides[h.batter])}" style="margin-right:10px">${face(h.batter,20)}
          <span>${esc(h.batter)}${Number(h.rbi)>1?`(${h.rbi}点)`:""}</span></span>`).join("")}</span>` : ""}
  </div>`;
}
/**
 * その試合の打順表から、選手 → 打順番号を引けるようにする。
 *
 * <p>result の order 列は「その回の何人目か」なので打順にならない。
 * 打順表と同じ作り方(打った順に一巡するまで)で番号を振る。
 */
function orderNumbers(rows){
  const at=new Map();
  [0,1].forEach(side=>{
    lineup(rows, side).forEach(one=>at.set(one.name, one.slot));
  });
  return at;
}

/**
 * 打席の始まりの塁状況。ひし形 3 つで表す。
 *
 * <p>並びはサイドバーと同じで、上が二塁、下の左右が三塁と一塁。
 * 走者がいれば塗りつぶし、いなければ白抜き。
 */
function baseMark(row){
  const on=at => row[at]===true;
  const mark=full => `<i class="${full ? "on" : ""}"></i>`;
  return `<span class="diamond">
    <span class="top">${mark(on("base2"))}</span>
    <span class="row">${mark(on("base3"))}${mark(on("base1"))}</span>
  </span>`;
}

/* ------------------------------------------------------ 戦況変化
   1 打席ごとの勝利確率。点差と残りイニング、塁状況とアウト数から出す。
   上へ行くほど先攻(赤)が有利、下へ行くほど後攻(青)が有利。 */

/**
 * 塁状況とアウト数から、その回にあと何点入りそうか。
 *
 * <p>大リーグの得点期待値の形をそのまま使い、
 * このリーグの得点力(1 イニングおよそ 0.8 点)に合わせて倍率を掛けてある。
 */
const RUN_EXPECT={
  "000":[0.50,0.27,0.10], "100":[0.87,0.52,0.22], "010":[1.10,0.66,0.32],
  "001":[1.35,0.95,0.37], "110":[1.44,0.90,0.44], "101":[1.75,1.16,0.50],
  "011":[1.95,1.38,0.58], "111":[2.28,1.55,0.75]
};

/** その場面の得点期待値。3 アウトなら 0。 */
function runExpect(bases, outs){
  if(outs>=3) return 0;
  return (RUN_EXPECT[bases] || RUN_EXPECT["000"])[Math.min(2, outs)];
}

/**
 * 1 点がどれだけ勝ちに近いか。
 *
 * <p>同点の場面で 1 点動くと、勝つ見込みはおよそ 1 割動く。
 */
const WIN_PER_RUN=0.11;

/** 正規分布の累積。勝利確率に直すのに使う。 */
function normalCdf(z){
  // 誤差関数の近似(Abramowitz and Stegun 7.1.26)
  const t=1/(1+0.2316419*Math.abs(z));
  const d=0.3989423*Math.exp(-z*z/2);
  const p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));
  return z>0 ? 1-p : p;
}

/**
 * その場面での先攻の勝利確率。
 *
 * @param top    先攻の得点
 * @param bottom 後攻の得点
 * @param inning 回
 * @param isTop  表の攻撃か
 * @param bases  "110" のような塁の状況
 * @param outs   アウト数
 */
function winProb(top, bottom, inning, isTop, bases, outs){
  // 済んだ半イニング。今の回のぶんは、アウト数で目減りさせる。
  const done=(inning-1)*2 + (isTop ? 0 : 1);
  let left=Math.max(0, GAME_INNINGS*2-done) - Math.min(2, outs)/3;
  // 延長。同点で最終回まで来たので、残りは今の半イニングと、
  // 表ならそのあとの裏のぶん。ここを 0 にすると決着したことになってしまう。
  if(done>=GAME_INNINGS*2) left=(isTop ? 2 : 1) - Math.min(2, outs)/3;
  // 最終回の裏に入った時点で後攻が勝っていれば、もう試合は終わっている。
  if(!isTop && done>=GAME_INNINGS*2-1 && bottom>top) return 0;
  if(left<=0.05){
    return top===bottom ? 0.5 : (top>bottom ? 1 : 0);
  }
  // いま出塁している走者ぶんの期待得点。攻めている側に足す。
  const re=(RUN_EXPECT[bases]||RUN_EXPECT["000"])[Math.min(2,outs)];
  const now=(RUN_EXPECT["000"])[Math.min(2,outs)];
  const edge=(re-now)*(isTop ? 1 : -1);
  // 残りで動く点差のばらつき。1 半イニングおよそ 0.8 点。
  const sd=Math.max(0.8, Math.sqrt(left)*1.35);
  return Math.max(0.01, Math.min(0.99, normalCdf((top-bottom+edge)/sd)));
}

/**
 * 1 打席ごとの勝利確率の並び。打席が始まる前の値を出す。
 *
 * <p>result の outs 列はその打席で増えたアウトなので、
 * 打席が始まる前のアウト数はこちらで数え直す。
 *
 * <p>点差を 0 とみなした値(pn)も一緒に出す。勝利関与で、
 * 大差の場面の重みを弱めるのに使う。
 */
function winPath(rows){
  let top=0, bottom=0, outs=0, half="";
  const out=[];
  rows.forEach(r=>{
    const isTop=!isBottom(r);
    const inning=Number(r.inning)||1;
    const key=inning+(isTop?"T":"B");
    if(key!==half){ half=key; outs=0; }
    const bases=(r.base1===true?"1":"0")+(r.base2===true?"1":"0")+(r.base3===true?"1":"0");
    const at={r, top, bottom, inning, isTop, bases, outs:Math.min(2,outs)};
    at.p =winProb(top, bottom, inning, isTop, bases, at.outs);
    at.pn=winProb(0,   0,      inning, isTop, bases, at.outs);
    out.push(at);
    const runs=Number(r.runs)||0;
    if(isTop) top+=runs; else bottom+=runs;
    outs+=Number(r.outs)||0;
  });
  // 最後に決着した時点も入れる
  out.push({p:top===bottom?0.5:(top>bottom?1:0), pn:0.5, r:null, top, bottom});
  return out;
}

/** アウトで終わった打席か。抑えた側の手柄として書く。 */
const OUT_RESULT=new Set(["STRIKE_OUT","GROUND_OUT","FLY_OUT","DOUBLE_PLAY",
  "TRIPLE_PLAY","FIELDER_CHOICE","SACRIFICE_BUNT","SACRIFICE_FLY"]);

/**
 * その打席をひとことで。丸に当てたときに出す文。
 *
 * <p>打った側が良くなった場面は打者の手柄、抑えた側が良くなった場面は
 * 投手の手柄として書く。勝率の動きは「後攻 15pt up」の形。
 */
function playNote(row, delta){
  const batter=row.batter || "打者";
  const pitcher=row.pitcher || "投手";
  const label=JA[row.result] || row.result || "打席";
  const rbi=Number(row.rbi)||0;
  const risp=row.base1===true || row.base2===true || row.base3===true;
  let text;
  if(row.result==="HOME_RUN"){
    const kind=rbi>=4 ? "満塁ホームラン"
      : rbi>=2 ? rbi+"ランホームラン" : "ソロホームラン";
    text=batter+" の"+kind;
  }else if(OUT_RESULT.has(row.result)){
    // 抑えた側の手柄。走者を置いていたならピンチを切り抜けた形。
    if(row.result==="STRIKE_OUT"){
      text=risp ? pitcher+" がピンチを三振で切り抜けた"
                : pitcher+" が三振を奪った";
    }else if(row.result==="DOUBLE_PLAY" || row.result==="TRIPLE_PLAY"){
      text=pitcher+" が"+label+"に仕留めた";
    }else if(rbi>0){
      // 犠飛などは点が入っているので、打った側の記録として書く
      text=batter+" の"+label+"("+rbi+"打点)";
    }else if(risp){
      text=pitcher+" がピンチを抑えた";
    }else{
      text=pitcher+" が"+batter+" を"+label+"に打ち取った";
    }
  }else if(rbi>0){
    text=batter+" の"+label+"("+rbi+"打点)";
  }else{
    text=batter+" の"+label;
  }
  const side=delta>0 ? "先攻" : "後攻";
  const move=(100*Math.abs(delta)).toFixed(0);
  return text+" ｜ "+row.inning+"回"+(isBottom(row)?"裏":"表")
    +" ｜ "+side+" "+move+"pt up";
}

/**
 * 山場。勝率が大きく動いた打席を 1〜5 か所選ぶ。
 *
 * <p>勝ち負けは見ない。動いた幅の大きい順に取り、
 * 小さすぎるもの(5pt 未満)は落とす。いちばん大きい 1 つは必ず残す。
 */
function bigMoments(path){
  const moves=[];
  for(let i=0;i<path.length-1;i++){
    if(!path[i].r) continue;
    moves.push({at:i, row:path[i].r, delta:path[i+1].p-path[i].p});
  }
  if(!moves.length) return [];
  moves.sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta));
  const picked=moves.filter((m,i)=>i===0 || Math.abs(m.delta)>=0.05).slice(0,5);
  return picked.sort((a,b)=>a.at-b.at);
}

/** 戦況変化のグラフ。 */
function winChart(rows){
  const path=winPath(rows);
  if(path.length<3) return "";
  const W=920, H=210, pad=26;
  const x=i=>pad+(W-pad*2)*i/(path.length-1);
  const y=p=>pad+(H-pad*2)*(1-p);
  const names=teamNames(rows);
  // 塗り分け。50% より上は先攻、下は後攻。
  let line="", area="";
  path.forEach((one,i)=>{
    line+=(i?"L":"M")+x(i).toFixed(1)+" "+y(one.p).toFixed(1);
  });
  area=line+"L"+x(path.length-1).toFixed(1)+" "+y(0.5).toFixed(1)
    +"L"+x(0).toFixed(1)+" "+y(0.5).toFixed(1)+"Z";
  // 回の区切り
  let marks="";
  let lastInning=null;
  path.forEach((one,i)=>{
    if(!one.r) return;
    const key=one.r.inning+"/"+(isBottom(one.r)?"B":"T");
    if(key===lastInning) return;
    lastInning=key;
    marks+=`<line x1="${x(i).toFixed(1)}" y1="${pad}" x2="${x(i).toFixed(1)}"
      y2="${H-pad}" stroke="var(--line-soft)"/>`;
    if(!isBottom(one.r)){
      marks+=`<text x="${(x(i)+3).toFixed(1)}" y="${pad+11}" font-size="10"
        fill="var(--muted)">${one.r.inning}回</text>`;
    }
  });
  return `<div class="winwrap">
    <div class="winside top"><b>${esc(names[0])}</b><span>先攻</span></div>
    <svg viewBox="0 0 ${W} ${H}" class="winchart" role="img" aria-label="戦況変化">
      <defs>
        <clipPath id="winup"><rect x="0" y="0" width="${W}" height="${y(0.5)}"/></clipPath>
        <clipPath id="windown"><rect x="0" y="${y(0.5)}" width="${W}" height="${H}"/></clipPath>
      </defs>
      <rect x="${pad}" y="${pad}" width="${W-pad*2}" height="${H-pad*2}"
        fill="var(--panel-2)" rx="6"/>
      ${marks}
      <path d="${area}" fill="var(--hot)" fill-opacity="0.22" clip-path="url(#winup)"/>
      <path d="${area}" fill="var(--cold)" fill-opacity="0.22" clip-path="url(#windown)"/>
      <line x1="${pad}" y1="${y(0.5).toFixed(1)}" x2="${W-pad}" y2="${y(0.5).toFixed(1)}"
        stroke="var(--line)" stroke-dasharray="4 4"/>
      <path d="${line}" fill="none" stroke="var(--text)" stroke-width="2"
        stroke-linejoin="round"/>
      ${bigMoments(path).map(m=>`<g class="moment">
        <circle cx="${x(m.at+1).toFixed(1)}" cy="${y(path[m.at+1].p).toFixed(1)}" r="6"
          fill="${m.delta>0 ? "var(--hot)" : "var(--cold)"}"
          stroke="var(--panel)" stroke-width="2">
          <title>${esc(playNote(m.row, m.delta))}</title></circle>
      </g>`).join("")}
      <text x="${pad-4}" y="${(y(1)+4).toFixed(1)}" text-anchor="end" font-size="10"
        fill="var(--muted)">100%</text>
      <text x="${pad-4}" y="${(y(0.5)+4).toFixed(1)}" text-anchor="end" font-size="10"
        fill="var(--muted)">50%</text>
      <text x="${pad-4}" y="${(y(0)+4).toFixed(1)}" text-anchor="end" font-size="10"
        fill="var(--muted)">100%</text>
    </svg>
    <div class="winside bottom"><b>${esc(names[1])}</b><span>後攻</span></div>
  </div>`;
}


/* ============================================ 打席結果の書き方と打席詳細 */

/** 打球がどちらへ飛んだか。負が左。 */
function sprayName(angle){
  if(!isFinite(angle)) return "";
  if(angle < -15) return "左";
  if(angle > 15) return "右";
  return "中";
}

/**
 * 打球を処理したであろう守備位置。
 *
 * <p>打ち出し角と方向から見当をつける。角度が取れていなければ空。
 */
function fielderName(rec){
  if(!rec) return "";
  const la=Number(rec.launch_angle), a=Number(rec.spray_angle);
  if(!isFinite(la) || !isFinite(a)) return "";
  const far=distanceOf(rec);
  if(la >= 25 || far >= 60){
    // 上がった打球か外野まで届いた打球
    return a < -15 ? "レフト" : (a > 15 ? "ライト" : "センター");
  }
  if(far < 12) return Math.abs(a) < 20 ? "ピッチャー" : "キャッチャー";
  if(a < -28) return "サード";
  if(a < -8) return "ショート";
  if(a > 28) return "ファースト";
  if(a > 8) return "セカンド";
  return "ピッチャー";
}

/**
 * 打席結果の書き方。どこへ飛んだかが分かればそれを添える。
 *
 * <p>アウトは「セカンドゴロ」「ライトフライ」、安打は「右安打」「中二塁打」。
 * 打球の記録が無ければこれまでどおりの言い方。
 */
function resultText(result, rec){
  const plain=JA[result] || result || "";
  if(!rec) return plain;
  const a=Number(rec.spray_angle);
  // 決め球の判定が分かれば、三振の種類まで書く
  if(result==="STRIKE_OUT"){
    if(rec.call==="SWINGING_STRIKE") return "空振り三振";
    if(rec.call==="CALLED_STRIKE") return "見逃し三振";
    return plain;
  }
  const hit=rec.contact===true && rec.call==="IN_PLAY";
  if(!hit) return plain;
  const where=fielderName(rec);
  if(result==="GROUND_OUT") return where ? where+"ゴロ" : plain;
  if(result==="FLY_OUT"){
    const la=Number(rec.launch_angle);
    const kind=isFinite(la) && la < 25 ? "ライナー" : "フライ";
    return where ? where+kind : plain;
  }
  if(result==="DOUBLE_PLAY") return where ? where+"ゴロ併殺" : plain;
  const side=sprayName(a);
  if(!side) return plain;
  if(result==="SINGLE") return side+"安打";
  if(result==="DOUBLE") return side+"二塁打";
  if(result==="TRIPLE") return side+"三塁打";
  if(result==="HOME_RUN") return side+"本塁打";
  return plain;
}

/** アウトカウントを丸で出す。 */
function outMark(outs){
  const mark=n => `<i class="${n < outs ? "on" : ""}"></i>`;
  return `<span class="outdots">${mark(0)}${mark(1)}</span>`;
}

/**
 * 打席が始まった時点のアウト数。
 *
 * <p>result の outs 列は「その打席で増えたアウト」なので、
 * 同じ回の前の打席ぶんを足し上げる。
 */
function outsBefore(rows){
  const box=new Map();
  const count={};
  rows.forEach(r=>{
    const key=[String(r.game_id), r.inning, isBottom(r)?"B":"T"].join("|");
    const before=count[key] || 0;
    box.set(r, Math.min(2, before));
    count[key]=before + (Number(r.outs)||0);
  });
  return box;
}

/* ------------------------------------------------------------ 打席詳細 */

/** 球の色。ストライク=黄、ボール=緑、インプレーのアウト=赤、安打=青。 */
function pitchTone(row, last, result){
  const call=String(row.call||"");
  if(call==="IN_PLAY" || (last && row.contact===true)){
    return HIT.has(result) ? "hit" : "inplay";
  }
  if(call==="BALL") return "ball";
  if(call) return "strike";
  // 判定が残っていない球。打席を決めた 1 球なら、結果から色を決める。
  // 四球の決め球を黄色(ストライク)で出すと、見た目が食い違う。
  if(!last) return "strike";
  if(result==="WALK" || result==="HIT_BY_PITCH") return "ball";
  if(HIT.has(result)) return "hit";
  if(result==="STRIKE_OUT") return "strike";
  return "inplay";
}

/** ボール・ストライク・アウトを丸で縦に並べる。 */
function countMark(text, outs){
  const part=String(text||"0-0").split("-");
  const dots=(n, max, tone)=>{
    let out="";
    for(let i=0;i<max;i++) out+=`<i class="${i<n?"on "+tone:""}"></i>`;
    return out;
  };
  return `<span class="bscount">
    <span><b>B</b>${dots(Number(part[0])||0, 3, "ball")}</span>
    <span><b>S</b>${dots(Number(part[1])||0, 2, "strike")}</span>
    <span><b>O</b>${dots(outs||0, 2, "out")}</span>
  </span>`;
}

/**
 * その打席の最後のカウント。判定を順に当てて数える。
 *
 * <p>4 つ目のボールと 3 つ目のストライクは打席を終わらせるので、
 * 表示は 3-2 で止める。
 */
function finalCount(pitches){
  let b=0, s=0;
  pitches.forEach(p=>{
    const call=String(p.call||"");
    if(call==="BALL") b=Math.min(3,b+1);
    else if(call==="FOUL"){ if(s<2) s++; }
    else if(call.indexOf("STRIKE")>=0) s=Math.min(2,s+1);
  });
  return b+"-"+s;
}

/** 打席 → その打席の投球(順番どおり)。 */
let PA_PITCH=null, PA_PITCH_N=-1;
function paPitchIndex(){
  if(PA_PITCH && PA_PITCH_N===DATA.pitch.length) return PA_PITCH;
  const box=new Map();
  DATA.pitch.forEach(r=>{
    if(r.side==="Pitching") return;          // 打者側の記録だけ使う
    const pa=String(r.pa||"");
    if(!pa) return;
    (box.get(pa) || box.set(pa,[]).get(pa)).push(r);
  });
  // 打席 ID は result に無いので、試合・回・打者・結果で引けるように移し替える
  const out=new Map();
  box.forEach(list=>{
    list.sort((a,b)=>(Number(a.pitch_no)||0)-(Number(b.pitch_no)||0));
    const last=list[list.length-1];
    const result=list.map(r=>r.result).filter(Boolean).pop() || "";
    const key=[String(last.game), last.inning, isBottom(last)?"B":"T",
      last.batter, result].join("|");
    out.set(key, list);
  });
  PA_PITCH=out; PA_PITCH_N=DATA.pitch.length;
  return out;
}

/**
 * 打席詳細。選んだ 1 打席だけを大きく見せる。
 *
 * <p>初めて開いたときは初回の先頭打者。前後のボタンと、
 * 打席結果の行を押すことでも移る。
 */
function paDetail(rows){
  if(!rows.length) return '<div class="empty">打席の記録がありません</div>';
  const at=Math.max(0, Math.min(rows.length-1, PA_AT));
  const row=rows[at];
  const index=paPitchIndex();
  const outs=outsBefore(rows);
  const sides=teamSides(rows);
  // その打席が始まるまでの得点
  const before=[0,0];
  for(let i=0;i<at;i++){
    before[isBottom(rows[i])?1:0]+=Number(rows[i].runs)||0;
  }
  const key=[String(row.game_id), row.inning, isBottom(row)?"B":"T",
    row.batter, row.result].join("|");
  const pitches=index.get(key) || [];
  return `<div class="panav">
      <button data-pa="${at-1}" ${at<=0?"disabled":""}>← 前の打席</button>
      <span>${at+1} / ${rows.length} 打席</span>
      <button data-pa="${at+1}" ${at>=rows.length-1?"disabled":""}>次の打席 →</button>
    </div>
    ${paCard(row, before, outs.get(row)||0, pitches, sides)}`;
}

/** 1 打席ぶんの中身。 */
function paCard(row, before, outs, pitches, sides){
  const side=isBottom(row)?1:0;
  const names=teamNames(DATA.plate.filter(r=>String(r.game_id)===String(row.game_id)));
  const lefty=throwHandOf(row.pitcher)==="L";
  const rec=pitches.length ? pitches[pitches.length-1] : null;
  const ev=rec?Number(rec.exit_velocity):NaN, la=rec?Number(rec.launch_angle):NaN;
  const hit=rec && rec.contact===true && rec.call==="IN_PLAY" && isFinite(ev) && ev>0;
  const rbi=Number(row.rbi)||0;
  const list=pitches.map((p,i)=>{
    const tone=pitchTone(p, i===pitches.length-1, row.result);
    const speed=Number(p.velocity);
    // 打席を決めた球だけは、結果まで書く
    const last=i===pitches.length-1;
    const strikeOut=last && row.result==="STRIKE_OUT";
    const walked=last && (row.result==="WALK" || row.result==="HIT_BY_PITCH");
    const what=p.call==="SWINGING_STRIKE" ? (strikeOut ? "空振り三振" : "空振り")
      : p.call==="CALLED_STRIKE" ? (strikeOut ? "見逃し三振" : "見逃し")
      : tone==="ball" ? (walked ? JA[row.result] : "ボール")
      : p.call==="FOUL" ? "ファウル"
      : resultText(row.result, p);
    return `<li><i class="pnum ${tone}">${i+1}</i>
      <span class="ptype">${esc(p.type||"")}</span>
      <span class="pspd">${isFinite(speed)&&speed>0?speed.toFixed(0)+" km/h":"—"}</span>
      <span class="pwhat">${esc(what)}</span></li>`;
  }).join("");
  const facts=[
    ["場面", `${row.inning} 回${side?"裏":"表"}`],
    ["スコア", `${esc(names[0])} ${before[0]}-${before[1]} ${esc(names[1])}`],
    ["カウント", finalCount(pitches)],
    ["打点", rbi ? rbi + " 点" : "—"]
  ];
  const batted=[
    ["打球速度", hit ? f1(ev)+" km/h" : "—"],
    ["打球角度", hit ? f1(la)+"°" : "—"],
    ["飛距離", hit ? f1(distanceOf(rec))+" m" : "—"]
  ];
  return `<div class="pacard">
    <div class="paside">
      <div class="pabox">
        <div class="paat">${row.inning} 回${side?"裏":"表"}</div>
        <div class="pascore"><span class="t-first">${esc(names[0])}</span>
          <b>${before[0]}-${before[1]}</b>
          <span class="t-second">${esc(names[1])}</span></div>
        <dl>
          <dt>投手</dt><dd>${withTeamFace(row.pitcher, sides[row.pitcher], 20)}</dd>
          <dt>打者</dt><dd>${withTeamFace(row.batter, sides[row.batter], 20)}</dd>
        </dl>
      </div>
      <div class="pabox pares2">
        <span class="rtag inline ${resultClass(row.result)}">${esc(resultText(row.result, rec))}</span>
        ${countMark(finalCount(pitches), outs)}
        ${baseMark(row)}
        ${rbi ? `<span class="parbi">${rbi} 打点</span>` : ""}
        ${winPtText(row)}
      </div>
      <div class="pabox pafacts">${batted.map(one=>
        `<span><i>${one[0]}</i><b>${one[1]}</b></span>`).join("")}</div>
    </div>
    <div class="pabox pazonebox">${paZone(pitches, row, lefty)}</div>
    <div class="pabox"><ol class="palist2">${list
      || '<li class="none">投球の記録がありません</li>'}</ol></div>
  </div>`;
}

/**
 * 1 打席ぶんのコース。ゾーンの上に球を順番の数字で置く。
 *
 * <p>見た目は選手統計の「投球位置」と揃えてある。
 * 太枠がストライクゾーン、その外の点線がボール 1 個ぶんの目安、
 * 下に本塁ベース。横へ大きく外れた球も入るよう、枠は広めに取る。
 *
 * <p>位置は本塁を通ったときのずれ(plate_x / plate_y)。
 * 左投手は左右を裏返して、打者から見た向きに揃える。
 */
function paZone(pitches, row, lefty){
  // ストライクゾーンの箱。選手統計の投球位置と同じ寸法。
  const ZW=0.6, ZB=0.5, ZT=1.7;
  // 1 ブロックあたりの大きさを上げて、そのぶん枠の左右を詰める
  const W=320, H=300, cx=W/2, cy=120, scale=105;
  const X=x=>cx+x*scale, Y=y=>cy-(y-(ZB+ZT)/2)*scale;
  const box={l:X(-ZW), r:X(ZW), t:Y(ZT), b:Y(ZB)};
  const stance=stanceOf(row.batter)==="L";
  let g="";
  // ボール 1 個ぶん外の目安
  g+=`<rect class="zdash" x="${(box.l-16).toFixed(1)}" y="${(box.t-16).toFixed(1)}"
      width="${(box.r-box.l+32).toFixed(1)}" height="${(box.b-box.t+32).toFixed(1)}"/>`;
  g+=`<rect class="zbox" x="${box.l.toFixed(1)}" y="${box.t.toFixed(1)}"
      width="${(box.r-box.l).toFixed(1)}" height="${(box.b-box.t).toFixed(1)}"/>`;
  for(let i=1;i<3;i++){
    const x=box.l+(box.r-box.l)*i/3, y=box.t+(box.b-box.t)*i/3;
    g+=`<line class="zline" x1="${x.toFixed(1)}" y1="${box.t}" x2="${x.toFixed(1)}" y2="${box.b}"/>`;
    g+=`<line class="zline" x1="${box.l}" y1="${y.toFixed(1)}" x2="${box.r}" y2="${y.toFixed(1)}"/>`;
  }
  // 打者の影。形の中では 肩=46 膝=198 足=248 の高さにある。
  // 肩をゾーンの上端、膝を下端に合わせると、背丈と置き場所が決まる。
  const tall=(box.b-box.t)/152;
  const headY=box.t-46*tall;          // 影の原点(頭の上)
  const feetY=headY+248*tall;         // 足の先
  const sx=stance ? W-14 : 14;
  // 本塁ベースは足の先と同じ高さに引く
  g+=`<path class="zplate" d="M ${cx-30} ${feetY.toFixed(1)} L ${cx+30} ${feetY.toFixed(1)}
      L ${cx+30} ${(feetY+11).toFixed(1)} L ${cx} ${(feetY+19).toFixed(1)}
      L ${cx-30} ${(feetY+11).toFixed(1)} Z"/>`;
  g+=`<g class="shadow" transform="translate(${sx},${headY.toFixed(1)})
      scale(${(stance?-tall:tall).toFixed(3)},${tall.toFixed(3)})">
      <rect x="26" y="10" width="30" height="30" rx="3"/>
      <rect x="24" y="46" width="34" height="58" rx="4"/>
      <rect x="10" y="52" width="14" height="44" rx="6"/>
      <rect x="24" y="104" width="34" height="44" rx="4"/>
      <rect x="25" y="148" width="14" height="100" rx="4"/>
      <rect x="43" y="148" width="14" height="100" rx="4"/>
    </g>`;
  pitches.forEach((p,i)=>{
    const rawX=Number(p.plate_x), rawY=Number(p.plate_y);
    if(!isFinite(rawX) || !isFinite(rawY) || (rawX===0 && rawY===0)) return;
    // 大きく外れた球は枠の中へ寄せる。外へ出ると見えなくなる。
    const x=Math.max(-1.35, Math.min(1.35, lefty ? -rawX : rawX));
    const y=Math.max(-0.2, Math.min(2.4, rawY));
    const px=X(x), py=Y(y);
    const tone=pitchTone(p, i===pitches.length-1, row.result);
    const name=String(p.type||"");
    const same=pitchOf(row.pitcher,"pit").filter(r=>String(r.type||"")===name);
    const dir=breakDirection(name, same);
    const up=STRAIGHT.indexOf(name)>=0 || dir==="up";
    if(up){
      g+=`<circle class="pd ${tone}" cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="15"/>`;
    }else{
      const raw=BREAK_DEG[dir]===undefined ? 90 : BREAK_DEG[dir];
      g+=`<polygon class="pd ${tone}" points="${pitchTip(px, py, 17, lefty ? 180-raw : raw)}"/>`;
    }
    g+=`<text class="pn" x="${px.toFixed(1)}" y="${(py+1).toFixed(1)}"
      text-anchor="middle" dominant-baseline="middle">${i+1}</text>`;
  });
  return `<svg class="pazone" viewBox="0 0 ${W} ${H}" width="100%">${g}</svg>`;
}

/** 変化の向きごとの角度(度。0 が右、下が正)。能力画面の図と同じ。 */
const BREAK_DEG={up:-90, upRight:-45, right:0, lowRight:45,
  down:90, lowLeft:135, left:180, upLeft:-135};

/**
 * 変化球の印。向いている方向へ尖った五角形。
 *
 * <p>尖った先が変化の向き。残りの 4 点で四角い胴を作る。
 */
function pitchTip(cx, cy, r, deg){
  const rad=deg*Math.PI/180;
  const ux=Math.cos(rad), uy=Math.sin(rad);
  // 向きに直交する向き
  const vx=-uy, vy=ux;
  const half=r*0.72, back=r*0.62;
  const at=(along, side)=>
    (cx + ux*along + vx*side).toFixed(1) + "," + (cy + uy*along + vy*side).toFixed(1);
  return [at(r, 0), at(0, half), at(-back, half), at(-back, -half), at(0, -half)].join(" ");
}

function inningTables(rows){
  const index=recordIndex();
  const outs=outsBefore(rows);
  const sides=teamSides(rows);
  const order=orderNumbers(rows);
  const innings=Math.max(1,...rows.map(r=>Number(r.inning)||1));
  let html="";
  for(let i=1;i<=innings;i++){
    for(const side of [0,1]){
      const half=rows.filter(r=>Number(r.inning)===i && (isBottom(r)?1:0)===side);
      if(!half.length) continue;
      html+=`<div class="inninghead" id="inning-${i}-${side}">${i} 回${side?"裏":"表"}</div>
      <div class="scroll"><table class="pa2">
      <colgroup><col class="c-o"><col class="c-p"><col class="c-p"><col class="c-b"><col class="c-b"><col class="c-r"><col class="c-s">
        <col class="c-w">
        <col class="c-m"><col class="c-s"><col class="c-m"><col class="c-k"><col class="c-s"></colgroup>
      <thead><tr>
        <th>打順</th><th class="nm">打者</th><th class="nm">投手</th><th>塁</th><th>アウト</th>
        <th class="nm">結果</th><th>打点</th><th>勝利pt</th>
        <th>初速</th><th>角度</th><th>距離</th><th>打球</th><th>xBA</th>
      </tr></thead><tbody>${half.map(r=>{
        const rec=index.get([GAME,r.inning,side?"B":"T",r.batter,r.result].join("|"));
        const ev=rec?Number(rec.exit_velocity):NaN, la=rec?Number(rec.launch_angle):NaN;
        const hit=rec && rec.contact===true && rec.call==="IN_PLAY" && isFinite(ev) && ev>0;
        const x=hit ? battedExpectation(ev,la).ba : null;
        const rbi=Number(r.rbi)||0;
        const slot=order.get(r.batter);
        return `<tr class="jumppa" data-pa="${rows.indexOf(r)}">
          <td class="slot">${slot ? `<i>${slot}</i>` : ""}</td>
          <td class="nm">${withTeamFace(r.batter,sides[r.batter],20)}</td>
          <td class="nm">${withTeamFace(r.pitcher,sides[r.pitcher],20)}</td>
          <td class="bases">${baseMark(r)}</td>
          <td class="bases">${outMark(outs.get(r)||0)}</td>
          <td class="res"><span class="rtag ${resultClass(r.result)}">${esc(resultText(r.result, rec))}</span></td>
          <td class="${rbi?"rbi":""}">${rbi||""}</td>
          <td class="wcell">${winPtText(r) || "–"}</td>
          <td>${hit?f1(ev):"–"}</td>
          <td>${hit?f1(la)+"°":"–"}</td>
          <td>${hit?f1(distanceOf(rec)):"–"}</td>
          <td>${hit?esc(battedKind(ev,la)):"–"}</td>
          <td>${x===null?"–":f3(x)}</td>
        </tr>`;
      }).join("")}</tbody></table></div>`;
    }
  }
  return html || '<div class="empty">打席の記録がありません</div>';
}

/* ======================================================== パワプロ風の能力
   持っている記録から 1〜100 の能力に直す。result と record の両方を見て、
   片方しか無ければそちらだけで判断する。何も無い項目は 55(並)。 */
/** 記録が足りない項目の値。 */
const ABILITY_DEFAULT=55;

/**
 * 値の範囲を能力値に均す。lo が 20、hi が 95。
 *
 * <p>目盛りの外へ出ても 20 と 95 で止める。
 * 端を 1 と 100 にすると、少ない記録で外れた数字がひとつ出ただけで
 * G が並んでしまうため。
 */
function ability(value, lo, hi){
  if(value===null || value===undefined || !isFinite(value)) return ABILITY_DEFAULT;
  const t=(value-lo)/(hi-lo);
  // 目盛りより下は 1〜20 に散らす。全員 20 で並ぶのを避ける。
  if(t<0) return Math.round(belowScale(t*100));
  // 50 より下は差を縮める。下振れがそのまま出ると見るのが嫌になる。
  // 順番は変わらないので、上手い下手の並びはそのまま。
  return Math.round(softLow(20+75*Math.min(1,t)));
}
/**
 * 記録の量から、その項目をどれだけ重く見るか。
 * 記録が少ないうちは成績のほうを重く見る。
 */
function weightOf(n, full){
  return Math.max(0.15, Math.min(1, n/full));
}
/**
 * 打席数が足りない選手の能力を真ん中へ寄せる。
 *
 * <p>数試合しか出ていない選手は、たまたまの成績で
 * 極端に高くも低くも出てしまう。
 * 規定に届くまでは、足りない分だけ 55 へ近づける。
 * 高すぎる人は下がり、低すぎる人は上がる。規定を超えていればそのまま。
 *
 * @param n    その選手の打席数(投手は投球のアウト数)
 * @param full 規定の数
 */
function steady(value, n, full){
  const trust=Math.max(0, Math.min(1, n/full));
  return Math.round(ABILITY_DEFAULT + (value-ABILITY_DEFAULT)*trust);
}
/**
 * 能力値の段位。
 *
 * <p>目安はパワプロに合わせてある。
 * S=90〜 A=80〜 B=70〜 C=60〜 D=50〜 E=40〜 F=20〜 それ未満が G。
 */
function rank(value){
  if(value>=90) return "S";
  if(value>=80) return "A";
  if(value>=70) return "B";
  if(value>=60) return "C";
  if(value>=50) return "D";
  if(value>=40) return "E";
  if(value>=20) return "F";
  return "G";
}
/**
 * 段位の色。A〜F は指定のもの。
 * C と D、E と F は同じ色で、段位の文字で見分ける。
 */
const RANK_COLOR={S:"#ff5fb0",A:"#f50fd7",B:"#ff1441",C:"#ffa500",D:"#c3d21e",
  E:"#41d400",F:"#26b6f2",G:"#8b98a4"};
/** 右上の基礎能力の段位。上は A 止まりにする。 */
function basicRank(value){
  const r=rank(value);
  return r==="S" ? "A" : r;
}

/** 項目名の字の大きさ。6 文字の「コントロール」だけ枠に収まらないので詰める。 */
const nameFont=name => [...String(name)].length>=6 ? 28 : 30;

/** 能力の 1 行。名前の枠・段位・数字。 */
function abrow(name, value){
  const r=rank(value), color=RANK_COLOR[r];
  return `<div class="abrow">
    <span class="nm" style="font-size:${nameFont(name)}px">${name}</span>
    <span class="rank" style="color:${color}">${r}</span>
    <span class="num">${value}</span>
  </div>`;
}
/**
 * 段位を出さない行(弾道や球速)。
 *
 * <p>矢印が無い行は、矢印の枠を置かずに数字を名札のすぐ右へ出す。
 * 空の枠を挟むと、数字だけが右へ寄って名札との間が空きすぎる。
 */
function abplain(name, text, arrow){
  return `<div class="abrow">
    <span class="nm" style="font-size:${nameFont(name)}px">${name}</span>
    ${arrow ? `<span class="rank arrow">${arrow}</span>` : ""}
    <span class="num${arrow ? "" : " left"}"
      style="width:auto;white-space:nowrap">${text}</span>
  </div>`;
}
/**
 * 弾道の矢印。数字が大きいほど上を向く。
 * 2 は水平ではなく、わずかに上がる打球なので少し傾ける。
 */
function trajectoryArrow(level){
  const tilt={1:-4, 2:-22, 3:-45, 4:-70}[level];
  if(tilt===undefined) return "";
  // 弾道が高いほど上の段位の色。1=D 2=C 3=B 4=A
  const color=RANK_COLOR[{1:"D", 2:"C", 3:"B", 4:"A"}[level]];
  return `<svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true"
      style="vertical-align:middle;transform:rotate(${tilt}deg)">
    <path d="M3 12h11" fill="none" stroke="${color}"
      stroke-width="5.5" stroke-linecap="round"/>
    <path d="M22 12 L11 5 L11 19 Z" fill="${color}"/>
  </svg>`;
}
/** 守備位置ごとの色。投手と中継ぎは同じ色。 */
const ROLE_COLOR={pitcher:"#fd8779", catcher:"#3eeff5",
  infield:"#facf04", outfield:"#64e86e"};
/** 内野の守備位置。 */
const INFIELD=new Set(["FIRST_BASEMAN","SECOND_BASEMAN","THIRD_BASEMAN","SHORTSTOP"]);
/** 記録が無いときの色。 */
const ROLE_UNKNOWN="#ffe45c";

/** 守備位置の 1 文字表記。 */
const POS_LABEL={PITCHER:"投", CATCHER:"捕", FIRST_BASEMAN:"一", SECOND_BASEMAN:"二",
  THIRD_BASEMAN:"三", SHORTSTOP:"遊", LEFT_FIELDER:"左", CENTER_FIELDER:"中",
  RIGHT_FIELDER:"右"};

/**
 * その選手が守った守備位置。多い順に並べる。投手は先頭。
 *
 * @return {position, n} の配列
 */
function aptitude(name){
  const count={};
  playOf(name,"field").forEach(r=>{
    const at=String(r.position||"");
    if(!POS_LABEL[at]) return;
    count[at]=(count[at]||0)+1;
  });
  // 投球の記録も投手としての回数に足す。
  // 守備の記録にも投手として出てくるので、別の項目として足すと
  // 「投」が二つ並んでしまう。
  const pitched=plateOf(name,"pit").length;
  if(pitched) count.PITCHER=(count.PITCHER||0)+pitched;
  const list=Object.keys(count)
    .map(at=>({position:at, n:count[at]}))
    .sort((a,b)=>b.n-a.n);
  // 投手をやっているなら先頭に置く
  const at=list.findIndex(one=>one.position==="PITCHER");
  if(pitched && at>0) list.unshift(list.splice(at,1)[0]);
  return list;
}

/** 成績の隣に出す適性。守った回数が多いところほど濃い。 */
function aptitudeBox(name){
  const list=aptitude(name);
  if(!list.length) return "";
  const most=list[0].n;
  const cells=list.map(at=>{
    const strong=at.n>=most*0.5;
    return `<span class="${strong?"on":""}" title="${at.n} 回">${POS_LABEL[at.position]}</span>`;
  });
  return `<span class="apt"><b>適性</b>${cells.join("")}</span>`;
}

/** その守備位置がどの色になるか。 */
function roleOf(position){
  if(position==="PITCHER") return "pitcher";
  if(position==="CATCHER") return "catcher";
  return INFIELD.has(position) ? "infield" : "outfield";
}

/**
 * その選手の守備の割合から、名前の枠に敷く色を決める。
 *
 * <p>投手をいちばん左に置き、あとは就いた回数の多い順。多くても 3 色まで。
 * 記録が無ければ黄色一色。
 */
function plateBackground(name){
  const count={};
  playOf(name,"field").forEach(r=>{
    const role=roleOf(String(r.position||""));
    count[role]=(count[role]||0)+1;
  });
  // 投球の記録があれば投手もやっている
  if(plateOf(name,"pit").length) count.pitcher=(count.pitcher||0)+999;
  const roles=Object.keys(count)
    .sort((a,b)=> a==="pitcher" ? -1 : b==="pitcher" ? 1 : count[b]-count[a])
    .slice(0,3);
  if(!roles.length) return ROLE_UNKNOWN;
  if(roles.length===1) return ROLE_COLOR[roles[0]];
  // 境目はぼかす。区切りの前後 2% を混ぜる。
  const step=100/roles.length;
  const stops=roles.map((role,i)=>{
    const from=i===0 ? 0 : i*step+2;
    const to=i===roles.length-1 ? 100 : (i+1)*step-2;
    return `${ROLE_COLOR[role]} ${from.toFixed(0)}%, ${ROLE_COLOR[role]} ${to.toFixed(0)}%`;
  });
  return `linear-gradient(90deg, ${stops.join(", ")})`;
}

/** 名前・顔・成績の帯。 */
function pawaHead(name, badge, stats){
  return `<div class="abhead">
    <span class="plate" style="background:${plateBackground(name)}">${esc(name)}</span>
    <span class="numbox">${badge}</span>
    <span class="facebox">${face(name,40)}</span>
    <span class="stat"><b>成績</b>${stats}</span>
    ${aptitudeBox(name)}
    <span class="sidepick">
      <b data-pawa="bat" class="${PAWA_TAB==="bat"?"on":""}">打者</b>
      <b data-pawa="pit" class="${PAWA_TAB==="pit"?"on":""}">投手</b>
      <b data-pawa="def" class="${PAWA_TAB==="def"?"on":""}">守備</b>
    </span>
  </div>`;
}
/**
 * 枠に収まる字の大きさ。
 *
 * <p>枠の幅は決まっているので、字数が増えたらそのぶん小さくする。
 * 4 字までは 25px、それより長い 1 字につき 1px ずつ詰める。
 *
 * @param text 入れる字
 * @param room この字数までは大きいまま
 */
function fitFont(text, room){
  const n=[...String(text)].length;
  const keep=room || 4;
  if(n<=keep) return 25;
  return Math.max(12, 25 - (n-keep));
}

/**
 * 右上の基礎能力。
 *
 * <p>末尾の 1 文字を段位として読み、B 以上は青、F 以下は赤にする。
 */
function basicRow(items){
  return `<div class="basics">${items.map(text => {
    const whole=String(text).trim();
    const letter=whole.slice(-1);
    const name=whole.slice(0, -1).trim();
    const tone="SAB".indexOf(letter)>=0 ? " good"
      : "FG".indexOf(letter)>=0 ? " bad" : "";
    return `<span class="basic${tone}">`
      + `<i style="font-size:${fitFont(name, 4)}px">${esc(name)}</i>`
      + `<b>${esc(letter)}</b></span>`;
  }).join("")}</div>`;
}
/**
 * 特殊能力。ゲームと同じように空き枠も並べる。
 *
 * @param slots 最低これだけの枠を出す
 */
function skillGrid(skills, slots){
  // 水=低い能力 青=高い能力 赤=悪い能力 緑=個性的
  const tone=k => k.bad ? "bad" : k.green ? "green" : k.low ? "low" : "good";
  const cells=skills.map(k=>
    `<span class="skill ${tone(k)}" style="font-size:${fitFont(k.name, 4)-1}px">`
    + `${esc(k.name)}</span>`);
  const least=slots || 8;
  while(cells.length<least || cells.length%4!==0){
    cells.push('<span class="skill empty">&nbsp;</span>');
  }
  return `<div class="skills">${cells.join("")}</div>`;
}

/* ------------------------------------------------------------ 打者の能力 */
function batterAbility(name){
  const pa=plateOf(name,"bat"), ps=pitchOf(name,"bat");
  const L=line(pa), S=summarize(ps);
  const has=pa.length>0, hasPitch=ps.length>0;

  // 投球の記録の多さと、当たった打球の数。少ないほど軽く見る
  const wPitch=hasPitch ? weightOf(ps.length, 60) : 0;
  const wBip=S.n ? weightOf(S.n, 20) : 0;
  // 長打の割合。弾道とパワーの両方で使う。
  const xbh=L.ab ? (L.d2+L.d3+L.hr)/L.ab : null;
  // 弾道。打球角度の平均と長打の多さから 1〜4。
  //
  // 角度だけで決めていたころは、打球の記録がある数人しか 3 以上にならなかった。
  // 長打を打てているかも見て、記録が無い選手にも弾道が付くようにする。
  const avgAngle=S.n>=3
    ? S.bip.reduce((n,r)=>n+Number(r.launch_angle),0)/S.n : null;
  const lift=blend([
    [avgAngle===null?null:ability(avgAngle, 2, 26), 1.0*Math.max(wBip, 0.3)],
    [xbh===null?null:ability(xbh, 0.00, 0.30), 1.0]
  ]);
  // 1 は「明らかに叩きつける打者」だけ。打球の記録が無い人は 2 のまま。
  const trajectory = (avgAngle !== null && avgAngle < 6) ? 1
    : lift>=85 ? 4 : lift>=58 ? 3 : 2;
  // ミート。打率・三振率・空振り率・xBA・弱い打球の少なさ。
  const meet=blend([
    [has ? ability(L.avg, 0.120, 0.480) : null, 1.4],
    [has ? ability(L.kRate, 60, 10) : null, 1.0],
    [hasPitch ? ability(S.whiff, 48, 14) : null, 0.8*wPitch],
    [hasPitch ? ability(S.xba, 0.150, 0.480) : null, 1.0*wBip],
    [hasPitch ? ability(weakRate(S), 60, 18) : null, 0.6*wBip]
  ]);
  // パワー。長打・打球速度・xSLG。
  const power=blend([
    [has ? ability(xbh, 0.00, 0.35) : null, 1.0],
    [hasPitch ? ability(S.ev, 138, 190) : null, 1.2*wBip],
    [hasPitch ? ability(S.xslg, 0.200, 0.900) : null, 1.0*wBip]
  ]);
  // 規定打席に届かないうちは、上も下も真ん中へ寄せる。
  // ただし本塁打を打った選手のパワーは B より下げない。
  // 柵を越えせる時点でその力はあるので、打席が少なくても引き下げない。
  const settled=steady(power, L.pa, QUAL_PA);
  return {L, S, trajectory,
          meet:steady(meet, L.pa, QUAL_PA),
          power:L.hr>=1 ? Math.max(settled, 70) : settled,
          pa, ps};
}
/** 加重平均。値の無いものは飛ばす。全部無ければ 55。 */
function blend(pairs){
  let sum=0, weight=0;
  pairs.forEach(([value,w])=>{
    if(value===null||value===undefined||!isFinite(value)) return;
    sum+=value*w; weight+=w;
  });
  return weight ? Math.round(sum/weight) : ABILITY_DEFAULT;
}
/** 弱い打球の割合(%)。 */
function weakRate(S){
  if(!S.n) return null;
  const weak=S.bip.filter(r=>Number(r.exit_velocity)<153).length;
  return 100*weak/S.n;
}

/**
 * 守備と走塁の能力。パワプロ側で使う。
 *
 * <p>記録が少ないうちは {@link steady} で真ん中へ寄せる。
 * 守備機会は打席よりずっと少ないので、5 機会を規定とする。
 */
const QUAL_CHANCE=5;

/**
 * 内野安打の割合。打球が内野で止まったのに間に合った安打。
 *
 * <p>ゴロ(打球角 10 度未満)で、本塁から 40m 以内に落ちた単打を数える。
 * 打球の強さではなく足でもぎ取った安打なので、走力の裏付けになる。
 *
 * @return 決着した打席に対する割合(%)。打席の記録が無ければ null
 */
function infieldHitRate(name){
  const rows=pitchOf(name,"bat").filter(r=>r.result);
  if(rows.length<4) return null;
  const hits=rows.filter(r=>{
    if(r.result!=="SINGLE") return false;
    const la=Number(r.launch_angle), d=distanceOf(r);
    return isFinite(la) && la<10 && isFinite(d) && d>0 && d<=40;
  }).length;
  return 100*hits/rows.length;
}

/**
 * 走りの速さの元になる値。
 * 余分に進めた割合、ダッシュを使った割合、内野安打の割合から。
 *
 * <p>この値そのものは能力にしない。リーグの中で何番目かを見るのに使う。
 */
function runRaw(name){
  const B=baserunLine(playOf(name,"run"));
  if(!B.plays) return null;
  const infield=infieldHitRate(name);
  return blend([
    [B.extraRate===null?null:ability(B.extraRate, 10, 120), 1.2],
    [B.sprint===null?null:ability(B.sprint*100, 0, 60), 0.6],
    [infield===null?null:ability(infield, 0, 25), 0.8]
  ]);
}

/** 走力の目安を覚えておく。読み込んだ記録が変われば作り直す。 */
let SPEED_TABLE=null;

/** 走塁の記録がある人を速い順に並べた表。 */
function speedTable(){
  const key=DATA.play.length;
  if(SPEED_TABLE && SPEED_TABLE.key===key) return SPEED_TABLE;
  const list=[];
  new Set(DATA.play.map(r=>r.player)).forEach(n=>{
    if(!n) return;
    const B=baserunLine(playOf(n,"run"));
    // 数回しか走っていない人は目盛りを作る側には入れない
    if(B.plays<3) return;
    const raw=runRaw(n);
    if(raw!==null) list.push({name:n, raw});
  });
  list.sort((a,b)=>a.raw-b.raw);
  SPEED_TABLE={key, list};
  return SPEED_TABLE;
}

/**
 * 走力。リーグの中で何番目に速いかで決める。
 *
 * <p>一番速い人が 81、真ん中が 58、一番遅い人が 30 あたり。
 * 走塁の記録が少ない人は {@link steady} で真ん中へ寄る。
 */
function speedFromRank(name){
  const raw=runRaw(name);
  if(raw===null) return ABILITY_DEFAULT;
  const list=speedTable().list;
  if(list.length<3) return Math.round(raw);
  // 自分より遅い人が何人いるか。同じ値なら半分として数える。
  let below=0;
  list.forEach(one=>{
    if(one.raw<raw) below++;
    else if(one.raw===raw) below+=0.5;
  });
  const place=below/list.length;
  return Math.round(30+56*place);
}

function gloveAbility(name){
  const F=fieldingLine(playOf(name,"field"));
  const B=baserunLine(playOf(name,"run"));
  const per=(value, n) => value===null||!n ? null : value/n;
  // 記録が無い項目は 55(並)。打撃と同じ扱いにする。
  // 走力はリーグの中での順位で決める。値そのものを目盛りに当てると、
  // ずば抜けた 1 人だけが上に張り付いて、あとは全員が真ん中で固まってしまう。
  const speed=B.plays
    ? steady(speedFromRank(name), B.plays, QUAL_CHANCE)
    : ABILITY_DEFAULT;
  // 肩力。送球の速さそのもの。
  const arm=F.arm===null ? ABILITY_DEFAULT
    : steady(ability(F.arm, 95, 145), F.throws, QUAL_CHANCE);
  // 守備力。その難しさなら処理できて当たり前という割合を、どれだけ上回ったか。
  // 割合そのものを段の期待値へ寄せてあるので、機会が少ない人は真ん中に来る。
  const wide=fieldBase();
  const glove=F.chances
    ? ability(rangeLift(F.reachRate - F.expected/F.chances), -0.30, 0.30)
    : ABILITY_DEFAULT;
  // 捕球。落球の少なさ。外野のノーバウンド落球は 3 つぶんとして数えてある。
  const hands=F.touches
    ? ability(F.dropRate, wide.all.touchDrop*2.6+0.05, 0)
    : ABILITY_DEFAULT;
  // 送球(コントロール)。悪送球の少なさ。送球の数も少ないので平均へ寄せる。
  const control=F.throws
    ? ability(blendRate(F.throws-F.errors, F.throws, 0.85, 6)*100, 60, 100)
    : ABILITY_DEFAULT;
  // 走塁。走塁の値打ち。
  const baserun=B.plays
    ? steady(ability(per(B.runs,B.plays), -0.20, 0.25), B.plays, QUAL_CHANCE)
    : ABILITY_DEFAULT;
  return {F, B, speed, arm, glove, hands, control, baserun};
}

/** 打者の特殊能力。 */
function batterSkills(name, A){
  const basics=[], skills=[];
  // チャンス。得点圏とそれ以外の wRC+ を比べる。
  basics.push("チャンス " + basicRank(clutchSplit(name)));
  // 対左投手。左投げ相手の wRC+ を、いつもの wRC+ と比べる。
  basics.push("対左投手 " + basicRank(vsLeftSplit(name)));
  // 回復は試合に出た割合、ケガしにくさはイベントに顔を出した割合から。
  basics.push("回復 " + basicRank(recoveryOf(name)));
  basics.push("ケガしにくさ " + basicRank(toughnessOf(name)));
  // 盗塁は記録の取りようが無いので並で置く
  basics.push("盗塁 D");
  const G=gloveAbility(name);
  basics.push("走塁 " + basicRank(G.baserun));
  basics.push("送球 " + basicRank(G.control));

  if(A.L.hr>=1) skills.push({name:"パワーヒッター"});
  if(A.L.avg!==null && A.L.avg>=0.400) skills.push({name:"アベレージヒッター"});
  const spray=sprayLean(A.S, name);
  if(spray==="oppo") skills.push({name:"広角打法"});
  if(spray==="pull") skills.push({name:"引っ張り"});
  // 選球眼は個性寄りなので緑
  if(A.L.bbRate!==null && A.L.bbRate>=12) skills.push({name:"選球眼", green:true});
  if(A.L.kRate!==null && A.L.kRate>=35) skills.push({name:"三振", bad:true});
  return {basics, skills};
}
/** 得点圏とそれ以外の wRC+ の差から、チャンスの強さを 1〜100 で返す。 */
/**
 * 対左投手。左投げ相手の打撃が、いつもよりどれだけ良いか。
 *
 * <p>1 球ごとの記録に入っている投手の投げ手(throws)で、打席を振り分ける。
 * 左投げとの打席が少ないうちは並(55)へ寄せる。
 */
function vsLeftSplit(name){
  const ended=pitchOf(name,"bat").filter(r=>r.result);
  const left=ended.filter(r=>String(r.throws||"").toUpperCase()==="L");
  if(left.length<4 || ended.length<8) return ABILITY_DEFAULT;
  const all=wrcPlus(line(ended)), vs=wrcPlus(line(left));
  if(all===null || vs===null) return ABILITY_DEFAULT;
  return steady(ability(vs-all, -60, 60), left.length, 12);
}

/**
 * 試合に出た割合。全試合のうち何試合に出たか。
 *
 * <p>「回復」の元にする。休まず出られる人は回復が早い、という見立て。
 */
function playRate(name){
  const mine=new Set();
  DATA.plate.forEach(r=>{
    if(r.batter===name || r.pitcher===name) mine.add(String(r.game_id));
  });
  if(!mine.size) return null;
  // 初めて出た試合より前は数えない。後から入ってきた人が
  // それだけで低くならないようにする。
  const first=[...mine].sort()[0];
  const since=gameIds().filter(g=>g>=first);
  return since.length ? mine.size/since.length : null;
}

/**
 * イベントに出た割合。開催日のうち何日に顔を出したか。
 *
 * <p>「ケガしにくさ」の元にする。同じ日に 2 試合あっても、
 * どちらかに出ていればその日は出たものとして数える。
 * 試合 ID の頭 8 桁(年月日)で日を見る。
 */
function eventRate(name){
  const mine=new Set();
  DATA.plate.forEach(r=>{
    if(r.batter===name || r.pitcher===name) mine.add(String(r.game_id).slice(0,8));
  });
  if(!mine.size) return null;
  // 初めて顔を出した日より前は数えない
  const first=[...mine].sort()[0];
  const days=[...new Set(gameIds().map(g=>String(g).slice(0,8)))].filter(d=>d>=first);
  return days.length ? mine.size/days.length : null;
}

/** 回復。全試合に出ていれば B(75)。 */
function recoveryOf(name){
  const rate=playRate(name);
  return rate===null ? ABILITY_DEFAULT : Math.round(20+55*rate);
}

/** ケガしにくさ。全開催日に顔を出していれば C(65)。 */
function toughnessOf(name){
  const rate=eventRate(name);
  return rate===null ? ABILITY_DEFAULT : Math.round(20+45*rate);
}

function clutchSplit(name){
  const rows=plateOf(name,"bat");
  const scoring=rows.filter(r=>r.base2===true||r.base3===true);
  const rest=rows.filter(r=>!(r.base2===true||r.base3===true));
  if(scoring.length<3||rest.length<3) return ABILITY_DEFAULT;
  const a=wrcPlus(line(scoring)), b=wrcPlus(line(rest));
  if(a===null||b===null) return ABILITY_DEFAULT;
  return ability(a-b, -60, 60);
}
function letterOf(value){
  return " "+rank(value);
}
/**
 * 引っ張りか広角か。
 *
 * <p>強い打球(153km/h 以上)がどちら側に多いかで見る。
 * 右打席なら三塁側が引っ張り、左打席なら一塁側。
 */
function sprayLean(S, name){
  const hard=S.bip.filter(r=>Number(r.exit_velocity)>=153 && isFinite(Number(r.spray_angle)));
  if(hard.length<5) return "";
  const right=String(stanceOf(name)||"R").toUpperCase()!=="L";
  const pull=hard.filter(r=>{
    const a=Number(r.spray_angle);
    return right ? a<-8 : a>8;
  }).length;
  const oppo=hard.filter(r=>{
    const a=Number(r.spray_angle);
    return right ? a>8 : a<-8;
  }).length;
  if(pull>=hard.length*0.5 && pull>oppo*1.6) return "pull";
  if(oppo>=hard.length*0.32 && oppo>=pull*0.8) return "oppo";
  return "";
}
/**
 * その投手の投げる手。1 球ごとの記録の throws を数えて多いほうを採る。
 *
 * <p>守備と走塁の記録(throwHand)にも入っているので、投球の記録が無い人は
 * そちらから引く。どちらも無ければ空。
 *
 * @return "R" 右投げ / "L" 左投げ / "" 記録なし
 */
function throwHandOf(name){
  let right=0, left=0;
  DATA.pitch.forEach(r=>{
    if(r.pitcher!==name) return;
    const h=String(r.throws||"").toUpperCase();
    if(h==="R") right++; else if(h==="L") left++;
  });
  DATA.play.forEach(r=>{
    if(r.player!==name) return;
    const h=String(r.throwhand||"").toUpperCase();
    if(h==="R") right++; else if(h==="L") left++;
  });
  if(!right && !left) return "";
  return right>=left ? "R" : "L";
}

/**
 * 「右投左打」のような書き方。
 *
 * @param fill 記録が無いときに右投右打として出すか
 */
function handsText(name, fill){
  const t=throwHandOf(name), b=stanceOf(name);
  const throwText = t==="L" ? "左投" : t==="R" ? "右投" : (fill ? "右投" : "");
  const batText = b==="L" ? "左打" : b==="R" ? "右打" : b==="S" ? "両打"
    : (fill ? "右打" : "");
  return (throwText+batText) || "—";
}

/**
 * その打者の打席の左右。1 球ごとの記録に入っている stance を数える。
 *
 * <p>1 行目だけを見ると、たまたま記録が欠けていたり、
 * 打席を変えた 1 打席だけを拾ったりする。多いほうを採る。
 * 少ないほうもそれなりにあれば両打ちとして S。
 *
 * @return "R" 右打ち / "L" 左打ち / "S" 両打ち / "" 記録なし
 */
function stanceOf(name){
  let right=0, left=0;
  DATA.pitch.forEach(r=>{
    if(r.batter!==name) return;
    const s=String(r.stance||"").toUpperCase();
    if(s==="R") right++;
    else if(s==="L") left++;
  });
  if(!right && !left) return "";
  const few=Math.min(right,left), many=Math.max(right,left);
  if(few>=5 && few>=many*0.25) return "S";
  return right>=left ? "R" : "L";
}

/**
 * 守備位置ごとの守備力。
 *
 * <p>守ったことのある位置だけ数字を出す。守った回数が少ない位置は、
 * その分だけ 55(並)へ寄せる。ゲームの「守備適性」と同じ見え方にする。
 */
function positionSkill(name, glove, position){
  const one=aptitude(name).find(a=>a.position===position);
  if(!one) return null;
  return steady(glove, one.n, QUAL_CHANCE);
}

/**
 * 守備位置の図。扇形の球場に、守った位置だけ段位と数字を置く。
 *
 * <p>場所は実際の守備位置に合わせてある。x は左右(-1〜1)、y は奥行き(0〜1)。
 */
const FIELD_SPOT={
  PITCHER:[0, 0.34], CATCHER:[0, -0.02],
  FIRST_BASEMAN:[0.52, 0.46], SECOND_BASEMAN:[0.30, 0.63],
  THIRD_BASEMAN:[-0.52, 0.46], SHORTSTOP:[-0.30, 0.63],
  LEFT_FIELDER:[-0.62, 0.88], CENTER_FIELDER:[0, 0.99], RIGHT_FIELDER:[0.62, 0.88]
};

/**
 * 守備の段。1 段に 2 つずつ、4 段で 8 枠。
 *
 * <pre>
 *   守備      投 −
 *   捕 −      一 C55
 *   二 −      三 D55
 *   遊 C65    外 D54
 * </pre>
 *
 * <p>外野は左中右をまとめて「外」1 つにする。
 * 守ったことのない位置は「−」。投手は一律 D55。
 */
const DEFENCE_SLOTS=[
  ["投", ["PITCHER"]], ["捕", ["CATCHER"]],
  ["一", ["FIRST_BASEMAN"]], ["二", ["SECOND_BASEMAN"]],
  ["三", ["THIRD_BASEMAN"]], ["遊", ["SHORTSTOP"]],
  ["外", ["LEFT_FIELDER","CENTER_FIELDER","RIGHT_FIELDER"]]
];

function defenceRows(name, G){
  const cell=(label, spots)=>{
    if(!spots){
      // 見出しの枠。ほかの段の名前と同じ見た目にする。
      return `<span class="half head">${label}</span>`;
    }
    // 外野はまとめて数える。どこかを守っていればその合計で見る。
    const list=aptitude(name);
    const chances=spots.reduce((n,at)=>{
      const one=list.find(a=>a.position===at);
      return n + (one ? one.n : 0);
    }, 0);
    if(!chances) return `<span class="half none"><i>${label}</i><b>−</b></span>`;
    const value=steady(G.glove, chances, QUAL_CHANCE);
    const r=rank(value);
    return `<span class="half"><i>${label}</i>
      <b style="color:${RANK_COLOR[r]}">${r}</b><u>${value}</u></span>`;
  };
  const order=[["守備",null], ...DEFENCE_SLOTS];
  let out="";
  for(let i=0;i<order.length;i+=2){
    out+=`<div class="abrow dual">${cell(order[i][0], order[i][1])}`
       + `${cell(order[i+1][0], order[i+1][1])}</div>`;
  }
  return out;
}

function fieldMap(name, G){
  const W=300, H=238, cx=W/2, cy=H-26, reach=H-52;
  const at=(x,y)=>[cx + x*reach*0.78, cy - y*reach];
  // 扇形の外枠
  const [lx,ly]=at(-1, 1), [rx,ry]=at(1, 1);
  let g=`<path d="M${cx} ${cy} L${lx.toFixed(1)} ${ly.toFixed(1)}
      A ${reach.toFixed(1)} ${reach.toFixed(1)} 0 0 1 ${rx.toFixed(1)} ${ry.toFixed(1)} Z"
      fill="#eaf4fd" stroke="#a9c9e4" stroke-width="1.5"/>`;
  // 内野のひし形
  const d=[[0,0],[0.30,0.30],[0,0.60],[-0.30,0.30]].map(v=>at(v[0],v[1]));
  g+=`<path d="M${d.map(q=>q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" L")} Z"
      fill="#fff7e3" stroke="#e8c07a" stroke-width="1.4"/>`;
  Object.keys(FIELD_SPOT).forEach(pos=>{
    const value=positionSkill(name, G.glove, pos);
    const [x,y]=at(FIELD_SPOT[pos][0], FIELD_SPOT[pos][1]);
    const on=value!==null;
    const r=on ? rank(value) : "";
    g+=`<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})">
      <rect x="-26" y="-13" width="52" height="26" rx="6"
        fill="${on ? "#fff" : "rgba(255,255,255,.55)"}"
        stroke="${on ? "#1d6fb8" : "#bcd6ea"}" stroke-width="${on ? 1.6 : 1}"/>
      <text x="-17" y="5" font-size="13" font-weight="800"
        fill="${on ? "#3d7ea8" : "#b9c4cc"}">${POS_LABEL[pos]}</text>
      <text x="-2" y="5" font-size="13" font-weight="800"
        fill="${on ? RANK_COLOR[r] : "#b9c4cc"}">${on ? r : "—"}</text>
      <text x="22" y="5" font-size="13" font-weight="800" text-anchor="end"
        font-family="Barlow Condensed,sans-serif"
        fill="${on ? "#13395f" : "#b9c4cc"}">${on ? value : ""}</text>
    </g>`;
  });
  return `<svg class="fieldmap" viewBox="0 0 ${W} ${H}" role="img"
    aria-label="守備位置">${g}</svg>`;
}

/** 守備位置ごとの数字。守ったことのない位置は「—」。 */
function positionGrid(name, G){
  const cells=Object.keys(POS_LABEL).map(at=>{
    const value=positionSkill(name, G.glove, at);
    const r=value===null ? "" : rank(value);
    return `<span class="pos${value===null?" none":""}">
      <i>${POS_LABEL[at]}</i>
      <b style="color:${value===null?"inherit":RANK_COLOR[r]}">${value===null?"—":r}</b>
      <u>${value===null?"—":value}</u></span>`;
  }).join("");
  return `<div class="posgrid">${cells}</div>`;
}

/**
 * プレースタイル。緑の札で出す。
 *
 * <p>成績そのものではなく「どういう打ち方・守り方をする人か」。
 * 数字に出ない持ち味を言葉にする。
 */
function playStyles(name){
  const out=[];
  // ---- 打撃
  const bp=pitchOf(name,"bat"), B=summarize(bp);
  const swing=B.pitches ? 100*B.swings/B.pitches : null;
  const first=bp.filter(r=>Number(r.pitch_no)===1);
  const firstSwing=first.length ? 100*first.filter(r=>r.swing===true).length/first.length : null;
  const bl=line(plateOf(name,"bat"));
  if(swing!==null && B.pitches>=25 && swing>=58) out.push("積極打法");
  if(swing!==null && B.pitches>=25 && swing<=45) out.push("慎重打法");
  if(firstSwing!==null && first.length>=8 && firstSwing>=60) out.push("初球から");
  if(firstSwing!==null && first.length>=8 && firstSwing<=35) out.push("初球は見る");
  if(B.n>=4 && B.hard!==null && B.hard>=60) out.push("強振多用");
  else if(B.n>=4 && B.whiff!==null && B.whiff<=45) out.push("ミート多用");
  if(bl.bbRate!==null && bl.bbRate>=12) out.push("四球選び");
  // ---- 投球
  const pp=pitchOf(name,"pit"), P=summarize(pp);
  if(pp.length>=20){
    const pl=pitcherLine(plateOf(name,"pit"));
    if(pl.kRate!==null && pl.kRate>=30) out.push("奪三振");
    if(P.gb!==null && P.gb>=45 && (pl.kRate===null||pl.kRate<25)) out.push("打たせて取る");
    if(pl.bbRate!==null && pl.bbRate<=5) out.push("制球重視");
    if(P.chase!==null && P.chase>=60) out.push("誘い球");
    const kinds=new Set(pp.map(r=>String(r.type||"")).filter(Boolean));
    if(kinds.size>=4) out.push("球種豊富");
    else if(kinds.size<=2 && pp.length>=40) out.push("力押し");
  }
  // ---- 走塁
  const R=baserunLine(playOf(name,"run"));
  if(R.plays>=8 && R.extraRate!==null && R.extraRate>=45) out.push("積極走塁");
  if(R.plays>=8 && R.extraRate!==null && R.extraRate<=12) out.push("慎重走塁");
  // ---- 守備
  const F=playOf(name,"field");
  const dived=F.filter(r=>r.dived===true).length;
  if(F.length>=8 && dived>=Math.max(2, F.length*0.12)) out.push("積極守備");
  const spots=aptitude(name).filter(a=>a.n>=3).length;
  if(spots>=3) out.push("守備職人");
  return out.slice(0,12);
}

/** プレースタイルの枠。緑の札を 1 列 4 つで並べる。 */
function stylePanel(name){
  const list=playStyles(name);
  const cells=list.map(text=>
    `<span class="style" style="font-size:${fitFont(text,5)-2}px">${esc(text)}</span>`);
  while(cells.length<12 || cells.length%4!==0){
    cells.push('<span class="style empty">&nbsp;</span>');
  }
  return `<div class="dhead">プレースタイル</div>
    <div class="styles">${cells.join("")}</div>`;
}

/**
 * 守備の面。走力と肩力、守備位置ごとの守備力、最後に捕球。
 *
 * <p>投手を守ったことがある人の「投」は一律 D55。
 * 投手の守備は打球が飛んでくる回数が少なく、記録から測っても
 * たまたまの 1 球で大きく振れてしまうため。
 */
function pawaDefence(){
  const G=gloveAbility(PLAYER);
  const A=batterAbility(PLAYER);
  const L=A.L;
  return `<section class="span"><div class="pad">
    <div class="pawa">
      ${pawaHead(PLAYER, L.pa + "打席",
        `率 ${f3(L.avg)}　${L.hr}本${L.rbi}点　<b>投打</b>${handsText(PLAYER)}`)}
      <div class="abwrap">
        <div class="card ab">
          ${abrow("走力", G.speed)}
          ${abrow("肩力", G.arm)}
          ${defenceRows(PLAYER, G)}
          ${abrow("捕球", G.hands)}
        </div>
        <div class="card ab" style="gap:6px">${stylePanel(PLAYER)}</div>
      </div>
    </div>
  </div></section>`;
}

function pawaBatter(){
  const A=batterAbility(PLAYER);
  const skills=batterSkills(PLAYER, A);
  const G=gloveAbility(PLAYER);
  const L=A.L;
  const arrow=trajectoryArrow(A.trajectory);
  const hand=handsText(PLAYER);
  return `<section class="span"><div class="pad">
    <div class="pawa">
      ${pawaHead(PLAYER, L.pa + "打席",
        `率 ${f3(L.avg)}　${L.hr}本${L.rbi}点　<b>投打</b>${hand}`)}
      <div class="abwrap">
        <div class="card ab">
          ${abplain("弾道", A.trajectory, arrow)}
          ${abrow("ミート", A.meet)}
          ${abrow("パワー", A.power)}
          ${abrow("走力", G.speed)}
          ${abrow("肩力", G.arm)}
          ${abrow("守備力", G.glove)}
          ${abrow("捕球", G.hands)}
        </div>
        <div class="card ab" style="gap:6px">
          ${basicRow(skills.basics)}
          ${skillGrid(skills.skills, 12)}
        </div>
      </div>
    </div>
  </div></section>`;
}

/* ------------------------------------------------------------ 打者 */

    ["K %","三振率","k",L.kRate,pc],

  ];
  const std=[

/**
 * record から打席の一覧を作る。
 *
 * <p>打席の最後の 1 球にだけ結果が入っているので、その行を並べる。
 * 打球のデータはその 1 球のもの。四球や三振の行は打球の欄が空になる。
 *
 * @param other 相手の名前を引く列。打者なら pitcher、投手なら batter
 */
/**
 * 打席の一覧に使う行を作る。
 *
 * <p>record(1 球ごと)に残っている打席を土台にして、
 * result にしか無い打席を足す。投球の記録を取っていない試合でも
 * 打席の並びが出るようにするため。
 *
 * @param rows  その選手の record の行
 * @param plate その選手の result の行
 * @param other 相手を引く列。打者のページなら pitcher
 */
function paRows(rows, plate, other){
  const ended=rows.filter(r=>r.result);
  // record にある打席を、試合と回と結果で数えておく
  const seen=new Map();
  ended.forEach(r=>{
    const key=[r.game, r.inning, r.half, r.result].join("|");
    seen.set(key, (seen.get(key)||0)+1);
  });
  const extra=[];
  (plate||[]).forEach(r=>{
    const half=String(r.half||"").toUpperCase().startsWith("B") ? "BOTTOM" : "TOP";
    const key=[r.game_id, r.inning, half, r.result].join("|");
    const left=seen.get(key)||0;
    if(left>0){ seen.set(key, left-1); return; }
    // record に無い打席。打球の数字は残っていないので、結果だけ並べる。
    extra.push({game:r.game_id, inning:r.inning, half:half, result:r.result,
      pitcher:r.pitcher, batter:r.batter, fromResult:true});
  });
  const all=ended.concat(extra);
  // 試合と回の順に並べ、新しい打席を上にする
  all.sort((a,b)=>{
    const g=String(a.game).localeCompare(String(b.game));
    if(g) return g;
    const ia=Number(a.inning)||0, ib=Number(b.inning)||0;
    if(ia!==ib) return ia-ib;
    const ha=a.half==="BOTTOM" ? 1 : 0, hb=b.half==="BOTTOM" ? 1 : 0;
    return ha-hb;
  });
  return all.reverse();
}

function paTable(rows, other, plate){
  // 新しい打席を上に
  const ended=paRows(rows, plate, other);
  if(!ended.length) return '<div class="empty">打席の記録がありません</div>';
  return `<div class="palist"><table class="pafix">
    <colgroup><col class="c-game"><col class="c-name"><col class="c-res">
      <col class="c-num"><col class="c-num"><col class="c-wpt">
      <col class="c-num"><col class="c-num"><col class="c-num">
      <col class="c-flag"><col class="c-num"><col class="c-num"></colgroup>
    <thead><tr>
      <th>試合</th><th>${other==="pitcher"?"投手":"打者"}</th><th>結果</th>
      <th>アウト</th><th>打点</th><th>勝利pt</th>
      <th>初速</th><th>角度</th><th>距離</th><th>打球</th><th>xBA</th><th>HR球場</th>
    </tr></thead><tbody>
    ${ended.map(r=>{
      const ev=Number(r.exit_velocity), la=Number(r.launch_angle);
      // インプレーになった球だけ打球として扱う。
      // 三振や四球の行に、その前のファールの打球データが残っていることがある。
      const hit=r.contact===true && r.call==="IN_PLAY" && isFinite(ev) && ev>0;
      const kind=hit ? battedKind(ev,la) : null;
      const x=hit ? battedExpectation(ev,la).ba : null;
      // 登録してある球場のうち、この打球が柵を越える数
      const parkNames=hit ? hrParkNames(Number(r.spray_angle), distanceOf(r)) : null;
      const name=String(r[other]??"").trim();
      // 結果の行から、アウト数・打点・勝利ポイントを引く
      const plate2=plateRowOf(r);
      const rbi2=plate2 ? (Number(plate2.rbi)||0) : 0;
      return `<tr>
        <td>${esc(gameLabel(r.game))}</td>
        <td class="nm">${withFace(name,20)}</td>
        <td class="res"><span class="rtag ${resultClass(r.result)}">${esc(resultText(r.result, r))}</span></td>
        <td class="bases">${plate2 ? outMark(outsBeforeAll().get(plate2)||0) : "–"}</td>
        <td class="${rbi2?"rbi":""}">${rbi2||""}</td>
        <td class="wcell">${winPtText(plate2, {pit:other==="batter"}) || "–"}</td>
        <td>${hit?f1(ev):"–"}</td>
        <td>${hit?f1(la)+"°":"–"}</td>
        <td>${hit?f1(distanceOf(r)):"–"}</td>
        <td class="${kind==="バレル"?"yes":""}">${kind||"–"}</td>
        <td>${x===null?"–":f3(x)}</td>
        <td>${parkNames===null ? "–"
          : `<span class="hrparks" title="${esc(parkNames.length
              ? "本塁打になる球場\n" + parkNames.join("\n")
              : "どの球場でも本塁打になりません")}">${parkNames.length}/${PARKS.length}</span>`}</td>
      </tr>`;
    }).join("")}
  </tbody></table></div>`;
}

/** 打席結果の色分け。ヒット=青、四球=黄緑、三振=黄、それ以外のアウト=赤。 */
function resultClass(result){
  if(HIT.has(result)) return "r-hit";
  if(result==="WALK"||result==="HIT_BY_PITCH") return "r-walk";
  if(result==="STRIKE_OUT") return "r-k";
  return "r-out";
}

function resultTable(counts,pa){
  const order=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  if(!order.length) return '<div class="empty">記録がありません</div>';
  return `<table><thead><tr><th>結果</th><th>数</th><th>割合</th></tr></thead><tbody>
    ${order.map(([k,v])=>`<tr><td>${JA[k]||k}</td><td>${v}</td>
      <td>${pa?(100*v/pa).toFixed(1)+"%":"—"}</td></tr>`).join("")}</tbody></table>`;
}

function zoneGrid(rows){
  const cell=Array.from({length:26},()=>({ab:0,h:0,hr:0,pa:0,swings:0,whiffs:0}));
  rows.forEach(r=>{
    // 整数の枠だけ。列がずれた古い csv では小数が入ってくることがあり、
    // そのまま添え字にすると中身が無くて画面ごと落ちる。
    const z=Number(r.zone);
    if(!Number.isInteger(z) || z<1 || z>25) return;
    const c=cell[z];
    // 空振り率はその枠へ来た全部の球から。打席を終えた球だけでは足りない。
    if(r.swing===true){ c.swings++; if(r.whiff===true) c.whiffs++; }
    if(!r.result) return;
    c.pa++;
    if(!NOT_AB.has(r.result)) c.ab++;
    if(HIT.has(r.result)) c.h++;
    if(r.result==="HOME_RUN") c.hr++;
  });
  let html="";
  for(let z=1;z<=25;z++){
    const c=cell[z], avg=c.ab?c.h/c.ab:null;
    // 色はパーセンタイルの棒と同じ並び。真ん中で紫にならないよう、
    // 青 → 灰 → 赤 と 2 段に分けて混ぜる。
    const bg=c.pa===0 ? "var(--panel-2)"
      : scoreColor(Math.max(0, Math.min(100, 100*(avg??0)/0.450)));
    const whiff=c.swings ? Math.round(100*c.whiffs/c.swings) : null;
    html+=`<div class="z${ZONE_IN.has(z)?" in":""}" style="background:${bg}"
      title="ゾーン ${z} / ${c.pa} 打席 / ${c.swings} スイング ${c.whiffs} 空振り"><b>${c.ab?f3(avg):""}</b>
      <i>${(c.hr?`HR${c.hr} `:"")+(whiff===null?"":whiff+"%")}</i></div>`;
  }
  return `<div class="zone">${html}</div>`;
}

/* ---------------------------------------------------------- 投手の能力
   球速は 125km/h 固定。コントロールは与四球とストライク率、
   スタミナは 1 試合あたりの投球回。変化球は使用率の上位 4 つ。 */

/** 球種の名前から、変化の向きを引く表。 */
const BREAK_DIRECTION={
  right:["スライダー","カットボール","高速スライダー"],
  lowRight:["カーブ","スローカーブ","スラーブ","パワーカーブ","ナックルカーブ","超スローカーブ"],
  down:["フォーク","SFF","スプリット","チェンジアップ","縦スライダー"],
  lowLeft:["シンカー","高速シンカー","超高速シンカー","サークルチェンジ"],
  left:["シュート","高速シュート"],
  up:["ファストボール","ツーシーム","ライズボール","ストレート","ツーシームファスト"]
};
/** 変化量を付けない球種(速球系)。 */
const STRAIGHT=["ファストボール","ツーシーム","ライズボール","ストレート","ツーシームファスト"];

/**
 * その球種がどちらへ曲がるか。
 *
 * <p>表に無い名前は、実際に測った変化量から向きを決める。
 */
function breakDirection(name, rows){
  for(const key in BREAK_DIRECTION){
    if(BREAK_DIRECTION[key].some(x=>x===name)) return key;
  }
  const h=avgOf(rows,"h_break"), v=avgOf(rows,"v_break");
  if(h===null&&v===null) return "down";
  const hx=h||0, vy=v||0;
  if(Math.abs(hx)<0.4 && vy>0.4) return "up";
  if(Math.abs(hx)<0.4) return "down";
  if(hx>0) return vy<-0.4 ? "lowRight" : "right";
  return vy<-0.4 ? "lowLeft" : "left";
}
/** 打数に数えない結果。被打率を出すときに分母から外す。 */
const NO_AB=new Set(["WALK","HIT_BY_PITCH","SACRIFICE_FLY","SACRIFICE_BUNT"]);

function avgOf(rows, key){
  const values=rows.map(r=>Number(r[key])).filter(v=>isFinite(v));
  return values.length ? values.reduce((a,b)=>a+b,0)/values.length : null;
}

/**
 * 変化量の段階(1〜7)。その球がどれだけ打ちづらいかで決める。
 *
 * <p>曲がり幅そのものは見ない。大きく曲がっても打たれる球はあるし、
 * わずかな変化でも空振りを取れる球はある。ここでは 4 つを合わせて見る。
 *
 * <ul>
 *   <li>空振り率 … 振らせて当てさせない力。いちばん重く見る</li>
 *   <li>被打率 … その球で終わった打席の打率</li>
 *   <li>被打球の質 … 打たれたときの打球速度。速いほど捉えられている</li>
 *   <li>ストライク率 … 狙って投げられているか。ボールばかりでは使えない</li>
 * </ul>
 *
 * <p>目盛りは実測に合わせてある。空振り率 25〜70%、被打率 .600〜.200、
 * 打球速度 185〜130km/h、ストライク率 45〜85%。
 * 球数が少ないうちは真ん中(4)へ寄せる。
 *
 * <p>速球系と、上へ向かう球には付けない。
 * 落ちない球はパワプロでも変化量を持たないため。
 */
function breakAmount(name, rows, dir){
  if(STRAIGHT.some(x=>x===name)) return 0;
  if(dir==="up" || dir==="upLeft" || dir==="upRight") return 0;
  const clamp01=v => Math.max(0, Math.min(1, v));
  const parts=[];

  const swings=rows.filter(r=>r.swing===true).length;
  const whiffs=rows.filter(r=>r.whiff===true).length;
  if(swings>=3){
    parts.push([clamp01((100*whiffs/swings - 25)/45), 1.3]);
  }
  // 被打率。その球で決着した打席だけを数える。
  const ended=rows.filter(r=>r.result);
  const ab=ended.filter(r=>!NO_AB.has(r.result)).length;
  const hits=ended.filter(r=>HIT.has(r.result)).length;
  if(ab>=3){
    parts.push([clamp01((0.600 - hits/ab)/0.400), 0.9]);
  }
  // 被打球の質。打たれたときの打球速度。
  const bip=rows.filter(r=>r.contact===true && r.call==="IN_PLAY"
    && Number(r.exit_velocity)>0);
  if(bip.length>=3){
    const ev=bip.reduce((a,r)=>a+Number(r.exit_velocity),0)/bip.length;
    parts.push([clamp01((185-ev)/55), 0.8]);
  }
  // ストライク率。ボールと数えられなかった球の割合。
  if(rows.length>=6){
    const strike=100*rows.filter(r=>r.call!=="BALL").length/rows.length;
    parts.push([clamp01((strike-45)/40), 0.6]);
  }
  if(!parts.length) return 4;

  const weight=parts.reduce((a,x)=>a+x[1],0);
  const score=parts.reduce((a,x)=>a+x[0]*x[1],0)/weight;
  // 球数が少ないうちは真ん中へ寄せる。
  // 1 球種 12 球も投げれば持ち味は出るので、そこで満点の信用にする。
  const trust=Math.max(0, Math.min(1, rows.length/12));
  // 4 つを平均すると真ん中に寄りやすい。差を 1.6 倍に開いて段階を散らす。
  const spread=0.5+(score-0.5)*trust*1.6;
  const settled=Math.max(0, Math.min(1, spread));
  return Math.max(1, Math.min(7, 1+Math.round(settled*6)));
}

function pitcherAbility(name){
  const pa=plateOf(name,"pit"), ps=pitchOf(name,"pit");
  const L=pitcherLine(pa), S=summarize(ps);
  const games=new Set(pa.map(r=>String(r.game_id))).size;
  // コントロール。与四球の少なさとストライク率。
  const strikes=ps.filter(r=>r.in_zone===true).length;
  const zoneRate=ps.length ? 100*strikes/ps.length : null;
  const bb9=L.outs ? 27*L.bb/L.outs : null;
  const control=blend([
    [bb9===null?null:ability(bb9, 8.0, 0.5), 1.2],
    [zoneRate===null?null:ability(zoneRate, 30, 68), 0.8*weightOf(ps.length, 60)]
  ]);
  // スタミナ。1 試合あたりの投球回。
  const ipPerGame=games ? (L.outs/3)/games : null;
  const stamina=ipPerGame===null?ABILITY_DEFAULT:ability(ipPerGame, 0.4, 4.0);
  // 変化球。使用率の上位 4 つ。
  const types=typeUsage(ps).slice(0,4).map(t=>{
    const rows=ps.filter(r=>(r.type||"Normal")===t.name);
    const dir=breakDirection(t.name, rows);
    return {name:t.name, n:t.n, dir:dir, amount:breakAmount(t.name, rows, dir)};
  });
  // 規定投球回に届かないうちは、上も下も真ん中へ寄せる
  return {L, S, games, types, pa, ps, bb9,
          control:steady(control, L.outs, QUAL_IP*3),
          stamina:steady(stamina, L.outs, QUAL_IP*3),
          k9: L.outs ? 27*L.so/L.outs : null,
          hr9: L.outs ? 27*L.hr/L.outs : null};
}

/** 投手の特殊能力。 */
function pitcherSkills(name, A){
  const basics=[], skills=[];
  // 対ピンチ。走者が二塁以上のときとそれ以外の被 wRC+ を比べる。
  basics.push("対ピンチ " + basicRank(splitWrc(A.pa, r=>r.base2===true||r.base3===true, true)));
  // 対左打者。左打席と右打席での被 wRC+ を比べる。
  basics.push("対左打者 " + basicRank(splitByStance(name)));
  // 打たれ強さ。連打を許していないか。
  basics.push("打たれ強さ " + basicRank(noStreak(A.pa)));
  basics.push("ケガしにくさ " + basicRank(toughnessOf(name)));
  // ノビ。上へ向かう球種の空振り率。
  const rise=A.types.filter(t=>t.dir==="up").map(t=>t.name);
  const riseRows=A.ps.filter(r=>rise.includes(r.type||"Normal"));
  const riseSwings=riseRows.filter(r=>r.swing===true).length;
  const riseWhiff=riseSwings ? 100*riseRows.filter(r=>r.whiff===true).length/riseSwings : null;
  basics.push("ノビ "
    + basicRank(riseWhiff===null ? ABILITY_DEFAULT : ability(riseWhiff, 8, 38)));
  basics.push("クイック D");
  basics.push("回復 " + basicRank(recoveryOf(name)));

  if(A.k9!==null && A.k9>=10) skills.push({name:"奪三振"});
  // ゴロを打たせるのは個性寄りなので緑
  if(A.S.gb!==null && A.S.gb>=45) skills.push({name:"ゴロピッチャー", green:true});
  else if(A.S.gb!==null && A.S.gb<=22) skills.push({name:"フライボールピッチャー", green:true});
  if(A.hr9!==null && A.hr9>=1) skills.push({name:"一発", bad:true});
  if(A.bb9!==null && A.bb9>=2) skills.push({name:"四球", bad:true});
  if(slowStarter(A.pa)) skills.push({name:"スロースターター", bad:true});
  return {basics, skills};
}
/** 条件に当てはまる打席とそれ以外で、被 wRC+ を比べる。 */
function splitWrc(rows, test, lowerIsBetter){
  const a=rows.filter(test), b=rows.filter(r=>!test(r));
  if(a.length<3||b.length<3) return ABILITY_DEFAULT;
  const wa=wrcPlus(line(a)), wb=wrcPlus(line(b));
  if(wa===null||wb===null) return ABILITY_DEFAULT;
  const diff=lowerIsBetter ? wb-wa : wa-wb;
  return ability(diff, -60, 60);
}
/** 左打者と右打者での被 wRC+ を比べる。 */
function splitByStance(name){
  const stance={};
  DATA.pitch.forEach(r=>{ if(r.batter&&r.stance) stance[r.batter]=r.stance; });
  const rows=plateOf(name,"pit");
  return splitWrc(rows, r=>stance[r.batter]==="L", true);
}
/**
 * 連打を許していないか。
 *
 * <p>安打の直後の打席でまた打たれた割合を見る。低いほど粘り強い。
 */
function noStreak(rows){
  let chances=0, hits=0;
  for(let i=1;i<rows.length;i++){
    if(!HIT.has(rows[i-1].result)) continue;
    chances++;
    if(HIT.has(rows[i].result)) hits++;
  }
  if(chances<4) return ABILITY_DEFAULT;
  return ability(100*hits/chances, 70, 15);
}
/** 1 回の成績が 2 回以降より悪いか。 */
function slowStarter(rows){
  const first=rows.filter(r=>Number(r.inning)===1);
  const rest=rows.filter(r=>Number(r.inning)>1);
  if(first.length<4||rest.length<4) return false;
  const a=line(first), b=line(rest);
  return a.obp!==null && b.obp!==null && a.obp-b.obp>=0.080;
}

/**
 * 変化球を放射状の図で見せる。
 *
 * <p>中心のボールから、その向きへ変化量のぶんだけ段を積む。
 * 球種の名前は段の先に書く。
 */
function breakCompass(types, lefty){
  const W=280, H=210, cx=W/2, cy=H/2;
  // 向きごとの角度(度。0 が右、下が正)
  const DEG={up:-90, upRight:-45, right:0, lowRight:45,
             down:90, lowLeft:135, left:180, upLeft:-135};
  // 変化量の段ごとの色。外へ行くほど強い色になる
  const STEP=["#ffb03a","#ffbe4d","#ffd93d","#ffd93d","#ffa62b","#ff7a2e","#ff4d2e"];
  const TIP="#ff2d2d";
  // 同じ向きの球が重ならないように、向きごとに扇状へ散らす
  const bucket={};
  types.forEach(t=>{ (bucket[t.dir]=bucket[t.dir] || []).push(t); });
  let g="";
  Object.keys(bucket).forEach(dir=>{
    const list=bucket[dir];
    // 左投手は左右が逆に見える。図もそのまま裏返す。
    const raw=DEG[dir]===undefined ? 90 : DEG[dir];
    const base=lefty ? 180-raw : raw;
    // 2 本以上あるときは角度を広げ、名前の位置も前後へずらす
    const spread=list.length>1 ? 34 : 0;
    list.forEach((t, i)=>{
      const deg=base + (i - (list.length-1)/2) * spread;
      const rad=deg*Math.PI/180, ux=Math.cos(rad), uy=Math.sin(rad);
      for(let k=1;k<t.amount;k++){
        const x=cx+ux*(12+k*11), y=cy+uy*(12+k*11);
        g+=`<rect x="${(x-5.5).toFixed(1)}" y="${(y-5).toFixed(1)}" width="11" height="10"
            rx="1" fill="${STEP[Math.min(k, STEP.length)-1]}"
            stroke="#1d6fb8" stroke-width="1.2"
            transform="rotate(${deg.toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})"/>`;
      }
      // 先の印はホームベースと同じ五角形。段階の四角と同じ幅で、先だけ尖らせる。
      const tipAt=t.amount ? 12+t.amount*11 : 18;
      const tx=cx+ux*tipAt, ty=cy+uy*tipAt;
      g+=`<path d="M-5.5,-5 L3,-5 L8.5,0 L3,5 L-5.5,5 Z" fill="${TIP}"
          stroke="#1d6fb8" stroke-width="1.2"
          transform="translate(${tx.toFixed(1)} ${ty.toFixed(1)}) rotate(${deg.toFixed(0)})"/>`;
      // 名前。同じ向きが並ぶときは一本ごとに遠さを変えて重なりを避ける
      const reach=tipAt + 15 + (list.length>1 ? (i%2)*15 : 0);
      const lx=cx+ux*reach, ly=cy+uy*reach+4;
      const anchor=ux>0.25 ? "start" : ux<-0.25 ? "end" : "middle";
      g+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${anchor}"
          font-size="9.5" font-weight="700" fill="#1d6fb8">${esc(t.name)}</text>`;
    });
  });
  g+=`<circle cx="${cx}" cy="${cy}" r="12" fill="#fff" stroke="#e02020" stroke-width="2.4"/>
      <path d="M${cx-7} ${cy-8.5} A 14 14 0 0 1 ${cx-7} ${cy+8.5}
        M${cx+7} ${cy-8.5} A 14 14 0 0 0 ${cx+7} ${cy+8.5}"
        fill="none" stroke="#e02020" stroke-width="1.6"/>`;
  if(!types.length){
    g+=`<text x="${cx}" y="${cy+36}" text-anchor="middle" font-size="11"
        fill="#8aa7bd">変化球の記録がありません</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;flex:1 1 0;height:0;
      min-height:0;display:block;margin-top:6px;overflow:visible"
      role="img" aria-label="変化球">${g}</svg>`;
}

/** 変化球の向きを 3×3 の升目で見せる。 */
function breakGrid(types){
  const at={upLeft:"",up:"",upRight:"",left:"",mid:"",right:"",
            lowLeft:"",down:"",lowRight:""};
  types.forEach(t=>{
    if(t.amount<=0) return;
    at[t.dir]=Math.max(Number(at[t.dir])||0, t.amount);
  });
  const cell=key=>`<div class="${at[key]?"on":""}">${at[key]||""}</div>`;
  return `<div class="breaks">
    ${cell("upLeft")}${cell("up")}${cell("upRight")}
    ${cell("left")}<div class="mid">球</div>${cell("right")}
    ${cell("lowLeft")}${cell("down")}${cell("lowRight")}
  </div>`;
}

function typeUsage(rows){
  const map={};
  rows.forEach(r=>{
    const t=r.type||"Normal";
    const o=map[t]||(map[t]={name:t,n:0,ev:0,swings:0,whiffs:0,zones:Array(26).fill(0)});
    o.n++; o.ev+=Number(r.velocity)||0;
    if(r.swing===true) o.swings++;
    if(r.whiff===true) o.whiffs++;
    const z=Number(r.zone); if(z>=1&&z<=25) o.zones[z]++;
  });
  return Object.values(map).sort((a,b)=>b.n-a.n).map(o=>({...o, ev:o.ev/o.n}));
}
/**
 * 本塁の面を通った位置が分かっている球。
 *
 * <p>打たれた球はバットに当たった時点で消えるので、
 * 面まで届かず位置が取れないものがある。それは 0,0 で残っている。
 */
function located(rows){
  return rows.filter(r=>{
    const x=Number(r.plate_x), y=Number(r.plate_y);
    return isFinite(x) && isFinite(y) && (x!==0 || y!==0);
  });
}
/**
 * 投球の位置を 1 球ずつ点で打つ。
 *
 * <p>5×5 のゾーンに丸めず、記録してある plate_x / plate_y をそのまま使う。
 * ゾーンの箱は config の Strike_Zone_* と同じ寸法で描いている。
 */
function drawLoc(){
  const svg=document.getElementById("loc"); if(!svg) return;
  const rows=located(pitchOf(PLAYER,"pit"));
  // ストライクゾーンの箱(config の既定値)
  const ZW=0.6, ZB=0.5, ZT=1.7;
  const cx=125, cy=150;                      // 本塁の中心
  const scale=76;                            // 1m あたりの点数
  const X=x=>cx+x*scale, Y=y=>cy-(y-(ZB+ZT)/2)*scale;
  const box={l:X(-ZW), r:X(ZW), t:Y(ZT), b:Y(ZB)};
  let g="";
  // ゾーンの外側の目安(ボール 1 個ぶん外)
  g+=`<rect x="${(box.l-14).toFixed(1)}" y="${(box.t-14).toFixed(1)}"
      width="${(box.r-box.l+28).toFixed(1)}" height="${(box.b-box.t+28).toFixed(1)}"
      fill="none" stroke="var(--line)" stroke-dasharray="3 4"/>`;
  g+=`<rect x="${box.l.toFixed(1)}" y="${box.t.toFixed(1)}"
      width="${(box.r-box.l).toFixed(1)}" height="${(box.b-box.t).toFixed(1)}"
      fill="var(--panel-2)" stroke="var(--text)" stroke-width="1.6"/>`;
  // 3 分割の薄い線
  for(let i=1;i<3;i++){
    const x=box.l+(box.r-box.l)*i/3, y=box.t+(box.b-box.t)*i/3;
    g+=`<line x1="${x.toFixed(1)}" y1="${box.t}" x2="${x.toFixed(1)}" y2="${box.b}"
        stroke="var(--line)"/>`;
    g+=`<line x1="${box.l}" y1="${y.toFixed(1)}" x2="${box.r}" y2="${y.toFixed(1)}"
        stroke="var(--line)"/>`;
  }
  // 本塁ベース
  const hp=cy+82;
  g+=`<path d="M ${cx-26} ${hp} L ${cx+26} ${hp} L ${cx+26} ${hp+9}
      L ${cx} ${hp+16} L ${cx-26} ${hp+9} Z"
      fill="none" stroke="var(--line)"/>`;
  // 球種ごとに色を振る。使用率の並びは球種別コースと同じ。
  const order={};
  typeUsage(pitchOf(PLAYER,"pit")).forEach((t,i)=>{ order[t.name]=i; });
  rows.forEach(r=>{
    const i=order[r.type||"Normal"]||0;
    const color=TYPE_COLORS[i%TYPE_COLORS.length];
    const x=X(Number(r.plate_x)), y=Y(Number(r.plate_y));
    g+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.6"
        fill="${color}" stroke="var(--panel)" stroke-width="1.2" fill-opacity="0.85">
        <title>${esc(r.type||"Normal")} ${f1(Number(r.velocity))}km/h / ${JA[r.call]||r.call||""}</title>
      </circle>`;
  });
  svg.innerHTML=g || '<text x="125" y="140" text-anchor="middle" fill="var(--muted)" font-size="12">位置の記録がありません</text>';
}
function drawHeats(){

/* ======================================================== 選手成績
   打席を場面ごとに分けて並べる。カウント別・塁状況別・左右別。
   場面の見出しは字ではなく、カウントのランプと塁のひし形で見せる。 */

/** 打者の並び。 */
const SPLIT_BAT=[
  {head:"打率",  get:L=>f3(L.avg)},
  {head:"打席",  get:L=>L.pa},
  {head:"打数",  get:L=>L.ab},
  {head:"本塁打",get:L=>L.hr},
  {head:"打点",  get:L=>L.rbi},
  {head:"安打",  get:L=>L.h},
  {head:"四球",  get:L=>L.bb},
  {head:"三振",  get:L=>L.so},
  {head:"出塁率",get:L=>f3(L.obp)},
  {head:"長打率",get:L=>f3(L.slg)},
  {head:"OPS",   get:L=>f3(L.ops)}
];

/** 投手の並び。防御率と WHIP は投球回が要るので、分かるときだけ出す。 */
const SPLIT_PIT=[
  {head:"防御率",  get:L=>L.era===undefined||L.era===null ? "—" : f2(L.era)},
  {head:"投球回",  get:L=>L.outs===undefined ? "—" : ipText(L.outs)},
  {head:"被打席",  get:L=>L.pa},
  {head:"被打数",  get:L=>L.ab},
  {head:"被打率",  get:L=>f3(L.avg)},
  {head:"三振",    get:L=>L.so},
  {head:"四球",    get:L=>L.bb},
  {head:"被本塁打",get:L=>L.hr},
  {head:"被OPS",   get:L=>f3(L.ops)},
  {head:"WHIP",    get:L=>L.whip===undefined||L.whip===null ? "—" : f2(L.whip)}
];

/**
 * カウント別に出す項目。
 *
 * <p>カウント別は 1 球ごとの記録から数えるので、アウトの数を持っていない。
 * 防御率と投球回は出せないので外す。
 */
const SPLIT_PIT_COUNT=SPLIT_PIT.slice(2);

/** 通算だけに出す項目。打者は wRC+。 */
function splitBatTotal(name){
  const games=new Set(plateOf(name,"bat").map(r=>String(r.game_id))).size;
  return [{head:"試合", get:()=>games}].concat(SPLIT_BAT).concat([
    {head:"wRC+", get:L=>{ const v=wrcPlus(L); return v===null?"—":Math.round(v); }}
  ]);
}

/** 通算だけに出す項目。投手は勝敗と救援の記録。 */
function splitPitTotal(name){
  const win=decisionTotal(name,"win"), lose=decisionTotal(name,"lose");
  const decided=win+lose;
  const games=new Set(plateOf(name,"pit").map(r=>String(r.game_id))).size;
  return [
    {head:"登板",  get:()=>games},
    {head:"防御率", get:L=>L.era===undefined||L.era===null ? "—" : f2(L.era)},
    {head:"投球回", get:L=>L.outs===undefined ? "—" : ipText(L.outs)},
    {head:"勝",    get:()=>win},
    {head:"敗",    get:()=>lose},
    {head:"勝率",  get:()=>decided ? f3(win/decided) : "—"},
    {head:"ホールド", get:()=>reliefTotal(name,"hold")},
    {head:"セーブ",  get:()=>reliefTotal(name,"save")}
    // 防御率と投球回は先頭に出したので、ここでは繰り返さない
  ].concat(SPLIT_PIT.slice(2));
}

/** 場面ごとの表。label は見出しに入れる HTML。 */
function splitTable(groups, cols){
  const rows=groups.filter(g=>g.rows.length).map(g=>{
    const L=g.line ? g.line(g.rows) : line(g.rows);
    return `<tr><td class="sit">${g.label}</td>
      ${cols.map(c=>`<td>${c.get(L)}</td>`).join("")}</tr>`;
  }).join("");
  if(!rows) return '<div class="empty">この分け方の記録がありません</div>';
  return `<div class="scroll"><table class="split">
    <thead><tr><th class="sit">場面</th>
      ${cols.map(c=>`<th>${c.head}</th>`).join("")}</tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

/** カウントのランプ。球数と見逃し数を丸で見せる。 */
function countLamp(balls, strikes){
  const dot=(on, kind)=>`<i class="${kind}${on?" on":""}"></i>`;
  let b="", k="";
  for(let i=0;i<3;i++) b+=dot(i<balls, "b");
  for(let i=0;i<2;i++) k+=dot(i<strikes, "k");
  return `<span class="lamp">${b}<em></em>${k}</span>`;
}

/** 塁のひし形。上が二塁、下の左右が三塁と一塁。 */
function baseMarkAt(first, second, third){
  const mark=on=>`<i class="${on?"on":""}"></i>`;
  return `<span class="diamond">
    <span class="top">${mark(second)}</span>
    <span class="row">${mark(third)}${mark(first)}</span>
  </span>`;
}

/** カウント別。1 球ごとの記録の count(ボール-ストライク)で分ける。 */
function countGroups(rows){
  const out=[];
  for(let b=0;b<=3;b++){
    for(let k=0;k<=2;k++){
      const want=b+"-"+k;
      out.push({label:countLamp(b,k), rows:rows.filter(r=>String(r.count||"")===want)});
    }
  }
  return out;
}

/**
 * 得点圏かどうかで分ける。二塁か三塁に走者がいれば得点圏。
 *
 * <p>塁状況別は 8 通りに散るので、まとめて見る枠を別に置く。
 */
function scoringGroups(rows){
  const risp=r=>r.base2===true || r.base3===true;
  const anyone=r=>r.base1===true || r.base2===true || r.base3===true;
  return [
    {label:baseMarkAt(false,true,true)+" 得点圏", rows:rows.filter(risp)},
    {label:baseMarkAt(true,false,false)+" 一塁のみ",
      rows:rows.filter(r=>anyone(r) && !risp(r))},
    {label:baseMarkAt(false,false,false)+" 走者なし", rows:rows.filter(r=>!anyone(r))}
  ];
}

/** 塁状況別。打席の記録の base1〜3 で分ける。 */
function baseGroups(rows){
  const out=[];
  [[false,false,false],[true,false,false],[false,true,false],[false,false,true],
   [true,true,false],[true,false,true],[false,true,true],[true,true,true]]
  .forEach(([a,b,c])=>{
    out.push({label:baseMarkAt(a,b,c),
      rows:rows.filter(r=>(r.base1===true)===a && (r.base2===true)===b
        && (r.base3===true)===c)});
  });
  return out;
}

/** 左右別。打者なら投手の投げ手、投手なら打者の打席で分ける。 */
function handGroups(rows, key){
  const pick=want=>rows.filter(r=>String(r[key]||"").toUpperCase()===want);
  return [
    {label:key==="throws" ? "対右投手" : "対右打者", rows:pick("R")},
    {label:key==="throws" ? "対左投手" : "対左打者", rows:pick("L")}
  ];
}

/**
 * 球種ごとの表と円グラフ。
 *
 * <p>球速・投球割合・左右別の割合・奪三振の内訳・空振り率・被打率を並べる。
 */
function pitchMix(name){
  const ps=pitchOf(name,"pit");
  const types=typeUsage(ps);
  if(!types.length) return '<div class="empty">投球の記録がありません</div>';
  const total=ps.length;
  const toLeft=ps.filter(r=>r.stance==="L").length;
  const toRight=ps.filter(r=>r.stance==="R").length;
  const allK=ps.filter(r=>r.result==="STRIKE_OUT").length;
  const rows=types.map((t,i)=>{
    const mine=ps.filter(r=>(r.type||"Normal")===t.name);
    const top=Math.max(...mine.map(r=>Number(r.velocity)||0));
    const left=mine.filter(r=>r.stance==="L").length;
    const right=mine.filter(r=>r.stance==="R").length;
    const so=mine.filter(r=>r.result==="STRIKE_OUT").length;
    const ended=mine.filter(r=>r.result);
    const ab=ended.filter(r=>!NOT_AB.has(r.result)).length;
    const hits=ended.filter(r=>HIT.has(r.result)).length;
    const hr=ended.filter(r=>r.result==="HOME_RUN").length;
    return `<tr>
      <td class="tname"><i style="background:${TYPE_COLORS[i%TYPE_COLORS.length]}"></i>${esc(t.name)}</td>
      <td>${top>0?top.toFixed(0):"—"}</td>
      <td>${t.ev>0?t.ev.toFixed(1):"—"}</td>
      <td>${pc(100*t.n/total)}%</td>
      <td>${toLeft?pc(100*left/toLeft)+"%":"—"}</td>
      <td>${toRight?pc(100*right/toRight)+"%":"—"}</td>
      <td>${so}</td>
      <td>${t.swings?pc(100*t.whiffs/t.swings)+"%":"—"}</td>
      <td>${ab?f3(hits/ab):"—"} (${hr})</td>
    </tr>`;
  }).join("");
  // 円グラフ。投球割合をそのまま角度にする。
  const R=52, C=2*Math.PI*R;
  let at=0;
  const ring=types.map((t,i)=>{
    const share=t.n/total;
    const dash=`${(C*share).toFixed(2)} ${(C*(1-share)).toFixed(2)}`;
    const off=(-C*at).toFixed(2);
    at+=share;
    return `<circle cx="70" cy="70" r="${R}" fill="none" stroke-width="28"
      stroke="${TYPE_COLORS[i%TYPE_COLORS.length]}"
      stroke-dasharray="${dash}" stroke-dashoffset="${off}"
      transform="rotate(-90 70 70)"></circle>`;
  }).join("");
  const keys=types.map((t,i)=>`<span><i style="background:${TYPE_COLORS[i%TYPE_COLORS.length]}"></i>${esc(t.name)}</span>`).join("");
  return `<div class="mixwrap">
    <div class="mixtable"><table class="mix">
      <thead>
        <tr><th rowspan="2">球種</th><th colspan="2">球速(km/h)</th>
          <th colspan="3">投球割合</th><th rowspan="2">奪三振</th>
          <th rowspan="2">空振り率</th><th rowspan="2">被打率<small>(被本塁打)</small></th></tr>
        <tr><th>最高</th><th>平均</th><th>全体</th><th>対左</th><th>対右</th></tr>
      </thead>
      <tbody>${rows}</tbody></table></div>
    <div class="mixpie">
      <svg viewBox="0 0 140 140" width="140" height="140">${ring}</svg>
      <div class="mixkey">${keys}</div>
      <div class="note">円グラフは投球割合(全体)</div>
    </div>
  </div>`;
}
